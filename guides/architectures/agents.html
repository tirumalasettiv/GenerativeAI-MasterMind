<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agents: Autonomous Decision-Making</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    #root { height: 100%; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes blink { 0%, 49%, 100% { opacity: 1; } 50%, 99% { opacity: 0; } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const P = {
      root: { display: 'flex', height: '100%', width: '100%', backgroundColor: 'white', fontFamily: '"DM Sans", sans-serif', color: '#1a1a1a' },
      sidebar: { width: '180px', backgroundColor: '#f8f9fa', borderRight: '1px solid #e9ecef', overflowY: 'auto', padding: '24px 16px' },
      stepCircle: (stage, currentStage) => {
        let bg = '#e9ecef', color = '#666';
        if (stage === currentStage) bg = '#6c5ce7', color = 'white';
        else if (stage < currentStage) bg = '#2ecc71', color = 'white';
        return { width: '60px', height: '60px', borderRadius: '50%', backgroundColor: bg, color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '20px', cursor: 'pointer', transition: 'all 0.3s', margin: '12px auto' };
      },
      stepLabel: { fontSize: '11px', textAlign: 'center', marginTop: '8px', color: '#666', lineHeight: '1.2' },
      connector: (active) => ({ height: '24px', width: '2px', backgroundColor: active ? '#2ecc71' : '#e9ecef', margin: '0 auto' }),
      main: { flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' },
      topBar: { height: '64px', backgroundColor: '#f8f9fa', borderBottom: '1px solid #e9ecef', display: 'flex', alignItems: 'center', paddingLeft: '32px', gap: '16px' },
      leftSection: { display: 'flex', alignItems: 'center', gap: '16px', flex: 1 },
      backLink: { color: '#6c5ce7', textDecoration: 'none', fontSize: '14px', fontWeight: '500', cursor: 'pointer' },
      badge: { backgroundColor: '#e8f0fe', color: '#6c5ce7', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', fontWeight: '600' },
      title: { fontFamily: '"Fraunces", serif', fontSize: '32px', fontWeight: '700', color: '#1a1a1a' },
      navRow: { display: 'flex', gap: '8px', alignItems: 'center' },
      navBtn: (active) => ({ width: '36px', height: '36px', backgroundColor: active ? '#6c5ce7' : 'transparent', color: active ? 'white' : '#666', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '18px', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s' }),
      navP: { fontSize: '13px', color: '#666', minWidth: '40px', textAlign: 'center' },
      content: { flex: 1, overflowY: 'auto', padding: '40px 48px' },
      explainRow: { marginBottom: '32px' },
      explain: { fontSize: '18px', lineHeight: '1.6', color: '#444', marginBottom: '12px' },
      scene: { backgroundColor: '#f8f9fa', borderRadius: '16px', padding: '32px', marginTop: '24px', border: '1px solid #e9ecef', animation: 'fadeIn 0.4s', minHeight: '300px' },
      insightLabel: { color: '#1a9456', fontWeight: '600', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px' },
      insight: { backgroundColor: '#f0faf0', borderLeft: '4px solid #2ecc71', padding: '16px', borderRadius: '8px', marginTop: '24px', fontSize: '16px', lineHeight: '1.6', color: '#2d5016' }
    };

    function S1() {
      return (
        <div style={P.explainRow}>
          <p style={P.explain}>AI that uses tools and decides its own next steps to complete a task — like giving a goal to an expert who figures out what to do instead of being told every step.</p>
          <div style={P.scene}>
            <svg viewBox="0 0 600 400" style={{ width: '100%', maxHeight: '300px' }}>
              <defs>
                <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
                  <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                  <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
              <circle cx="300" cy="200" r="60" fill="#6c5ce7" filter="url(#purpleGlow)" opacity="0.8" />
              <text x="300" y="210" textAnchor="middle" fontSize="16" fontWeight="bold" fill="white">Agent</text>
              <circle cx="120" cy="100" r="40" fill="#3498db" />
              <text x="120" y="105" textAnchor="middle" fontSize="12" fontWeight="bold" fill="white">Web</text>
              <text x="120" y="120" textAnchor="middle" fontSize="12" fontWeight="bold" fill="white">Search</text>
              <circle cx="480" cy="100" r="40" fill="#e74c3c" />
              <text x="480" y="110" textAnchor="middle" fontSize="12" fontWeight="bold" fill="white">Calc</text>
              <circle cx="120" cy="300" r="40" fill="#f39c12" />
              <text x="120" y="310" textAnchor="middle" fontSize="12" fontWeight="bold" fill="white">Code</text>
              <circle cx="480" cy="300" r="40" fill="#1abc9c" />
              <text x="480" y="310" textAnchor="middle" fontSize="12" fontWeight="bold" fill="white">Files</text>
              <line x1="300" y1="200" x2="150" y2="130" stroke="#6c5ce7" strokeWidth="2" />
              <line x1="300" y1="200" x2="450" y2="130" stroke="#6c5ce7" strokeWidth="2" />
              <line x1="300" y1="200" x2="150" y2="270" stroke="#6c5ce7" strokeWidth="2" />
              <line x1="300" y1="200" x2="450" y2="270" stroke="#6c5ce7" strokeWidth="2" />
            </svg>
          </div>
          <div style={{ marginTop: '20px', fontSize: '16px', color: '#666' }}>
            <strong>Travel Booking Analogy:</strong> "Book me a flight to Tokyo" \u2192 agent decides to check prices, compare airlines, check dates, then books. Not step-directed, but goal-directed.
          </div>
          <div style={P.insight}>
            <div style={P.insightLabel}>Key Insight</div>
            <p style={{ marginTop: '8px' }}>An Agent = LLM + Tools + Decision Loop. You give it a goal, and it figures out the steps. Like hiring an expert vs writing a recipe.</p>
          </div>
        </div>
      );
    }

    function S2() {
      const [step, setStep] = useState(0);
      const steps = [
        { thought: "I need recent documentation about Python 3.12 async features", action: "web_search(\"Python 3.12 async new features\")" },
        { thought: "Need official docs for accuracy", action: "web_fetch(\"https://docs.python.org/3.12/whatsnew/\")" },
        { thought: "Now I can create accurate example", action: "Generate code with TaskGroups" }
      ];
      const observations = [
        "Results show TaskGroups and asyncio improvements",
        "Full documentation retrieved successfully",
        "Code example created with TaskGroups example"
      ];

      return (
        <div style={P.explainRow}>
          <p style={P.explain}>Agents use a Thought \u2192 Action \u2192 Observation cycle, repeating until the task is done. This is called ReAct (Reasoning + Acting).</p>
          <div style={P.scene}>
            <div style={{ textAlign: 'center', marginBottom: '24px' }}>
              <strong style={{ fontSize: '18px' }}>Goal: Find Python 3.12 async features and create code example</strong>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '24px' }}>
              <div style={{ backgroundColor: '#e8eef7', padding: '12px', borderRadius: '8px' }}>
                <div style={{ color: '#6c5ce7', fontWeight: '600', fontSize: '12px' }}>THOUGHT</div>
                <div style={{ marginTop: '8px', fontSize: '14px' }}>{steps[step]?.thought}</div>
              </div>
              <div style={{ backgroundColor: '#e3f2fd', padding: '12px', borderRadius: '8px' }}>
                <div style={{ color: '#3498db', fontWeight: '600', fontSize: '12px' }}>ACTION</div>
                <div style={{ marginTop: '8px', fontSize: '13px', fontFamily: 'monospace' }}>{steps[step]?.action}</div>
              </div>
              <div style={{ backgroundColor: '#e8f5e9', padding: '12px', borderRadius: '8px' }}>
                <div style={{ color: '#2ecc71', fontWeight: '600', fontSize: '12px' }}>OBSERVATION</div>
                <div style={{ marginTop: '8px', fontSize: '14px' }}>{observations[step]}</div>
              </div>
            </div>
            <div style={{ textAlign: 'center', marginTop: '24px' }}>
              <button onClick={() => setStep(Math.max(0, step - 1))} style={{ marginRight: '12px', padding: '8px 16px', backgroundColor: '#e9ecef', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>Previous</button>
              <span style={{ fontWeight: '600', margin: '0 16px' }}>Step {step + 1} of 3</span>
              <button onClick={() => setStep(Math.min(2, step + 1))} style={{ marginLeft: '12px', padding: '8px 16px', backgroundColor: '#6c5ce7', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer' }}>Next Step</button>
            </div>
            <div style={{ marginTop: '24px', padding: '16px', backgroundColor: '#fff9e6', borderRadius: '8px', fontSize: '14px', lineHeight: '1.6' }}>
              <svg viewBox="0 0 400 100" style={{ width: '100%', marginBottom: '12px' }}>
                <circle cx="50" cy="50" r="30" fill="#6c5ce7" opacity="0.3" />
                <text x="50" y="55" textAnchor="middle" fontSize="12" fontWeight="bold">Thought</text>
                <path d="M 80 50 L 120 50" stroke="#999" strokeWidth="2" markerEnd="url(#arrowhead)" />
                <circle cx="150" cy="50" r="30" fill="#3498db" opacity="0.3" />
                <text x="150" y="55" textAnchor="middle" fontSize="12" fontWeight="bold">Action</text>
                <path d="M 180 50 L 220 50" stroke="#999" strokeWidth="2" />
                <circle cx="250" cy="50" r="30" fill="#2ecc71" opacity="0.3" />
                <text x="250" y="55" textAnchor="middle" fontSize="12" fontWeight="bold">Observe</text>
                <path d="M 280 50 L 320 50" stroke="#999" strokeWidth="2" />
                <path d="M 320 50 Q 300 80 80 80" stroke="#999" strokeWidth="2" strokeDasharray="4" />
              </svg>
              <span>\u2190 Loop continues until goal is achieved</span>
            </div>
          </div>
          <div style={P.insight}>
            <div style={P.insightLabel}>Key Insight</div>
            <p style={{ marginTop: '8px' }}>ReAct = Think before you act, observe what happened, then think again. This loop is why agents can handle complex, unpredictable tasks. Each cycle narrows in on the answer.</p>
          </div>
        </div>
      );
    }

    function S3() {
      const [tab, setTab] = useState('info');
      const tools = {
        info: [
          { name: 'Web Search', desc: 'Find information online' },
          { name: 'Document Reader', desc: 'Extract text from files' },
          { name: 'Database Query', desc: 'Access structured data' },
          { name: 'API Calls', desc: 'Call external services' }
        ],
        action: [
          { name: 'File Operations', desc: 'Create, read, write files' },
          { name: 'Code Execution', desc: 'Run code and scripts' },
          { name: 'Browser Automation', desc: 'Control web browser' },
          { name: 'Form Filling', desc: 'Interact with web forms' }
        ],
        compute: [
          { name: 'Calculator', desc: 'Math and computation' },
          { name: 'Data Analysis', desc: 'Process datasets' },
          { name: 'Chart Generation', desc: 'Create visualizations' },
          { name: 'Statistics', desc: 'Statistical analysis' }
        ],
        comm: [
          { name: 'Email Sender', desc: 'Send emails' },
          { name: 'Slack Poster', desc: 'Post to Slack' },
          { name: 'Calendar Manager', desc: 'Schedule events' },
          { name: 'Notifications', desc: 'Send alerts' }
        ]
      };

      const toolData = {
        info: tools.info, action: tools.action, compute: tools.compute, comm: tools.comm
      };

      return (
        <div style={P.explainRow}>
          <p style={P.explain}>An agent is only as powerful as its tools. The right toolkit determines what tasks your agent can handle.</p>
          <div style={P.scene}>
            <div style={{ display: 'flex', gap: '8px', marginBottom: '24px' }}>
              {['info', 'action', 'compute', 'comm'].map(t => (
                <button key={t} onClick={() => setTab(t)} style={{ padding: '8px 16px', backgroundColor: tab === t ? '#6c5ce7' : '#e9ecef', color: tab === t ? 'white' : '#666', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: '600' }}>
                  {t === 'info' ? 'Information' : t === 'action' ? 'Action' : t === 'compute' ? 'Computation' : 'Communication'}
                </button>
              ))}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
              {toolData[tab].map((tool, i) => (
                <div key={i} style={{ backgroundColor: 'white', border: '1px solid #e9ecef', borderRadius: '8px', padding: '16px' }}>
                  <div style={{ fontWeight: '600', fontSize: '16px', marginBottom: '4px' }}>{tool.name}</div>
                  <div style={{ fontSize: '13px', color: '#666' }}>{tool.desc}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: '24px', padding: '16px', backgroundColor: '#f0f4ff', borderRadius: '8px', borderLeft: '4px solid #6c5ce7' }}>
              <div style={{ fontWeight: '600', color: '#6c5ce7', marginBottom: '8px' }}>MCP (Model Context Protocol)</div>
              <div style={{ fontSize: '14px', color: '#4a4a4a' }}>Standardized way to connect ANY tool to ANY agent. Makes tool integration universal.</div>
            </div>
          </div>
          <div style={P.insight}>
            <div style={P.insightLabel}>Key Insight</div>
            <p style={{ marginTop: '8px' }}>Tools are the agent's hands. Without tools, an agent is just an LLM that talks about doing things. With tools, it can actually DO things. MCP is making tool integration universal.</p>
          </div>
        </div>
      );
    }

    function S4() {
      const metrics = [
        { label: 'Flexibility', value: 95, color: '#2ecc71' },
        { label: 'Reliability', value: 65, color: '#f39c12' },
        { label: 'Control', value: 45, color: '#f39c12' },
        { label: 'Cost', value: 'Variable', color: '#e74c3c' }
      ];

      return (
        <div style={P.explainRow}>
          <p style={P.explain}>Understanding agent properties helps you predict when they'll excel and when they'll struggle.</p>
          <div style={P.scene}>
            <div style={{ marginBottom: '32px' }}>
              <strong style={{ fontSize: '16px' }}>Agent Metrics</strong>
              {metrics.map((m, i) => (
                <div key={i} style={{ marginTop: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px', fontSize: '14px', fontWeight: '500' }}>
                    <span>{m.label}</span>
                    <span>{m.value}{'%' === m.value ? '' : ' ' + m.value}</span>
                  </div>
                  <div style={{ backgroundColor: '#e9ecef', borderRadius: '4px', height: '8px', overflow: 'hidden' }}>
                    <div style={{ backgroundColor: m.color, height: '100%', width: m.value + '%' }} />
                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: '32px' }}>
              <strong style={{ fontSize: '16px' }}>Agent vs Workflow</strong>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginTop: '16px', fontSize: '13px' }}>
                <div style={{ padding: '12px', backgroundColor: '#f0faf0', borderRadius: '6px' }}>
                  <div style={{ fontWeight: '600', color: '#2ecc71', marginBottom: '8px' }}>Workflow</div>
                  <div style={{ lineHeight: '1.6' }}>Do step 1, then 2, then 3. You plan the steps. Same path every time. Like a recipe.</div>
                </div>
                <div style={{ padding: '12px', backgroundColor: '#e8f0fe', borderRadius: '6px' }}>
                  <div style={{ fontWeight: '600', color: '#6c5ce7', marginBottom: '8px' }}>Agent</div>
                  <div style={{ lineHeight: '1.6' }}>Achieve this goal. AI plans the steps. Different path based on situation. Like a personal assistant.</div>
                </div>
              </div>
            </div>
            <div style={{ marginTop: '24px', padding: '12px', backgroundColor: '#ffe8e8', borderRadius: '6px', fontSize: '13px', borderLeft: '4px solid #e74c3c' }}>
              <strong style={{ color: '#c0392b' }}>Common Failure Modes:</strong> Infinite loops, wrong tool selection, context overflow
            </div>
          </div>
          <div style={P.insight}>
            <div style={P.insightLabel}>Key Insight</div>
            <p style={{ marginTop: '8px' }}>Agents trade reliability for flexibility. Workflows always do the same thing; agents adapt but can surprise you. Use agents for exploration and research — use workflows for production automation.</p>
          </div>
        </div>
      );
    }

    function S5() {
      const [expanded, setExpanded] = useState(null);
      const examples = [
        { title: '\ud83d\udd0d Research Agent', goal: 'Analyze competitor pricing strategies', steps: ['search web', 'find pricing pages', 'extract data', 'compare', 'write report'] },
        { title: '\ud83d\udcbb Coding Agent', goal: 'Fix the authentication bug', steps: ['read error logs', 'find relevant code', 'identify bug', 'write fix', 'run tests'] },
        { title: '\ud83d\udcc8 Data Agent', goal: 'Summarize Q3 sales trends', steps: ['query database', 'analyze results', 'create visualizations', 'write insights'] },
        { title: '\ud83c\udf86 Support Agent', goal: 'Resolve billing complaint', steps: ['look up account', 'check billing history', 'identify issue', 'draft resolution', 'escalate if needed'] }
      ];

      return (
        <div style={P.explainRow}>
          <p style={P.explain}>Agents shine in research, coding assistance, and complex problem-solving where the steps aren't known upfront.</p>
          <div style={P.scene}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '24px' }}>
              {examples.map((ex, i) => (
                <div key={i} onClick={() => setExpanded(expanded === i ? null : i)} style={{ backgroundColor: 'white', border: '2px solid #e9ecef', borderRadius: '8px', padding: '16px', cursor: 'pointer', transition: 'all 0.2s' }}>
                  <div style={{ fontWeight: '600', fontSize: '16px', marginBottom: '4px' }}>{ex.title}</div>
                  <div style={{ fontSize: '13px', color: '#666', marginBottom: '8px' }}>Goal: {ex.goal}</div>
                  {expanded === i && (
                    <div style={{ marginTop: '12px', fontSize: '12px', color: '#666', paddingTop: '12px', borderTop: '1px solid #e9ecef', animation: 'slideInLeft 0.3s' }}>
                      {ex.steps.map((s, j) => (
                        <div key={j} style={{ marginTop: '6px', paddingLeft: '12px', borderLeft: '2px solid #6c5ce7' }}>{j + 1}. {s}</div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div style={{ padding: '16px', backgroundColor: '#f5f5f5', borderRadius: '8px', fontSize: '13px' }}>
              <strong>Real Tools:</strong> Claude Code, ChatGPT with tools, AutoGPT, CrewAI
            </div>
          </div>
          <div style={P.insight}>
            <div style={P.insightLabel}>Key Insight</div>
            <p style={{ marginTop: '8px' }}>The best agent use cases have 3 properties: the goal is clear, the steps are unpredictable, and tools are available. If all steps are known, use a workflow instead.</p>
          </div>
        </div>
      );
    }

    function App() {
      const [current, setCurrent] = useState(0);
      const stages = [
        { num: 1, label: 'What is an\nAgent?', comp: S1 },
        { num: 2, label: 'The ReAct\nLoop', comp: S2 },
        { num: 3, label: 'Tools &\nCapabilities', comp: S3 },
        { num: 4, label: 'Agent\nCharacteristics', comp: S4 },
        { num: 5, label: 'Real-World\nExamples', comp: S5 }
      ];

      const CurrentComp = stages[current].comp;

      return (
        <div style={P.root}>
          <div style={P.sidebar}>
            {stages.map((s, i) => (
              <div key={i}>
                <div onClick={() => setCurrent(i)} style={P.stepCircle(i, current)}>
                  {i < current ? '\u2713' : i + 1}
                </div>
                <div style={P.stepLabel}>{s.label}</div>
                {i < stages.length - 1 && <div style={P.connector(i < current)} />}
              </div>
            ))}
          </div>
          <div style={P.main}>
            <div style={P.topBar}>
              <div style={P.leftSection}>
                <a href="../../index.html" style={P.backLink}>\u2190 Back</a>
                <span style={P.badge}>DEEP DIVE</span>
              </div>
            </div>
            <div style={P.content}>
              <div style={{ marginBottom: '24px', animation: 'fadeIn 0.4s' }}>
                <h1 style={P.title}>AI Agents: Autonomous Decision-Making</h1>
              </div>
              <CurrentComp />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
