<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agents — LLMs that reason, plan, use tools, and loop. ReAct, capabilities, and when to reach for one.">
  <meta name="theme-color" content="#6c5ce7">
  <meta property="og:title" content="Agent Architecture — Interactive Guide">
  <meta property="og:description" content="Agents — LLMs that reason, plan, use tools, and loop. ReAct, capabilities, and when to reach for one.">

  <meta name="twitter:description" content="Agents — LLMs that reason, plan, use tools, and loop. ReAct, capabilities, and when to reach for one.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>AI Agents - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .capability-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
    }

    .capability-card {
      padding: 24px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .capability-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .capability-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .capability-emoji { font-size: 32px; margin-bottom: 12px; }
    .capability-title { font-weight: 700; font-size: 18px; color: #1a1a1a; margin-bottom: 6px; }
    .capability-subtitle { font-size: 14px; color: #666; line-height: 1.5; }

    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

    .capability-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
    }

    .capability-card.expanded .capability-detail {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .react-cycle {
      width: 100%;
      padding: 24px;
      background: white;
      border: 2px solid #e8e3f8;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .react-step {
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.6;
    }

    .react-step.thought { background: #f5f3ff; border-left: 4px solid #6c5ce7; }
    .react-step.action { background: #fff8e1; border-left: 4px solid #f39c12; }
    .react-step.observation { background: #e8f5e9; border-left: 4px solid #2ecc71; }

    .react-step-label {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .react-step.thought .react-step-label { color: #6c5ce7; }
    .react-step.action .react-step-label { color: #f39c12; }
    .react-step.observation .react-step-label { color: #2ecc71; }

    .react-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .react-nav-btn {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .react-nav-btn:hover { border-color: #6c5ce7; color: #6c5ce7; }
    .react-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .react-nav-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }

    .tool-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tool-tab {
      padding: 10px 20px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .tool-tab:hover { border-color: #6c5ce7; }
    .tool-tab.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .tool-item {
      padding: 16px;
      background: white;
      border: 1px solid #e8e3f8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 500;
    }

    .tool-item-emoji { font-size: 22px; }

    .failure-card {
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: white;
    }

    .failure-card:hover { transform: translateY(-2px); }
    .failure-card.expanded { border-color: #e74c3c; background: #fef5f5; }

    .failure-card-title {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .failure-card-content {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .failure-card.expanded .failure-card-content {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }

    .checklist-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #2ecc71;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .example-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .example-card {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .example-card:hover { transform: translateY(-3px); border-color: #6c5ce7; }
    .example-card.expanded { border-color: #6c5ce7; background: #f5f3ff; grid-column: 1 / -1; }

    .example-card-emoji { font-size: 28px; margin-bottom: 8px; }
    .example-card-title { font-weight: 700; font-size: 16px; color: #1a1a1a; margin-bottom: 4px; }
    .example-card-desc { font-size: 13px; color: #666; line-height: 1.5; }
    .example-card-hint { font-size: 11px; color: #b0a6e8; margin-top: 8px; font-style: italic; }
    .example-card.expanded .example-card-hint { display: none; }

    .example-card-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.7;
    }

    .example-card.expanded .example-card-detail {
      max-height: 400px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .mcp-callout {
      background: linear-gradient(135deg, #6c5ce7 0%, #a78bfa 100%);
      color: white;
      padding: 24px;
      border-radius: 12px;
      margin-top: 16px;
      width: 100%;
    }

    .mcp-callout-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
    .mcp-callout-text { font-size: 14px; line-height: 1.6; opacity: 0.95; }

    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      margin-top: 16px;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.agent { background: #f5f3ff; border-color: #6c5ce7; }
    .comparison-item.workflow { background: #f8f9fa; border-color: #bbb; }

    .comparison-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .comparison-item.agent .comparison-title { color: #6c5ce7; }
    .comparison-item.workflow .comparison-title { color: #555; }

    .comparison-content {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
    }

    /* Guide-specific animations */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .slide-in-right { animation: slideInRight 0.6s ease forwards; }
    .slide-in-left { animation: slideInLeft 0.6s ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">{insightSvg} INSIGHT</div>
          {children}
        </div>
      );
    }

    /* Sidebar icon components */
    function RobotIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2" />
          <circle cx="12" cy="5" r="2" />
          <path d="M12 7v4" />
          <line x1="8" y1="16" x2="8" y2="16" />
          <line x1="16" y1="16" x2="16" y2="16" />
          <circle cx="8" cy="16" r="1" fill="currentColor" />
          <circle cx="16" cy="16" r="1" fill="currentColor" />
        </svg>
      );
    }

    function BrainIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 2a5 5 0 015 5c0 .98-.28 1.89-.77 2.66A5 5 0 0119 14a5 5 0 01-3 4.58V22h-4v-3.42A5 5 0 015 14a5 5 0 012.77-4.34A5 5 0 017 7a5 5 0 015-5z" />
          <path d="M12 2v20" />
        </svg>
      );
    }

    function LoopIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="17 1 21 5 17 9" />
          <path d="M3 11V9a4 4 0 014-4h14" />
          <polyline points="7 23 3 19 7 15" />
          <path d="M21 13v2a4 4 0 01-4 4H3" />
        </svg>
      );
    }

    function WrenchIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" />
        </svg>
      );
    }

    function WarningIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      );
    }

    function GlobeIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" />
        </svg>
      );
    }

    const STAGES = [
      { id: 1, label: 'What', icon: RobotIcon },
      { id: 2, label: 'Skills', icon: BrainIcon },
      { id: 3, label: 'ReAct', icon: LoopIcon },
      { id: 4, label: 'Tools', icon: WrenchIcon },
      { id: 5, label: 'Pitfalls', icon: WarningIcon },
      { id: 6, label: 'Real', icon: GlobeIcon }
    ];

    /* Stage 1 -- What is an Agent? */
    function S1() {
      return (
        <>
          <div><div className="stage-header">What is an Agent?</div></div>
          <div className="explanation">
            An AI agent operates in a <strong>reasoning loop</strong> -- it observes the world, thinks about what to do, takes an action, checks the result, and decides the next step. Unlike a chatbot that gives one response and stops, an agent <strong>keeps going until the goal is achieved</strong>.
          </div>
          <div className="scene-card">
            <svg width="480" height="320" viewBox="0 0 480 320" aria-label="AI Agent hub connected to Web Search, Calculator, Code Exec, and File System tools">
              {/* Agent center */}
              <rect x="170" y="120" width="140" height="80" rx="16" fill="#6c5ce7" />
              <text x="240" y="155" textAnchor="middle" fill="white" fontWeight="700" fontSize="16" fontFamily="DM Sans">AI Agent</text>
              <text x="240" y="175" textAnchor="middle" fill="#d4ccff" fontSize="11" fontFamily="DM Sans">Observe - Think - Act</text>

              {/* Web Search */}
              <rect x="20" y="30" width="110" height="50" rx="10" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="1.5" />
              <text x="75" y="52" textAnchor="middle" fontSize="18" fontFamily="DM Sans">&#x1F50D;</text>
              <text x="75" y="70" textAnchor="middle" fill="#333" fontSize="11" fontWeight="600" fontFamily="DM Sans">Web Search</text>
              <line x1="130" y1="55" x2="170" y2="140" stroke="#6c5ce7" strokeWidth="1.5" strokeDasharray="4 3" />

              {/* Calculator */}
              <rect x="350" y="30" width="110" height="50" rx="10" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="1.5" />
              <text x="405" y="52" textAnchor="middle" fontSize="18" fontFamily="DM Sans">&#x1F5A9;</text>
              <text x="405" y="70" textAnchor="middle" fill="#333" fontSize="11" fontWeight="600" fontFamily="DM Sans">Calculator</text>
              <line x1="350" y1="55" x2="310" y2="140" stroke="#6c5ce7" strokeWidth="1.5" strokeDasharray="4 3" />

              {/* Code */}
              <rect x="20" y="240" width="110" height="50" rx="10" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="1.5" />
              <text x="75" y="262" textAnchor="middle" fontSize="18" fontFamily="DM Sans">&#x1F4BB;</text>
              <text x="75" y="280" textAnchor="middle" fill="#333" fontSize="11" fontWeight="600" fontFamily="DM Sans">Code Exec</text>
              <line x1="130" y1="265" x2="170" y2="180" stroke="#6c5ce7" strokeWidth="1.5" strokeDasharray="4 3" />

              {/* Files */}
              <rect x="350" y="240" width="110" height="50" rx="10" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="1.5" />
              <text x="405" y="262" textAnchor="middle" fontSize="18" fontFamily="DM Sans">&#x1F4C1;</text>
              <text x="405" y="280" textAnchor="middle" fill="#333" fontSize="11" fontWeight="600" fontFamily="DM Sans">File System</text>
              <line x1="350" y1="265" x2="310" y2="180" stroke="#6c5ce7" strokeWidth="1.5" strokeDasharray="4 3" />
            </svg>
            <div style={{marginTop: '16px', textAlign: 'center', width: '100%'}}>
              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', maxWidth: '440px', margin: '0 auto'}}>
                <div style={{padding: '16px', background: '#f8f9fa', borderRadius: '10px', border: '2px solid #bbb'}}>
                  <div style={{fontSize: '24px', marginBottom: '6px'}}>&#x1F5A9;</div>
                  <div style={{fontWeight: 700, fontSize: '15px', color: '#555'}}>Calculator</div>
                  <div style={{fontSize: '13px', color: '#888', marginTop: '4px'}}>Does what you tell it. One operation, done.</div>
                </div>
                <div style={{padding: '16px', background: '#f5f3ff', borderRadius: '10px', border: '2px solid #6c5ce7'}}>
                  <div style={{fontSize: '24px', marginBottom: '6px'}}>&#x1F4BC;</div>
                  <div style={{fontWeight: 700, fontSize: '15px', color: '#6c5ce7'}}>Accountant</div>
                  <div style={{fontSize: '13px', color: '#555', marginTop: '4px'}}>Figures out what needs doing, does it, checks, flags issues.</div>
                </div>
              </div>
            </div>
          </div>
          <InsightBlock>
            The AI agent market is projected to grow from <strong>$7.84B in 2025</strong> to <strong>$52.62B by 2030</strong>. Agents represent the shift from AI as a tool you operate to AI as a collaborator that operates alongside you.
          </InsightBlock>
        </>
      );
    }

    function S2Diagram() {
      const vertices = [
        { label: 'Reasoning', icon: '🧠', cx: 200, cy: 32,  color: '#6c5ce7', bg: '#f5f3ff' },
        { label: 'Tool Use',  icon: '🔧', cx: 66,  cy: 240, color: '#3498db', bg: '#e0f0ff' },
        { label: 'Memory',    icon: '🧩', cx: 334, cy: 240, color: '#f39c12', bg: '#fff8e1' },
      ];
      const center = { cx: 200, cy: 172 };
      const edgeLabels = [
        { lx: 100, ly: 118, text: "can't adapt"    },
        { lx: 300, ly: 118, text: "can't act"      },
        { lx: 200, ly: 268, text: 'forgets mid-task' },
      ];
      const edges = [
        [0, 1], [0, 2], [1, 2],
      ];
      return (
        <svg width="400" height="290" viewBox="0 0 400 290"
          style={{ maxWidth: '100%', overflow: 'visible', marginBottom: '16px' }}
          aria-label="Three core agent capabilities triangle: Reasoning at top, Tool Use at bottom-left, Memory at bottom-right, Agent at center">
          {/* Triangle edges */}
          {edges.map(([a, b], i) => (
            <line key={i}
              x1={vertices[a].cx} y1={vertices[a].cy}
              x2={vertices[b].cx} y2={vertices[b].cy}
              stroke="#e0e0e0" strokeWidth="2" strokeDasharray="4 4" />
          ))}
          {/* Edge labels */}
          {edgeLabels.map((e, i) => (
            <text key={i} x={e.lx} y={e.ly} textAnchor="middle"
              fontSize="10" fill="#ccc" fontFamily="DM Sans">{e.text}</text>
          ))}
          {/* Spokes from center to vertices */}
          {vertices.map(v => {
            const dx = v.cx - center.cx, dy = v.cy - center.cy;
            const len = Math.sqrt(dx * dx + dy * dy);
            const x1 = center.cx + (dx / len) * 28;
            const y1 = center.cy + (dy / len) * 28;
            const x2 = v.cx - (dx / len) * 34;
            const y2 = v.cy - (dy / len) * 34;
            return (
              <line key={v.label} x1={x1} y1={y1} x2={x2} y2={y2}
                stroke={v.color} strokeWidth="1.5" strokeDasharray="4 4" />
            );
          })}
          {/* Vertex nodes */}
          {vertices.map(v => (
            <g key={v.label}>
              <circle cx={v.cx} cy={v.cy} r="34" fill={v.bg} stroke={v.color} strokeWidth="2" />
              <text x={v.cx} y={v.cy - 8} textAnchor="middle" fontSize="16" fontFamily="DM Sans">{v.icon}</text>
              <text x={v.cx} y={v.cy + 10} textAnchor="middle"
                fontSize="11" fontWeight="600" fill={v.color} fontFamily="DM Sans">{v.label}</text>
            </g>
          ))}
          {/* Center Agent node */}
          <circle cx={center.cx} cy={center.cy} r="28" fill="#6c5ce7" />
          <text x={center.cx} y={center.cy + 5} textAnchor="middle"
            fontSize="12" fontWeight="700" fill="white" fontFamily="DM Sans">Agent</text>
        </svg>
      );
    }

    /* Stage 2 -- Three Capabilities */

    /* Stage 4 -- Tools & MCP */
    function S4() {

      const toolsByTab = {
        info: [
          { emoji: "\uD83D\uDD0D", name: 'Web Search' },
          { emoji: "\uD83D\uDCC4", name: 'Doc Reader' },
          { emoji: "\uD83D\uDDC3\uFE0F", name: 'DB Query' },
          { emoji: "\uD83D\uDD17", name: 'API Calls' }
        ],
        action: [
          { emoji: "\uD83D\uDCC2", name: 'File Operations' },
          { emoji: "\u25B6\uFE0F", name: 'Code Execution' },

    /* Stage 5 -- Why Agents Fail */
    function S5() {
      const [expandedCard, setExpandedCard] = useState(null);

      const mistakes = [
        {
          id: 'overengineering',
          emoji: "\uD83C\uDFD7\uFE0F",
          title: 'Over-engineering from Day One',
          summary: 'Building multi-agent systems before validating a single agent works',
          detail: 'Companies jump straight to complex multi-agent orchestration before proving a single agent can reliably complete its task. Start with one agent, one loop, minimal tools. Only add complexity when you have evidence the simple version is the bottleneck.'
        },
        {
          id: 'tools',
          emoji: "\uD83E\uDDF0",
          title: 'Tool Definitions as Afterthought',
          summary: 'Poorly defined tools that confuse the agent',
          detail: 'A tool with a vague name like "process_data" and no parameter descriptions forces the agent to guess. Agents choose tools based on their descriptions. Invest the same care in tool definitions as you would in an API specification -- clear names, typed parameters, usage examples.'
        },
        {
          id: 'recovery',
          emoji: "\uD83D\uDEA8",

        }
      ];

      const checklist = [
        { label: 'Guardrails', desc: 'max_turns limits, tool access restrictions, output validation' },

        { label: 'Graceful Degradation', desc: 'Fallback tools, partial results, human handoff paths' },

      return (
        <>
          <div><div className="stage-header">Why Agents Fail</div></div>

            Only about <strong>1 in 9 enterprises</strong> experimenting with AI agents actually run them in production. Here are the three most common mistakes and a checklist for getting it right.
          </div>

            <div style={{width: '100%'}}>

                </div>
              ))}

          </div>

            The gap between demo and production is where most agent projects die. A demo can tolerate a 70% success rate. Production cannot. Build evaluation into the process from day one -- not as an afterthought after the architecture is set.

    const STAGE_COMPONENTS = [S1, S2, S3, S4, S5, S6];
