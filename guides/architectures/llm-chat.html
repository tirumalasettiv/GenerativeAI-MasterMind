<html lang="en">

  <title>Basic LLM Chat - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Guide-specific animations */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .slide-in-left {
      animation: slideInLeft 0.6s ease forwards;
    }

    /* Chat simulation */
    .chat-container {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e8e3f8;
      overflow: hidden;
    }

    .chat-header {
      background: #6c5ce7;
      color: white;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 260px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.4s ease forwards;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #6c5ce7;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: #f5f3ff;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-self: flex-start;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b0a6e8;
      animation: pulse 1s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* Pipeline */
    .pipeline {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pipeline-box {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      flex: 1;
      min-width: 140px;
      max-width: 200px;
      transition: all 0.3s ease;
    }

    .pipeline-box.active {
      border-color: #6c5ce7;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.15);
    }

    .pipeline-arrow {
      font-size: 24px;
      color: #b0a6e8;
      flex-shrink: 0;
    }

    /* Temperature slider */
    .temp-slider-wrap {
      width: 100%;
      margin-top: 20px;
      padding: 24px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e8e3f8;
    }

    .temp-slider-wrap input[type="range"] {
      width: 100%;
      accent-color: #6c5ce7;
      height: 6px;
      cursor: pointer;
    }

    .temp-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    .temp-output {
      margin-top: 16px;
      padding: 16px;
      background: #f5f3ff;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
      color: #333;
      border-left: 3px solid #6c5ce7;
    }

    /* Technique table */
    .technique-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
    }

    .technique-table th {
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #6c5ce7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 16px;
    }

    .technique-table td {
      padding: 14px 16px;
      background: white;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
    }

    .technique-table tr td:first-child {
      border-radius: 8px 0 0 8px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .technique-table tr td:last-child {
      border-radius: 0 8px 8px 0;
    }

    /* Warning cards */
    .warning-card {
      padding: 16px 20px;
      background: #fef5f5;
      border: 1px solid #f5c6cb;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .warning-card-emoji {
      font-size: 20px;
      flex-shrink: 0;
    }

    .warning-card-text {
      font-size: 14px;
      line-height: 1.6;
      color: #721c24;
    }

    /* Use case grid */
    .usecase-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .usecase-card {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .usecase-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-3px);
    }

    .usecase-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .usecase-emoji {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .usecase-title {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .usecase-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .usecase-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 8px;
      font-style: italic;
    }

    .usecase-card.expanded .usecase-hint {
      display: none;
    }

    .usecase-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .usecase-card.expanded .usecase-detail {
      max-height: 250px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

    .usecase-prompt {
      background: #eee8ff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      font-family: monospace;
      margin-bottom: 8px;
    }

    .usecase-tag {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Limitation flip cards */
    .limit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .limit-card {
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 140px;
      position: relative;
    }

    .limit-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-3px);
    }

    .limit-card.flipped {
      background: #f0faf0;
      border-color: #2ecc71;
    }

    .limit-card-front, .limit-card-back {
      transition: opacity 0.3s ease;
    }

    .limit-card.flipped .limit-card-front {
      display: none;
    }

    .limit-card:not(.flipped) .limit-card-back {
      display: none;
    }

    .limit-title {
      font-weight: 700;
      font-size: 15px;
      color: #c0392b;
      margin-bottom: 6px;
    }

    .limit-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .limit-flip-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 10px;
      font-style: italic;
    }

    .upgrade-title {
      font-weight: 700;
      font-size: 15px;
      color: #27ae60;
      margin-bottom: 6px;
    }

    .upgrade-desc {
      font-size: 13px;
      color: #1a5e3a;
      line-height: 1.5;
    }

    /* Upgrade path */
    .upgrade-path {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .upgrade-node {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid #e0e0e0;
      background: white;
      transition: all 0.3s ease;
    }

    .upgrade-node.current {
      background: #6c5ce7;
      color: white;
      border-color: #6c5ce7;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .upgrade-arrow {
      font-size: 16px;
      color: #b0a6e8;
    }

    /* Cost bar */
    .cost-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      padding: 8px 0;
    }

    .cost-label {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      min-width: 100px;
    }

    .cost-bar {
      height: 10px;
      border-radius: 5px;
      background: #6c5ce7;
      transition: width 0.6s ease;
    }

    .cost-amount {
      font-size: 12px;
      color: #666;
      min-width: 40px;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">{insightSvg} INSIGHT</div>
          {children}
        </div>
      );
    }

    /* Sidebar icon components */
    function ChatIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
        </svg>
      );
    }

    function GearIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
        </svg>
      );
    }

    function StarIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
      );
    }

    function GridIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
        </svg>
      );
    }

    function WarningIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      );
    }

    function S1Diagram() {
  return (
    <svg width="480" height="130" viewBox="0 0 480 130"
      style={{ maxWidth: '100%', overflow: 'visible', marginBottom: '20px' }}
      aria-label="LLM Chat architecture: User prompt goes to LLM trained on data, response generated without external lookups">
      <defs>
        <marker id="lcArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#6c5ce7" />
        </marker>
      </defs>
      {/* User */}
      <rect x="10" y="48" width="90" height="36" rx="10" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="1.5" />
      <text x="55" y="70" textAnchor="middle" fontSize="12" fontWeight="600" fill="#6c5ce7" fontFamily="DM Sans">User</text>
      <line x1="100" y1="66" x2="154" y2="66" stroke="#6c5ce7" strokeWidth="2" markerEnd="url(#lcArr)" />
      {/* LLM */}
      <rect x="155" y="42" width="120" height="48" rx="12" fill="#6c5ce7" />
      <text x="215" y="63" textAnchor="middle" fontSize="13" fontWeight="700" fill="white" fontFamily="DM Sans">LLM</text>
      <text x="215" y="80" textAnchor="middle" fontSize="10" fill="#d4ccff" fontFamily="DM Sans">billions of params</text>
      {/* Training data arc */}
      <path d="M 160 48 Q 215 8 275 48" fill="none" stroke="#b0a6e8" strokeWidth="1.5" strokeDasharray="4 4" />
      <text x="215" y="20" textAnchor="middle" fontSize="10" fill="#b0a6e8" fontFamily="DM Sans">training data</text>
      <line x1="275" y1="66" x2="329" y2="66" stroke="#6c5ce7" strokeWidth="2" markerEnd="url(#lcArr)" />
      {/* Response */}
      <rect x="330" y="48" width="110" height="36" rx="10" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="1.5" />
      <text x="385" y="70" textAnchor="middle" fontSize="12" fontWeight="600" fill="#6c5ce7" fontFamily="DM Sans">Response</text>
      {/* Footer note */}
      <text x="240" y="112" textAnchor="middle" fontSize="10" fill="#aaa" fontFamily="DM Sans">no database · no web search · no tools</text>
    </svg>
  );
}

    /* Stage 1: What is LLM Chat? */
    function S1() {
      const [phase, setPhase] = useState(0);
      const timerRef = useRef(null);

      useEffect(() => {
        const delays = [800, 2200, 3800];
        if (phase < 3) {
          timerRef.current = setTimeout(() => setPhase(p => p + 1), delays[phase] || 1500);
        }
        return () => clearTimeout(timerRef.current);
      }, [phase]);

      const aiResponse = "Here are 5 creative names for your AI tool:\n\n1. Synapse Studio\n2. MindForge AI\n3. Lumina Assistant\n4. NeuroNest\n5. ClarityBot";

      return (
        <>
          <div>
            <div className="stage-header">What is LLM Chat?</div>
          </div>
          <div className="explanation">
            Direct conversation with AI using only its training knowledge &mdash; like texting a very smart friend who has read millions of books but can&rsquo;t look anything up in real time. No databases, no web search, no tools. Just the model and its learned knowledge.
          </div>
          <div className="scene-card">
            <S1Diagram />
            <div className="chat-container">
              <div className="chat-header">
                <span style={{ fontSize: '18px' }}>&#x1F4AC;</span> LLM Chat
                <span style={{ marginLeft: 'auto', fontSize: '12px', opacity: 0.8 }}>Direct conversation</span>
              </div>
              <div className="chat-body">
                {phase >= 1 && (
                  <div className="chat-bubble user">
                    Help me brainstorm product names for an AI tool
                  </div>
                )}
                {phase === 2 && (
                  <div className="typing-dots">
                    <span></span><span></span><span></span>
                  </div>
                )}
                {phase >= 3 && (
                  <div className="chat-bubble ai" style={{ whiteSpace: 'pre-line' }}>
                    {aiResponse}
                  </div>
                )}
              </div>
            </div>
            <div style={{
              marginTop: '24px', padding: '16px 20px', background: 'white',
              borderRadius: '10px', border: '1px solid #e8e3f8', width: '100%', maxWidth: '560px'
            }}>
              <div style={{ fontWeight: 700, fontSize: '14px', color: '#6c5ce7', marginBottom: '8px' }}>
                &#x1F4DA; The Walking Encyclopedia
              </div>
              <div style={{ fontSize: '14px', color: '#555', lineHeight: 1.6 }}>
                Think of an LLM as a walking encyclopedia &mdash; it has absorbed billions of words from books, articles, and code during training. When you chat with it, you&rsquo;re tapping into that compressed knowledge. It doesn&rsquo;t search the internet or check databases; everything it knows was learned during training.
              </div>
            </div>
          </div>
          <InsightBlock>
            LLM Chat is the simplest AI architecture &mdash; and often the most underrated. Before reaching for complex pipelines, always ask: &ldquo;Can a well-crafted prompt solve this?&rdquo;
          </InsightBlock>
        </>
      );
    }

    /* Stage 2: How It Works */
    function S2() {
      const [temperature, setTemperature] = useState(0.5);
      const [activeBox, setActiveBox] = useState(null);

      const getTempLabel = (t) => {
        if (t <= 0.3) return { label: 'Low (Factual)', color: '#3498db' };
        if (t <= 0.7) return { label: 'Medium (Balanced)', color: '#f39c12' };
        return { label: 'High (Creative)', color: '#e74c3c' };
      };

      const getTempOutput = (t) => {
        if (t <= 0.3) return 'The capital of France is Paris. It is located in the north-central part of the country along the Seine River. Paris has been the capital since the 10th century.';
        if (t <= 0.7) return 'Paris is the capital of France, a vibrant city known for the Eiffel Tower, world-class cuisine, and its role as a global center for art, fashion, and culture.';
        return 'Ah, Paris! The City of Light where cobblestone streets whisper centuries of romance, where every boulangerie is a portal to pure bliss, and the Seine dances beneath bridges older than most nations.';
      };

      const tempInfo = getTempLabel(temperature);

      return (
        <>
          <div>
            <div className="stage-header">How It Works</div>
          </div>
          <div className="explanation">
            The LLM Chat pipeline has three components: your input goes in, the model processes it through billions of parameters, and generated text comes out. Temperature controls the creativity dial.
          </div>
          <div className="scene-card">
            <div className="pipeline">
              <div
                className={`pipeline-box fade-in ${activeBox === 'input' ? 'active' : ''}`}
                onMouseEnter={() => setActiveBox('input')}
                onMouseLeave={() => setActiveBox(null)}
              >
                <div style={{ fontSize: '28px', marginBottom: '8px' }}>&#x1F4DD;</div>
                <div style={{ fontWeight: 700, fontSize: '15px', color: '#1a1a1a', marginBottom: '4px' }}>Input</div>
                <div style={{ fontSize: '12px', color: '#666' }}>Your prompt</div>
                <div style={{ fontSize: '11px', color: '#b0a6e8', marginTop: '4px' }}>~45 tokens</div>
              </div>
              <div className="pipeline-arrow">&#x2192;</div>
              <div
                className={`pipeline-box fade-in ${activeBox === 'model' ? 'active' : ''}`}
                style={{ animationDelay: '0.2s' }}
                onMouseEnter={() => setActiveBox('model')}
                onMouseLeave={() => setActiveBox(null)}
              >
                <div style={{ fontSize: '28px', marginBottom: '8px' }}>&#x1F9E0;</div>
                <div style={{ fontWeight: 700, fontSize: '15px', color: '#1a1a1a', marginBottom: '4px' }}>Model</div>
                <div style={{ fontSize: '12px', color: '#666' }}>Billions of parameters</div>
                <div style={{ fontSize: '11px', color: '#b0a6e8', marginTop: '4px' }}>Temperature: {temperature.toFixed(1)}</div>
              </div>
              <div className="pipeline-arrow">&#x2192;</div>
              <div
                className={`pipeline-box fade-in ${activeBox === 'output' ? 'active' : ''}`}
                style={{ animationDelay: '0.4s' }}
                onMouseEnter={() => setActiveBox('output')}
                onMouseLeave={() => setActiveBox(null)}
              >
                <div style={{ fontSize: '28px', marginBottom: '8px' }}>&#x1F4C4;</div>
                <div style={{ fontWeight: 700, fontSize: '15px', color: '#1a1a1a', marginBottom: '4px' }}>Output</div>
                <div style={{ fontSize: '12px', color: '#666' }}>Generated text</div>
                <div style={{ fontSize: '11px', color: '#b0a6e8', marginTop: '4px' }}>Token by token</div>
              </div>
            </div>

            <div className="temp-slider-wrap">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                <div style={{ fontWeight: 700, fontSize: '14px', color: '#1a1a1a' }}>
                  &#x1F321;&#xFE0F; Temperature Control
                </div>
                <div style={{ fontSize: '13px', fontWeight: 600, color: tempInfo.color }}>
                  {tempInfo.label}
                </div>
              </div>
              <input
                type="range"
                min="0"
                max="1"
                step="0.1"
                value={temperature}
                onChange={(e) => setTemperature(parseFloat(e.target.value))}
              />
              <div className="temp-labels">
                <span>0.0 Factual</span>
                <span>0.5 Balanced</span>
                <span>1.0 Creative</span>
              </div>
              <div className="temp-output">
                <div style={{ fontSize: '11px', fontWeight: 700, color: '#6c5ce7', marginBottom: '6px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                  Prompt: &ldquo;Tell me about Paris&rdquo;
                </div>
                {getTempOutput(temperature)}
              </div>
            </div>
          </div>
          <InsightBlock>
            Temperature is your most powerful knob. Low temperature for facts and code, medium for general tasks, high for brainstorming and creative writing. There&rsquo;s no universally &ldquo;right&rdquo; setting.
          </InsightBlock>
        </>
      );
    }

    /* Stage 3: Why It's Underrated */
    function S3() {
      const techniques = [
        { name: 'System Prompt', tip: 'Pack with role, constraints, output format' },
        { name: 'Few-shot Examples', tip: '3 good examples beat a paragraph of instructions' },
        { name: 'Context Stuffing', tip: '128K+ tokens: paste docs directly into the prompt' },
        { name: 'Temperature Control', tip: 'Dial creativity up or down per use case' },
        { name: 'Prompt Chaining', tip: 'Break complex tasks into sequential small prompts' }
      ];

      const traps = [
        { emoji: '\u26A0\uFE0F', text: 'Building a RAG pipeline to answer questions that are already in the model\'s training data.' },
        { emoji: '\u26A0\uFE0F', text: 'Deploying an agent with tool access when a simple system prompt plus few-shot examples would produce the same output.' },
        { emoji: '\u26A0\uFE0F', text: 'Spending weeks on vector database setup when pasting the document into the prompt would have worked on day one.' }
      ];

      return (
        <>
          <div>
            <div className="stage-header">Why It&rsquo;s Underrated</div>
          </div>
          <div className="explanation">
            Teams routinely skip past direct LLM chat on their way to more complex architectures. But a well-crafted prompt that ships in a day beats a RAG pipeline that ships in a quarter.
          </div>
          <div className="scene-card">
            <S3Diagram />
            <div style={{ width: '100%' }}>
              <div style={{ fontWeight: 700, fontSize: '16px', color: '#1a1a1a', marginBottom: '16px' }}>
                &#x1F527; Techniques to Maximize LLM Chat
              </div>
              <table className="technique-table">
                <thead>
                  <tr>
                    <th>Technique</th>
                    <th>Key Tip</th>
                  </tr>
                </thead>
                <tbody>
                  {techniques.map((t, idx) => (
                    <tr key={idx} className="fade-in" style={{ animationDelay: `${0.1 * idx}s` }}>
                      <td>{t.name}</td>
                      <td>{t.tip}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div style={{ width: '100%', marginTop: '28px' }}>
              <div style={{ fontWeight: 700, fontSize: '16px', color: '#c0392b', marginBottom: '12px' }}>
                &#x1F6A8; The Over-Engineering Trap
              </div>
              {traps.map((trap, idx) => (
                <div className="warning-card fade-in" key={idx} style={{ animationDelay: `${0.15 * idx}s` }}>
                  <div className="warning-card-emoji">{trap.emoji}</div>
                  <div className="warning-card-text">{trap.text}</div>
                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            Start simple. A well-crafted prompt that ships today beats a complex RAG pipeline that ships next quarter. You can always upgrade later &mdash; but only if you actually need to.
          </InsightBlock>
        </>
      );
    }

    /* Stage 4: Best Use Cases */
    function S4() {
      const [expandedCase, setExpandedCase] = useState(null);

      const useCases = [
        {
          id: 'brainstorm',
          emoji: '\uD83D\uDCA1',
          title: 'Brainstorming',
          desc: 'Generate ideas, explore possibilities, and think divergently.',
          prompt: 'Give me 10 unconventional marketing strategies for a B2B SaaS product targeting small law firms.',
          bestFor: 'Ideation & creativity'
        },
        {
          id: 'content',
          emoji: '\u270D\uFE0F',
          title: 'Content Drafting',
          desc: 'Write emails, blog posts, reports, and documentation.',
          prompt: 'Draft a professional email declining a vendor proposal while keeping the relationship warm for future opportunities.',
          bestFor: 'Writing & communication'
        },
        {
          id: 'explain',
          emoji: '\uD83C\uDF93',
          title: 'Explaining Concepts',
          desc: 'Break down complex topics into simple, understandable language.',
          prompt: 'Explain how DNS works to a 10-year-old using a pizza delivery analogy.',

        {
          id: 'code',

        {

          emoji: '\uD83C\uDFAD',

        {
          id: 'summarize',
          emoji: '\uD83D\uDCCB',
          title: 'Summarization',

          prompt: 'Summarize this 2000-word article into 5 bullet points, highlighting the key arguments and any data cited.',
          bestFor: 'Research & analysis'
        }
      ];

      return (
        <>
          <div>
            <div className="stage-header">Best Use Cases</div>
          </div>
          <div className="explanation">
            LLM Chat excels in tasks that rely on general knowledge, language fluency, and creative reasoning. Here are six areas where it shines brightest.
          </div>
          <div className="scene-card">
            <div className="usecase-grid">
              {useCases.map((uc, idx) => (
                <div
                  key={uc.id}
                  className={`usecase-card disclosure-card-host fade-in ${expandedCase === uc.id ? 'expanded' : ''}`}
                  style={{ animationDelay: `${0.08 * idx}s` }}
                  onClick={() => setExpandedCase(expandedCase === uc.id ? null : uc.id)}
                >
                  <span className="disclosure-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">

                  </div>
                </div>

            </div>
          </div>
          <InsightBlock>
            Notice the pattern: all these use cases rely on the model&rsquo;s general training knowledge. The moment you need company-specific data, real-time information, or actions in external systems, you&rsquo;ve outgrown basic LLM Chat.

    /* Stage 5: Limitations & Upgrade Path */
    function S5() {
      const [flippedCards, setFlippedCards] = useState({});

      const toggleFlip = (id) => {
        setFlippedCards(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const limitations = [
        {
          id: 'cutoff',
          title: 'Knowledge Cutoff',
          desc: 'Training data has a fixed end date. The model cannot know about events after that date.',
          upgrade: 'RAG with Web Search',
          upgradeDesc: 'Add real-time web search to ground responses in current information.'
        },
        {
          id: 'nodata',
          title: 'No Custom Data',
          desc: 'Cannot access your company documents, internal databases, or proprietary knowledge.',
          upgrade: 'RAG Pipeline',
          upgradeDesc: 'Connect a vector database with your documents so the model can search and cite them.'
        },
        {
          id: 'hallucinate',
          title: 'Hallucinations',
          desc: 'May generate confident-sounding but factually incorrect information with no way to verify.',
          upgrade: 'RAG with Grounding',
          upgradeDesc: 'Retrieve source documents and force the model to cite them, reducing fabricated claims.'
        },
        {
          id: 'notools',
          title: 'No Tool Use',
          desc: 'Cannot send emails, query APIs, update databases, or take any real-world actions.',
          upgrade: 'Agent Architecture',
          upgradeDesc: 'Give the model access to tools and let it decide when and how to use them.'
        }
      ];

      const archPath = [
        { name: 'LLM Chat', current: true },
        { name: 'RAG', current: false },
        { name: 'Workflow', current: false },
        { name: 'Agent', current: false },
        { name: 'Agentic AI', current: false }
      ];

      const costData = [
        { name: 'LLM Chat', tokens: 1500, cost: '$', width: '15%' },
        { name: 'RAG', tokens: 4000, cost: '$$', width: '40%' },
        { name: 'Workflow', tokens: 8000, cost: '$$$', width: '60%' },
        { name: 'Agent', tokens: 15000, cost: '$$$$', width: '85%' },
        { name: 'Agentic AI', tokens: 25000, cost: '$$$$$', width: '100%' }
      ];

      return (
        <>
          <div>
            <div className="stage-header">Limitations &amp; Upgrade Path</div>
          </div>
          <div className="explanation">
            Every architecture has boundaries. Understanding LLM Chat&rsquo;s limitations tells you exactly when to upgrade &mdash; and what to upgrade to. Click each card to reveal the solution.
          </div>
          <div className="scene-card">
            <div className="limit-grid">
              {limitations.map((lim, idx) => (
                <div
                  key={lim.id}
                  className={`limit-card fade-in ${flippedCards[lim.id] ? 'flipped' : ''}`}
                  style={{ animationDelay: `${0.1 * idx}s` }}
                  onClick={() => toggleFlip(lim.id)}
                >
                  <div className="limit-card-front">
                    <div style={{ fontSize: '22px', marginBottom: '8px' }}>&#x1F6AB;</div>
                    <div className="limit-title">{lim.title}</div>
                    <div className="limit-desc">{lim.desc}</div>
                    <div className="limit-flip-hint">Click to see upgrade</div>
                  </div>
                  <div className="limit-card-back">
                    <div style={{ fontSize: '22px', marginBottom: '8px' }}>&#x2705;</div>
                    <div className="upgrade-title">{lim.upgrade}</div>
                    <div className="upgrade-desc">{lim.upgradeDesc}</div>
                  </div>
                </div>
              ))}
            </div>

            <div className="upgrade-path">
              {archPath.map((node, idx) => (
                <React.Fragment key={idx}>
                  <div className={`upgrade-node ${node.current ? 'current' : ''}`}>
                    {node.name}
                  </div>
                  {idx < archPath.length - 1 && (
                    <div className="upgrade-arrow">&#x2192;</div>
                  )}
                </React.Fragment>
              ))}
            </div>

            <div style={{ width: '100%', marginTop: '28px' }}>
              <div style={{ fontWeight: 700, fontSize: '14px', color: '#1a1a1a', marginBottom: '12px' }}>
                &#x1F4B0; Cost Comparison (avg tokens per query)
              </div>
              {costData.map((item, idx) => (
                <div className="cost-row fade-in" key={idx} style={{ animationDelay: `${0.1 * idx}s` }}>
                  <div className="cost-label">{item.name}</div>
                  <div style={{ flex: 1, background: '#f0eeff', borderRadius: '5px', height: '10px' }}>
                    <div className="cost-bar" style={{ width: item.width }} />
                  </div>
                  <div className="cost-amount">{item.cost}</div>
                </div>
              ))}
              <div style={{ fontSize: '12px', color: '#999', marginTop: '8px', textAlign: 'center' }}>
                LLM Chat uses ~1,500 tokens/query &mdash; the most cost-effective starting point
              </div>
            </div>
          </div>
          <InsightBlock>
            Start with LLM Chat. Upgrade only when you hit a concrete limitation. The architecture upgrade path is a ladder, not a starting line &mdash; climb only as high as your use case demands.
          </InsightBlock>
        </>
      );
    }

    /* Main Guide component */
    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stages = [
        { icon: ChatIcon, label: 'What Is It', component: S1 },
        { icon: GearIcon, label: 'How It Works', component: S2 },
        { icon: StarIcon, label: 'Underrated', component: S3 },
        { icon: GridIcon, label: 'Use Cases', component: S4 },
        { icon: WarningIcon, label: 'Limits', component: S5 }
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) setCurrentStage(currentStage + 1);
      };

      const handlePrev = () => {
        if (currentStage > 0) setCurrentStage(currentStage - 1);
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {stages.map((stage, idx) => {
                const IconComp = stage.icon;
                return (
                  <React.Fragment key={idx}>
                    <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                      <button
                        type="button"
                        className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                        aria-label={`Step ${idx + 1}: ${stage.label}`}
                        aria-current={currentStage === idx ? "step" : undefined}
                        onClick={() => setCurrentStage(idx)}
                      >
                        <IconComp />
                      </button>
                      <div className="step-btn-label">{stage.label}</div>
                    </div>
                    {idx < stages.length - 1 && (
                      <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">5.2</span>
                    <div className="title">Basic LLM Chat</div>
                  </div>
                  <div style={{ marginLeft: '20px' }}>
                    <div className="badge">BEGINNER</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of 5</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentStage === 0}
                      aria-label="Previous section"
                      title="Previous stage"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={currentStage === stages.length - 1}
                      aria-label="Next section"
                      title="Next stage"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide">
                <CurrentComponent />
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
