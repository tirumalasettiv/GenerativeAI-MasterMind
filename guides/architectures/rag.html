<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>RAG Architecture - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
    }

    #root {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 120px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 80px 12px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .step-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .step-btn:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .step-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    .step-wrapper.active .step-btn-label {
      color: #6c5ce7;
    }

    .step-connector {
      width: 2px;
      height: 16px;
      background: #e0e0e0;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .step-connector.active {
      background: #6c5ce7;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, #6c5ce7, #a78bfa, #2ecc71) 1;
      background: white;
      flex-shrink: 0;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      color: #6c5ce7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #2ecc71;
    }

    .badge {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .progress-indicator {
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .guide-number {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #b0a6e8;
      margin-right: 8px;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .nav-arrows {
      display: flex;
      gap: 12px;
    }

    .arrow-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .arrow-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
      transform: translateY(-2px);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 32px 48px;
      gap: 30px;
    }

    .explanation {
      font-size: 22px;
      line-height: 1.7;
      color: #2a2a2a;
    }

    .scene-card {
      background: linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%);
      border-radius: 16px;
      padding: 40px;
      border: 1px solid #e8e3f8;
      min-height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
    }

    .insight-box {
      background: #f0faf0;
      border-left: 4px solid #2ecc71;
      padding: 24px;
      border-radius: 8px;
      color: #1a5e3a;
      font-size: 17px;
      line-height: 1.7;
      margin-top: 24px;
      position: relative;
    }

    .insight-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #2ecc71;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .slide-in-left {
      animation: slideInLeft 0.6s ease forwards;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    /* Toggle button group */
    .toggle-group {
      display: flex;
      gap: 0;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #e0e0e0;
      margin-bottom: 24px;
    }

    .toggle-btn {
      padding: 12px 28px;
      border: none;
      background: white;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s ease;
      color: #666;
    }

    .toggle-btn.active {
      background: #6c5ce7;
      color: white;
    }

    /* Component cards */
    .component-card {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 0;
    }

    .component-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .component-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .component-card-title {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a1a;
      margin-top: 8px;
    }

    .component-card-desc {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
      line-height: 1.5;
    }

    .component-card-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .component-card.expanded .component-card-detail {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    /* Pipeline flow */
    .pipeline-flow {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      margin-top: 20px;
    }

    .pipeline-step {
      background: white;
      border: 2px solid #e8e3f8;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #6c5ce7;
    }

    .pipeline-arrow {
      color: #b0a6e8;
      font-size: 18px;
    }

    /* Step progression cards */
    .step-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .step-card.active-step {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .step-card.completed-step {
      border-color: #2ecc71;
      background: #f0faf0;
    }

    .step-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e0e0e0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-card.active-step .step-number {
      background: #6c5ce7;
    }

    .step-card.completed-step .step-number {
      background: #2ecc71;
    }

    .step-card-content {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .step-card.active-step .step-card-content {
      max-height: 400px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e8e3f8;
    }

    /* Slider controls */
    .slider-control {
      width: 100%;
      margin-bottom: 16px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .slider-input {
      width: 100%;
      accent-color: #6c5ce7;
      height: 6px;
    }

    /* Strategy cards */
    .strategy-card {
      padding: 16px 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .strategy-card:hover {
      border-color: #6c5ce7;
    }

    .strategy-card.selected {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    /* Warning cards */
    .warning-card {
      padding: 16px 20px;
      background: #fff8f0;
      border: 1px solid #f0c050;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .warning-card-title {
      font-weight: 700;
      font-size: 14px;
      color: #b8860b;
      margin-bottom: 4px;
    }

    .warning-card-desc {
      font-size: 13px;
      color: #8b6914;
      line-height: 1.5;
    }

    /* Result cards */
    .result-card {
      padding: 16px 20px;
      background: white;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      margin-bottom: 10px;
      transition: all 0.3s ease;
    }

    .result-score {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    .result-score.high {
      background: #e8f8e8;
      color: #27ae60;
    }

    .result-score.medium {
      background: #fef9e7;
      color: #b8860b;
    }

    .result-score.low {
      background: #fef5f5;
      color: #c0392b;
    }

    /* Pattern cards */
    .pattern-card {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 12px;
    }

    .pattern-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .pattern-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .pattern-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pattern-card-title {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
    }

    .expand-hint {
      font-size: 18px;
      color: #b0a6e8;
      transition: transform 0.3s ease;
    }

    .pattern-card.expanded .expand-hint {
      transform: rotate(180deg);
    }

    .pattern-card-content {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .pattern-card.expanded .pattern-card-content {
      max-height: 500px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #ddd;
    }

    /* Prompt block */
    .prompt-block {
      background: #1a1a2e;
      color: #e8e8f0;
      padding: 20px 24px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.8;
      width: 100%;
      margin-top: 12px;
    }

    .prompt-label {
      color: #6c5ce7;
      font-weight: 700;
    }

    .prompt-context {
      color: #2ecc71;
    }

    .prompt-user {
      color: #f39c12;
    }

    /* Tag pills */
    .tag-pill {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin: 3px;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    /* Insight icon as React element */
    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">{insightSvg} INSIGHT</div>
          {children}
        </div>
      );
    }

    /* Sidebar SVG icon components */
    function SearchIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      );
    }

    function LayersIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
      );
    }

    function MicroscopeIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M6 18h8" />
          <path d="M3 22h18" />
          <path d="M14 22a7 7 0 100-14h-1" />
          <path d="M9 14h2" />
          <path d="M9 12a2 2 0 01-2-2V6h6v4a2 2 0 01-2 2" />
          <path d="M12 6V3a1 1 0 00-1-1H9a1 1 0 00-1 1v3" />
        </svg>
      );
    }

    function ScissorsIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="6" cy="6" r="3" />
          <circle cx="6" cy="18" r="3" />
          <line x1="20" y1="4" x2="8.12" y2="15.88" />
          <line x1="14.47" y1="14.48" x2="20" y2="20" />
          <line x1="8.12" y1="8.12" x2="12" y2="12" />
        </svg>
      );
    }

    function TargetIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="12" cy="12" r="10" />
          <circle cx="12" cy="12" r="6" />
          <circle cx="12" cy="12" r="2" />
        </svg>
      );
    }

    function RocketIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z" />
          <path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z" />
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
        </svg>
      );
    }

    /* Stage 1: What is RAG? */
    function S1() {
      const [mode, setMode] = useState('with');

      const data = {
        with: {
          answer: 'According to our company policy (updated March 2024), employees may work remotely up to 3 days per week after completing their 90-day onboarding period. Remote work requires manager approval and a signed home-office safety checklist.',
          sources: ['HR Policy Handbook v4.2, Section 7.3', 'Remote Work Amendment, March 2024'],
          label: '\u2713 Grounded, sourced answer',
          color: '#2ecc71',
          bg: '#f0f8f0',
          titleColor: '#27ae60'
        },
        without: {
          answer: 'Most companies allow some form of remote work these days. Typically, you can work from home a few days a week, but you should check with your manager for the specific details. Many organizations have adopted hybrid models since 2020.',
          sources: [],
          label: '\u2717 Hallucinated generic answer',
          color: '#e74c3c',
          bg: '#fef5f5',
          titleColor: '#c0392b'
        }
      };

      const cur = data[mode];

      return (
        <>
          <div>
            <div className="stage-header">What is RAG?</div>
          </div>
          <div className="explanation">
            Retrieval-Augmented Generation (RAG) is an AI pattern where the model first searches your documents to find relevant information, then generates answers grounded in what it found. Think of it as a reference librarian who understands your question, walks to the right shelf, reads the relevant pages, and gives you a cited answer.
          </div>
          <div className="scene-card">
            <div style={{ fontWeight: 700, fontSize: '16px', color: '#1a1a1a', marginBottom: '16px' }}>
              Question: &ldquo;What does our policy say about remote work?&rdquo;
            </div>
            <div className="toggle-group">
              <button
                className={`toggle-btn ${mode === 'with' ? 'active' : ''}`}
                onClick={() => setMode('with')}
              >
                With RAG
              </button>
              <button
                className={`toggle-btn ${mode === 'without' ? 'active' : ''}`}
                onClick={() => setMode('without')}
              >
                Without RAG
              </button>
            </div>
            <div style={{ width: '100%' }}>
              <div
                className="fade-in"
                key={mode}
                style={{
                  padding: '24px',
                  borderRadius: '12px',
                  border: `2px solid ${cur.color}`,
                  background: cur.bg
                }}
              >
                <div style={{ fontWeight: 700, fontSize: '14px', color: cur.titleColor, marginBottom: '12px' }}>
                  {cur.label}
                </div>
                <div style={{ fontSize: '15px', lineHeight: '1.7', color: '#333' }}>
                  {cur.answer}
                </div>
                {cur.sources.length > 0 && (
                  <div style={{ marginTop: '16px', paddingTop: '12px', borderTop: '1px solid #c8e6c9' }}>
                    <div style={{ fontSize: '12px', fontWeight: 700, color: '#27ae60', marginBottom: '6px' }}>
                      SOURCES:
                    </div>
                    {cur.sources.map((s, i) => (
                      <div key={i} style={{ fontSize: '13px', color: '#2e7d32' }}>{s}</div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            <div style={{ marginTop: '24px', display: 'flex', gap: '16px', flexWrap: 'wrap', justifyContent: 'center' }}>
              {['1. Understand question', '2. Search documents', '3. Read relevant pages', '4. Cite and answer'].map((step, i) => (
                <div
                  key={i}
                  className="fade-in"
                  style={{
                    animationDelay: `${i * 0.15}s`,
                    padding: '10px 18px',
                    background: 'white',
                    border: '2px solid #e8e3f8',
                    borderRadius: '10px',
                    fontSize: '13px',
                    fontWeight: 600,
                    color: '#6c5ce7'
                  }}
                >
                  {step}
                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            RAG reduces hallucinations by 70&ndash;90% by grounding the LLM&rsquo;s response in actual retrieved documents rather than relying solely on training data. It transforms AI from an unreliable oracle into a trustworthy research assistant.
          </InsightBlock>
        </>
      );
    }

    /* Stage 2: The Five Components */
    function S2() {
      const [expanded, setExpanded] = useState(null);

      const components = [
        {

    /* Stage 4: Chunking Deep Dive */
    function S4() {
      const [chunkSize, setChunkSize] = useState(400);
      const [overlap, setOverlap] = useState(15);
      const [strategy, setStrategy] = useState(0);

      const strategies = [
        { name: 'Fixed-Size', desc: 'Splits text at exact token boundaries regardless of content structure. Simple and predictable.', pros: 'Easy to implement, consistent chunk sizes', cons: 'May split sentences or paragraphs mid-thought' },
        { name: 'Sentence-Based', desc: 'Splits at sentence boundaries, grouping sentences until reaching the target chunk size.', pros: 'Preserves complete thoughts, better coherence', cons: 'Variable chunk sizes, slightly more complex' },
        { name: 'Semantic', desc: 'Uses embeddings to detect topic shifts and splits at natural semantic boundaries.', pros: 'Best retrieval quality, topic-aware chunks', cons: 'Computationally expensive, requires embedding calls' }
      ];

      const pitfalls = [
        { title: '\u26A0 Chunks too large', desc: 'Precision drops because retrieved chunks contain too much irrelevant text mixed with relevant content.' },
        { title: '\u26A0 Chunks too small', desc: 'Context is lost because individual chunks lack enough surrounding information to be meaningful.' },
        { title: '\u26A0 No source tracking', desc: 'Cannot cite where answers came from, destroying user trust and making debugging impossible.' },
        { title: '\u26A0 Too many retrieved chunks', desc: 'Floods the LLM context window with noise, causing it to miss the most relevant information.' },
        { title: '\u26A0 Wrong embedding model', desc: 'Using a general-purpose model for domain-specific content produces poor similarity matches.' }
      ];

      const sampleText = 'Our company offers flexible remote work arrangements. Employees who have completed their 90-day onboarding period may work from home up to three days per week. Remote work requires prior manager approval. All remote workers must complete a home-office safety checklist annually. Equipment provided includes a laptop, monitor, and ergonomic keyboard.';

      const getChunks = () => {
        const words = sampleText.split(' ');
        const wpc = Math.max(4, Math.round(chunkSize / 8));
        const ow = Math.round(wpc * overlap / 100);
        const chunks = [];
        let i = 0;
        while (i < words.length) {
          const end = Math.min(i + wpc, words.length);
          chunks.push(words.slice(i, end).join(' '));
          i = end - ow;
          if (i >= words.length - 2) break;
        }
        return chunks;
      };

      return (
        <>
          <div>
            <div className="stage-header">Chunking Deep Dive</div>
          </div>
          <div className="explanation">
            How you split documents determines what gets retrieved. Too large and you lose precision; too small and you lose context. Adjust the sliders to see how chunk size and overlap affect the output.
          </div>

              </div>

                  <span>Overlap</span>
                  <span style={{ color: '#6c5ce7', fontWeight: 700 }}>{overlap}%</span>
                </div>
                <input type="range" className="slider-input" min="0" max="30" step="5"
                  value={overlap} onChange={e => setOverlap(Number(e.target.value))} />
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#999' }}>
                  <span>0%</span><span>30%</span>
                </div>
              </div>

              <div style={{ marginTop: '16px', marginBottom: '20px' }}>
                <div style={{ fontSize: '14px', fontWeight: 700, marginBottom: '10px' }}>
                  Preview ({getChunks().length} chunks):
                </div>
                {getChunks().map((chunk, i) => (
                  <div
                    key={`${chunkSize}-${overlap}-${i}`}
                    className="fade-in"
                    style={{
                      animationDelay: `${i * 0.1}s`,
                      padding: '12px 16px',
                      background: i % 2 === 0 ? '#f5f3ff' : '#f0f8ff',
                      border: '1px solid #e8e3f8',
                      borderRadius: '8px',
                      fontSize: '13px',
                      color: '#333',
                      lineHeight: '1.6',
                      marginBottom: '6px'
                    }}
                  >
                    <span style={{ fontWeight: 700, color: '#6c5ce7', fontSize: '11px' }}>CHUNK {i + 1}: </span>
                    {chunk}
                  </div>
                ))}
              </div>

              <div style={{ fontWeight: 700, fontSize: '15px', marginBottom: '12px' }}>
                Chunking Strategies:
              </div>
              <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap', width: '100%' }}>
                {strategies.map((s, idx) => (
                  <div
                    key={idx}
                    className={`strategy-card ${strategy === idx ? 'selected' : ''}`}
                    style={{ flex: '1 1 180px' }}
                    onClick={() => setStrategy(idx)}
                  >
                    <div style={{
                      fontWeight: 700, fontSize: '14px',

                    }}>

                    <div style={{ fontSize: '13px', color: '#555', lineHeight: '1.5' }}>{s.desc}</div>
                    {strategy === idx && (

                        <div style={{ color: '#c0392b', marginTop: '4px' }}><strong>Cons:</strong> {s.cons}</div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>

            <div style={{ width: '100%', marginTop: '24px' }}>
              <div style={{ fontWeight: 700, fontSize: '15px', color: '#b8860b', marginBottom: '12px' }}>
                Common RAG Pitfalls:

                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            There is no universally &ldquo;best&rdquo; chunk size. Start with 400&ndash;500 tokens and 10&ndash;15% overlap, then evaluate retrieval quality on your actual queries. Domain-specific content (legal, medical) often benefits from smaller, more precise chunks.
          </InsightBlock>
        </>
      );
    }

                    </div>
                    <div style={{
                      padding: '10px 16px', background: '#f0f8ff', border: '1px solid #d0e8ff',
                      borderRadius: '8px', fontSize: '13px', color: '#1a5e8a', fontFamily: 'monospace'
                    }}>
                      {p.example}
                    </div>
                  </div>
                </div>
              ))}

              <div style={{ marginTop: '24px' }}>
                <div style={{ fontWeight: 700, fontSize: '14px', marginBottom: '12px' }}>
                  Production Pipeline:
                </div>
                <div className="pipeline-flow" style={{ flexWrap: 'wrap' }}>
                  {['User Query', 'Query Rewriter', 'Keyword Search', 'Semantic Search', 'Fusion', 'Re-ranker', 'Top-K', 'LLM', 'Evaluate', 'Output'].map((step, i) => (
                    <React.Fragment key={i}>
                      <div className="pipeline-step" style={{ fontSize: '12px' }}>{step}</div>
                      {i < 9 && <span className="pipeline-arrow">&rarr;</span>}
                    </React.Fragment>
                  ))}
                </div>
              </div>

              <div style={{ marginTop: '24px', display: 'flex', gap: '24px', width: '100%', flexWrap: 'wrap' }}>
                <div style={{ flex: '1 1 200px' }}>
                  <div style={{ fontWeight: 700, fontSize: '14px', marginBottom: '10px' }}>
                    Orchestration Frameworks:
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                    {frameworks.map((f, i) => (
                      <span key={i} className="tag-pill">{f}</span>
                    ))}
                  </div>
                </div>
                <div style={{ flex: '1 1 200px' }}>
                  <div style={{ fontWeight: 700, fontSize: '14px', marginBottom: '10px' }}>
                    Vector Databases:
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                    {vectorDBs.map((db, i) => (
                      <span key={i} className="tag-pill">{db}</span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
          <InsightBlock>
            Start simple: a basic RAG pipeline with fixed-size chunks and semantic search covers 80% of use cases. Add query rewriting, hybrid search, and re-ranking incrementally as you identify specific retrieval failures. Premature optimization leads to complexity without measurable gain.
          </InsightBlock>
        </>
      );
    }

    /* Main Guide Component */
    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);
      const contentRef = useRef(null);

      const stages = [
        { icon: SearchIcon, label: 'What is RAG', component: S1 },
        { icon: LayersIcon, label: 'Components', component: S2 },
        { icon: MicroscopeIcon, label: 'Under Hood', component: S3 },
        { icon: ScissorsIcon, label: 'Chunking', component: S4 },
        { icon: TargetIcon, label: 'Retrieval', component: S5 },
        { icon: RocketIcon, label: 'Production', component: S6 },
      ];

      const goTo = (idx) => {
        if (idx >= 0 && idx < stages.length) {
          setCurrentStage(idx);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        }
      };

      const CurrentComponent = stages[currentStage].component;

      return (
        <div className="container">
          <div className="sidebar scrollbar-hide">
            {stages.map((stage, idx) => {
              const IconComp = stage.icon;
              return (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    <button
                      className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                      onClick={() => goTo(idx)}
                    >
                      <IconComp />
                    </button>
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < stages.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              );
            })}
          </div>

          <div className="main-content">
            <div className="top-bar">
              <div className="left-section">
                <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                  <span className="guide-number">5.3</span>
                  <div className="title">RAG Architecture</div>
                </div>
                <div style={{ marginLeft: '20px' }}>
                  <div className="badge">DEEP DIVE</div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center' }}>
                <span className="progress-indicator">Page {currentStage + 1} of {stages.length}</span>
                <div className="nav-arrows">
                  <button
                    className="arrow-btn"
                    onClick={() => goTo(currentStage - 1)}
                    disabled={currentStage === 0}
                    title="Previous stage"
                  >
                    &#8592;
                  </button>
                  <button
                    className="arrow-btn"
                    onClick={() => goTo(currentStage + 1)}
                    disabled={currentStage === stages.length - 1}
                    title="Next stage"
                  >
                    &#8594;
                  </button>
                </div>
              </div>
            </div>

            <div className="content-area scrollbar-hide" ref={contentRef}>
              <div className="fade-in" key={currentStage}>
                <CurrentComponent />
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
