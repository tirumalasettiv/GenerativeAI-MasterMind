<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Multi-agent systems — teams of specialist agents coordinated by a supervisor. When and why.">

  <style>
    .pattern-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .pattern-card {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .pattern-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .pattern-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .pattern-label {
      font-weight: 700;
      font-size: 18px;
      color: #6c5ce7;
      margin-bottom: 4px;
    }

    .pattern-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

    .pattern-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-top: 0;
      padding-top: 0;
    }

    .pattern-card.expanded .pattern-detail {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .design-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .design-card {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .design-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .design-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .design-label {
      font-weight: 700;
      font-size: 18px;
      color: #6c5ce7;
      margin-bottom: 4px;
    }

    .design-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }


    .design-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-top: 0;
      padding-top: 0;
    }

    .design-card.expanded .design-detail {
      max-height: 400px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .framework-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .framework-card-emoji { font-size: 24px; flex-shrink: 0; }
    .framework-card-title { font-weight: 700; font-size: 16px; color: #1a1a1a; margin-bottom: 4px; }
    .framework-card-desc { font-size: 14px; color: #555; line-height: 1.6; }

    .gotcha-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: #fef5f5;
      border-radius: 8px;
      border: 1px solid #fce0e0;
      margin-bottom: 8px;
    }

    .gotcha-emoji { font-size: 20px; flex-shrink: 0; }
    .gotcha-label { font-weight: 700; font-size: 14px; color: #c0392b; }
    .gotcha-desc { font-size: 13px; color: #666; margin-top: 2px; }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
      font-weight: 500;
      color: #333;
    }

    .checklist-item.checked {
      border-color: #2ecc71;
      background: #f0faf0;
    }

    .checklist-item:hover {
      border-color: #6c5ce7;
    }

    .checklist-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .checklist-item.checked .checklist-checkbox {
      background: #2ecc71;
      border-color: #2ecc71;
      color: white;
    }

    .hierarchy-bar {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      margin-top: 16px;
    }

    .hierarchy-segment {
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      flex: 1;
      transition: all 0.3s ease;
    }

    .launch-btn {
      padding: 12px 32px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }

    .launch-btn:hover {
      background: #5a4bd1;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .launch-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Guide-specific animations */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* SVG flow animation for agentic pipeline */
    @keyframes flowPulse {
      0% { stroke-dashoffset: 8; }
      100% { stroke-dashoffset: 0; }
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">{insightSvg} INSIGHT</div>
          {children}
        </div>
      );
    }

    /* Sidebar icon components */

    function NetworkIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="5" r="3" />
          <circle cx="5" cy="19" r="3" />
          <circle cx="19" cy="19" r="3" />
          <line x1="12" y1="8" x2="5" y2="16" />
          <line x1="12" y1="8" x2="19" y2="16" />
          <line x1="5" y1="19" x2="19" y2="19" />
        </svg>
      );
    }

    function GridIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
      );
    }

    function RocketIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z" />
          <path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z" />
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" />
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
        </svg>
      );
    }

    function CogIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
        </svg>
      );
    }

    function ToolIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" />
        </svg>
      );
    }

    function CompassIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
        </svg>
      );
    }

    /* ========== Stage 1: What is Agentic AI? ========== */
    function S1() {
      const [selectedAgent, setSelectedAgent] = useState(null);

      const agents = [
        { id: 'director', label: 'Director', x: 200, y: 40, color: '#6c5ce7', desc: 'The orchestrator. Decomposes the project, assigns tasks, manages the timeline, and ensures all pieces come together cohesively.' },
        { id: 'writer', label: 'Writer', x: 60, y: 140, color: '#e17055', desc: 'The content specialist. Drafts scripts, dialogue, and narrative arcs based on the director\'s vision and research inputs.' },
        { id: 'cinematographer', label: 'Camera', x: 340, y: 140, color: '#00b894', desc: 'The visual expert. Plans shots, lighting, and composition. Translates written scenes into visual storytelling.' },
        { id: 'editor', label: 'Editor', x: 100, y: 250, color: '#fdcb6e', desc: 'The quality reviewer. Reviews all output against the original brief, catches errors, and ensures consistency across the project.' },
        { id: 'sound', label: 'Sound', x: 300, y: 250, color: '#74b9ff', desc: 'The audio specialist. Handles music, effects, and ambient sound. Works in parallel with the editor to finalize output.' }
      ];

      const connections = [
        ['director', 'writer'], ['director', 'cinematographer'],
        ['director', 'editor'], ['director', 'sound'],
        ['writer', 'editor'], ['cinematographer', 'editor'],
        ['editor', 'sound']
      ];

      const getAgent = (id) => agents.find(a => a.id === id);

      return (
        <>
          <div><div className="stage-header">What is Agentic AI?</div></div>
          <div className="explanation">
            Multiple specialized AI agents working together as a team, each with different expertise, collaborating on complex projects. You would never ask one person to be researcher, writer, editor, and publisher simultaneously &mdash; and you should not ask one AI agent to do it either.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div style={{ fontSize: '15px', lineHeight: '1.7', color: '#333', marginBottom: '20px' }}>
                <strong style={{ color: '#1a1a1a' }}>Analogy: A Film Production Crew.</strong> Click each agent node to learn its role.
              </div>
              <svg viewBox="0 0 400 310" style={{ width: '100%', maxWidth: '500px', margin: '0 auto', display: 'block' }} aria-label="Interactive multi-agent network diagram">
                {connections.map(([fromId, toId], idx) => {
                  const from = getAgent(fromId);
                  const to = getAgent(toId);
                  const isActive = selectedAgent === fromId || selectedAgent === toId;
                  return (
                    <line key={idx}
                      x1={from.x} y1={from.y} x2={to.x} y2={to.y}
                      stroke={isActive ? '#6c5ce7' : '#d0d0d0'}
                      strokeWidth={isActive ? 3 : 1.5}
                      strokeDasharray={isActive ? '0' : '4 4'}
                      style={isActive ? { animation: 'pulse 1.5s ease infinite' } : {}}
                    />
                  );
                })}
                {agents.map(agent => (
                  <g key={agent.id} onClick={() => setSelectedAgent(selectedAgent === agent.id ? null : agent.id)} style={{ cursor: 'pointer' }}>
                    <circle cx={agent.x} cy={agent.y} r={selectedAgent === agent.id ? 28 : 24}
                      fill={agent.color} stroke="white" strokeWidth="3"
                      style={{ transition: 'all 0.3s ease', filter: selectedAgent === agent.id ? 'drop-shadow(0 4px 8px rgba(0,0,0,0.2))' : 'none' }}
                    />
                    <text x={agent.x} y={agent.y + 4} textAnchor="middle" fill="white" fontSize="10" fontWeight="700" fontFamily="DM Sans">{agent.label}</text>
                  </g>
                ))}
              </svg>
              {selectedAgent && (
                <div className="fade-in" style={{ marginTop: '20px', padding: '16px 20px', background: 'white', borderRadius: '10px', border: `2px solid ${getAgent(selectedAgent).color}` }}>
                  <div style={{ fontWeight: 700, fontSize: '16px', color: getAgent(selectedAgent).color, marginBottom: '6px' }}>
                    {getAgent(selectedAgent).label}
                  </div>
                  <div style={{ fontSize: '14px', color: '#555', lineHeight: 1.6 }}>
                    {getAgent(selectedAgent).desc}
                  </div>
                </div>
              )}
              <div style={{ marginTop: '24px', padding: '16px 20px', background: '#f5f3ff', borderRadius: '10px', border: '1px solid #e8e3f8', textAlign: 'center' }}>
                <div style={{ fontSize: '13px', color: '#6c5ce7', fontWeight: 700, marginBottom: '4px' }}>CORNELL STUDY</div>
                <div style={{ fontSize: '28px', fontWeight: 700, color: '#1a1a1a', fontFamily: 'Fraunces, serif' }}>42.68% vs 2.92%</div>
                <div style={{ fontSize: '13px', color: '#666', marginTop: '4px' }}>Multi-agent success rate vs. single agent on complex planning tasks</div>
              </div>
            </div>
          </div>
          <InsightBlock>
            Agentic AI is not about making one model smarter &mdash; it is about making multiple models collaborate. Each agent has a focused role, clear inputs and outputs, and the orchestrator ensures the team delivers a result no single agent could achieve alone.
          </InsightBlock>
        </>
      );
    }

    /* ========== Stage 2: Four Patterns ========== */
    function S2() {
      const [expanded, setExpanded] = useState(null);

      const patterns = [
        {
          id: 'pipeline',
          emoji: '\u27A1\uFE0F',
          title: 'Pipeline',
          desc: 'Fixed order: Agent A \u2192 B \u2192 C. Like an assembly line.',
          detail: 'Each agent processes the output of the previous one in a strict sequence. Best for structured workflows, document processing, and compliance pipelines where order matters. Example: Research \u2192 Write \u2192 Edit \u2192 Publish. Predictable, easy to debug, but no parallelism.',
          bestFor: 'Structured workflows, document processing, compliance'
        },
        {
          id: 'supervisor',
          emoji: '\uD83D\uDC68\u200D\uD83D\uDCBC',
          title: 'Supervisor',
          desc: 'Central orchestrator decomposes tasks, assigns to specialists.',
          detail: 'A manager agent breaks down the task, delegates to specialized workers, and synthesizes results. Like a project manager. Roughly 70% of production multi-agent systems use this pattern. The supervisor can re-route, retry, and dynamically adjust assignments.',
          bestFor: 'Complex projects, dynamic task allocation'
        },
        {
          id: 'debate',
          emoji: '\u2696\uFE0F',
          title: 'Debate',
          desc: 'Multiple agents argue opposing positions; a judge synthesizes.',
          detail: 'Agents take different stances on a problem and present arguments. A judge agent evaluates the arguments and synthesizes a final answer. Like a courtroom. Research shows up to 23% higher accuracy on reasoning tasks. Best for risk assessment, legal analysis, and strategic planning.',
          bestFor: 'Risk assessment, legal analysis, strategic planning'
        },
        {
          id: 'swarm',
          emoji: '\uD83D\uDC1C',
          title: 'Swarm',
          desc: 'Autonomous agents with minimal central control, shared state.',
          detail: 'Agents operate independently with minimal coordination, sharing state through a common knowledge base. Like an ant colony. No single point of failure. Best for parallelizable tasks, distributed research, and exploratory analysis where agents can work simultaneously.',
          bestFor: 'Parallelizable tasks, distributed research, exploration'
        }
      ];

      return (
        <>
          <div><div className="stage-header">Four Patterns</div></div>
          <div className="explanation">
            Multi-agent systems are not one-size-fits-all. Four distinct collaboration patterns have emerged, each suited to different types of problems. Click each pattern to explore.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div className="pattern-grid">
                {patterns.map(p => (
                  <div key={p.id}
                    className={`pattern-card disclosure-card-host ${expanded === p.id ? 'expanded' : ''}`}
                    onClick={() => setExpanded(expanded === p.id ? null : p.id)}
                  >
                    <span className="disclosure-badge" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">
                        <polyline points="6 9 12 15 18 9" />
                      </svg>
                    </span>
                    <div className="pattern-label">{p.emoji} {p.title}</div>
                    <div className="pattern-description">{p.desc}</div>
                    <div className="pattern-detail">
                      {p.detail}
                      <div style={{ marginTop: '10px', padding: '8px 12px', background: '#e8e3f8', borderRadius: '6px', fontSize: '12px', fontWeight: 700, color: '#6c5ce7' }}>
                        Best for: {p.bestFor}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <InsightBlock>
            Most production systems use the <strong>Supervisor</strong> pattern (~70%). Start there unless your task specifically calls for debate (high-stakes reasoning) or swarm (massively parallel work). Pipelines work best when the sequence is well-defined and unlikely to change.
          </InsightBlock>
        </>
      );
    }

    /* ========== Stage 3: Product Launch Team ========== */
    function S3() {
      const [launchStep, setLaunchStep] = useState(-1);
      const [isRunning, setIsRunning] = useState(false);
      const [reviewLoop, setReviewLoop] = useState(false);

      const pipelineAgents = [
        { label: 'Research Agent', color: '#6c5ce7', desc: 'Gathers market data, competitor positioning, and audience insights. Outputs a structured brief.' },
        { label: 'Writing Agent', color: '#e17055', desc: 'Consumes the research brief, produces a campaign draft, and can generate channel-specific variants.' },
        { label: 'Editing Agent', color: '#00b894', desc: 'Reviews against the ORIGINAL research \u2014 not just the draft. Catches fabricated claims and factual issues.' },
        { label: 'Publishing Agent', color: '#74b9ff', desc: 'Formats content for blog, LinkedIn, and email. Pushes the final campaign live.' }
      ];

      const runLaunch = () => {
        setIsRunning(true);
        setLaunchStep(0);
        setReviewLoop(false);
        let step = 0;
        const timer = setInterval(() => {
          step++;
          if (step === 3) {
            setReviewLoop(true);
            setLaunchStep(step);
            setTimeout(() => {
              setReviewLoop(false);
              setLaunchStep(step);
              setTimeout(() => {
                setLaunchStep(4);
                setIsRunning(false);
                clearInterval(timer);
              }, 800);
            }, 1200);
            clearInterval(timer);
          } else {
            setLaunchStep(step);
          }
        }, 1000);
      };

      return (
        <>
          <div><div className="stage-header">Product Launch Team</div></div>
          <div className="explanation">
            A concrete example: a hybrid supervisor-pipeline for launching a marketing campaign. Four agents work in sequence with a supervisor oversight arc. The editing agent can kick work back &mdash; creating a review loop.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <svg viewBox="0 0 520 200" style={{ width: '100%', maxWidth: '560px', margin: '0 auto', display: 'block' }} aria-label="Product launch pipeline: Research, Writing, Editing, Publishing agents with supervisor oversight">
                {/* Supervisor arc */}
                <path d="M 65 40 Q 260 -20 455 40" fill="none" stroke="#b0a6e8" strokeWidth="2" strokeDasharray="6 4" />
                <text x="260" y="12" textAnchor="middle" fill="#b0a6e8" fontSize="11" fontWeight="700" fontFamily="DM Sans">SUPERVISOR OVERSIGHT</text>

                {/* Pipeline boxes */}
                {pipelineAgents.map((agent, idx) => {
                  const x = 10 + idx * 130;
                  const isActive = launchStep === idx;
                  const isDone = launchStep > idx;
                  return (
                    <g key={idx}>
                      <rect x={x} y="50" width="110" height="60" rx="10"
                        fill={isActive ? agent.color : isDone ? agent.color + '33' : 'white'}
                        stroke={agent.color} strokeWidth={isActive ? 3 : 2}
                        style={{ transition: 'all 0.4s ease' }}
                      />
                      <text x={x + 55} y="76" textAnchor="middle" fill={isActive ? 'white' : '#333'}
                        fontSize="11" fontWeight="700" fontFamily="DM Sans">{agent.label}</text>
                      <text x={x + 55} y="98" textAnchor="middle" fill={isActive ? 'rgba(255,255,255,0.8)' : '#999'}
                        fontSize="9" fontFamily="DM Sans">{isDone ? 'Done' : isActive ? 'Working...' : 'Waiting'}</text>
                      {idx < 3 && (
                        <path d={`M ${x + 110} 80 L ${x + 130} 80`}
                          stroke={isDone ? '#2ecc71' : '#d0d0d0'} strokeWidth="2" markerEnd="url(#arrow)" />
                      )}
                    </g>
                  );
                })}

                {/* Review loop arrow */}
                {reviewLoop && (
                  <g style={{ animation: 'fadeIn 0.3s ease' }}>
                    <path d="M 340 115 Q 280 160 210 115" fill="none" stroke="#e74c3c" strokeWidth="2.5" strokeDasharray="6 3"
                      style={{ animation: 'flowPulse 0.5s linear infinite' }} />
                    <text x="275" y="158" textAnchor="middle" fill="#e74c3c" fontSize="10" fontWeight="700" fontFamily="DM Sans">
                      Issues found! Revising...
                    </text>
                  </g>
                )}

                {/* Arrow marker */}
                <defs>
                  <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#999" />
                  </marker>
                </defs>

                {/* Completion badge */}
                {launchStep === 4 && (
                  <g style={{ animation: 'fadeIn 0.4s ease' }}>
                    <rect x="180" y="140" width="160" height="36" rx="18" fill="#2ecc71" />
                    <text x="260" y="163" textAnchor="middle" fill="white" fontSize="13" fontWeight="700" fontFamily="DM Sans">
                      Campaign Live!
                    </text>
                  </g>
                )}
              </svg>

              {launchStep >= 0 && launchStep < 4 && (
                <div className="fade-in" style={{ marginTop: '16px', padding: '14px 18px', background: 'white', borderRadius: '10px', border: `2px solid ${pipelineAgents[Math.min(launchStep, 3)].color}`, fontSize: '14px', color: '#555', lineHeight: 1.6 }}>
                  <strong style={{ color: pipelineAgents[Math.min(launchStep, 3)].color }}>{pipelineAgents[Math.min(launchStep, 3)].label}:</strong> {pipelineAgents[Math.min(launchStep, 3)].desc}
                </div>
              )}

              <div style={{ textAlign: 'center' }}>
                <button className="launch-btn" onClick={runLaunch} disabled={isRunning}>
                  {isRunning ? 'Running Campaign...' : launchStep === 4 ? 'Relaunch Campaign' : 'Launch Campaign'}
                </button>
              </div>
            </div>
          </div>
          <InsightBlock>
            The key insight: the Editing Agent reviews against the <strong>original research</strong>, not just the draft. If it finds fabricated claims, it kicks the draft back to the Writing Agent &mdash; creating a review loop within the pipeline. This is what makes agentic systems self-correcting.
          </InsightBlock>
        </>
      );
    }

    /* ========== Stage 4: Building Multi-Agent Systems ========== */
    function S4() {
      const [expanded, setExpanded] = useState(null);

      const designCards = [
        {
          id: 'agent-design',
          emoji: '\uD83E\uDDE9',
          title: 'Agent Design',
          desc: 'Define role, tools, and output format for each agent.',
          detail: 'Every agent needs three things: a role description (system prompt defining its expertise), tool access (which APIs and functions it can call), and a clear output format (structured JSON, markdown, or plain text). Keep scope narrow \u2014 an agent that does everything does nothing well.'
        },
        {
          id: 'communication',
          emoji: '\uD83D\uDCE1',
          title: 'Communication',
          desc: 'How agents talk to each other and pass work.',
          detail: 'Three communication patterns: Shared memory (blackboard pattern \u2014 all agents read/write a common state), Direct messages (agent-to-agent handoffs with typed contracts), and Event bus (publish-subscribe for loosely coupled agents). Define clear handoff protocols: what data is passed, what format, what the receiver should do.'
        },
        {
          id: 'memory',
          emoji: '\uD83E\uDDE0',
          title: 'Memory & State',
          desc: 'Short-term, long-term, and shared team knowledge.',
          detail: 'Short-term memory: the current conversation context within a single task. Long-term memory: a vector store for past work, decisions, and learned patterns. Shared state: a team knowledge base that all agents can read and update. Without proper memory, agents repeat mistakes or contradict each other.'
        },
        {
          id: 'errors',
          emoji: '\uD83D\uDEE1\uFE0F',
          title: 'Error Handling',
          desc: 'What happens when an agent fails or produces bad output.',
          detail: 'Four strategies: Retry with feedback (tell the agent what went wrong), Escalate to supervisor (let the orchestrator decide next steps), Fallback to simpler agent (degrade gracefully), and Human-in-the-loop (escalate to a person for critical decisions). Never let a failed agent silently corrupt the pipeline.'
        }
      ];

      return (
        <>
          <div><div className="stage-header">Building Multi-Agent Systems</div></div>
          <div className="explanation">
            The hardest part is not individual agents &mdash; it is coordination. Four design dimensions determine whether your multi-agent system works or falls apart. Click each card to explore.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div className="design-grid">
                {designCards.map(card => (
                  <div key={card.id}
                    className={`design-card disclosure-card-host ${expanded === card.id ? 'expanded' : ''}`}
                    onClick={() => setExpanded(expanded === card.id ? null : card.id)}
                  >
                    <span className="disclosure-badge" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">
                        <polyline points="6 9 12 15 18 9" />
                      </svg>
                    </span>
                    <div className="design-label">{card.emoji} {card.title}</div>
                    <div className="design-description">{card.desc}</div>
                    <div className="design-detail">{card.detail}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <InsightBlock>
            &ldquo;The hardest part isn&rsquo;t individual agents &mdash; it&rsquo;s coordination.&rdquo; Most multi-agent failures come from poor inter-agent contracts, not from weak individual agents. Define clear input/output schemas between every agent pair before writing any agent logic.
          </InsightBlock>
        </>
      );
    }

    /* ========== Stage 5: Frameworks & Tools ========== */
    function S5() {
      const frameworks = [
        {
          emoji: '\uD83D\uDE80',
          title: 'CrewAI',
          desc: 'Best for prototyping and experimentation. Lowest barrier to entry \u2014 define agents in under 20 lines of Python. Role-based agent definition with built-in task delegation. Great for proof-of-concept, but less control over complex state management.',
          color: '#6c5ce7'
        },
        {
          emoji: '\uD83D\uDD17',
          title: 'LangGraph',
          desc: 'Best for production systems. Graph-based workflows with explicit state machines, checkpointing, and human-in-the-loop support. Most battle-tested in enterprise environments. Steeper learning curve, but offers the most control over agent orchestration.',
          color: '#00b894'
        },
        {
          emoji: '\uD83D\uDCAC',
          title: 'AutoGen / AG2',
          desc: 'Best for conversational multi-agent patterns. Designed for multi-party dialogue, group debates, and collaborative reasoning. Agents talk to each other naturally. Ideal for debate patterns and scenarios requiring agent-to-agent negotiation.',
          color: '#e17055'
        }
      ];

      const gotchas = [
        { emoji: '\u26A0\uFE0F', label: 'Over-engineering', desc: 'Using 5 agents when 1 would do. Start simple, add agents only when you prove a single agent cannot handle the task.' },
        { emoji: '\uD83D\uDCC4', label: 'Poor Inter-Agent Contracts', desc: 'Agents passing unstructured text instead of typed schemas. Define JSON contracts between every agent pair.' },
        { emoji: '\uD83D\uDD0D', label: 'Missing Observability', desc: 'No logging of agent-to-agent communication. You cannot debug what you cannot see. Log every handoff.' },
        { emoji: '\uD83D\uDCA7', label: 'Context Bleed', desc: 'Agent A\'s context leaking into Agent B. Each agent should have a clean, scoped context window with only what it needs.' }
      ];

      return (
        <>
          <div><div className="stage-header">Frameworks & Tools</div></div>
          <div className="explanation">
            Three major frameworks have emerged for building multi-agent systems. Each serves a different use case. Below, also find the four most common gotchas that trip up builders.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div style={{ fontSize: '15px', fontWeight: 700, color: '#1a1a1a', marginBottom: '16px' }}>Frameworks</div>
              {frameworks.map((fw, idx) => (
                <div className="framework-card fade-in" key={idx}
                  style={{ borderLeftColor: fw.color, animationDelay: `${0.15 * idx}s` }}>
                  <div className="framework-card-emoji">{fw.emoji}</div>
                  <div>
                    <div className="framework-card-title">{fw.title}</div>
                    <div className="framework-card-desc">{fw.desc}</div>
                  </div>
                </div>
              ))}

              <div style={{ fontSize: '15px', fontWeight: 700, color: '#c0392b', marginTop: '28px', marginBottom: '16px' }}>Common Gotchas</div>
              {gotchas.map((g, idx) => (
                <div className="gotcha-row fade-in" key={idx} style={{ animationDelay: `${0.1 * idx}s` }}>
                  <div className="gotcha-emoji">{g.emoji}</div>
                  <div>
                    <div className="gotcha-label">{g.label}</div>
                    <div className="gotcha-desc">{g.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            Start with <strong>CrewAI</strong> for prototyping, graduate to <strong>LangGraph</strong> for production. Use <strong>AutoGen</strong> when your agents need to debate or negotiate. The framework matters less than getting your agent contracts and error handling right.
          </InsightBlock>
        </>
      );
    }

    /* ========== S6 Decision Matrix Diagram ========== */
    function S6Diagram() {
      const quadrants = [
        { label: 'Workflow',     x: 54,  y: 48,  color: '#6c5ce7', bg: '#f5f3ff' },
        { label: 'Agentic AI',  x: 214, y: 48,  color: '#e056a0', bg: '#fdf0f7' },
        { label: 'RAG + Agent', x: 54,  y: 158, color: '#3498db', bg: '#e0f0ff' },
        { label: 'Single Agent',x: 214, y: 158, color: '#f39c12', bg: '#fff8e1' },
      ];
      return (
        <svg width="400" height="290" viewBox="0 0 400 290"
          style={{ maxWidth: '100%', overflow: 'visible', marginBottom: '20px' }}
          aria-label="2x2 decision matrix for choosing architecture: axes are Task Complexity and Uncertainty">
          <defs>
            <marker id="axisArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
              <polygon points="0 0,8 3,0 6" fill="#ccc" />
            </marker>
          </defs>
          {/* Axes */}
          <line x1="44" y1="256" x2="390" y2="256" stroke="#ccc" strokeWidth="2" markerEnd="url(#axisArr)" />
          <line x1="44" y1="256" x2="44" y2="22" stroke="#ccc" strokeWidth="2" markerEnd="url(#axisArr)" />
          {/* Axis labels */}
          <text x="217" y="276" textAnchor="middle" fontSize="11" fontWeight="600" fill="#888" fontFamily="DM Sans">Task Complexity →</text>
          <text x="14" y="140" textAnchor="middle" fontSize="11" fontWeight="600" fill="#888"
            fontFamily="DM Sans" transform="rotate(-90 14 140)">Uncertainty →</text>
          {/* Crosshair */}
          <line x1="214" y1="22" x2="214" y2="256" stroke="#e8e8e8" strokeWidth="1" strokeDasharray="4 4" />
          <line x1="44" y1="148" x2="390" y2="148" stroke="#e8e8e8" strokeWidth="1" strokeDasharray="4 4" />
          {/* Tick labels */}
          <text x="129" y="270" textAnchor="middle" fontSize="10" fill="#bbb" fontFamily="DM Sans">Low</text>
          <text x="302" y="270" textAnchor="middle" fontSize="10" fill="#bbb" fontFamily="DM Sans">High</text>
          <text x="32" y="216" textAnchor="middle" fontSize="10" fill="#bbb" fontFamily="DM Sans">Low</text>
          <text x="32" y="68" textAnchor="middle" fontSize="10" fill="#bbb" fontFamily="DM Sans">High</text>
          {/* Quadrant boxes */}
          {quadrants.map(q => (
            <g key={q.label}>
              <rect x={q.x} y={q.y} width="148" height="88" rx="12"
                fill={q.bg} stroke={q.color} strokeWidth="2" />
              <text x={q.x + 74} y={q.y + 48} textAnchor="middle"
                fontSize="13" fontWeight="700" fill={q.color} fontFamily="DM Sans">{q.label}</text>
            </g>
          ))}
        </svg>
      );
    }

    /* ========== Stage 6: When to Use ========== */
    function S6() {
      const [checks, setChecks] = useState([false, false, false, false]);

      const questions = [
        'Multiple expertise areas needed?',
        'Quality matters more than speed?',
        'Work benefits from review / critique cycles?',
        'Complex project, not a simple task?'
      ];

      const toggleCheck = (idx) => {
        const next = [...checks];
        next[idx] = !next[idx];
        setChecks(next);
      };

      const count = checks.filter(Boolean).length;

      const getRecommendation = () => {
        if (count >= 3) return { text: 'Agentic AI recommended', color: '#2ecc71', bg: '#f0faf0' };
        if (count >= 1) return { text: 'Consider your needs carefully', color: '#f39c12', bg: '#fef9e7' };
        return { text: 'Try a simpler architecture first', color: '#e74c3c', bg: '#fef5f5' };
      };

      const rec = getRecommendation();

      const hierarchy = [
        { label: 'LLM Chat', color: '#74b9ff', textColor: '#1a5276' },
        { label: 'RAG', color: '#81ecec', textColor: '#0c5e5e' },
        { label: 'Workflow', color: '#fdcb6e', textColor: '#7d6608' },
        { label: 'Agent', color: '#fab1a0', textColor: '#7f3b2e' },
        { label: 'Agentic', color: '#6c5ce7', textColor: '#ffffff' }
      ];

      return (
        <>
          <div><div className="stage-header">When to Use Agentic AI</div></div>
          <div className="explanation">
            Agentic AI is powerful but expensive (~40,000 tokens per query). Use this decision checklist to determine if your problem truly needs a multi-agent approach, or if a simpler architecture will serve you better.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <S6Diagram />
              <div style={{ fontSize: '15px', fontWeight: 700, color: '#1a1a1a', marginBottom: '16px' }}>Decision Checklist</div>
              {questions.map((q, idx) => (
                <div key={idx}
                  className={`checklist-item ${checks[idx] ? 'checked' : ''}`}
                  onClick={() => toggleCheck(idx)}
                >
                  <div className="checklist-checkbox">
                    {checks[idx] ? '\u2713' : ''}
                  </div>
                  {q}
                </div>
              ))}

              <div className="fade-in" style={{ marginTop: '20px', padding: '16px 24px', background: rec.bg, borderRadius: '12px', border: `2px solid ${rec.color}`, textAlign: 'center' }}>
                <div style={{ fontSize: '13px', fontWeight: 700, color: rec.color, marginBottom: '4px' }}>
                  {count} of 4 checked
                </div>
                <div style={{ fontSize: '20px', fontWeight: 700, color: rec.color, fontFamily: 'Fraunces, serif' }}>
                  {rec.text}
                </div>
              </div>

              <div style={{ fontSize: '15px', fontWeight: 700, color: '#1a1a1a', marginTop: '28px', marginBottom: '12px' }}>Architecture Hierarchy (simplest to most complex)</div>
              <div className="hierarchy-bar">
                {hierarchy.map((h, idx) => (
                  <div key={idx} className="hierarchy-segment"
                    style={{
                      background: h.color,
                      color: h.textColor,
                      borderRadius: idx === 0 ? '10px 0 0 10px' : idx === hierarchy.length - 1 ? '0 10px 10px 0' : '0'
                    }}>
                    {h.label}
                  </div>
                ))}
              </div>
              <div style={{ textAlign: 'center', fontSize: '11px', color: '#999', marginTop: '6px' }}>
                Simple &rarr; Complex &nbsp;&nbsp;|&nbsp;&nbsp; Low cost &rarr; ~40,000 tokens/query ($$$$$)
              </div>

              <div style={{ marginTop: '24px', padding: '16px 20px', background: '#f5f3ff', borderRadius: '10px', border: '1px solid #e8e3f8', textAlign: 'center' }}>
                <div style={{ fontSize: '13px', color: '#6c5ce7', fontWeight: 700, marginBottom: '4px' }}>GARTNER PREDICTION</div>
                <div style={{ fontSize: '24px', fontWeight: 700, color: '#1a1a1a', fontFamily: 'Fraunces, serif' }}>33%</div>
                <div style={{ fontSize: '13px', color: '#666', marginTop: '4px' }}>of enterprise software will include agentic AI by 2028</div>
              </div>
            </div>
          </div>
          <InsightBlock>
            &ldquo;Don&rsquo;t use a construction crew when you need a handyman.&rdquo; Agentic AI is the most powerful architecture in the hierarchy, but it is also the most expensive and hardest to debug. Always start with the simplest architecture that solves your problem and scale up only when you hit its limits.
          </InsightBlock>
        </>
      );
    }

    /* ========== Main Guide Component ========== */
    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stages = [
        { icon: NetworkIcon, label: 'What', component: S1 },
        { icon: GridIcon, label: 'Patterns', component: S2 },
        { icon: RocketIcon, label: 'Example', component: S3 },
        { icon: CogIcon, label: 'Building', component: S4 },
        { icon: ToolIcon, label: 'Tools', component: S5 },
        { icon: CompassIcon, label: 'When', component: S6 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) setCurrentStage(currentStage + 1);
      };

      const handlePrev = () => {
        if (currentStage > 0) setCurrentStage(currentStage - 1);
      };

      const handleStageClick = (idx) => setCurrentStage(idx);

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {stages.map((stage, idx) => {
                const IconComp = stage.icon;
                return (
                  <React.Fragment key={idx}>
                    <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                      <button
                        type="button"
                        className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                        aria-label={`Step ${idx + 1}: ${stage.label}`}
                        aria-current={currentStage === idx ? "step" : undefined}
                        onClick={() => handleStageClick(idx)}
                      >
                        <IconComp />
                      </button>
                      <div className="step-btn-label">{stage.label}</div>
                    </div>
                    {idx < stages.length - 1 && (
                      <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">5.6</span>
                    <div className="title">Agentic AI</div>
                  </div>
                  <div style={{ marginLeft: '20px' }}>
                    <div className="badge">DEEP DIVE</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of 6</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentStage === 0}
                      aria-label="Previous section"
                      title="Previous stage"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={currentStage === stages.length - 1}
                      aria-label="Next section"
                      title="Next stage"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide">
                <CurrentComponent />
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
