<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Five AI Architectures: Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@6..72,600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; font-family:'DM Sans',sans-serif; background:#fff; color:#1a1a1a; overflow:hidden; }
    #root { width:100%; height:100%; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes slideInRight { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
    @keyframes slideInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const P = {
      root: { display:'flex', flexDirection:'row', width:'100%', height:'100%', backgroundColor:'#fff', overflow:'hidden' },
      sidebar: { width:'180px', backgroundColor:'#f8f9fa', borderRight:'1px solid #e9ecef', padding:'24px 16px', overflowY:'auto', display:'flex', flexDirection:'column', alignItems:'center', gap:'8px', position:'relative' },
      stepCircle: (isActive, isComplete) => ({ width:'60px', height:'60px', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', transition:'all 0.3s ease', backgroundColor: isActive ? '#6c5ce7' : isComplete ? '#2ecc71' : '#e9ecef', color: isActive || isComplete ? '#fff' : '#666', fontSize:'24px', fontWeight:'700', position:'relative', zIndex:2, border: isActive ? '3px solid #6c5ce7' : 'none', boxShadow: isActive ? '0 4px 12px rgba(108,92,231,0.3)' : 'none' }),
      stepLabel: { fontSize:'11px', fontWeight:'500', marginTop:'8px', textAlign:'center', color:'#666', width:'80px', lineHeight:'1.2' },
      connector: (isComplete) => ({ width:'2px', height:'28px', backgroundColor: isComplete ? '#2ecc71' : '#d0d0d0', margin:'4px 0', transition:'background-color 0.3s ease' }),
      main: { flex:1, display:'flex', flexDirection:'column', overflow:'hidden', backgroundColor:'#fff' },
      topBar: { height:'64px', borderBottom:'1px solid #e9ecef', padding:'12px 32px', display:'flex', alignItems:'center', justifyContent:'space-between', backgroundColor:'#f8f9fa' },
      leftSection: { display:'flex', alignItems:'center', gap:'16px' },
      backLink: { fontSize:'13px', color:'#6c5ce7', textDecoration:'none', fontWeight:'500' },
      badge: { display:'inline-block', backgroundColor:'#e8f0fe', color:'#6c5ce7', padding:'6px 12px', borderRadius:'20px', fontSize:'11px', fontWeight:'600', textTransform:'uppercase', letterSpacing:'0.5px' },
      title: { fontSize:'20px', fontWeight:'600', color:'#1a1a1a', fontFamily:"'Fraunces', serif" },
      navRow: { display:'flex', alignItems:'center', gap:'24px' },
      navBtn: (disabled) => ({ width:'36px', height:'36px', borderRadius:'12px', border:'1px solid #d0d0d0', backgroundColor: disabled ? '#f0f0f0' : '#fff', color: disabled ? '#bbb' : '#1a1a1a', cursor: disabled ? 'default' : 'pointer', fontSize:'18px', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:'600' }),
      navP: { fontSize:'12px', color:'#666', fontWeight:'500', minWidth:'60px', textAlign:'right' },
      content: { flex:1, padding:'40px 48px', overflowY:'auto', scrollBehavior:'smooth', display:'flex', flexDirection:'column', gap:'32px' },
      explainRow: { display:'flex', flexDirection:'column', gap:'16px' },
      explain: { fontSize:'18px', lineHeight:'1.6', color:'#333', maxWidth:'600px' },
      scene: { backgroundColor:'#f8f9fa', borderRadius:'16px', padding:'32px', border:'1px solid #e9ecef', boxShadow:'0 2px 8px rgba(0,0,0,0.04)', minHeight:'280px', display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.5s ease-out', flexDirection:'column', gap:'24px' },
      insightLabel: { fontSize:'11px', fontWeight:'700', textTransform:'uppercase', letterSpacing:'0.5px', color:'#1a9456', marginBottom:'8px' },
      insight: { backgroundColor:'#f0faf0', borderLeft:'4px solid #2ecc71', borderRadius:'8px', padding:'20px', fontSize:'16px', lineHeight:'1.6', color:'#333' }
    };

    function S1() {
      const [selectedArch, setSelectedArch] = useState(0);
      const architectures = [
        { num: 1, name: 'LLM Chat', emoji: '\ud83d\udcac', desc: 'Direct Q&A, no custom data' },
        { num: 2, name: 'RAG', emoji: '\ud83d\udd0d', desc: 'Search + Answer with your data' },
        { num: 3, name: 'Workflow', emoji: '\ud83d\udd04', desc: 'Fixed steps, reliable sequence' },
        { num: 4, name: 'Agent', emoji: '\ud83e\udd16', desc: 'Smart steps, goal-focused' },
        { num: 5, name: 'Agentic AI', emoji: '\ud83d\udc65', desc: 'Multi-agent teams' }
      ];
      return (
        <div style={P.scene}>
          <div style={{display:'flex', justifyContent:'center', gap:'8px', width:'100%', flexWrap:'wrap'}}>
            {architectures.map((arch, idx) => {
              const progress = idx / 4;
              const basePurple = 108;
              const r = Math.floor(basePurple + (150 - basePurple) * progress);
              const g = Math.floor(92 + (60 - 92) * progress);
              const b = Math.floor(231 + (160 - 231) * progress);
              const color = `rgb(${r},${g},${b})`;
              return (
                <div key={idx} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:'8px', cursor:'pointer', opacity: selectedArch === idx ? 1 : 0.6, transition:'opacity 0.2s'}} onClick={() => setSelectedArch(idx)}>
                  <div style={{width:'64px', height:'64px', borderRadius:'50%', backgroundColor:color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'28px', color:'#fff', fontWeight:'700', boxShadow: selectedArch === idx ? `0 4px 12px ${color}80` : 'none', transform: selectedArch === idx ? 'scale(1.1)' : 'scale(1)', transition:'all 0.2s'}}>
                    {arch.num}
                  </div>
                  <div style={{fontSize:'12px', fontWeight:'600', textAlign:'center', width:'70px'}}>{arch.name}</div>
                </div>
              );
            })}
          </div>
          <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'20px', textAlign:'center', minWidth:'350px'}}>
            <div style={{fontSize:'32px', marginBottom:'12px'}}>{architectures[selectedArch].emoji}</div>
            <div style={{fontSize:'18px', fontWeight:'600', marginBottom:'8px'}}>{architectures[selectedArch].name}</div>
            <div style={{fontSize:'14px', color:'#666'}}>{architectures[selectedArch].desc}</div>
          </div>
        </div>
      );
    }

    function S2() {
      const [highlight, setHighlight] = useState(null);
      return (
        <div style={P.scene}>
          <div style={{display:'flex', gap:'32px', width:'100%', justifyContent:'center', padding:'0 32px'}}>
            <div style={{flex:1, backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'24px', opacity: highlight === 'rag' ? 1 : 0.7, transition:'opacity 0.2s', cursor:'pointer'}} onMouseEnter={() => setHighlight('rag')} onMouseLeave={() => setHighlight(null)}>
              <div style={{fontSize:'13px', fontWeight:'600', color:'#6c5ce7', marginBottom:'12px'}}>BASIC LLM CHAT</div>
              <div style={{display:'flex', alignItems:'center', gap:'12px', marginBottom:'16px'}}>
                <span style={{fontSize:'18px'}}>User Q</span>
                <span style={{fontSize:'18px', color:'#999'}}>→</span>
                <span style={{fontSize:'20px'}}>🧠</span>
                <span style={{fontSize:'18px', color:'#999'}}>→</span>
                <span style={{fontSize:'18px'}}>Answer</span>
              </div>
              <div style={{backgroundColor:'#ffe8e8', borderLeft:'3px solid #ff6b6b', padding:'12px', borderRadius:'6px', fontSize:'13px', color:'#a00', fontWeight:'500'}}>No custom data</div>
              <div style={{marginTop:'16px', fontSize:'12px', color:'#666', lineHeight:'1.5'}}>
                <strong>Best For:</strong> General Q&A, chat, brainstorming, no proprietary data needed
              </div>
            </div>
            <div style={{flex:1, backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'24px', opacity: highlight === 'llm' ? 1 : 0.7, transition:'opacity 0.2s', cursor:'pointer'}} onMouseEnter={() => setHighlight('llm')} onMouseLeave={() => setHighlight(null)}>
              <div style={{fontSize:'13px', fontWeight:'600', color:'#2ecc71', marginBottom:'12px'}}>RAG (RETRIEVAL-AUGMENTED)</div>
              <div style={{display:'flex', alignItems:'center', gap:'8px', marginBottom:'16px', flexWrap:'wrap'}}>
                <span style={{fontSize:'16px'}}>Q</span>
                <span style={{fontSize:'14px', color:'#999'}}>→</span>
                <span style={{fontSize:'16px'}}>🔍</span>
                <span style={{fontSize:'14px', color:'#999'}}>→</span>
                <span style={{fontSize:'16px'}}>Chunks</span>
                <span style={{fontSize:'14px', color:'#999'}}>→</span>
                <span style={{fontSize:'16px'}}>🧠</span>
                <span style={{fontSize:'14px', color:'#999'}}>→</span>
                <span style={{fontSize:'16px'}}>Answer</span>
              </div>
              <div style={{backgroundColor:'#e8f8f0', borderLeft:'3px solid #2ecc71', padding:'12px', borderRadius:'6px', fontSize:'13px', color:'#1a9456', fontWeight:'500'}}>Your data ✓</div>
              <div style={{marginTop:'16px', fontSize:'12px', color:'#666', lineHeight:'1.5'}}>
                <strong>Best For:</strong> Q&A from docs, company knowledge, customer service, grounded answers
              </div>
            </div>
          </div>
        </div>
      );
    }

    function S3() {
      const [step, setStep] = useState(0);
      const steps = ['Timer ⏱', 'Fetch Website 🌐', 'Extract Changes 🤖', 'Compare to Last Week 📊', 'Format Report 📋', 'Send to Slack 📬'];
      useEffect(() => {
        const timer = setInterval(() => setStep(s => (s + 1) % steps.length), 1200);
        return () => clearInterval(timer);
      }, []);
      return (
        <div style={P.scene}>
          <div style={{display:'flex', gap:'8px', justifyContent:'center', flexWrap:'wrap', marginBottom:'24px'}}>
            {steps.map((s, idx) => (
              <div key={idx} style={{display:'flex', alignItems:'center', gap:'8px'}}>
                <div style={{backgroundColor: idx <= step ? '#6c5ce7' : '#e9ecef', color: idx <= step ? '#fff' : '#999', padding:'10px 16px', borderRadius:'8px', fontSize:'12px', fontWeight:'600', transition:'all 0.3s', transform: idx === step ? 'scale(1.05)' : 'scale(1)'}}>{s}</div>
                {idx < steps.length - 1 && <span style={{fontSize:'16px', color: idx < step ? '#6c5ce7' : '#ccc', transition:'color 0.3s'}}>→</span>}
              </div>
            ))}
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'24px', width:'100%'}}>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'16px'}}>
              <div style={{fontSize:'12px', fontWeight:'600', color:'#666', marginBottom:'8px'}}>CHARACTERISTIC</div>
              <div style={{fontSize:'13px', color:'#333'}}>Fixed flow</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'16px'}}>
              <div style={{fontSize:'12px', fontWeight:'600', color:'#666', marginBottom:'8px'}}>YOU DESIGN</div>
              <div style={{fontSize:'13px', color:'#333'}}>Every step & order</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'16px'}}>
              <div style={{fontSize:'12px', fontWeight:'600', color:'#666', marginBottom:'8px'}}>RELIABILITY</div>
              <div style={{fontSize:'13px', color:'#333'}}>Very high (predictable)</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'12px', padding:'16px'}}>
              <div style={{fontSize:'12px', fontWeight:'600', color:'#666', marginBottom:'8px'}}>FLEXIBILITY</div>
              <div style={{fontSize:'13px', color:'#333'}}>Low (same order always)</div>
            </div>
          </div>
          <div style={{fontSize:'12px', color:'#666', textAlign:'center', marginTop:'12px'}}>Tools: N8N, Make, Zapier</div>
        </div>
      );
    }

    function S4() {
      const [selectedAgent, setSelectedAgent] = useState(0);
      const agents = [
        { name: 'Researcher', role: 'Gathers facts and data' },
        { name: 'Writer', role: 'Creates content from research' },
        { name: 'Editor', role: 'Reviews and refines' },
        { name: 'Publisher', role: 'Formats and distributes' }
      ];
      return (
        <div style={P.scene}>
          <div style={{width:'100%'}}>
            <div style={{fontSize:'13px', fontWeight:'600', color:'#666', marginBottom:'16px'}}>SINGLE AGENT (ReAct Loop)</div>
            <div style={{display:'flex', gap:'12px', justifyContent:'center', marginBottom:'32px', flexWrap:'wrap'}}>
              <div style={{backgroundColor:'#e8f0fe', padding:'12px 16px', borderRadius:'8px', fontSize:'12px', fontWeight:'600', color:'#6c5ce7'}}>Goal</div>
              <span style={{color:'#ccc'}}>→</span>
              <div style={{backgroundColor:'#e8f0fe', padding:'12px 16px', borderRadius:'8px', fontSize:'12px', fontWeight:'600', color:'#6c5ce7'}}>Thought</div>
              <span style={{color:'#ccc'}}>→</span>
              <div style={{backgroundColor:'#e8f0fe', padding:'12px 16px', borderRadius:'8px', fontSize:'12px', fontWeight:'600', color:'#6c5ce7'}}>Action</div>
              <span style={{color:'#ccc'}}>→</span>
              <div style={{backgroundColor:'#e8f0fe', padding:'12px 16px', borderRadius:'8px', fontSize:'12px', fontWeight:'600', color:'#6c5ce7'}}>Observe</div>
              <span style={{color:'#ccc'}}>↻</span>
            </div>
          </div>
          <div style={{width:'100%'}}>
            <div style={{fontSize:'13px', fontWeight:'600', color:'#666', marginBottom:'16px'}}>AGENTIC AI (Multi-Agent Team)</div>
            <div style={{display:'flex', justifyContent:'center', gap:'32px', marginBottom:'16px'}}>
              {agents.map((agent, idx) => (
                <div key={idx} style={{textAlign:'center', cursor:'pointer', opacity: selectedAgent === idx ? 1 : 0.6, transition:'opacity 0.2s'}} onClick={() => setSelectedAgent(idx)}>
                  <div style={{width:'64px', height:'64px', borderRadius:'50%', backgroundColor: selectedAgent === idx ? '#6c5ce7' : '#f0f0f0', color: selectedAgent === idx ? '#fff' : '#666', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'28px', fontWeight:'700', margin:'0 auto 8px', transition:'all 0.2s', boxShadow: selectedAgent === idx ? '0 4px 12px rgba(108,92,231,0.3)' : 'none'}}>
                    {idx + 1}
                  </div>
                  <div style={{fontSize:'12px', fontWeight:'600'}}>{agent.name}</div>
                </div>
              ))}
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'8px', padding:'12px 16px', textAlign:'center', fontSize:'12px', color:'#666'}}>
              {agents[selectedAgent].role}
            </div>
          </div>
        </div>
      );
    }

    function S5() {
      const [selected, setSelected] = useState(null);
      const decisions = [
        { id: 'need_data', q: 'Need custom data?', yes: 'next1', no: 'llm' },
        { id: 'next1', q: 'Fixed steps?', yes: 'workflow', no: 'next2' },
        { id: 'next2', q: 'Simple Q&A?', yes: 'rag', no: 'next3' },
        { id: 'next3', q: 'Multiple expertise?', yes: 'agentic', no: 'agent' },
        { id: 'llm', name: 'LLM Chat', color: '#6c5ce7' },
        { id: 'rag', name: 'RAG', color: '#3498db' },
        { id: 'workflow', name: 'Workflow', color: '#9b59b6' },
        { id: 'agent', name: 'AI Agent', color: '#e74c3c' },
        { id: 'agentic', name: 'Agentic AI', color: '#27ae60' }
      ];
      const decisionTree = [
        { id: 'need_data', x: 50, y: 10, w: 120, h: 60 },
        { id: 'next1', x: 20, y: 30, w: 120, h: 60 },
        { id: 'next2', x: 80, y: 30, w: 120, h: 60 },
        { id: 'next3', x: 80, y: 50, w: 120, h: 60 },
        { id: 'llm', x: 5, y: 50, w: 100, h: 50 },
        { id: 'workflow', x: 20, y: 50, w: 100, h: 50 },
        { id: 'rag', x: 80, y: 50, w: 100, h: 50 },
        { id: 'agent', x: 90, y: 70, w: 100, h: 50 },
        { id: 'agentic', x: 100, y: 70, w: 100, h: 50 }
      ];
      return (
        <div style={P.scene}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'24px', width:'100%', fontSize:'13px'}}>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'8px', padding:'16px'}}>
              <div style={{fontWeight:'600', color:'#6c5ce7', marginBottom:'8px'}}>LLM Chat</div>
              <div style={{fontSize:'12px', color:'#666', lineHeight:'1.5'}}>Direct Q&A, general knowledge, no proprietary data</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'8px', padding:'16px'}}>
              <div style={{fontWeight:'600', color:'#3498db', marginBottom:'8px'}}>RAG</div>
              <div style={{fontSize:'12px', color:'#666', lineHeight:'1.5'}}>Question answering from documents, company knowledge</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'8px', padding:'16px'}}>
              <div style={{fontWeight:'600', color:'#9b59b6', marginBottom:'8px'}}>Workflow</div>
              <div style={{fontSize:'12px', color:'#666', lineHeight:'1.5'}}>Fixed sequences, automation, scheduled tasks, monitoring</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'8px', padding:'16px'}}>
              <div style={{fontWeight:'600', color:'#e74c3c', marginBottom:'8px'}}>AI Agent</div>
              <div style={{fontSize:'12px', color:'#666', lineHeight:'1.5'}}>Goal-oriented, flexible steps, reasoning, one area of expertise</div>
            </div>
            <div style={{backgroundColor:'#fff', border:'1px solid #e9ecef', borderRadius:'8px', padding:'16px', gridColumn:'1 / -1'}}>
              <div style={{fontWeight:'600', color:'#27ae60', marginBottom:'8px'}}>Agentic AI</div>
              <div style={{fontSize:'12px', color:'#666', lineHeight:'1.5'}}>Complex projects, multiple specialized agents, research → write → edit → publish teams</div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [stage, setStage] = useState(0);
      const stages = [
        { num: 1, label: 'Big Picture', component: S1 },
        { num: 2, label: 'Simple Ones', component: S2 },
        { num: 3, label: 'Workflows', component: S3 },
        { num: 4, label: 'Smart Ones', component: S4 },
        { num: 5, label: 'Choose', component: S5 }
      ];
      const stageData = [
        { explain: 'There are 5 ways to build AI solutions, from simple chat to autonomous AI teams. Choosing the right one depends on task complexity.', insight: 'Think of it as choosing the right vehicle: bicycle (LLM Chat) for short trips, car (RAG) for daily commutes, bus (Workflow) for fixed routes, taxi (Agent) for flexible trips, fleet (Agentic) for logistics.' },
        { explain: 'Basic LLM Chat is like texting a smart friend. RAG adds a library search before answering—it retrieves relevant documents first, then answers based on both the question and your data.', insight: 'LLM Chat = encyclopedia. RAG = librarian who checks your files first. If you need answers from YOUR data, you need RAG.' },
        { explain: 'Multiple AI steps chained in a fixed sequence, like a factory assembly line where each station does one job. You design every step in advance, and they execute in the same order every time.', insight: 'Workflows = assembly line. Same steps, same order, every time. Use when you know EXACTLY what needs to happen.' },
        { explain: 'Agents decide their own next steps using tools. An Agent figures out how to reach a goal. Agentic AI means teams of specialized agents collaborating on complex projects—like a research, writing, editing, publishing pipeline.', insight: 'Agent = personal assistant who figures it out. Agentic = specialized team. Use Agents when you know the GOAL but not the steps. Use Agentic for complex projects needing multiple expertise areas.' },
        { explain: 'Use the simplest architecture that solves your problem. Start with LLM Chat or RAG. Only reach for Agents or Agentic AI when simpler approaches fail or you need sophisticated reasoning and planning.', insight: 'Start simple, upgrade when needed. Most use cases are solved by LLM Chat or RAG. Only reach for Agents/Agentic when simpler approaches fail.' }
      ];
      const CurrentScene = stages[stage].component;
      return (
        <div style={P.root}>
          <div style={P.sidebar}>
            {stages.map((s, idx) => (
              <div key={idx}>
                <div style={P.stepCircle(stage === idx, stage > idx)} onClick={() => setStage(idx)}>{s.num}</div>
                <div style={P.stepLabel}>{s.label}</div>
                {idx < stages.length - 1 && <div style={P.connector(stage > idx)}></div>}
              </div>
            ))}
          </div>
          <div style={P.main}>
            <div style={P.topBar}>
              <div style={P.leftSection}>
                <a href="../../index.html" style={P.backLink}>← Back</a>
                <div style={P.badge}>INTERACTIVE</div>
              </div>
              <div style={P.title}>The Five AI Architectures</div>
              <div style={P.navRow}>
                <button style={P.navBtn(stage === 0)} onClick={() => stage > 0 && setStage(stage - 1)}>←</button>
                <div style={P.navP}>{stage + 1} / 5</div>
                <button style={P.navBtn(stage === 4)} onClick={() => stage < 4 && setStage(stage + 1)}>→</button>
              </div>
            </div>
            <div style={P.content}>
              <div style={P.explainRow}>
                <p style={P.explain}>{stageData[stage].explain}</p>
              </div>
              <CurrentScene />
              <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                <div style={P.insightLabel}>Key Insight</div>
                <div style={P.insight}>{stageData[stage].insight}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
