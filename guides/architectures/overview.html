<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare the five GenAI architectures — LLM Chat, RAG, Workflows, Agents, Agentic AI — and learn how to pick the right one.">
  <meta name="theme-color" content="#6c5ce7">
  <meta property="og:title" content="GenAI Architectures Overview — Interactive Guide">
  <meta property="og:description" content="Compare the five GenAI architectures — LLM Chat, RAG, Workflows, Agents, Agentic AI — and learn how to pick the right one.">

  <meta name="twitter:title" content="GenAI Architectures Overview — Interactive Guide">
  <meta name="twitter:description" content="Compare the five GenAI architectures — LLM Chat, RAG, Workflows, Agents, Agentic AI — and learn how to pick the right one.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Architecture Overview - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Guide-specific animations */
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .slide-in-left {
      animation: slideInLeft 0.6s ease forwards;
    }

    /* Spectrum cards */
    .spectrum-row {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .spectrum-card {
      flex: 1;
      min-width: 140px;
      max-width: 180px;
      padding: 20px 14px;
      border-radius: 14px;
      border: 2px solid #e0e0e0;
      background: white;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }

    .spectrum-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.15);
    }

    .spectrum-card.selected {
      border-color: #6c5ce7;
      background: #f5f3ff;
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.2);
    }

    .spectrum-emoji {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .spectrum-label {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .spectrum-analogy {
      font-size: 12px;
      color: #888;
      font-style: italic;
    }

    .spectrum-detail {
      margin-top: 20px;
      padding: 20px 24px;
      background: white;
      border: 2px solid #6c5ce7;
      border-radius: 12px;
      width: 100%;
      animation: fadeIn 0.4s ease forwards;
    }

    .spectrum-detail-title {
      font-weight: 700;
      font-size: 18px;
      color: #6c5ce7;
      margin-bottom: 8px;
    }

    .spectrum-detail-text {
      font-size: 15px;
      line-height: 1.7;
      color: #333;
    }

    /* Comparison panels */
    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.left-panel {
      background: #f8f0ff;
      border-color: #6c5ce7;
    }

    .comparison-item.right-panel {
      background: #f0f8ff;
      border-color: #3498db;
    }

    .comparison-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 17px;
      color: #1a1a1a;
    }

    .comparison-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    /* Flow pipeline */
    .flow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      flex-wrap: wrap;
    }

    .flow-step {
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      min-width: 100px;
    }

    .flow-arrow {
      font-size: 18px;
      color: #6c5ce7;
      font-weight: 700;
    }

    /* Clickable expandable grid cards */
    .click-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .click-card {
      padding: 18px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .click-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-3px);
    }

    .click-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .click-card-emoji {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .click-card-title {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .click-card-sub {
      font-size: 13px;
      color: #6c5ce7;
      font-style: italic;
    }

    .click-card-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 6px;
      font-style: italic;
    }

    .click-card.expanded .click-card-hint {
      display: none;
    }

    .click-card-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
    }

    .click-card.expanded .click-card-detail {
      max-height: 200px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

    /* Decision gates */
    .gate-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gate-card {
      padding: 18px 22px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .gate-card:hover {
      border-color: #6c5ce7;
      transform: translateX(4px);
    }

    .gate-card.active-gate {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .gate-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #6c5ce7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .gate-question {
      font-weight: 600;
      font-size: 15px;
      color: #1a1a1a;
      flex: 1;
    }

    .gate-answer {
      font-weight: 700;
      font-size: 14px;
      color: #6c5ce7;
      overflow-wrap: break-word;
    }

    /* Cost table */
    .cost-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      margin-top: 16px;
    }

    .cost-table th {
      background: #6c5ce7;
      color: white;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      letter-spacing: 0.3px;
    }

    .cost-table td {
      padding: 10px 16px;
      font-size: 14px;
      border-bottom: 1px solid #f0f0f0;
    }

    .cost-table tr:last-child td {
      border-bottom: none;
    }

    .cost-table tr:nth-child(even) {
      background: #fafafe;
    }

    .cost-table tr:hover td {
      background: #f5f3ff;
    }

    .cost-bar {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #6c5ce7, #e056a0);
      transition: width 0.6s ease;
    }

    /* Stat badge */
    .stat-badge {
      display: inline-block;
      background: #f5f3ff;
      border: 1px solid #e8e3f8;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #6c5ce7;
      margin: 8px 4px;
    }

    /* ReAct loop */
    .react-loop {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .react-step {
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
    }

    .react-arrow {
      font-size: 18px;
      color: #6c5ce7;
      font-weight: 700;
    }

    /* Golden rule */
    .golden-rule {
      background: linear-gradient(135deg, #fff8e1 0%, #fff3cd 100%);
      border: 2px solid #f0c040;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: center;
      margin-top: 16px;
    }

    .golden-rule-title {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #856404;
      margin-bottom: 8px;
    }

    .golden-rule-text {
      font-size: 16px;
      color: #664d03;
      line-height: 1.6;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">{insightSvg} INSIGHT</div>
          {children}
        </div>
      );
    }

    /* Sidebar icon components */

    function SpectrumIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 20h20" />
          <path d="M4 16l4-8 4 4 4-10 4 6" />
        </svg>
      );
    }

    function CompareIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="2" y="4" width="8" height="16" rx="2" />
          <rect x="14" y="4" width="8" height="16" rx="2" />
          <path d="M12 2v20" strokeDasharray="2 2" />
        </svg>
      );
    }

    function PipelineIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="2" y="9" width="5" height="6" rx="1" />
          <rect x="10" y="9" width="5" height="6" rx="1" />
          <rect x="18" y="9" width="5" height="6" rx="1" />
          <path d="M7 12h3" />
          <path d="M15 12h3" />
        </svg>
      );
    }

    function BrainIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 2a5 5 0 015 5c0 1.5-.7 2.8-1.7 3.7L12 14l-3.3-3.3A5 5 0 0112 2z" />
          <circle cx="8" cy="18" r="3" />
          <circle cx="16" cy="18" r="3" />
          <path d="M12 14v1" />
          <path d="M10.5 15.5L8.5 15.5" />
          <path d="M13.5 15.5L15.5 15.5" />
        </svg>
      );
    }

    function DecisionIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 3l9 5v8l-9 5-9-5V8z" />
          <path d="M12 3v10" />
          <path d="M12 13l9-5" />
          <path d="M12 13l-9-5" />
        </svg>
      );
    }

    function S1Diagram() {
  const nodes = [
    { label: 'LLM Chat',   analogy: 'Bicycle', color: '#6c5ce7', x: 60  },
    { label: 'RAG',        analogy: 'Car',     color: '#3498db', x: 165 },
    { label: 'Workflow',   analogy: 'Bus',     color: '#f39c12', x: 270 },
    { label: 'Agent',      analogy: 'Taxi',    color: '#e74c3c', x: 375 },
    { label: 'Agentic AI', analogy: 'Fleet',   color: '#e056a0', x: 480 },
  ];
  return (
    <svg width="540" height="110" viewBox="0 0 540 110"
      style={{ maxWidth: '100%', overflow: 'visible' }}
      aria-label="Architecture spectrum from simple to complex">
      <defs>
        <linearGradient id="specGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor="#6c5ce7" />
          <stop offset="100%" stopColor="#e056a0" />
        </linearGradient>
      </defs>
      <text x="60" y="14" textAnchor="middle" fontSize="10" fontWeight="600" fill="#aaa" fontFamily="DM Sans">SIMPLE</text>
      <text x="480" y="14" textAnchor="middle" fontSize="10" fontWeight="600" fill="#aaa" fontFamily="DM Sans">COMPLEX</text>
      <line x1="60" y1="50" x2="480" y2="50" stroke="url(#specGrad)" strokeWidth="3" />
      {nodes.map(n => (
        <g key={n.label}>
          <circle cx={n.x} cy="50" r="20" fill={n.color} />
          <text x={n.x} y="82" textAnchor="middle" fontSize="11" fontWeight="600" fill="#1a1a1a" fontFamily="DM Sans">{n.label}</text>
          <text x={n.x} y="96" textAnchor="middle" fontSize="10" fill="#888" fontFamily="DM Sans">{n.analogy}</text>
        </g>
      ))}
    </svg>
  );
}

    /* Stage 1: The Spectrum */
    function S1() {
      const [selected, setSelected] = useState(null);

      const archs = [
        {
          id: 'llm', emoji: '\uD83D\uDEB2', label: 'LLM Chat', analogy: 'Bicycle', color: '#6c5ce7',
          desc: 'Direct conversation with an AI model. Like a bicycle for short trips: simple, fast, no infrastructure needed. Best for brainstorming, summarizing, and creative tasks where the model\'s training data is sufficient.'
        },
        {
          id: 'rag', emoji: '\uD83D\uDE97', label: 'RAG', analogy: 'Car', color: '#7c55d4',
          desc: 'Retrieval-Augmented Generation searches your documents first, then answers. Like a car for daily commutes: more capable, takes you to specific destinations. Best when you need answers grounded in your own data.'
        },
        {
          id: 'workflow', emoji: '\uD83D\uDE8C', label: 'Workflow', analogy: 'Bus', color: '#9050c0',
          desc: 'Multiple AI steps chained in a fixed sequence. Like a bus on a fixed route: reliable, predictable, handles many passengers. Best for repeatable business processes with well-defined steps.'
        },
        {
          id: 'agent', emoji: '\uD83D\uDE95', label: 'Agent', analogy: 'Taxi', color: '#a84aaf',
          desc: 'A single autonomous AI that reasons and uses tools dynamically. Like a taxi: flexible routing, adapts to conditions. Best when tasks require dynamic decisions and real-time tool use.'
        },
        {
          id: 'agentic', emoji: '\uD83D\uDE9A', label: 'Agentic AI', analogy: 'Fleet', color: '#e056a0',
          desc: 'Teams of specialized agents collaborating. Like a logistics fleet: multiple vehicles coordinated for complex operations. Best for multi-domain problems requiring diverse expertise working together.'
        }
      ];

      return (
        <>
          <div>
            <h2 className="stage-header">The Spectrum</h2>
          </div>
          <div className="explanation">
            There are 5 ways to build AI-powered solutions, ranging from simple to complex. Each architecture adds capabilities &mdash; and cost. Click any card to explore.
          </div>
          <div className="scene-card">
            <S1Diagram />
            <div style={{ width: '100%' }}>
              <div style={{ fontSize: '14px', fontWeight: 700, color: '#6c5ce7', marginBottom: '16px', textAlign: 'center', letterSpacing: '0.5px' }}>
                SIMPLE &rarr; COMPLEX
              </div>
              <div style={{ height: '6px', borderRadius: '3px', background: 'linear-gradient(90deg, #6c5ce7, #9050c0, #e056a0)', marginBottom: '24px' }} />
              <div className="spectrum-row">
                {archs.map((a, idx) => (
                  <div
                    key={a.id}
                    className={`spectrum-card ${selected === a.id ? 'selected' : ''}`}
                    style={{ borderColor: selected === a.id ? a.color : undefined }}
                    onClick={() => setSelected(selected === a.id ? null : a.id)}
                  >
                    <div className="spectrum-emoji">{a.emoji}</div>
                    <div className="spectrum-label">{a.label}</div>
                    <div className="spectrum-analogy">{a.analogy}</div>
                  </div>
                ))}
              </div>
              {selected && (() => {
                const a = archs.find(x => x.id === selected);
                return (
                  <div className="spectrum-detail" style={{ borderColor: a.color }}>
                    <div className="spectrum-detail-title" style={{ color: a.color }}>
                      {a.emoji} {a.label}
                    </div>
                    <div className="spectrum-detail-text">{a.desc}</div>
                  </div>
                );
              })()}
            </div>
          </div>
          <InsightBlock>
            Think of these five architectures as a toolbox, not a ladder. You don&rsquo;t always need the most advanced option. A bicycle is perfect for a trip around the block &mdash; you wouldn&rsquo;t call a logistics fleet.
          </InsightBlock>
        </>
      );
    }

    function S2Diagram() {
  const llmNodes = [
    { label: 'User',     bg: '#f5f3ff', color: '#6c5ce7', x: 70  },
    { label: 'LLM',      bg: '#6c5ce7', color: 'white',   x: 230 },
    { label: 'Response', bg: '#f5f3ff', color: '#6c5ce7', x: 390 },
  ];
  const ragNodes = [
    { label: 'User',   bg: '#e0f0ff', color: '#3498db', x: 40  },
    { label: 'Search', bg: '#3498db', color: 'white',   x: 140 },
    { label: 'Chunks', bg: '#e0f0ff', color: '#3498db', x: 240 },
    { label: 'LLM',    bg: '#3498db', color: 'white',   x: 340 },
    { label: 'Answer', bg: '#e0f0ff', color: '#3498db', x: 440 },
  ];
  return (
    <svg width="500" height="150" viewBox="0 0 500 150"
      style={{ maxWidth: '100%', overflow: 'visible', marginBottom: '16px' }}
      aria-label="LLM Chat vs RAG architecture comparison">
      <defs>
        <marker id="ovArrP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#6c5ce7" />
        </marker>
        <marker id="ovArrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0,8 3,0 6" fill="#3498db" />
        </marker>
      </defs>
      <text x="6" y="32" fontSize="11" fontWeight="700" fill="#6c5ce7" fontFamily="DM Sans">LLM Chat</text>
      {llmNodes.map((n, i, arr) => (
        <g key={n.label + 'l'}>
          <rect x={n.x - 45} y="40" width="90" height="30" rx="10" fill={n.bg} stroke="#6c5ce7" strokeWidth="1.5" />
          <text x={n.x} y="59" textAnchor="middle" fontSize="12" fontWeight="600" fill={n.color} fontFamily="DM Sans">{n.label}</text>
          {i < arr.length - 1 && (
            <line x1={n.x + 45} y1="55" x2={arr[i + 1].x - 45} y2="55"
              stroke="#6c5ce7" strokeWidth="2" markerEnd="url(#ovArrP)" />
          )}
        </g>
      ))}
      <line x1="0" y1="86" x2="500" y2="86" stroke="#e0e0e0" strokeWidth="1" strokeDasharray="4 4" />
      <text x="6" y="108" fontSize="11" fontWeight="700" fill="#3498db" fontFamily="DM Sans">RAG</text>
      {ragNodes.map((n, i, arr) => (
        <g key={n.label + 'r'}>
          <rect x={n.x - 38} y="114" width="76" height="28" rx="8" fill={n.bg} stroke="#3498db" strokeWidth="1.5" />
          <text x={n.x} y="132" textAnchor="middle" fontSize="11" fontWeight="600" fill={n.color} fontFamily="DM Sans">{n.label}</text>
          {i < arr.length - 1 && (
            <line x1={n.x + 38} y1="128" x2={arr[i + 1].x - 38} y2="128"
              stroke="#3498db" strokeWidth="2" markerEnd="url(#ovArrB)" />
          )}
        </g>
      ))}
    </svg>
  );
}

    /* Stage 2: Simple Architectures */
    function S2() {
      const [activeTab, setActiveTab] = useState('llm');

      const tabBtn = (id, label, color) => (
        <button
          onClick={() => setActiveTab(id)}
          style={{
            padding: '10px 24px',
            borderRadius: '10px',
            border: '2px solid',
            borderColor: activeTab === id ? color : '#e0e0e0',
            background: activeTab === id ? color : 'white',
            color: activeTab === id ? 'white' : '#333',
            fontWeight: 700,
            fontSize: '14px',
            cursor: 'pointer',
            transition: 'all 0.3s ease'
          }}
        >
          {label}
        </button>
      );

      return (
        <>
          <div>
            <h2 className="stage-header">Simple Architectures</h2>
          </div>
          <div className="explanation">
            LLM Chat and RAG are the foundation of most AI applications today. Understanding the difference between these two is the first step in choosing the right architecture.
          </div>
          <div className="scene-card">
            <S2Diagram />
            <div style={{ width: '100%' }}>
              <div style={{ display: 'flex', gap: '12px', marginBottom: '24px', justifyContent: 'center' }}>
                {tabBtn('llm', 'LLM Chat', '#6c5ce7')}
                {tabBtn('rag', 'RAG', '#3498db')}
                {tabBtn('both', 'Compare', '#2ecc71')}
              </div>

              {activeTab === 'llm' && (
                <div className="fade-in">
                  <div style={{ fontWeight: 700, fontSize: '18px', color: '#6c5ce7', marginBottom: '12px' }}>
                    LLM Chat &mdash; Direct Conversation
                  </div>
                  <div style={{ fontSize: '15px', lineHeight: 1.7, color: '#333', marginBottom: '20px' }}>
                    The simplest architecture: you ask a question, the model answers using only its training data.
                    No external lookups, no document search &mdash; just the model&rsquo;s memorized knowledge.
                  </div>
                  <div className="flow-row">
                    <div className="flow-step" style={{ background: '#e8e3f8', color: '#6c5ce7' }}>User Question</div>
                    <div className="flow-arrow">&rarr;</div>
                    <div className="flow-step" style={{ background: '#6c5ce7', color: 'white' }}>LLM Model</div>
                    <div className="flow-arrow">&rarr;</div>
                    <div className="flow-step" style={{ background: '#e8e3f8', color: '#6c5ce7' }}>Answer</div>
                  </div>
                  <div style={{ marginTop: '16px', fontSize: '14px', color: '#888', textAlign: 'center' }}>
                    Best for: brainstorming, creative writing, general knowledge, code generation
                  </div>
                </div>
              )}

              {activeTab === 'rag' && (
                <div className="fade-in">
                  <div style={{ fontWeight: 700, fontSize: '18px', color: '#3498db', marginBottom: '12px' }}>
                    RAG &mdash; Retrieval-Augmented Generation
                  </div>
                  <div style={{ fontSize: '15px', lineHeight: 1.7, color: '#333', marginBottom: '20px' }}>
                    Before answering, the system searches your documents, retrieves relevant chunks, and feeds them
                    to the model as context. The model answers based on your actual data, not just what it memorized.
                  </div>
                  <div className="flow-row">
                    <div className="flow-step" style={{ background: '#e0f0ff', color: '#3498db' }}>Question</div>
                    <div className="flow-arrow">&rarr;</div>
                    <div className="flow-step" style={{ background: '#3498db', color: 'white' }}>Search</div>
                    <div className="flow-arrow">&rarr;</div>
                    <div className="flow-step" style={{ background: '#e0f0ff', color: '#3498db' }}>Chunks</div>
                    <div className="flow-arrow">&rarr;</div>
                    <div className="flow-step" style={{ background: '#3498db', color: 'white' }}>Model</div>
                    <div className="flow-arrow">&rarr;</div>
                    <div className="flow-step" style={{ background: '#e0f0ff', color: '#3498db' }}>Answer</div>
                  </div>
                  <div style={{ marginTop: '16px', fontSize: '14px', color: '#888', textAlign: 'center' }}>
                    Best for: company knowledge bases, document Q&amp;A, customer support, legal/medical research
                  </div>
                </div>
              )}

              {activeTab === 'both' && (
                <div className="comparison-box fade-in">
                  <div className="comparison-item left-panel">
                    <div className="comparison-title" style={{ color: '#6c5ce7' }}>LLM Chat</div>
                    <div className="comparison-content">
                      <div style={{ marginBottom: '8px' }}><strong>Data source:</strong> Training data only</div>
                      <div style={{ marginBottom: '8px' }}><strong>Freshness:</strong> Frozen at training cutoff</div>
                      <div style={{ marginBottom: '8px' }}><strong>Accuracy:</strong> Can hallucinate freely</div>
                      <div style={{ marginBottom: '8px' }}><strong>Cost:</strong> ~1,500 tokens/query</div>
                      <div><strong>Setup:</strong> Zero &mdash; just call the API</div>
                    </div>
                  </div>
                  <div className="comparison-item right-panel">
                    <div className="comparison-title" style={{ color: '#3498db' }}>RAG</div>
                    <div className="comparison-content">
                      <div style={{ marginBottom: '8px' }}><strong>Data source:</strong> Your documents + training</div>
                      <div style={{ marginBottom: '8px' }}><strong>Freshness:</strong> As current as your index</div>
                      <div style={{ marginBottom: '8px' }}><strong>Accuracy:</strong> Reduces hallucinations 70-90%</div>
                      <div style={{ marginBottom: '8px' }}><strong>Cost:</strong> ~3,000 tokens/query</div>
                      <div><strong>Setup:</strong> Embed + index your documents</div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
          <InsightBlock>
            RAG reduces hallucinations by 70-90% because the model generates answers from retrieved evidence
            rather than relying solely on memorized patterns. If your use case needs factual accuracy about
            specific data, RAG is almost always the right next step above plain LLM Chat.
          </InsightBlock>
        </>
      );
    }

    /* Stage 3: Orchestrated Pipelines */
    function S3() {
      const [expanded, setExpanded] = useState(null);

      const patterns = [
        {
          id: 'chaining', emoji: '\uD83C\uDFED', title: 'Prompt Chaining', sub: 'Assembly Line',
          detail: 'Each step transforms the output of the previous step \u2014 like stations on an assembly line.'
        },
        {
          id: 'routing', emoji: '\uD83C\uDFA9', title: 'Routing', sub: 'Sorting Hat',
          detail: 'A classifier sends the input to the right specialist \u2014 like a sorting hat picking the best handler.'
        },
        {
          id: 'parallel', emoji: '\uD83D\uDEE3\uFE0F', title: 'Parallelization', sub: 'Multi-Lane Highway',
          detail: 'Multiple LLM calls run at once on different aspects \u2014 like a multi-lane highway processing in parallel.'
        },
        {
          id: 'orchestrator', emoji: '\uD83D\uDCCB', title: 'Orchestrator-Workers', sub: 'Project Manager',
          detail: 'A central LLM breaks tasks apart and delegates to specialized workers \u2014 like a project manager coordinating a team.'
        },
        {
          id: 'evaluator', emoji: '\uD83D\uDD0D', title: 'Evaluator-Optimizer', sub: 'QA Inspector',
          detail: 'One LLM generates, another critiques, and they iterate until quality is met \u2014 like a writer with a QA reviewer.'
        }
      ];

      return (
        <>
          <div>
            <h2 className="stage-header">Orchestrated Pipelines</h2>
          </div>
          <div className="explanation">
            AI Workflows chain multiple AI steps in a fixed sequence &mdash; like a factory assembly line
            where each station performs one specialized task. The path is predetermined and predictable.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div style={{ fontSize: '15px', lineHeight: 1.7, color: '#333', marginBottom: '20px' }}>
                <strong>5 Workflow Patterns</strong> &mdash; click any pattern to see how it works:
              </div>
              <div className="click-grid">
                {patterns.map((p, idx) => {
                  const isOpen = expanded === p.id;
                  const toggle = () => setExpanded(isOpen ? null : p.id);
                  return (
                  <div
                    key={p.id}
                    className={`click-card disclosure-card-host ${isOpen ? 'expanded' : ''}`}
                    style={idx === 4 && !isOpen ? { gridColumn: '1 / -1', maxWidth: '50%', justifySelf: 'center' } : {}}

                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
                    aria-expanded={isOpen}
                    aria-controls={`overview-pattern-detail-${p.id}`}
                  >
                    <span className="disclosure-badge" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">
                        <polyline points="6 9 12 15 18 9" />
                      </svg>
                    </span>
                    <div className="click-card-emoji">{p.emoji}</div>
                    <div className="click-card-title">{p.title}</div>
                    <div className="click-card-sub">{p.sub}</div>
                    <div className="click-card-detail" id={`overview-pattern-detail-${p.id}`}>{p.detail}</div>
                  </div>
                  );
                })}
              </div>
              <div style={{ marginTop: '24px', display: 'flex', gap: '8px', alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontSize: '13px', fontWeight: 600, color: '#888' }}>Common tools:</span>
                {['N8N', 'Make', 'Zapier', 'LangChain', 'Prefect'].map(tool => (
                  <span key={tool} className="stat-badge" style={{ fontSize: '13px', padding: '6px 12px' }}>
                    {tool}
                  </span>
                ))}
              </div>
              <div className="deep-dive-link">
                See each pattern broken down step-by-step in <a href="workflows.html">Guide 5.4: AI Workflows &rarr;</a>
              </div>
            </div>
          </div>
          <InsightBlock>
            Workflows trade flexibility for reliability. Because each step is predefined, you can test,
            debug, and optimize each stage independently. This makes workflows ideal for production systems
            where predictability matters more than adaptability.
          </InsightBlock>
        </>
      );
    }

    /* Stage 4: Autonomous Agents */
    function S4() {
      const [expanded, setExpanded] = useState(null);

      const collabs = [
        {
          id: 'pipeline', emoji: '\u27A1\uFE0F', title: 'Pipeline', sub: 'Sequential handoff',
          detail: 'Agent A hands results to Agent B to Agent C \u2014 like an assembly line of specialists.'
        },
        {
          id: 'supervisor', emoji: '\uD83D\uDC51', title: 'Supervisor', sub: 'Boss delegates tasks',
          detail: 'A manager agent breaks work apart and assigns tasks to specialized worker agents.'
        },
        {
          id: 'debate', emoji: '\uD83E\uDD3C', title: 'Debate', sub: 'Adversarial refinement',
          detail: 'Agents argue opposing perspectives and a judge agent synthesizes the final answer.'
        },
        {
          id: 'swarm', emoji: '\uD83D\uDC1D', title: 'Swarm', sub: 'Self-organizing team',
          detail: 'Agents dynamically claim tasks without a central controller \u2014 like a self-organizing bee colony.'
        }
      ];

      return (
        <>
          <div>
            <h2 className="stage-header">Autonomous Agents</h2>
          </div>
          <div className="explanation">
            Agents break free from fixed sequences. A single agent uses a ReAct loop (Reason, Act, Observe)
            to dynamically decide its next step. Agentic AI takes this further &mdash; teams of specialized
            agents collaborating on complex problems.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div style={{ fontWeight: 700, fontSize: '16px', color: '#1a1a1a', marginBottom: '16px' }}>
                The ReAct Loop (Single Agent)
              </div>
              <div className="react-loop">
                <div className="react-step" style={{ background: '#e8e3f8', color: '#6c5ce7' }}>
                  Thought
                </div>
                <div className="react-arrow">&rarr;</div>
                <div className="react-step" style={{ background: '#6c5ce7', color: 'white' }}>
                  Action
                </div>
                <div className="react-arrow">&rarr;</div>
                <div className="react-step" style={{ background: '#e8e3f8', color: '#6c5ce7' }}>
                  Observation
                </div>
                <div className="react-arrow">&circlearrowright;</div>
                <div style={{ fontSize: '13px', color: '#888', fontStyle: 'italic' }}>
                  repeat until done
                </div>
              </div>

              <div style={{ fontWeight: 700, fontSize: '16px', color: '#1a1a1a', marginBottom: '12px', marginTop: '28px' }}>
                Agentic AI &mdash; 4 Collaboration Patterns
              </div>
              <div className="click-grid">
                {collabs.map(c => {
                  const isOpen = expanded === c.id;
                  const toggle = () => setExpanded(isOpen ? null : c.id);
                  return (
                  <div
                    key={c.id}
                    className={`click-card disclosure-card-host ${isOpen ? 'expanded' : ''}`}
                    onClick={toggle}
                    role="button"
                    tabIndex={0}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
                    aria-expanded={isOpen}
                    aria-controls={`overview-collab-detail-${c.id}`}
                  >
                    <span className="disclosure-badge" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">
                        <polyline points="6 9 12 15 18 9" />
                      </svg>
                    </span>
                    <div className="click-card-emoji">{c.emoji}</div>
                    <div className="click-card-title">{c.title}</div>
                    <div className="click-card-sub">{c.sub}</div>
                    <div className="click-card-detail" id={`overview-collab-detail-${c.id}`}>{c.detail}</div>
                  </div>
                  );
                })}
              </div>

              <div style={{ marginTop: '24px', textAlign: 'center' }}>
                <div className="stat-badge">
                  Cornell Study: 42.68% success (multi-agent) vs 2.92% (single agent) on complex tasks
                </div>
              </div>
              <div style={{ marginTop: '16px', display: 'flex', gap: '8px', alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontSize: '13px', fontWeight: 600, color: '#888' }}>Frameworks:</span>
                {['CrewAI', 'LangGraph', 'AutoGen', 'OpenAI Swarm'].map(fw => (
                  <span key={fw} className="stat-badge" style={{ fontSize: '13px', padding: '6px 12px' }}>
                    {fw}
                  </span>
                ))}
              </div>
              <div className="deep-dive-link">
                Deep dive into single-agent and multi-agent patterns in <a href="agents.html">Guide 5.5: AI Agents &rarr;</a>
              </div>
            </div>
          </div>
          <InsightBlock>
            Multi-agent systems dramatically outperform single agents on complex tasks. A Cornell study
            found multi-agent collaboration achieved a 42.68% success rate compared to just 2.92% for a
            single agent &mdash; but they come with higher cost, latency, and debugging complexity.
          </InsightBlock>
        </>
      );
    }

    /* Stage 5: Choosing Right */
    function S5() {
      const [activeGate, setActiveGate] = useState(null);

      const gates = [
        { num: 1, question: 'Does a single prompt solve it?', answer: 'LLM Chat', emoji: '\uD83D\uDEB2' },
        { num: 2, question: 'Need your specific data?', answer: 'RAG', emoji: '\uD83D\uDE97' },
        { num: 3, question: 'Repeatable, well-defined process?', answer: 'Workflow', emoji: '\uD83D\uDE8C' },
        { num: 4, question: 'Dynamic decisions and tool use?', answer: 'Agent', emoji: '\uD83D\uDE95' },
        { num: 5, question: 'Multiple expertise domains?', answer: 'Agentic AI', emoji: '\uD83D\uDE9A' }
      ];

      const costs = [
        { arch: 'LLM Chat', tokens: '~1,500', pct: 4 },
        { arch: 'RAG', tokens: '~3,000', pct: 8 },
        { arch: 'Workflow', tokens: '~5,000', pct: 13 },
        { arch: 'Agent', tokens: '~12,000', pct: 30 },
        { arch: 'Agentic AI', tokens: '~40,000', pct: 100 }
      ];

      return (
        <>
          <div>
            <h2 className="stage-header">Choosing the Right Architecture</h2>
          </div>
          <div className="explanation">
            Walk through 5 decision gates to find the simplest architecture that meets your needs.
            Each gate asks one question &mdash; the first &ldquo;yes&rdquo; is your answer.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <div style={{ fontWeight: 700, fontSize: '16px', color: '#1a1a1a', marginBottom: '16px' }}>
                Decision Flowchart &mdash; click any gate:
              </div>
              <div className="gate-list">
                {gates.map(g => (
                  <div
                    key={g.num}
                    className={`gate-card ${activeGate === g.num ? 'active-gate' : ''}`}
                    onClick={() => setActiveGate(activeGate === g.num ? null : g.num)}
                  >
                    <div className="gate-number">{g.num}</div>
                    <div className="gate-question">{g.question}</div>
                    <div className="gate-answer">{g.emoji} {g.answer}</div>
                  </div>
                ))}
              </div>

              <div style={{ fontWeight: 700, fontSize: '16px', color: '#1a1a1a', marginTop: '28px', marginBottom: '12px' }}>
                Cost Comparison (tokens per query)
              </div>
              <table className="cost-table">
                <thead>
                  <tr>
                    <th>Architecture</th>
                    <th>Tokens / Query</th>
                    <th style={{ width: '40%' }}>Relative Cost</th>
                  </tr>
                </thead>
                <tbody>
                  {costs.map(c => (
                    <tr key={c.arch}>
                      <td style={{ fontWeight: 600 }}>{c.arch}</td>
                      <td>{c.tokens}</td>
                      <td>
                        <div className="cost-bar" style={{ width: `${c.pct}%` }} />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div className="golden-rule">
                <div className="golden-rule-title">The Golden Rule</div>
                <div className="golden-rule-text">
                  Start simple, measure results, and upgrade only when data tells you to.
                  The best architecture is the simplest one that solves your problem.
                </div>
              </div>
            </div>
          </div>
          <InsightBlock>
            Agentic AI can cost 25x more per query than plain LLM Chat. Before reaching for agents,
            ask: can a well-crafted prompt or a simple RAG pipeline solve this? Over-engineering with
            agents is the most common (and most expensive) mistake in AI architecture.
          </InsightBlock>
        </>
      );
    }

    /* Main Guide Component */
    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const NEXT_GUIDE = { id: "5.2", title: "LLM Chat", module: "Module 5", href: "./llm-chat.html" };

      const stages = [
        { icon: SpectrumIcon, label: 'Spectrum', component: S1 },
        { icon: CompareIcon, label: 'Simple', component: S2 },
        { icon: PipelineIcon, label: 'Pipelines', component: S3 },
        { icon: BrainIcon, label: 'Agents', component: S4 },
        { icon: DecisionIcon, label: 'Choosing', component: S5 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) setCurrentStage(currentStage + 1);
      };

      const handlePrev = () => {
        if (currentStage > 0) setCurrentStage(currentStage - 1);
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {stages.map((stage, idx) => {
                const IconComp = stage.icon;
                return (
                  <React.Fragment key={idx}>
                    <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>

                        <IconComp />
                      </button>
                      <div className="step-btn-label">{stage.label}</div>
                    </div>
                    {idx < stages.length - 1 && (
                      <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">5.1</span>
                    <h1 className="title">Architecture Overview</h1>
                  </div>
                  <div style={{ marginLeft: '20px' }}>
                    <div className="badge">INTERACTIVE</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of 5</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentStage === 0}
                      aria-label="Previous section"
                      title="Previous stage"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={currentStage === stages.length - 1}
                      aria-label="Next section"
                      title="Next stage"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide">
                <CurrentComponent />
                {currentStage === stages.length - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">→</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
