                  if (idx === question.correct) {

    function ResultsView({ questions, answers, onRetry }) {
      const correctCount = answers.filter((a, i) => a === questions[i].correct).length;
      const percentage = Math.round((correctCount / questions.length) * 100);
      const circumference = 2 * Math.PI * 75;
      const strokeDashoffset = circumference - (percentage / 100) * circumference;

      const getGrade = () => {
        if (percentage >= 90) return { label: 'Outstanding!', color: '#2ecc71', emoji: '\uD83C\uDF1F' };
        if (percentage >= 70) return { label: 'Great Job!', color: '#6c5ce7', emoji: '\uD83D\uDCAA' };
        if (percentage >= 50) return { label: 'Good Effort!', color: '#f39c12', emoji: '\uD83D\uDC4D' };
        return { label: 'Keep Learning!', color: '#e74c3c', emoji: '\uD83D\uDCDA' };
      };

      const grade = getGrade();

      const moduleScores = {};
      questions.forEach((q, i) => {
        const mod = q.module;
        if (!moduleScores[mod]) moduleScores[mod] = { correct: 0, total: 0 };
        moduleScores[mod].total++;
        if (answers[i] === q.correct) moduleScores[mod].correct++;
      });

      return (
        <div className="scale-in">
          <div style={{ textAlign: 'center', marginBottom: 32 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>{grade.emoji}</div>

                  fill="none"
                  stroke={grade.color}
                  strokeWidth="10"
                  strokeLinecap="round"
                  strokeDasharray={circumference}
                  strokeDashoffset={strokeDashoffset}
                  style={{ transition: 'stroke-dashoffset 1s ease' }}

              <div className="score-text">

                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a1a' }}>

      const [showResults, setShowResults] = useState(false);
      const contentRef = useRef(null);

      const resetQuiz = () => {
        setCurrentQuestion(0);
        setSelectedAnswer(null);
        setAnswered(false);
        setAnswers([]);
        setShowResults(false);
        if (contentRef.current) contentRef.current.scrollTop = 0;
      };

      const handleSelect = (idx) => {
        setSelectedAnswer(idx);
      };

      const handleSubmit = () => {
        setAnswered(true);
        const newAnswers = [...answers];
        newAnswers[currentQuestion] = selectedAnswer;
        setAnswers(newAnswers);
      };

      const handleNext = () => {
        if (currentQuestion < QUESTIONS.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setSelectedAnswer(null);
          setAnswered(false);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        } else {
          setShowResults(true);
        }
      };

      const handlePrev = () => {
        if (currentQuestion > 0 && !showResults) {
          setCurrentQuestion(currentQuestion - 1);
          setSelectedAnswer(answers[currentQuestion - 1] ?? null);
          setAnswered(answers[currentQuestion - 1] !== undefined);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        }
      };

      const handleStageClick = (idx) => {
        if (showResults) return;
        if (idx <= answers.length) {
          setCurrentQuestion(idx);
          setSelectedAnswer(answers[idx] ?? null);
          setAnswered(answers[idx] !== undefined);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        }

                        aria-label={`Step ${idx + 1}: Question ${idx + 1}`}

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&larr; Back to All Guides</a>
                  <span style={{ marginLeft: 20, fontSize: 14, color: '#999' }}>|</span>
                  <div style={{ marginLeft: 12, display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">F.1</span>
                    <h1 className="title">Course Final Exam</h1>
                  </div>
                  <div style={{ marginLeft: 16 }}>
                    <div className="badge">FINAL EXAM</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  {!showResults && (
                    <span className="progress-indicator">
                      Question {currentQuestion + 1} of {QUESTIONS.length}
                    </span>
                  )}
                  {showResults && (
                    <span className="progress-indicator">
                      Results
                    </span>
                  )}
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentQuestion === 0 || showResults}
                      aria-label="Previous section"
                      title="Previous question"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={!answered || showResults}
                      aria-label="Next section"
                      title="Next question"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide" ref={contentRef}>
                {showResults ? (
                  <ResultsView questions={QUESTIONS} answers={answers} onRetry={resetQuiz} />
                ) : (
                  <QuestionView
                    question={QUESTIONS[currentQuestion]}
                    questionIndex={currentQuestion}
                    totalQuestions={QUESTIONS.length}
                    selectedAnswer={selectedAnswer}
                    answered={answered}
                    onSelect={handleSelect}
                    onSubmit={handleSubmit}
                    onNext={handleNext}
                  />
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Quiz />);
  </script>
</body>
</html>
