<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>MCP Fundamentals - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
    }

    #root {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 120px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 80px 12px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .step-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .step-btn:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .step-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    .step-wrapper.active .step-btn-label {
      color: #6c5ce7;
    }

    .step-connector {
      width: 2px;
      height: 16px;
      background: #e0e0e0;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .step-connector.active {
      background: #6c5ce7;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, #6c5ce7, #a78bfa, #2ecc71) 1;
      background: white;
      flex-shrink: 0;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      color: #6c5ce7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #2ecc71;
    }

    .badge {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .progress-indicator {
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .guide-number {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #b0a6e8;
      margin-right: 8px;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .nav-arrows {
      display: flex;
      gap: 12px;
    }

    .arrow-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .arrow-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
      transform: translateY(-2px);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 24px 36px;
      gap: 18px;
    }

    .explanation {
      font-size: 22px;
      line-height: 1.7;
      color: #2a2a2a;
    }

    .scene-card {
      background: linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%);
      border-radius: 16px;
      padding: 28px;
      border: 1px solid #e8e3f8;
      min-height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
    }

    .insight-box {
      background: #f0faf0;
      border-left: 4px solid #2ecc71;
      padding: 16px 20px;
      border-radius: 8px;
      color: #1a5e3a;
      font-size: 17px;
      line-height: 1.7;
      margin-top: 0;
      position: relative;
    }

    .insight-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #2ecc71;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes dashMarch {
      to { stroke-dashoffset: -16; }
    }

    @keyframes barFill {
      from { width: 0%; }
      to { width: var(--bar-target); }
    }

    @keyframes nodePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .scale-in { animation: scaleIn 0.5s ease forwards; }
    .dash-march { animation: dashMarch 0.5s linear infinite; }

    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .mcp-arch-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .mcp-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 2px solid #e0e0e0;
      padding: 14px 20px;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 140px;
      text-align: center;
    }

    .mcp-box:hover, .mcp-box.active {
      border-color: #6c5ce7;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.15);
      transform: translateY(-2px);
    }

    .mcp-box-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .mcp-box-label {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a1a;
    }

    .mcp-box-sub {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
    }

    .mcp-detail {
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.3s ease;
      max-height: 0;
      opacity: 0;
      width: 100%;
      max-width: 520px;
    }

    .mcp-detail.open {
      max-height: 120px;
      opacity: 1;
    }

    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.bad {
      background: #fef5f5;
      border-color: #e74c3c;
    }

    .comparison-item.good {
      background: #f0f8f0;
      border-color: #2ecc71;
    }

    .comparison-item.neutral {
      background: #f8f9fa;
      border-color: #bbb;
    }

    .comparison-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .comparison-item.bad .comparison-title { color: #c0392b; }
    .comparison-item.good .comparison-title { color: #27ae60; }
    .comparison-item.neutral .comparison-title { color: #555; }

    .comparison-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    .costar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .costar-box {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .costar-box:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .costar-box.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .costar-label {
      font-weight: 700;
      font-size: 20px;
      color: #6c5ce7;
      margin-bottom: 4px;
    }

    .costar-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .costar-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 8px;
      font-style: italic;
    }

    .costar-box.expanded .costar-hint { display: none; }

    .costar-example {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-top: 0;
      padding-top: 0;
    }

    .costar-box.expanded .costar-example {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .context-source-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
    }

    .context-source-emoji { font-size: 20px; flex-shrink: 0; }
    .context-source-label { font-weight: 700; font-size: 14px; color: #1a1a1a; }
    .context-source-desc { font-size: 13px; color: #666; margin-top: 2px; }

    .failure-card {
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .failure-card:hover { transform: translateY(-2px); }
    .failure-card.expanded { border-color: inherit; }

    .failure-card-title {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .failure-card-content {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .failure-card.expanded .failure-card-content {
      max-height: 200px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .summary-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .summary-card-emoji { font-size: 24px; flex-shrink: 0; }
    .summary-card-title { font-weight: 700; font-size: 16px; color: #1a1a1a; margin-bottom: 4px; }
    .summary-card-desc { font-size: 14px; color: #555; line-height: 1.6; }

    .arch-diagram {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .arch-box {
      padding: 14px 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .arch-connector {
      text-align: center;
      padding: 4px;
      font-size: 14px;
      color: #6c5ce7;
      font-weight: 600;
    }

    .arch-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .arch-row .arch-box {
      flex: 1;
      max-width: 160px;
    }

    .code-block {
      background: #1a1a2e;
      color: #a78bfa;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 12px;
      white-space: pre-wrap;
      width: 100%;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }

    /* Disclosure badge */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }
  </style>
</head>

  <div id="root"></div>

    /* ── Diagram Components ─────────────────────────────────────── */

    function S1Diagram() {

          {/* 9 messy crossing lines */}

                  <div className="context-source-desc">Identify the target package (e.g., &ldquo;langgraph&rdquo; &rarr; official library ID)</div>

              {advantages.map((a, idx) => (

    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stages = [
        { icon: UsbIcon, label: 'Why MCP', component: S1 },
        { icon: NetworkIcon, label: 'Architecture', component: S2 },
        { icon: RocketIcon, label: 'In Action', component: S3 },
        { icon: TerminalIcon, label: 'Setup', component: S4 },
        { icon: StarIcon, label: 'Takeaways', component: S5 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) setCurrentStage(currentStage + 1);
      };

      const handlePrev = () => {
        if (currentStage > 0) setCurrentStage(currentStage - 1);
      };

      const handleStageClick = (idx) => setCurrentStage(idx);

      return (
        <div className="container">
          <div className="sidebar scrollbar-hide">
            {stages.map((stage, idx) => {
              const IconComp = stage.icon;
              return (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    <button
                      className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                      onClick={() => handleStageClick(idx)}
                    >
                      <IconComp />
                    </button>
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < stages.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              );
            })}
          </div>

          <div className="main-content">
            <div className="top-bar">
              <div className="left-section">
                <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>

                  <span className="guide-number">4.1</span>

                </div>
                <div style={{ marginLeft: '20px' }}>
                  <div className="badge">BEGINNER GUIDE</div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center' }}>
                <span className="progress-indicator">Page {currentStage + 1} of 5</span>
                <div className="nav-arrows">
                  <button className="arrow-btn" onClick={handlePrev} disabled={currentStage === 0} title="Previous stage">&#8592;</button>
                  <button className="arrow-btn" onClick={handleNext} disabled={currentStage === stages.length - 1} title="Next stage">&#8594;</button>
                </div>
              </div>
            </div>

            <div className="content-area scrollbar-hide">
              <CurrentComponent />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
