<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Advanced MCP — context bloat, optimization, plugins, Code Mode, and when to use each.">
  <meta name="theme-color" content="#6c5ce7">
  <meta property="og:title" content="MCP Advanced — Interactive Guide">
  <meta property="og:description" content="Advanced MCP — context bloat, optimization, plugins, Code Mode, and when to use each.">
  <meta property="og:type" content="article">
  <meta property="og:image" content="../../assets/og-default.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MCP Advanced — Interactive Guide">
  <meta name="twitter:description" content="Advanced MCP — context bloat, optimization, plugins, Code Mode, and when to use each.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Advanced MCP - Deep Dive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes dashMarch {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes barFill {
      from { width: 0%; }
      to { width: var(--bar-target); }
    }

    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(108, 92, 231, 0)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(108, 92, 231, 0.4)); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .scale-in { animation: scaleIn 0.5s ease forwards; }
    .slide-in-right { animation: slideInRight 0.5s ease forwards; }

    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.bad {
      background: #fef5f5;
      border-color: #e74c3c;
    }

    .comparison-item.good {
      background: #f0f8f0;
      border-color: #2ecc71;
    }

    .comparison-item.neutral {
      background: #f8f9fa;
      border-color: #bbb;
    }

    .comparison-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .comparison-item.bad .comparison-title {
      color: #c0392b;
    }

    .comparison-item.good .comparison-title {
      color: #27ae60;
    }

    .comparison-item.neutral .comparison-title {
      color: #555;
    }

    .comparison-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    .context-source-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
    }

    .context-source-emoji {
      font-size: 20px;
      flex-shrink: 0;
    }

    .context-source-label {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a1a;
    }

    .context-source-desc {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .decision-tree {
      width: 100%;
    }

    .decision-node {
      padding: 24px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .decision-node:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .decision-question {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .expand-hint {
      font-size: 18px;
      color: #b0a6e8;
      transition: transform 0.3s ease;
    }

    .decision-node.expanded .expand-hint {
      transform: rotate(180deg);
    }

    .decision-answer {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .decision-node.expanded .decision-answer {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .answer-text {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
    }

    .code-block {
      background: #1a1a2e;
      color: #a78bfa;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 12px;
      white-space: pre-wrap;
      width: 100%;
    }

    .summary-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .summary-card-emoji {
      font-size: 24px;
      flex-shrink: 0;
    }

    .summary-card-title {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .summary-card-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    .bar-chart {
      width: 100%;
      max-width: 480px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .bar-label {
      font-size: 13px;
      font-weight: 600;
      width: 120px;
      text-align: right;
      color: #555;
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: #f0f0f0;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      transition: width 0.8s ease;
    }

    .plugin-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: white;
      border-radius: 10px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
    }

    .plugin-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Disclosure badge */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Note: dangerouslySetInnerHTML below is used only with hardcoded SVG icon strings (stageIcons), not user input -->
  <script type="text/babel">
    const { useState } = React;

    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightLabel() {
      return <div className="insight-label">{insightSvg} INSIGHT</div>;
    }

    /* ── SVG Diagrams ─────────────────────────────────────────────────────── */

    function S1Diagram() {
      return (
        <svg width="520" height="100" viewBox="0 0 520 100"
          style={{ maxWidth: '100%', overflow: 'visible' }}
          aria-label="Context window bar chart showing four MCP servers consuming approximately 20 percent of available context"
          role="img">
          <defs>
            <marker id="s1arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c" />
            </marker>
          </defs>
          {/* label */}
          <text x="20" y="18" fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="600" fill="#666">Context Window (200k tokens)</text>
          {/* background track */}
          <rect x="20" y="28" width="480" height="44" rx="8" fill="#f5f5f5" stroke="#e0e0e0" strokeWidth="1.5" />
          {/* Server A */}
          <rect x="20" y="28" width="90" height="44" rx="8" fill="#e74c3c" fillOpacity="0.85" />
          <text x="65" y="54" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="white" textAnchor="middle">Server A</text>
          {/* Server B */}
          <rect x="110" y="28" width="70" height="44" fill="#f39c12" fillOpacity="0.85" />
          <text x="145" y="54" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="white" textAnchor="middle">Server B</text>
          {/* Server C */}
          <rect x="180" y="28" width="60" height="44" fill="#3498db" fillOpacity="0.85" />
          <text x="210" y="54" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="white" textAnchor="middle">Server C</text>
          {/* Server D */}
          <rect x="240" y="28" width="50" height="44" fill="#9b59b6" fillOpacity="0.85" />
          <text x="265" y="54" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="white" textAnchor="middle">Server D</text>
          {/* Available context segment */}
          <rect x="290" y="28" width="210" height="44" rx="0" fill="#f0f0f0" stroke="#e0e0e0" strokeWidth="1" strokeDasharray="4 4"
            style={{ borderRadius: '0 8px 8px 0' }} />
          <rect x="290" y="28" width="210" height="44" fill="none" stroke="#e0e0e0" strokeWidth="1" strokeDasharray="4 4" />
          <text x="395" y="54" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="#aaa" textAnchor="middle">Available Context</text>
          {/* annotation */}
          <text x="20" y="90" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="#e74c3c">~55k tokens consumed by tool definitions (20%)</text>
        </svg>
      );
    }

    function S2Diagram() {
      const bars = [
        { x: 40, height: 120, pct: '20%', label1: 'All', label2: 'Servers', fill: '#e74c3c' },
        { x: 160, height: 15, pct: '2.4%', label1: 'Strict', label2: 'Config', fill: '#2ecc71' },
        { x: 280, height: 19, pct: '3.2%', label1: 'Session', label2: 'Toggle', fill: '#2ecc71' },
      ];
      const baseY = 140;
      return (
        <svg width="400" height="160" viewBox="0 0 400 160"
          style={{ maxWidth: '100%', overflow: 'visible' }}
          aria-label="Bar chart comparing context consumption: All Servers 20 percent, Strict Config 2.4 percent, Session Toggle 3.2 percent"
          role="img">
          {/* baseline */}
          <line x1="20" y1={baseY} x2="380" y2={baseY} stroke="#e0e0e0" strokeWidth="1" />
          {bars.map((b) => (
            <g key={b.x}>
              <rect x={b.x} y={baseY - b.height} width="80" height={b.height} rx="6" fill={b.fill} fillOpacity="0.85" />
              <text x={b.x + 40} y={baseY - b.height - 6} fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="700"
                fill={b.fill} textAnchor="middle">{b.pct}</text>
              <text x={b.x + 40} y={baseY + 14} fontFamily="'DM Sans', sans-serif" fontSize="10" fill="#666" textAnchor="middle">{b.label1}</text>
              <text x={b.x + 40} y={baseY + 26} fontFamily="'DM Sans', sans-serif" fontSize="10" fill="#666" textAnchor="middle">{b.label2}</text>
            </g>
          ))}
          {/* savings annotation: vertical bracket + label */}
          <line x1="135" y1={baseY - 120} x2="135" y2={baseY - 19} stroke="#2ecc71" strokeWidth="1.5" strokeDasharray="3 3" />
          <line x1="130" y1={baseY - 120} x2="140" y2={baseY - 120} stroke="#2ecc71" strokeWidth="1.5" />
          <line x1="130" y1={baseY - 19} x2="140" y2={baseY - 19} stroke="#2ecc71" strokeWidth="1.5" />
          <text x="142" y={baseY - 66} fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="700" fill="#2ecc71">↓ 87% less</text>
        </svg>
      );
    }

    function S3Diagram() {
      const cells = [
        { label: '/ Commands', x: 50, y: 55, stroke: '#6c5ce7' },
        { label: '🤖 Subagents', x: 162, y: 55, stroke: '#3498db' },
        { label: '🔎 MCP Servers', x: 50, y: 113, stroke: '#2ecc71' },
        { label: '⚙️ Hooks', x: 162, y: 113, stroke: '#f39c12' },
      ];
      return (
        <svg width="460" height="140" viewBox="0 0 460 140"
          style={{ maxWidth: '100%', overflow: 'visible' }}
          aria-label="Plugin package containing four bundled components: slash commands, subagents, MCP servers, and hooks"
          role="img">
          {/* outer package */}
          <rect x="20" y="15" width="420" height="110" rx="16" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="2" strokeDasharray="6 3" />
          <text x="230" y="34" fontFamily="'DM Sans', sans-serif" fontSize="13" fontWeight="700" fill="#6c5ce7" textAnchor="middle">Plugin Package</text>
          {/* component boxes */}
          {cells.map((c) => (
            <g key={c.label}>
              <rect x={c.x} y={c.y} width="88" height="44" rx="8" fill="white" stroke={c.stroke} strokeWidth="1.5" />
              <text x={c.x + 44} y={c.y + 26} fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="600" fill="#1a1a1a" textAnchor="middle">{c.label}</text>
            </g>
          ))}
          {/* install arrow */}
          <defs>
            <marker id="s3arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#2ecc71" />
            </marker>
          </defs>
          <line x1="440" y1="70" x2="394" y2="70" stroke="#2ecc71" strokeWidth="2" markerEnd="url(#s3arr)" />
          <circle cx="452" cy="70" r="12" fill="#2ecc71" />
          <text x="452" y="74" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="700" fill="white" textAnchor="middle">✓</text>
        </svg>
      );
    }

    function S4Diagram() {
      const nodes = [
        { label: 'Context', label2: 'Pollution', x: 80, fill: '#fff5f5', stroke: '#e74c3c' },
        { label: 'Ping-Pong', label2: 'Execution', x: 190, fill: '#fff8f0', stroke: '#f39c12' },
        { label: 'Lang', label2: 'Mismatch', x: 300, fill: '#fff5f5', stroke: '#e74c3c' },
        { label: 'Schema', label2: 'Limits', x: 410, fill: '#fff8f0', stroke: '#f39c12' },
      ];
      return (
        <svg width="540" height="110" viewBox="0 0 540 110"
          style={{ maxWidth: '100%', overflow: 'visible' }}
          aria-label="Four MCP drawbacks in pipeline: context pollution, ping-pong execution, language mismatch, schema limits"
          role="img">
          <defs>
            <marker id="s4arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#b0a6e8" />
            </marker>
            <marker id="s4arrRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c" />
            </marker>
          </defs>
          {/* input circle */}
          <circle cx="30" cy="55" r="20" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="2" />
          <text x="30" y="51" fontFamily="'DM Sans', sans-serif" fontSize="8" fontWeight="700" fill="#6c5ce7" textAnchor="middle">MCP</text>
          <text x="30" y="62" fontFamily="'DM Sans', sans-serif" fontSize="8" fontWeight="700" fill="#6c5ce7" textAnchor="middle">Call</text>
          {/* arrow from input to first node */}
          <line x1="50" y1="55" x2="75" y2="55" stroke="#b0a6e8" strokeWidth="1.5" markerEnd="url(#s4arr)" />
          {/* bottleneck nodes */}
          {nodes.map((n, i) => (
            <g key={n.label}>
              <rect x={n.x} y="31" width="90" height="48" rx="8" fill={n.fill} stroke={n.stroke} strokeWidth="1.5" />
              <text x={n.x + 45} y="52" fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="600" fill="#1a1a1a" textAnchor="middle">{n.label}</text>
              <text x={n.x + 45} y="66" fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="600" fill="#1a1a1a" textAnchor="middle">{n.label2}</text>
              {/* warning triangle */}
              <text x={n.x + 78} y="45" fontFamily="'DM Sans', sans-serif" fontSize="12" textAnchor="middle">⚠</text>
              {/* arrow to next node */}
              {i < nodes.length - 1 && (
                <line x1={n.x + 90} y1="55" x2={n.x + 105} y2="55" stroke="#b0a6e8" strokeWidth="1.5" markerEnd="url(#s4arr)" />
              )}
            </g>
          ))}
          {/* final arrow */}
          <line x1="500" y1="55" x2="510" y2="55" stroke="#e74c3c" strokeWidth="1.5" markerEnd="url(#s4arrRed)" />
          {/* output circle */}
          <circle cx="524" cy="55" r="16" fill="#fff5f5" stroke="#e74c3c" strokeWidth="1.5" />
          <text x="524" y="51" fontFamily="'DM Sans', sans-serif" fontSize="7" fontWeight="700" fill="#e74c3c" textAnchor="middle">Degraded</text>
          <text x="524" y="61" fontFamily="'DM Sans', sans-serif" fontSize="7" fontWeight="700" fill="#e74c3c" textAnchor="middle">Perf.</text>
        </svg>
      );
    }

    function S5Diagram() {
      return (
        <svg width="520" height="160" viewBox="0 0 520 160"
          style={{ maxWidth: '100%', overflow: 'visible' }}
          aria-label="Traditional MCP requires three round trips between LLM and server. Code Mode requires only one."
          role="img">
          <defs>
            <marker id="s5blueArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#6c5ce7" />
            </marker>
            <marker id="s5greenArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#2ecc71" />
            </marker>
            <marker id="s5redArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#e74c3c" />
            </marker>
          </defs>
          {/* dividing line */}
          <line x1="260" y1="10" x2="260" y2="150" stroke="#e0e0e0" strokeWidth="1" strokeDasharray="4 4" />

          {/* === LEFT: Traditional MCP === */}
          <text x="130" y="18" fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="700" fill="#666" textAnchor="middle">Traditional MCP</text>
          {/* LLM box */}
          <rect x="20" y="26" width="90" height="36" rx="8" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="2" />
          <text x="65" y="49" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="600" fill="#6c5ce7" textAnchor="middle">LLM</text>
          {/* MCP Server box */}
          <rect x="140" y="26" width="100" height="36" rx="8" fill="#f0fff8" stroke="#2ecc71" strokeWidth="2" />
          <text x="190" y="49" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="600" fill="#2ecc71" textAnchor="middle">MCP Server</text>
          {/* 3 round-trip arrows */}
          {[0, 1, 2].map((i) => {
            const yDown = 72 + i * 20;
            const yUp = 80 + i * 20;
            return (
              <g key={i}>
                <line x1="110" y1={yDown} x2="138" y2={yDown} stroke="#e74c3c" strokeWidth="1.5" markerEnd="url(#s5redArr)" />
                <line x1="138" y1={yUp} x2="110" y2={yUp} stroke="#6c5ce7" strokeWidth="1.5" markerEnd="url(#s5blueArr)" />
              </g>
            );
          })}
          <text x="130" y="150" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="#e74c3c" textAnchor="middle">3 round trips</text>

          {/* === RIGHT: Code Mode === */}
          <text x="390" y="18" fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="700" fill="#6c5ce7" textAnchor="middle">Code Mode</text>
          {/* LLM box */}
          <rect x="278" y="26" width="90" height="36" rx="8" fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="2" />
          <text x="323" y="49" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="600" fill="#6c5ce7" textAnchor="middle">LLM</text>
          {/* arrow to Execute Code */}
          <line x1="368" y1="44" x2="396" y2="44" stroke="#2ecc71" strokeWidth="2" markerEnd="url(#s5greenArr)" />

        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',

        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.439 7.85c-.049.322.059.648.289.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 01-.837.276c-.47-.07-.802-.48-.968-.925a2.501 2.501 0 10-3.214 3.214c.446.166.855.497.925.968a.979.979 0 01-.276.837l-1.61 1.61a2.404 2.404 0 01-1.705.707 2.402 2.402 0 01-1.704-.706l-1.568-1.568a1.026 1.026 0 00-.877-.29c-.493.074-.84.504-1.02.968a2.5 2.5 0 11-3.237-3.237c.464-.18.894-.527.967-1.02a1.026 1.026 0 00-.289-.877l-1.568-1.568A2.402 2.402 0 011.998 12c0-.617.236-1.234.706-1.704L4.23 8.77c.24-.24.581-.353.917-.303.515.077.877.528 1.073 1.01a2.5 2.5 0 103.259-3.259c-.482-.196-.933-.558-1.01-1.073-.05-.336.062-.676.303-.917l1.525-1.525A2.402 2.402 0 0112 2c.617 0 1.234.236 1.704.706l1.568 1.568c.23.23.556.338.877.29.493-.074.84-.504 1.02-.968a2.5 2.5 0 113.237 3.237c-.464.18-.894.527-.967 1.02z"/></svg>',
        /* Drawbacks: shield with X */
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>',
        /* Code Mode: terminal with cursor */
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
        /* Summary: star */
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      ];

      const NEXT_GUIDE = { id: "4.3", title: "MCP Quiz", module: "Module 4", href: "./quiz.html", isQuiz: true };

      const stages = [
        { icon: stageIcons[0], label: 'Bloat', component: S1 },
        { icon: stageIcons[1], label: 'Optimize', component: S2 },
        { icon: stageIcons[2], label: 'Plugins', component: S3 },
        { icon: stageIcons[3], label: 'Drawbacks', component: S4 },
        { icon: stageIcons[4], label: 'Code Mode', component: S5 },
        { icon: stageIcons[5], label: 'Summary', component: S6 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => { if (currentStage < stages.length - 1) setCurrentStage(currentStage + 1); };
      const handlePrev = () => { if (currentStage > 0) setCurrentStage(currentStage - 1); };

      /* SVG icon content is hardcoded above — not user input */
      const renderSidebarBtn = (stage, idx) => {
        const svgContent = stage.icon;
        const props = {
          type: 'button',
          className: `step-btn ${currentStage === idx ? 'active' : ''}`,
          'aria-label': `Step ${idx + 1}: ${stage.label}`,
          'aria-current': currentStage === idx ? 'step' : undefined,
          onClick: () => setCurrentStage(idx),
          dangerouslySetInnerHTML: { __html: svgContent }
        };
        return React.createElement('button', props);
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {stages.map((stage, idx) => (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    {renderSidebarBtn(stage, idx)}
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < stages.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              ))}
            </aside>
            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">4.2</span>
                    <h1 className="title">Advanced MCP</h1>
                  </div>
                  <div style={{ marginLeft: '20px' }}>
                    <div className="badge">DEEP DIVE</div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of {stages.length}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentStage === 0}
                      aria-label="Previous section"
                      title="Previous stage"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={currentStage === stages.length - 1}
                      aria-label="Next section"
                      title="Next stage"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>
              <main id="main" className="content-area scrollbar-hide">
                <CurrentComponent />
                {currentStage === stages.length - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">→</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
