<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Test your AI build labs knowledge with this interactive Module 7 quiz.">
  <meta name="theme-color" content="#6c5ce7">
  <meta property="og:title" content="Module 7 Quiz — Build Labs">
  <meta property="og:description" content="Test your AI build labs knowledge with this interactive Module 7 quiz.">
  <meta property="og:type" content="article">
  <meta property="og:image" content="../../assets/og-default.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Module 7 Quiz — Build Labs">
  <meta name="twitter:description" content="Test your AI build labs knowledge with this interactive Module 7 quiz.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Module 7 Quiz &mdash; Build Labs</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .option-card { padding: 18px 24px; background: white; border: 2px solid #e0e0e0; border-radius: 14px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 16px; font-size: 16px; line-height: 1.5; }
    .option-card:hover { border-color: #6c5ce7; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108, 92, 231, 0.1); }
    .option-card.selected { border-color: #6c5ce7; background: #f5f3ff; }
    .option-card.correct { border-color: #2ecc71; background: #f0faf0; }
    .option-card.incorrect { border-color: #e74c3c; background: #fef5f5; }
    .option-card.disabled { cursor: default; opacity: 0.7; }
    .option-card.disabled:hover { transform: none; box-shadow: none; }
    .option-letter { width: 36px; height: 36px; border-radius: 50%; background: #f5f3ff; border: 2px solid #e0e0e0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #6c5ce7; flex-shrink: 0; transition: all 0.3s ease; }
    .option-card.selected .option-letter { background: #6c5ce7; border-color: #6c5ce7; color: white; }
    .option-card.correct .option-letter { background: #2ecc71; border-color: #2ecc71; color: white; }
    .option-card.incorrect .option-letter { background: #e74c3c; border-color: #e74c3c; color: white; }
    .submit-btn { padding: 14px 40px; background: #6c5ce7; color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.3px; }
    .submit-btn:hover { background: #5a4bd1; transform: translateY(-2px); box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3); }
    .submit-btn:disabled { background: #c4bce8; cursor: not-allowed; transform: none; box-shadow: none; }
    .section-tag { display: inline-block; background: #eee9fd; color: #6c5ce7; padding: 4px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 12px; }
    .score-ring { width: 180px; height: 180px; position: relative; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .score-number { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 700; color: #1a1a1a; line-height: 1; }
    .score-label { font-size: 14px; color: #999; font-weight: 500; }
    .result-card { padding: 20px 24px; background: white; border-radius: 14px; border: 1px solid #e0e0e0; display: flex; align-items: center; gap: 16px; transition: all 0.3s ease; }
    .result-card:hover { border-color: #6c5ce7; box-shadow: 0 4px 16px rgba(108, 92, 231, 0.08); }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    .scale-in { animation: scaleIn 0.5s ease forwards; }

    @media (max-width: 768px) {
      .option-card { padding: 14px 16px; font-size: 15px; gap: 12px; }
      .option-letter { width: 32px; height: 32px; font-size: 13px; }
      .submit-btn { padding: 12px 32px; font-size: 15px; }
      .score-ring { width: 140px; height: 140px; }
      .score-ring svg { width: 140px; height: 140px; }
      .score-number { font-size: 36px; }
      .result-card { padding: 14px 16px; gap: 12px; }
    }
    @media (max-width: 480px) {
      .option-card { padding: 12px 14px; font-size: 14px; gap: 10px; }
      .option-letter { width: 28px; height: 28px; font-size: 12px; }
      .submit-btn { padding: 10px 24px; font-size: 14px; }
      .section-tag { font-size: 10px; padding: 3px 10px; }
      .score-ring { width: 120px; height: 120px; }
      .score-ring svg { width: 120px; height: 120px; }
      .score-number { font-size: 30px; }
      .result-card { padding: 12px; gap: 10px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    Security note: dangerouslySetInnerHTML below renders only hardcoded SVG icon
    strings defined in SECTION_ICONS and INSIGHT_ICON constants. No user input is
    involved — these are developer-controlled static markup, same pattern used
    across all quiz files in this project.
  -->
  <script type="text/babel">
    const { useState, useRef } = React;

    const QUESTIONS = [
      { id: 1, section: "7.1 RAG Build", question: "What is the recommended starting chunk size when building a RAG system?", options: ["50 tokens", "500 tokens", "5,000 tokens", "The entire document as one chunk"], correct: 1, explanation: "~500 tokens is the recommended starting point — small enough for precision, large enough for context. Adjust based on testing." },
      { id: 2, section: "7.1 RAG Build", question: "Why should you test RAG with questions you already know the answer to?", options: ["It's faster than testing with unknown questions", "Known answers let you evaluate accuracy — you can't judge correctness without ground truth", "It prevents hallucinating", "Known questions are easier for the system"], correct: 1, explanation: "You can only evaluate accuracy when you have ground truth to compare against." },
      { id: 3, section: "7.1 RAG Build", question: "What is the most common reason a RAG system returns irrelevant results?", options: ["The LLM is too small", "The embedding model is outdated", "Poor chunking strategy — documents split at wrong boundaries lose context", "The vector database is too slow"], correct: 2, explanation: "Poor chunking is the most common culprit. Documents split at wrong boundaries lose context for retrieval." },
      { id: 4, section: "7.2 Workflow Build", question: "What causes most workflow failures?", options: ["AI models being too slow", "Insufficient API rate limits", "Data format mismatches between steps", "Network connectivity issues"], correct: 2, explanation: "Data format mismatches between steps — one node outputs JSON but the next expects plain text." },
      { id: 5, section: "7.2 Workflow Build", question: "Why should you 'map before you build' when creating AI workflows?", options: ["Mapping is required by workflow tools", "It creates better documentation", "Drawing the flow on paper catches logic errors before you invest time wiring up nodes", "It makes the workflow run faster"], correct: 2, explanation: "Drawing the flow catches logic errors and missing steps before you invest time wiring up nodes." },
      { id: 6, section: "7.2 Workflow Build", question: "What makes the AI node prompt the most critical part of a workflow?", options: ["It uses the most compute resources", "Every downstream step inherits the quality of the AI output — vague prompts cascade", "It's the hardest to configure", "AI nodes are the most expensive"], correct: 1, explanation: "Every downstream step inherits the quality of the AI output. A vague prompt cascades errors through the pipeline." },
      { id: 7, section: "7.3 Agent Build", question: "What distinguishes an AI agent from an AI workflow?", options: ["Agents are faster than workflows", "Agents use more expensive models", "Agents make dynamic decisions about tools and steps; workflows follow predefined paths", "Workflows can't use AI models"], correct: 2, explanation: "Agents make dynamic decisions about tools and steps. Workflows follow predefined paths regardless of input." },
      { id: 8, section: "7.3 Agent Build", question: "What is the most common cause of agent 'looping' (repeating the same action)?", options: ["A bug in the AI model", "Too many available tools", "Unclear success criteria in the system prompt", "Insufficient compute resources"], correct: 2, explanation: "Unclear success criteria means the agent doesn't know what 'done' looks like, so it keeps trying." },
      { id: 9, section: "7.3 Agent Build", question: "Why does the lab recommend testing with exactly 3 queries?", options: ["More queries would be too expensive", "Three is the minimum to expose obvious failure modes without over-investing before fixing issues", "AI agents can only handle 3 queries per session", "It matches the number of tools available"], correct: 1, explanation: "Three queries — happy path, edge case, out-of-scope — expose obvious failure modes without over-investing." },
      { id: 10, section: "7.4 Multi-Agent Design", question: "When should you use a Supervisor pattern vs a Pipeline pattern?", options: ["Supervisor for small teams, Pipeline for large teams", "Supervisor when tasks are assigned dynamically; Pipeline when the sequence is known and fixed", "Supervisor for simple tasks, Pipeline for complex tasks", "They are interchangeable"], correct: 1, explanation: "Supervisor when tasks are assigned dynamically based on results; Pipeline when sequence is fixed." },
      { id: 11, section: "7.4 Multi-Agent Design", question: "What is the most critical design element in a multi-agent system?", options: ["The number of agents", "The AI model used for each agent", "The handoff protocol — what passes between agents, in what format, and when", "The total number of tools available"], correct: 2, explanation: "The handoff protocol defines what information passes between agents. Poor handoffs cause agents to talk past each other." },
      { id: 12, section: "7.4 Multi-Agent Design", question: "Why does the lab recommend manual testing (copy-paste between chat windows) before automation?", options: ["Automated testing is too expensive", "Manual testing is faster", "If the design doesn't work with manual handoffs, automation won't fix it", "Chat windows provide better AI responses"], correct: 2, explanation: "If it doesn't work with manual handoffs, automation won't fix it — it'll just fail faster." },
      { id: 13, section: "7.5 Capstone", question: "Why does the Capstone recommend scoping to 'build the core in Week 1'?", options: ["Week 1 has the most available time", "If the core can't be built in a week, the project is too complex for a first iteration", "AI projects always take exactly one week", "It aligns with sprint planning"], correct: 1, explanation: "If the core can't be built in a week, the project is too complex for a first iteration. Ship small, then iterate." },
      { id: 14, section: "7.5 Capstone", question: "What is the purpose of the Architecture Decision Tree in the Capstone?", options: ["To recommend the cheapest architecture", "To provide a structured way to match use cases to architectures, preventing the 'most exciting' bias", "To rank architectures by difficulty", "To eliminate the need for prototyping"], correct: 1, explanation: "It provides a structured way to match use cases to the right architecture — preventing choosing the most exciting instead of most appropriate." },
      { id: 15, section: "7.5 Capstone", question: "Why limit the solution design to exactly 3 AI prompts?", options: ["AI models can only process 3 prompts per request", "It's a design constraint that forces simplicity — more than 3 means the solution is likely too complex", "Three is the industry standard", "It reduces API costs"], correct: 1, explanation: "It's a design constraint that forces simplicity. If you need more than 3, scope down for a first iteration." }
    ];

    /* Hardcoded SVG icon strings — developer-controlled constants, no user input */
    const SECTION_ICONS = {
      "7.1": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      "7.2": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>',
      "7.3": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M12 13v4"/><circle cx="7" cy="20" r="2"/><circle cx="17" cy="20" r="2"/></svg>',
      "7.4": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="12" cy="16" r="3"/><path d="M10.5 9.5l1.5 4M13.5 9.5l-1.5 4"/></svg>',
      "7.5": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
    };

    /* Hardcoded SVG — developer-controlled constant, no user input */
    const INSIGHT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>';

    function QuestionView({ question, questionIndex, totalQuestions, selectedAnswer, answered, onSelect, onSubmit, onNext }) {
      const letters = ['A', 'B', 'C', 'D'];
      return (
        <div className="fade-in" key={question.id}>
          <div className="section-tag">{question.section}</div>
          <div className="explanation">{question.question}</div>
          <div className="scene-card">
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: '100%' }}>
              {question.options.map((option, idx) => {
                let cardClass = 'option-card';
                if (answered) { cardClass += ' disabled'; if (idx === question.correct) { cardClass += ' correct'; } else if (idx === selectedAnswer && idx !== question.correct) { cardClass += ' incorrect'; } } else if (selectedAnswer === idx) { cardClass += ' selected'; }
                return (
                  <div key={idx} className={cardClass} onClick={() => !answered && onSelect(idx)} style={{ animationDelay: `${idx * 0.08}s` }}>
                    <div className="option-letter">{letters[idx]}</div>
                    <div style={{ flex: 1 }}>{option}</div>
                    {answered && idx === question.correct && (<span style={{ fontSize: 20, flexShrink: 0 }}>&#10003;</span>)}
                    {answered && idx === selectedAnswer && idx !== question.correct && (<span style={{ fontSize: 20, flexShrink: 0 }}>&#10007;</span>)}
                  </div>
                );
              })}
            </div>
          </div>
          {!answered && (<div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8 }}><button className="submit-btn" disabled={selectedAnswer === null} onClick={onSubmit}>Check Answer</button></div>)}
          {answered && (<div className="insight-box fade-in"><div className="insight-label"><span dangerouslySetInnerHTML={{__html: INSIGHT_ICON}} /> {selectedAnswer === question.correct ? 'CORRECT!' : 'EXPLANATION'}</div>{question.explanation}</div>)}
          {answered && (<div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8 }} className="fade-in"><button className="submit-btn" onClick={onNext}>{questionIndex < totalQuestions - 1 ? 'Next Question \u2192' : 'See Results'}</button></div>)}
        </div>
      );
    }

    function ResultsView({ questions, answers, onRetry }) {
      const correctCount = answers.filter((a, i) => a === questions[i].correct).length;
      const percentage = Math.round((correctCount / questions.length) * 100);
      const circumference = 2 * Math.PI * 75;
      const strokeDashoffset = circumference - (percentage / 100) * circumference;
      const getGrade = () => {
        if (percentage >= 90) return { label: 'Outstanding!', color: '#2ecc71', emoji: '\uD83C\uDF1F' };
        if (percentage >= 70) return { label: 'Great Job!', color: '#6c5ce7', emoji: '\uD83D\uDCAA' };
        if (percentage >= 50) return { label: 'Good Effort!', color: '#f39c12', emoji: '\uD83D\uDC4D' };
        return { label: 'Keep Learning!', color: '#e74c3c', emoji: '\uD83D\uDCDA' };
      };
      const grade = getGrade();
      const sectionScores = {};
      questions.forEach((q, i) => { const sec = q.section.split(' ')[0]; if (!sectionScores[sec]) sectionScores[sec] = { correct: 0, total: 0, name: q.section }; sectionScores[sec].total++; if (answers[i] === q.correct) sectionScores[sec].correct++; });

      return (
        <div className="scale-in">
          <div style={{ textAlign: 'center', marginBottom: 32 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>{grade.emoji}</div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 32, fontWeight: 700, color: '#1a1a1a', marginBottom: 4 }}>{grade.label}</div>
            <div style={{ fontSize: 16, color: '#999' }}>Module 7: Build Labs</div>
          </div>
          <div className="scene-card" style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 48, flexWrap: 'wrap' }}>
            <div className="score-ring">
              <svg width="180" height="180" viewBox="0 0 180 180">
                <circle cx="90" cy="90" r="75" fill="none" stroke="#e8e8f0" strokeWidth="10" />
                <circle cx="90" cy="90" r="75" fill="none" stroke={grade.color} strokeWidth="10" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} style={{ transition: 'stroke-dashoffset 1s ease' }} />
              </svg>
              <div className="score-text"><div className="score-number">{percentage}%</div><div className="score-label">{correctCount}/{questions.length}</div></div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, minWidth: 280 }}>
              {Object.entries(sectionScores).map(([sec, data]) => (
                <div key={sec} className="result-card">
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: data.correct === data.total ? '#f0faf0' : '#f5f3ff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }} dangerouslySetInnerHTML={{__html: SECTION_ICONS[sec] || ''}} />
                  <div style={{ flex: 1 }}><div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a1a' }}>{data.name}</div><div style={{ fontSize: 12, color: '#999' }}>{data.correct}/{data.total} correct</div></div>
                  <div style={{ padding: '4px 12px', borderRadius: 10, fontSize: 12, fontWeight: 700, background: data.correct === data.total ? '#f0faf0' : '#fef5f5', color: data.correct === data.total ? '#2ecc71' : '#e74c3c' }}>{Math.round((data.correct / data.total) * 100)}%</div>
                </div>
              ))}
            </div>
          </div>
          <div className="insight-box" style={{ marginTop: 24 }}><div className="insight-label"><span dangerouslySetInnerHTML={{__html: INSIGHT_ICON}} /> RECOMMENDATION</div>{percentage >= 90 ? "Excellent! You've mastered the principles of building AI systems." : percentage >= 70 ? "Strong understanding of AI system building! Review the sections where you scored below 100%." : "Consider revisiting the build lab guides. Focus on failure modes and debugging strategies."}</div>
          <div className="module-complete-cta">
            <div className="celebrate">
              <span className="celebrate-icon" aria-hidden="true">&#127881;</span>
              <span className="celebrate-text">Module 7 Complete</span>
            </div>
            <a href="../final-exam/quiz.html" className="continue-btn">
              Continue to the Final Exam &#8594;
            </a>
          </div>

          <div className="quiz-actions" role="group" aria-label="Quiz actions">
            <button type="button" className="action-btn" onClick={onRetry} aria-label="Retry this quiz">
              &#8635; Retry quiz
            </button>
            <a href="../../index.html#module-7" className="action-btn" aria-label="Review Module 7">
              &#128214; Review module
            </a>
          </div>
        </div>
      );
    }

    function Quiz() {
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [answers, setAnswers] = useState([]);
      const [showResults, setShowResults] = useState(false);
      const contentRef = useRef(null);

      const resetQuiz = () => {
        setCurrentQuestion(0);
        setSelectedAnswer(null);
        setAnswered(false);
        setAnswers([]);
        setShowResults(false);
        if (contentRef.current) contentRef.current.scrollTop = 0;
      };

      const handleSelect = (idx) => setSelectedAnswer(idx);
      const handleSubmit = () => { setAnswered(true); const na = [...answers]; na[currentQuestion] = selectedAnswer; setAnswers(na); };
      const handleNext = () => { if (currentQuestion < QUESTIONS.length - 1) { setCurrentQuestion(currentQuestion + 1); setSelectedAnswer(null); setAnswered(false); if (contentRef.current) contentRef.current.scrollTop = 0; } else { setShowResults(true); } };
      const handlePrev = () => { if (currentQuestion > 0 && !showResults) { setCurrentQuestion(currentQuestion - 1); setSelectedAnswer(answers[currentQuestion - 1] ?? null); setAnswered(answers[currentQuestion - 1] !== undefined); if (contentRef.current) contentRef.current.scrollTop = 0; } };
      const handleStageClick = (idx) => { if (showResults) return; if (idx <= answers.length) { setCurrentQuestion(idx); setSelectedAnswer(answers[idx] ?? null); setAnswered(answers[idx] !== undefined); if (contentRef.current) contentRef.current.scrollTop = 0; } };
      const getStepStatus = (idx) => { if (answers[idx] !== undefined) { return answers[idx] === QUESTIONS[idx].correct ? 'correct' : 'incorrect'; } return ''; };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {QUESTIONS.map((q, idx) => (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentQuestion === idx && !showResults ? 'active' : ''}`}>
                    <button
                      type="button"
                      className={`step-btn ${currentQuestion === idx && !showResults ? 'active' : ''} ${getStepStatus(idx)}`}
                      aria-label={`Step ${idx + 1}: Question ${idx + 1}`}
                      aria-current={currentQuestion === idx && !showResults ? "step" : undefined}
                      onClick={() => handleStageClick(idx)}
                      style={{ fontSize: 16, fontWeight: 700 }}
                    >
                      {answers[idx] !== undefined ? (answers[idx] === QUESTIONS[idx].correct ? '\u2713' : '\u2717') : idx + 1}
                    </button>
                    <div className="step-btn-label">Q{idx + 1}</div>
                  </div>
                  {idx < QUESTIONS.length - 1 && (<div className={`step-connector ${answers[idx] !== undefined ? 'active' : ''}`} />)}
                </React.Fragment>
              ))}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                  <span style={{ marginLeft: 20, fontSize: 14, color: '#999' }}>|</span>
                  <div style={{ marginLeft: 12, display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">7.6</span>
                    <h1 className="title">Module 7 Quiz</h1>
                  </div>
                  <div style={{ marginLeft: 16 }}><div className="badge">QUIZ</div></div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  {!showResults && <span className="progress-indicator">Question {currentQuestion + 1} of {QUESTIONS.length}</span>}
                  {showResults && <span className="progress-indicator">Results</span>}
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentQuestion === 0 || showResults}
                      aria-label="Previous section"
                      title="Previous question"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={!answered || showResults}
                      aria-label="Next section"
                      title="Next question"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>
              <main id="main" className="content-area scrollbar-hide" ref={contentRef}>
                {showResults ? <ResultsView questions={QUESTIONS} answers={answers} onRetry={resetQuiz} /> : <QuestionView question={QUESTIONS[currentQuestion]} questionIndex={currentQuestion} totalQuestions={QUESTIONS.length} selectedAnswer={selectedAnswer} answered={answered} onSelect={handleSelect} onSubmit={handleSubmit} onNext={handleNext} />}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Quiz />);
  </script>
</body>
</html>
