<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Use the VERIFY framework to check Generative AI output: Verify, Evaluate, Reason, Investigate, Fact-check, You confirm.">
  <meta name="theme-color" content="#6c5ce7">
  <meta property="og:title" content="The VERIFY Framework — Interactive Guide">
  <meta property="og:description" content="Use the VERIFY framework to check Generative AI output: Verify, Evaluate, Reason, Investigate, Fact-check, You confirm.">
  <meta property="og:type" content="article">
  <meta property="og:image" content="../../assets/og-default.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The VERIFY Framework — Interactive Guide">
  <meta name="twitter:description" content="Use the VERIFY framework to check Generative AI output: Verify, Evaluate, Reason, Investigate, Fact-check, You confirm.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>The VERIFY Framework: Using AI Responsibly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* .stage-header here uses 22px (guide-specific override) vs shared 24px — kept intentional */
    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes checkmark {
      from {
        transform: scale(0) rotate(-45deg);
      }
      to {
        transform: scale(1) rotate(0);
      }
    }

    @keyframes letterReveal {
      from {
        opacity: 0;
        transform: scale(0.8) rotate(10deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    /* Override sidebar padding to match guide's original 50px top */
    .sidebar {
      padding: 50px 12px 20px;
      gap: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const svgIcon = (svg, size) => React.createElement('span', {
      dangerouslySetInnerHTML: { __html: svg.replace(/width="\d+"/, 'width="' + (size || 28) + '"').replace(/height="\d+"/, 'height="' + (size || 28) + '"') },
      style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', lineHeight: 0 }
    });

    const SVG = {
      validate: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
      exclude: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',
      review: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      iterate: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>',
      flag: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
      user: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      lightbulb: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',
      overview: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
      newspaper: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16a1 1 0 011 1v14a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/><line x1="7" y1="16" x2="11" y2="16"/></svg>',
      lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
      medical: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a3 3 0 00-3 3v4H5a3 3 0 00-3 3v0a3 3 0 003 3h4v4a3 3 0 003 3v0a3 3 0 003-3v-4h4a3 3 0 003-3v0a3 3 0 00-3-3h-4V5a3 3 0 00-3-3z"/></svg>',
      mail: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 4 12 13 2 4"/></svg>',
      code: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      warning: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      flagSmall: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>'
    };

    const P = {
      root: {
        display: 'flex',
        flexDirection: 'row',
        width: '100%',
        height: '100%',
        backgroundColor: '#fff',
        overflow: 'hidden'
      },
      sidebar: {
        width: '180px',
        backgroundColor: '#f8f9fa',
        borderRight: '1px solid #e9ecef',
        padding: '24px 16px',
        overflowY: 'auto',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        gap: '8px',
        position: 'relative'
      },
      stepCircle: (isActive, isComplete) => ({
        width: '60px',
        height: '60px',
        borderRadius: '50%',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        cursor: 'pointer',
        transition: 'all 0.3s ease',
        backgroundColor: isActive ? '#6c5ce7' : isComplete ? '#2ecc71' : '#e9ecef',
        color: isActive || isComplete ? '#fff' : '#666',
        fontSize: '24px',
        fontWeight: '700',
        position: 'relative',
        zIndex: 2,
        border: isActive ? '3px solid #6c5ce7' : 'none',
        boxShadow: isActive ? '0 4px 12px rgba(108, 92, 231, 0.3)' : 'none'
      }),
      stepLabel: {
        fontSize: '12px',
        fontWeight: '500',
        marginTop: '8px',
        textAlign: 'center',
        color: '#666',
        width: '80px',
        lineHeight: '1.2'
      },
      connector: (isComplete) => ({
        width: '2px',
        height: '28px',
        backgroundColor: isComplete ? '#2ecc71' : '#d0d0d0',
        margin: '4px 0',
        transition: 'background-color 0.3s ease'
      }),
      main: {
        flex: 1,
        display: 'flex',
        flexDirection: 'column',
        overflow: 'hidden',
        backgroundColor: '#fff'
      },
      topBar: {
        height: '64px',
        borderBottom: '1px solid #e9ecef',
        padding: '12px 32px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        backgroundColor: '#f8f9fa'
      },
      leftSection: {
        display: 'flex',
        alignItems: 'center',
        gap: '16px'
      },
      backLink: {
        fontSize: '14px',
        color: '#6c5ce7',
        textDecoration: 'none',
        fontWeight: '500',
        transition: 'color 0.2s ease'
      },
      badge: {
        display: 'inline-block',
        backgroundColor: '#e8f0fe',
        color: '#6c5ce7',
        padding: '6px 12px',
        borderRadius: '20px',
        fontSize: '12px',
        fontWeight: '600',
        textTransform: 'uppercase',
        letterSpacing: '0.5px'
      },
      title: {
        fontSize: '36px',
        fontWeight: '600',
        color: '#1a1a1a',
        fontFamily: "'Fraunces', serif"
      },
      navRow: {
        display: 'flex',
        alignItems: 'center',
        gap: '24px'
      },
      navBtn: (disabled) => ({
        width: '36px',
        height: '36px',
        borderRadius: '12px',
        border: '1px solid #d0d0d0',
        backgroundColor: disabled ? '#f0f0f0' : '#fff',
        color: disabled ? '#bbb' : '#1a1a1a',
        cursor: disabled ? 'default' : 'pointer',
        fontSize: '18px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        transition: 'all 0.2s ease',
        fontWeight: '600'
      }),
      navP: {
        fontSize: '14px',
        color: '#666',
        fontWeight: '500',
        minWidth: '60px',
        textAlign: 'right'
      },
      content: {
        flex: 1,
        padding: '20px 32px',
        overflowY: 'auto',
        scrollBehavior: 'smooth',
        display: 'flex',
        flexDirection: 'column',
        gap: '16px'
      },
      explainRow: {
        display: 'flex',
        flexDirection: 'column',
        gap: '16px'
      },
      explain: {
        fontSize: '18px',
        lineHeight: '1.7',
        color: '#333',
        maxWidth: '100%'
      },
      scene: {
        background: 'linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%)',
        borderRadius: '16px',
        padding: '24px',
        border: '1px solid #e9ecef',
        boxShadow: '0 2px 8px rgba(0,0,0,0.04)',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        animation: 'fadeIn 0.5s ease-out'
      },
      insightLabel: {
        fontSize: '14px',
        fontWeight: '700',
        textTransform: 'uppercase',
        letterSpacing: '0.5px',
        color: '#1a9456',
        marginBottom: '8px',
        display: 'flex',
        alignItems: 'center',
        gap: '8px'
      },
      insight: {
        backgroundColor: '#f0faf0',
        borderLeft: '4px solid #2ecc71',
        borderRadius: '8px',
        padding: '14px 18px',
        marginTop: '0',
        fontSize: '17px',
        lineHeight: '1.7',
        color: '#333',
        fontStyle: 'italic'
      },
      sceneTitle: {
        fontSize: '24px',
        fontWeight: '600',
        marginBottom: '20px',
        color: '#1a1a1a',
        fontFamily: "'Fraunces', serif"
      },
      sceneGrid: {
        display: 'grid',
        gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
        gap: '24px',
        width: '100%'
      },
      card: (active) => ({
        backgroundColor: active ? '#6c5ce7' : '#fff',
        border: active ? '2px solid #6c5ce7' : '2px solid #d0d0d0',
        borderRadius: '8px',
        padding: '16px',
        cursor: 'pointer',
        transition: 'all 0.3s ease',
        textAlign: 'center',
        color: active ? '#fff' : '#1a1a1a',
        fontSize: '16px',
        fontWeight: '500'
      }),
      button: (variant) => {
        const baseStyles = {
          padding: '10px 20px',
          borderRadius: '6px',
          border: 'none',
          cursor: 'pointer',
          fontSize: '16px',
          fontWeight: '600',
          transition: 'all 0.2s ease',
          marginRight: '8px'
        };
        if (variant === 'primary') {
          return {
            ...baseStyles,
            backgroundColor: '#6c5ce7',
            color: '#fff'
          };
        }
        return {
          ...baseStyles,
          backgroundColor: '#e9ecef',
          color: '#1a1a1a'
        };
      },
      highlightRed: {
        backgroundColor: '#ffe5e5',
        color: '#c23030',
        padding: '2px 6px',
        borderRadius: '3px',
        fontWeight: '500',
        cursor: 'pointer',
        transition: 'all 0.2s ease'
      },
      highlightGreen: {
        backgroundColor: '#c8e6c9',
        color: '#1b5e20',
        padding: '2px 6px',
        borderRadius: '3px',
        fontWeight: '500'
      },
      highlightYellow: {
        backgroundColor: '#fff9c4',
        color: '#f57f17',
        padding: '2px 6px',
        borderRadius: '3px',
        fontWeight: '500',
        cursor: 'pointer',
        transition: 'all 0.2s ease'
      },
      letterBox: (color) => ({
        width: '80px',
        height: '80px',
        borderRadius: '12px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        backgroundColor: color,
        color: '#fff',
        fontSize: '48px',
        fontWeight: '700',
        fontFamily: "'Fraunces', serif",
        animation: 'letterReveal 0.6s ease-out',
        boxShadow: '0 4px 12px rgba(0,0,0,0.15)'
      }),
      iconBox: {
        fontSize: '32px',
        marginBottom: '12px'
      },
      progressBar: {
        display: 'flex',
        alignItems: 'center',
        gap: '6px',
        padding: '8px 0'
      },
      progressDot: (isActive, isComplete) => ({
        width: isActive ? '28px' : '10px',
        height: '10px',
        borderRadius: '5px',
        backgroundColor: isActive ? '#6c5ce7' : isComplete ? '#2ecc71' : '#d0d0d0',
        transition: 'all 0.3s ease'
      })
    };

    const STAGES = [
      { svgKey: "overview", label: "Overview", title: "The VERIFY Framework", sub: "6 steps to use AI responsibly" },
      { svgKey: "validate", label: "Validate", title: "V — Validate", sub: "Check outputs against trusted sources" },
      { svgKey: "exclude", label: "Exclude", title: "E — Exclude", sub: "Keep sensitive data out of prompts" },
      { svgKey: "review", label: "Review", title: "R — Review", sub: "Check for bias and accuracy" },
      { svgKey: "iterate", label: "Iterate", title: "I — Iterate", sub: "Improve prompts through refinement" },
      { svgKey: "flag", label: "Flag", title: "F — Flag", sub: "Mark uncertainty in AI responses" },
      { svgKey: "user", label: "Your Call", title: "Y — Your Judgment", sub: "You are the final decision-maker" }
    ];

    const InsightBox = ({ children }) => (
      <div style={P.insight}>
        <div style={P.insightLabel}>
          {svgIcon(SVG.lightbulb, 20)}
          INSIGHT
        </div>
        {children}
      </div>
    );

    const ProgressIndicator = ({ current, total }) => (
      <div style={P.progressBar}>
        {Array.from({ length: total }).map((_, idx) => (
          <div key={idx} style={P.progressDot(idx === current, idx < current)} />
        ))}
      </div>
    );

    const VERIFY_WORDS = ["Validate", "Exclude", "Review", "Iterate", "Flag", "Your Call"];
    const VERIFY_LETTERS = ["V", "E", "R", "I", "F", "Y"];
    const NODE_X = [10, 125, 240, 355, 470, 585];

    const VERIFYFlow = ({ activeNode }) => {
      const arrowId = "verifyArrow";
      return (
        <svg viewBox="0 0 720 130" style={{ width: '100%', maxWidth: '720px', height: 'auto', display: 'block' }}>
          <defs>
            <marker id={arrowId} markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#b0a6e8" />
            </marker>
          </defs>
          {NODE_X.slice(0, 5).map((x, i) => (
            <path
              key={i}
              d={`M${x + 100},65 L${NODE_X[i + 1]},65`}
              stroke="#b0a6e8"
              strokeWidth="1.5"
              fill="none"
              markerEnd={`url(#${arrowId})`}
            />
          ))}
          {NODE_X.map((x, i) => (
            <g key={i}>
              <rect
                x={x}
                y={30}
                width={100}
                height={70}
                rx={12}
                fill={i === activeNode ? '#f5f3ff' : '#ffffff'}
                stroke={i === activeNode ? '#6c5ce7' : '#e0e0e0'}
                strokeWidth={i === activeNode ? 2 : 1.5}
              />
              <text
                x={x + 50}
                y={60}
                textAnchor="middle"
                fontSize="28"
                fontWeight="800"
                fill="#6c5ce7"
                fontFamily="DM Sans, sans-serif"
              >
                {VERIFY_LETTERS[i]}
              </text>
              <text
                x={x + 50}
                y={85}
                textAnchor="middle"
                fontSize="9"
                fontWeight="600"
                fill="#666"
                fontFamily="DM Sans, sans-serif"
              >
                {VERIFY_WORDS[i]}
              </text>
            </g>
          ))}
        </svg>
      );
    };

    const OverviewStage = () => {
      const [revealed, setRevealed] = useState([]);
      const [activeStep, setActiveStep] = useState(0);

      useEffect(() => {
        const letters = ['V', 'E', 'R', 'I', 'F', 'Y'];
        letters.forEach((_, idx) => {
          setTimeout(() => {
            setRevealed(prev => [...prev, idx]);
          }, idx * 150);
        });
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          setActiveStep(prev => (prev + 1) % 6);
        }, 1200);
        return () => clearInterval(timer);
      }, []);

      const meanings = [
        "Validate outputs against trusted sources",
        "Exclude sensitive data from prompts",
        "Review for bias and accuracy",
        "Iterate prompts to improve results",
        "Flag uncertainty in AI responses",
        "Your judgment is final"
      ];

      const colors = ['#6c5ce7', '#2ecc71', '#1a9456', '#f39c12', '#e74c3c', '#3498db'];

      const letterSvgs = [SVG.validate, SVG.exclude, SVG.review, SVG.iterate, SVG.flag, SVG.user];

      return (
        <div style={P.content}>
          <div style={P.explainRow}>
            <div style={P.explain}>
              VERIFY is a 6-step checklist to make sure you're using AI safely and getting accurate results. Think of it like being a newspaper fact-checker -- journalists don't publish the first thing a source tells them.
            </div>
          </div>

          <div style={P.scene}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '24px', width: '100%', alignItems: 'center' }}>
              <VERIFYFlow activeNode={activeStep} />
              <div style={{ display: 'flex', gap: '20px', justifyContent: 'center', flexWrap: 'wrap' }}>
                {['V', 'E', 'R', 'I', 'F', 'Y'].map((letter, idx) => (
                  <div key={idx} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px' }}>
                    {revealed.includes(idx) && (
                      <div style={P.letterBox(colors[idx])}>
                        {letter}
                      </div>
                    )}
                    {revealed.includes(idx) && (
                      <div style={{ color: colors[idx], marginBottom: '2px' }}>
                        {svgIcon(letterSvgs[idx], 22)}
                      </div>
                    )}
                    {revealed.includes(idx) && (
                      <div style={{
                        fontSize: '14px',
                        textAlign: 'center',
                        maxWidth: '100px',
                        color: '#555',
                        animation: 'fadeIn 0.4s ease-out',
                        lineHeight: '1.4'
                      }}>
                        {meanings[idx]}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div style={{
                fontSize: '16px',
                color: '#555',
                textAlign: 'center',
                maxWidth: '480px',
                marginTop: '16px',
                padding: '20px 24px',
                backgroundColor: '#fff',
                borderRadius: '12px',
                border: '1px solid #e9ecef',
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                justifyContent: 'center'
              }}>
                {svgIcon(SVG.newspaper, 48)}
                <span><strong>Like a newspaper fact-checker:</strong> Verify with multiple sources, remove sensitive info, and always make the final call.</span>
              </div>
            </div>
          </div>

          <InsightBox>
            VERIFY is like being a newspaper fact-checker -- verify with multiple sources, remove sensitive info, and always make the final call.
          </InsightBox>
        </div>
      );
    };

    const ValidateStage = () => {
      const [mode, setMode] = useState('correct');
      const [validated, setValidated] = useState([]);
      const [checklist, setChecklist] = useState({
        checkTrusted: false,
        checkMultiple: false,
        verifyFacts: false
      });

      const handleValidate = (idx) => {
        if (!validated.includes(idx)) {
          setValidated([...validated, idx]);
          if (validated.length === 1) {
            setTimeout(() => {
              setMode('incorrect');
              setValidated([]);
            }, 600);
          }
        }
      };

      const toggleCheck = (key) => {
        setChecklist({ ...checklist, [key]: !checklist[key] });
      };

      const sources = ['Wikipedia', 'Official Docs', 'Research Paper'];

      return (
        <div style={P.content}>
          <div><div className="stage-header">V &mdash; Validate Sources</div></div>
          <div style={P.explainRow}>
            <div style={P.explain}>
              Like double-checking Wikipedia with textbooks. Always validate AI outputs against trusted, authoritative sources before using them. Don't rely on a single source.
            </div>
          </div>

          <div style={P.scene}>

    const YourJudgmentStage = () => {
      const [responses, setResponses] = useState([null, null, null]);

      const scenarioSvgs = [SVG.medical, SVG.mail, SVG.code];

      const scenarios = [
        {
          title: 'Medical Dosage',
          question: 'AI suggests a patient dosage. Should you follow it?',
          correct: 'override',
          answer: 'ALWAYS consult a doctor. Never rely on AI for medical decisions.',
          reason: 'Medical decisions have life-or-death consequences. AI is not a doctor.'
        },
        {
          title: 'Marketing Email',
          question: 'AI writes a marketing email. Is it ready to send?',
          correct: 'override',
          answer: 'Review for brand voice first. Adjust tone and messaging.',
          reason: 'The email may not match your brand\'s voice, values, or compliance standards.'
        },
        {
          title: 'Production Code',
          question: 'AI generates code for production. Deploy it?',
          correct: 'override',
          answer: 'Test thoroughly in staging first. Review for security.',
          reason: 'Untested code can break systems, expose data, or create vulnerabilities.'
        }
      ];

      const handleResponse = (idx, response) => {
        const newResponses = [...responses];
        newResponses[idx] = response;
        setResponses(newResponses);
      };

      const allAnswered = responses.every(r => r !== null);

      return (
        <div style={P.content}>
          <div><div className="stage-header">Y &mdash; Your Judgment is Final</div></div>
          <div style={P.explainRow}>
            <div style={P.explain}>
              You're the driver, AI is just GPS. GPS suggests a route, but you decide whether to follow it, take a detour, or go a completely different way. Your judgment is always final.
            </div>
          </div>

          <div style={P.scene}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', width: '100%' }}>
              {scenarios.map((scenario, idx) => (
                <div key={idx} style={{
                  backgroundColor: '#fff',
                  borderRadius: '12px',
                  padding: '20px',
                  border: responses[idx] ? '2px solid #6c5ce7' : '1px solid #e9ecef'
                }}>
                  <div style={{ display: 'flex', gap: '16px', marginBottom: '12px', alignItems: 'center' }}>
                    <div style={{ color: '#6c5ce7' }}>{svgIcon(scenarioSvgs[idx], 36)}</div>
                    <div>
                      <div style={{ fontSize: '20px', fontWeight: '600', color: '#1a1a1a', fontFamily: "'Fraunces', serif" }}>
                        {scenario.title}
                      </div>
                      <div style={{ fontSize: '16px', color: '#666', marginTop: '4px' }}>
                        {scenario.question}
                      </div>
                    </div>
                  </div>

                  {!responses[idx] ? (
                    <div style={{ display: 'flex', gap: '8px' }}>
                      <button onClick={() => handleResponse(idx, 'accept')} style={{
                        ...P.button('secondary'),
                        flex: 1
                      }}>
                        Accept
                      </button>
                      <button onClick={() => handleResponse(idx, 'override')} style={{
                        ...P.button('primary'),
                        flex: 1
                      }}>
                        Override
                      </button>
                    </div>
                  ) : (
                    <div style={{
                      backgroundColor: responses[idx] === scenario.correct ? '#c8e6c9' : '#ffcdd2',
                      borderRadius: '6px',
                      padding: '12px',
                      borderLeft: '4px solid ' + (responses[idx] === scenario.correct ? '#2ecc71' : '#e74c3c')
                    }}>
                      <div style={{
                        fontSize: '14px',
                        fontWeight: '600',
                        color: responses[idx] === scenario.correct ? '#1b5e20' : '#c23030',
                        marginBottom: '6px'
                      }}>
                        {responses[idx] === scenario.correct ? '✓ Correct' : '✗ Not quite'}
                      </div>
                      <div style={{
                        fontSize: '14px',
                        color: '#333',
                        lineHeight: '1.5',
                        marginBottom: '6px'
                      }}>
                        {scenario.answer}
                      </div>
                      <div style={{
                        fontSize: '14px',
                        color: '#666',
                        fontStyle: 'italic'
                      }}>
                        {scenario.reason}
                      </div>
                    </div>
                  )}
                </div>
              ))}

              {allAnswered && (
                <div style={{
                  backgroundColor: '#e8f0fe',
                  borderLeft: '4px solid #6c5ce7',
                  borderRadius: '8px',
                  padding: '16px',
                  animation: 'slideInLeft 0.4s ease'
                }}>
                  <div style={{ fontSize: '16px', fontWeight: '600', color: '#6c5ce7', marginBottom: '8px' }}>
                    {'✓'} You've completed the VERIFY Framework!
                  </div>
                  <div style={{ fontSize: '16px', color: '#333', lineHeight: '1.6' }}>
                    Remember: AI is a powerful assistant, but <strong>you are responsible for the final output</strong>. Always verify before trusting.
                  </div>
                </div>
              )}
            </div>
          </div>

          <InsightBox>
            AI is a powerful assistant, but you're responsible for the final output. Always verify before trusting -- that's the VERIFY way.
          </InsightBox>
        </div>
      );
    };

    const sidebarIcons = STAGES.map(s => SVG[s.svgKey]);

    const VerifyFramework = () => {
      const [current, setCurrent] = useState(0);

      const handlePrev = () => {
        if (current > 0) setCurrent(current - 1);
      };

      const handleNext = () => {
        if (current < STAGES.length - 1) setCurrent(current + 1);
      };

      const renderStage = () => {
        switch (current) {
          case 0:
            return <OverviewStage />;
          case 1:
            return <ValidateStage />;
          case 2:
            return <ExcludeStage />;
          case 3:
            return <ReviewStage />;
          case 4:
            return <IterateStage />;
          case 5:
            return <FlagStage />;
          case 6:
            return <YourJudgmentStage />;
          default:
            return <OverviewStage />;
        }
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div style={P.root}>
            <aside className="sidebar" aria-label="Guide sections">
              {STAGES.map((stage, idx) => {
                const iconMarkup = { __html: sidebarIcons[idx] };
                return (
                  <React.Fragment key={idx}>
                    <div className={`step-wrapper ${current === idx ? 'active' : ''}`}>
                      <button
                        type="button"
                        className={`step-btn ${current === idx ? 'active' : ''}`}
                        aria-label={`Step ${idx + 1}: ${stage.label}`}
                        aria-current={current === idx ? "step" : undefined}
                        onClick={() => setCurrent(idx)}
                        dangerouslySetInnerHTML={iconMarkup}
                      />
                      <div className="step-btn-label">{stage.label}</div>
                    </div>
                    {idx < STAGES.length - 1 && (
                      <div className={`step-connector ${current > idx ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

            <div style={P.main}>
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">← Back to All Guides</a>
                  <span style={{ fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">1.6</span>
                    <div className="title">{STAGES[current].title}</div>
                  </div>
                  <div>
                    <div className="badge">INTERACTIVE</div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {current + 1} of {STAGES.length}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button type="button" className="arrow-btn" aria-label="Previous section" onClick={handlePrev} disabled={current === 0}>←</button>
                    <button type="button" className="arrow-btn" aria-label="Next section" onClick={handleNext} disabled={current === STAGES.length - 1}>→</button>
                  </nav>
                </div>
              </div>

              <main id="main" style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                {renderStage()}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<VerifyFramework />);
  </script>
</body>
</html>
