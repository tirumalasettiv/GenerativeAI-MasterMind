    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes fillPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .cursor { animation: blink 1s infinite; }

    /* Disclosure badge - shared across all click-to-expand cards */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ---- SVG Icon Strings ---- */

    const SVG_CALENDAR = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    const SVG_BRAIN = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9b59b6" stroke-width="1.5"><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/><circle cx="12" cy="9" r="2"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>';
    const SVG_SHIELD = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>';
    const SVG_OVERVIEW = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5"><path d="M12 2a8 8 0 00-8 8c0 3.36 2.07 6.23 5 7.4V22h6v-4.6c2.93-1.17 5-4.04 5-7.4a8 8 0 00-8-8z"/><path d="M8 2L6 4M16 2l2 2M4 8H2M22 8h-2"/></svg>';

    /* Small sidebar versions */

    const SVG_CALENDAR_SM = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

    const SVG_SHIELD_SM = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>';
    const SVG_OVERVIEW_SM = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a8 8 0 00-8 8c0 3.36 2.07 6.23 5 7.4V22h6v-4.6c2.93-1.17 5-4.04 5-7.4a8 8 0 00-8-8z"/><path d="M8 2L6 4M16 2l2 2M4 8H2M22 8h-2"/></svg>';

    function SvgIcon({ html, style }) {
      return React.createElement('span', {
        dangerouslySetInnerHTML: { __html: html },
        style: Object.assign({ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }, style || {})
      });
    }

    const NEXT_GUIDE = { id: "1.6", title: "VERIFY Framework", module: "Module 1", href: "./verify-framework.html" };
    const STAGES = [
      { svgSm: SVG_OVERVIEW_SM, svg: SVG_OVERVIEW, label: "Overview", title: "The Three Weaknesses", sub: "What GenAI gets wrong" },
      { svgSm: SVG_GHOST_SM, svg: SVG_GHOST, label: "Hallucinate", title: "Hallucinations", sub: "Confidently making things up" },
      { svgSm: SVG_CALENDAR_SM, svg: SVG_CALENDAR, label: "Cutoff", title: "Knowledge Cutoff", sub: "Frozen in time" },
      { svgSm: SVG_BRAIN_SM, svg: SVG_BRAIN, label: "Memory", title: "Context Window", sub: "Short-term memory limits" },
      { svgSm: SVG_SHIELD_SM, svg: SVG_SHIELD, label: "Mitigate", title: "Mitigation Strategies", sub: "How to work around limitations" }
    ];

    const P = {
      root: {
        width: '100vw',
        height: '100vh',
        display: 'flex',
        flexDirection: 'row',
        overflow: 'hidden',
        background: '#ffffff'
      },
      sidebar: {
        width: '210px',
        backgroundColor: '#f8f9fa',
        borderRight: '1px solid #e0e0e0',
        display: 'flex',
        flexDirection: 'column',
        padding: '56px 20px 40px',
        gap: '6px',
        overflow: 'auto',
        position: 'relative'
      },
      stepButton: (isActive) => ({
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        gap: '8px',
        padding: '14px 10px',
        borderRadius: '12px',
        border: 'none',
        backgroundColor: isActive ? '#6c5ce7' : 'transparent',
        cursor: 'pointer',
        transition: 'all 0.3s ease',
        position: 'relative',
        color: isActive ? '#ffffff' : '#666',
        fontSize: '12px',
        fontWeight: '600',
        textAlign: 'center',
        width: '100%'
      }),
      stepConnector: {
        position: 'absolute',
        left: '50%',
        width: '2px',
        height: '6px',
        background: '#ddd',
        transform: 'translateX(-50%)',
        bottom: '-6px'
      },
      main: {
        flex: 1,
        display: 'flex',
        flexDirection: 'column',
        overflow: 'hidden'
      },
      topBar: {
        minHeight: '76px',
        borderBottom: '1px solid #e0e0e0',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        paddingLeft: '48px',
        paddingRight: '48px',
        backgroundColor: '#ffffff'
      },
      badge: {
        display: 'inline-block',
        backgroundColor: '#6c5ce7',
        color: '#ffffff',
        padding: '6px 14px',
        borderRadius: '20px',
        fontSize: '12px',
        fontWeight: '600',
        marginRight: '14px'
      },
      title: {
        fontSize: '36px',
        fontFamily: 'Fraunces, serif',
        fontWeight: '700',
        color: '#1a1a1a'
      },
      navRow: {
        display: 'flex',
        alignItems: 'center',
        gap: '24px'
      },
      navBtn: (disabled) => ({
        background: 'none',
        border: 'none',
        fontSize: '24px',
        cursor: disabled ? 'not-allowed' : 'pointer',
        opacity: disabled ? '0.3' : '1',
        transition: 'all 0.2s ease',
        padding: '8px',
        borderRadius: '12px'
      }),
      navP: {
        fontSize: '15px',
        color: '#666',
        fontWeight: '500'
      },
      content: {
        flex: 1,
        overflow: 'auto',
        padding: '24px 36px',
        display: 'flex',
        flexDirection: 'column',
        gap: '18px',
        scrollBehavior: 'smooth'
      },
      explainRow: {
        animation: 'fadeIn 0.5s ease'
      },
      explain: {
        fontSize: '22px',
        lineHeight: '1.7',
        color: '#2a2a2a',
        maxWidth: '100%'
      },
      scene: {
        backgroundColor: 'transparent',
        background: 'linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%)',
        borderRadius: '16px',
        padding: '28px',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        animation: 'fadeIn 0.6s ease 0.1s both',
        boxShadow: '0 4px 20px rgba(0,0,0,0.07)'
      },
      insight: {
        backgroundColor: '#f0faf0',
        color: '#2a2a2a',
        padding: '16px 20px',
        borderRadius: '12px',
        fontSize: '17px',
        fontWeight: '500',
        lineHeight: '1.7',
        marginTop: '0',
        animation: 'slideInLeft 0.5s ease 0.2s both',
        borderLeft: '6px solid #2ecc71'
      },
      backLink: {
        position: 'absolute',
        top: '24px',
        left: '24px',
        fontSize: '14px',
        color: '#6c5ce7',
        textDecoration: 'none',
        fontWeight: '600',
        transition: 'color 0.2s ease',
        zIndex: 10
      }
    };

    /* ---- Stage Progress Indicator ---- */
    function StageProgress({ current, total }) {
      return React.createElement('div', {
        style: {
          display: 'flex',
          alignItems: 'center',
          gap: '6px',
          marginRight: '20px'
        }
      }, Array.from({ length: total }).map(function(_, i) {
        return React.createElement('div', {
          key: i,
          style: {
            width: i === current ? '28px' : '10px',
            height: '6px',
            borderRadius: '3px',
            backgroundColor: i === current ? '#6c5ce7' : (i < current ? '#b8b0f0' : '#ddd'),
            transition: 'all 0.3s ease'
          }
        });
      }));
    }

    function S1({ onNavigate }) {
      const [animated, setAnimated] = useState([false, false, false]);

      useEffect(() => {
        const timers = [
          setTimeout(() => setAnimated(prev => [true, prev[1], prev[2]]), 200),
          setTimeout(() => setAnimated(prev => [prev[0], true, prev[2]]), 400),
          setTimeout(() => setAnimated(prev => [prev[0], prev[1], true]), 600)
        ];
        return () => timers.forEach(t => clearTimeout(t));
      }, []);

      const cards = [
        { svg: SVG_GHOST, title: "Hallucinations", desc: "Makes things up confidently", color: "#ff6b6b", idx: 0 },
        { svg: SVG_CALENDAR, title: "Knowledge Cutoff", desc: "Frozen knowledge at training date", color: "#ffa500", idx: 1 },
        { svg: SVG_BRAIN, title: "Context Window", desc: "Forgets long conversations", color: "#ffd700", idx: 2 }
      ];

      return (
        <>
          <div style={P.explainRow}>
            <p style={P.explain}>
              GenAI has three major weaknesses that every user must understand: it can make things up (hallucinations), its knowledge has a cutoff date, and it can only 'remember' a limited conversation.
            </p>
          </div>
          <div style={P.scene}>
            <div style={{ display: 'flex', gap: '28px', flexWrap: 'wrap', justifyContent: 'center' }}>
              {cards.map((card, i) => (
                <div
                  key={i}
                  onClick={() => onNavigate(i + 1)}
                  style={{
                    width: '200px',
                    padding: '28px 24px',
                    backgroundColor: '#ffffff',
                    borderLeft: '6px solid ' + card.color,
                    borderRadius: '12px',
                    textAlign: 'center',
                    cursor: 'pointer',
                    opacity: animated[i] ? 1 : 0,
                    transform: animated[i] ? 'scale(1)' : 'scale(0.9)',
                    transition: 'all 0.4s ease',
                    boxShadow: '0 4px 16px rgba(0,0,0,0.08)',
                    animation: animated[i] ? 'pulse 2s infinite' : 'none'
                  }}
                >
                  <div style={{ marginBottom: '14px' }}>
                    <SvgIcon html={card.svg} />
                  </div>
                  <div style={{ fontSize: '20px', fontWeight: '600', marginBottom: '10px', color: '#1a1a1a' }}>
                    {card.title}
                  </div>
                  <div style={{ fontSize: '16px', color: '#666' }}>
                    {card.desc}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div style={P.insight}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
              <SvgIcon html={SVG_LIGHTBULB} />
              <span style={{ fontSize: '14px', fontWeight: '700', color: '#1a9456' }}>INSIGHT</span>
            </div>
            Understanding these limitations is the difference between using AI effectively and being misled by it.
          </div>
        </>
      );
    }

    function ConfidenceMeter() {
      return (
        <svg viewBox="0 0 500 140" style={{ width: '100%', display: 'block' }}>
          {/* Title */}
          <text x="250" y="18" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#1a1a1a" fontFamily="DM Sans, sans-serif">
            The Hallucination Gap
          </text>

          {/* Left meter — AI Confidence */}
          <text x="40" y="44" fontSize="11" fontWeight="bold" fill="#6c5ce7" fontFamily="DM Sans, sans-serif" letterSpacing="0.5">
            AI CONFIDENCE
          </text>
          {/* Track */}
          <rect x="40" y="55" width="200" height="28" rx="8" fill="#f0edfa" />
          {/* Fill bar at 90% */}
          <rect x="40" y="55" width="180" height="28" rx="8" fill="#6c5ce7"
            style={{ animation: 'fillPulse 2s ease-in-out infinite' }} />
          {/* Percentage label */}
          <text x="135" y="74" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#ffffff" fontFamily="DM Sans, sans-serif">
            90%
          </text>
          {/* Caption */}
          <text x="140" y="102" textAnchor="middle" fontSize="11" fill="#6c5ce7" fontFamily="DM Sans, sans-serif">
            Very sure it&apos;s right
          </text>

          {/* Vertical divider */}
          <line x1="230" y1="38" x2="230" y2="115" stroke="#e0e0e0" strokeWidth="1.5" strokeDasharray="4 3" />

          {/* Right meter — Actual Accuracy */}
          <text x="260" y="44" fontSize="11" fontWeight="bold" fill="#e74c3c" fontFamily="DM Sans, sans-serif" letterSpacing="0.5">
            ACTUAL ACCURACY
          </text>
          {/* Track (empty) */}
          <rect x="260" y="55" width="200" height="28" rx="8" fill="#fef5f5" />
          {/* Fill bar at 0% — just show the empty track */}
          {/* Percentage label */}
          <text x="360" y="74" textAnchor="middle" fontSize="13" fontWeight="bold" fill="#e74c3c" fontFamily="DM Sans, sans-serif">
            0%
          </text>
          {/* Caption */}
          <text x="360" y="102" textAnchor="middle" fontSize="11" fill="#e74c3c" fontFamily="DM Sans, sans-serif">
            Completely wrong
          </text>
        </svg>
      );
    }

    function S2({ onNavigate }) {
      const [verified, setVerified] = useState({});
      const [activeExample, setActiveExample] = useState(0);

      const examples = [
        {
          question: "What research papers did Dr. Sarah Chen publish in 2023?",
          responses: [
            { title: "Neural Architectures for Quantum Computing", doi: "10.1234/qc.2023.1089" },
            { title: "Interpretability in Deep Language Models", doi: "10.5678/dl.2023.0456" },
            { title: "Graph Networks for Climate Prediction", doi: "10.9012/cp.2023.7834" }
          ]
        },
        {
          question: "Who won the Nobel Prize in Physics in 2015?",
          responses: [
            { title: "Research in gravitational wave detection", doi: "N/A" },
            { title: "Discovery of cosmic background radiation patterns", doi: "N/A" },
            { title: "Theoretical work on particle acceleration", doi: "N/A" }
          ]
        },
        {
          question: "What percentage of global gdp comes from AI?",
          responses: [
            { title: "In 2024, AI contributed 34.2% to global GDP growth", doi: "STAT-2024-001" },
            { title: "By 2030, AI market is projected to reach $5.7 trillion", doi: "FORECAST-2024" },
            { title: "Emerging markets show 42% AI adoption rate", doi: "SURVEY-2024-002" }
          ]
        }
      ];

      const example = examples[activeExample];

      return (
        <>
          <div><h2 className="stage-header">Hallucinations</h2></div>
          <div style={P.explainRow}>
            <p style={P.explain}>
              It's like a confident friend who never admits they don't know something. Instead of saying "I don't know," GenAI will confidently make up an answer that sounds completely plausible but is totally wrong.
            </p>
          </div>
          <div style={P.scene}>
            <div style={{ width: '100%' }}>
              <div style={{ width: '100%', marginBottom: '16px' }}>
                <ConfidenceMeter />
              </div>
              <div style={{ marginBottom: '28px', padding: '22px', backgroundColor: '#ffffff', borderRadius: '10px', border: '1px solid #ddd' }}>
                <div style={{ fontSize: '14px', color: '#666', marginBottom: '8px' }}>USER:</div>
                <div style={{ fontSize: '16px', color: '#1a1a1a', fontWeight: '500' }}>{example.question}</div>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <div style={{ fontSize: '14px', color: '#666', marginBottom: '14px', fontWeight: '600' }}>AI RESPONSE:</div>
                <div style={{ display: 'grid', gap: '14px' }}>
                  {example.responses.map((resp, i) => (
                    <div key={i} style={{ padding: '18px', backgroundColor: '#ffffff', borderRadius: '10px', border: '1px solid #e74c3c', position: 'relative' }}>

                      <div style={{ fontSize: '13px', color: '#7f8c8d', marginBottom: '14px' }}>
                        DOI: {resp.doi}
                      </div>
                      <button
                        onClick={() => setVerified({ ...verified, [i]: true })}
                        style={{
                          padding: '8px 16px',
                          fontSize: '13px',
                          backgroundColor: '#6c5ce7',
                          color: '#ffffff',
                          border: 'none',
                          borderRadius: '6px',
                          cursor: 'pointer',
                          fontWeight: '600'
                        }}
                      >
                        Verify
                      </button>
                      {verified[i] && (
                        <div style={{ marginTop: '14px', padding: '14px', backgroundColor: '#ffe6e6', borderRadius: '6px', fontSize: '15px', color: '#c0392b', fontWeight: '500' }}>
                          This paper does NOT exist!
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ marginTop: '24px', padding: '18px', backgroundColor: '#f0f0f0', borderRadius: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: '13px', color: '#666', marginBottom: '4px' }}>AI Confidence</div>
                  <div style={{ fontSize: '20px', fontWeight: '600', color: '#e74c3c' }}>98%</div>
                </div>
                <div style={{ borderLeft: '1px solid #ddd', height: '40px' }}></div>
                <div>
                  <div style={{ fontSize: '13px', color: '#666', marginBottom: '4px' }}>Actual Accuracy</div>
                  <div style={{ fontSize: '20px', fontWeight: '600', color: '#e74c3c' }}>0%</div>
                </div>
              </div>

              <div style={{ marginTop: '24px', display: 'flex', gap: '10px', justifyContent: 'center' }}>

                  <button

                    onClick={() => { setActiveExample(i); setVerified({}); }}

                      width: '14px',
                      height: '14px',
                      borderRadius: '50%',
                      backgroundColor: activeExample === i ? '#6c5ce7' : '#ddd',

                      transition: 'all 0.2s ease'

            </div>
          </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
              <SvgIcon html={SVG_LIGHTBULB} />
              <span style={{ fontSize: '14px', fontWeight: '700', color: '#1a9456' }}>INSIGHT</span>
            </div>
            AI doesn't know what it doesn't know -- it fills gaps with plausible-sounding fiction. Always verify critical facts.
          </div>
        </>
      );
    }

    function S3() {
      const [cutoffPosition, setCutoffPosition] = useState(50);
      const [selectedQuestion, setSelectedQuestion] = useState(0);

      const questions = [
        { q: "Who won the 2024 Super Bowl?", year: 2024 },
        { q: "What's the latest iPhone model?", year: 2024 },
        { q: "What happened in the 2024 US Election?", year: 2024 },
        { q: "What's the status of Mars rover Curiosity?", year: 2024 }
      ];

      const isAfterCutoff = questions[selectedQuestion].year > (2020 + Math.floor(cutoffPosition / 20));

      return (
        <>
          <div><h2 className="stage-header">Knowledge Cutoff</h2></div>
          <div style={P.explainRow}>
            <p style={P.explain}>
              It's like talking to someone who's been in a coma since a certain date. GenAI was trained on data up to a specific point. It has no idea what happened after that.
            </p>
          </div>
          <div style={P.scene}>
            <div style={{ width: '100%' }}>
              <div style={{ marginBottom: '36px' }}>
                <div style={{ fontSize: '14px', fontWeight: '600', color: '#666', marginBottom: '8px' }}>TRAINING DATA CUTOFF</div>

                {/* Slider area: padded top to give marker space above the line */}
                <div style={{ position: 'relative', paddingTop: '54px', paddingBottom: '4px' }}>
                  {/* Dynamic year + circle marker — floats in padded space */}
                  <div style={{ position: 'absolute', left: cutoffPosition + '%', top: 0, transform: 'translateX(-50%)', textAlign: 'center', zIndex: 2, pointerEvents: 'none' }}>
                    <div style={{ fontSize: '13px', fontWeight: '700', color: '#6c5ce7', marginBottom: '3px', whiteSpace: 'nowrap' }}>
                      {2020 + Math.floor(cutoffPosition / 20)}
                    </div>
                    <div style={{ width: '32px', height: '32px', backgroundColor: '#6c5ce7', borderRadius: '50%', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: '700', fontSize: '16px' }}>
                      |
                    </div>
                  </div>

                  {/* Track line */}
                  <div style={{ width: '100%', height: '3px', backgroundColor: '#ddd', borderRadius: '2px' }} />

                  {/* Static year range labels — below line */}
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#aaa', marginTop: '6px' }}>
                    <span>2020</span>
                    <span>2024</span>
                  </div>
                </div>

                {/* Range input */}
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={cutoffPosition}
                  onChange={(e) => setCutoffPosition(Number(e.target.value))}
                  style={{ width: '100%', marginTop: '6px', cursor: 'pointer' }}
                />

                {/* AI KNOWS / AI GUESSES — below input */}
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', marginTop: '4px' }}>
                  <span style={{ color: '#2ecc71', fontWeight: '600' }}>AI KNOWS</span>
                  <span style={{ color: '#e74c3c', fontWeight: '600' }}>AI GUESSES</span>
                </div>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <div style={{ fontSize: '14px', fontWeight: '600', color: '#666', marginBottom: '14px' }}>TRY A QUESTION:</div>
                <div style={{ display: 'grid', gap: '10px' }}>
                  {questions.map((item, i) => (
                    <button
                      key={i}
                      onClick={() => setSelectedQuestion(i)}
                      style={{
                        padding: '14px',
                        textAlign: 'left',
                        backgroundColor: selectedQuestion === i ? '#6c5ce7' : '#ffffff',
                        color: selectedQuestion === i ? '#ffffff' : '#1a1a1a',
                        border: '1px solid ' + (selectedQuestion === i ? '#6c5ce7' : '#ddd'),
                        borderRadius: '8px',
                        cursor: 'pointer',
                        fontSize: '15px',
                        fontWeight: '500',
                        transition: 'all 0.2s ease'
                      }}
                    >
                      {item.q}
                    </button>
                  ))}
                </div>
              </div>

              <div style={{ padding: '18px', backgroundColor: isAfterCutoff ? '#ffe6e6' : '#e6f7ff', borderRadius: '10px', borderLeft: '4px solid ' + (isAfterCutoff ? '#e74c3c' : '#3498db') }}>
                <div style={{ fontSize: '15px', fontWeight: '600', marginBottom: '8px', color: isAfterCutoff ? '#c0392b' : '#1a5c96' }}>
                  {isAfterCutoff ? "OUTSIDE KNOWLEDGE CUTOFF" : "WITHIN KNOWLEDGE CUTOFF"}
                </div>
                <div style={{ fontSize: '15px', color: '#2a2a2a' }}>
                  {isAfterCutoff
                    ? "I was trained before this event -- I'd be guessing or using unreliable information!"
                    : "This event likely falls within my training data. I can answer with reasonable confidence."}
                </div>
              </div>

              <div style={{ marginTop: '24px', padding: '18px', backgroundColor: '#f0f0f0', borderRadius: '10px' }}>
                <div style={{ fontSize: '13px', fontWeight: '600', color: '#666', marginBottom: '14px' }}>MODEL CUTOFF DATES</div>
                <div style={{ display: 'grid', gap: '10px', fontSize: '15px' }}>
                  <div><strong>Claude 3.5:</strong> April 2024</div>
                  <div><strong>GPT-4:</strong> April 2024</div>
                  <div><strong>Gemini 1.5:</strong> May 2024</div>
                  <div><strong>Llama 3:</strong> March 2024</div>
                </div>
              </div>
            </div>
          </div>
          <div style={P.insight}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
              <SvgIcon html={SVG_LIGHTBULB} />
              <span style={{ fontSize: '14px', fontWeight: '700', color: '#1a9456' }}>INSIGHT</span>
            </div>
            If the cutoff is January 2024, asking about events after that gets you guesses, not facts. Always check recency.
          </div>
        </>
      );
    }

    function S4() {
      const [fillAmount, setFillAmount] = useState(40);

      const messages = [
        { sender: "user", text: "Can you summarize this 100-page document?", tokens: 2000 },
        { sender: "ai", text: "I'll process it for you. Reading through...", tokens: 150 },
        { sender: "user", text: "What was mentioned on page 15?", tokens: 50 },
        { sender: "ai", text: "Page 15 discusses...", tokens: 200 }
      ];

      return (
        <>
          <div><h2 className="stage-header">Context Window</h2></div>
          <div style={P.explainRow}>
            <p style={P.explain}>
              It's like talking to someone with short-term memory loss. GenAI can only 'remember' a certain amount of your conversation. Share a 100-page document? It might forget the beginning by the time it reaches the end.
            </p>
          </div>
          <div style={P.scene}>
            <div style={{ width: '100%' }}>
              <div style={{ marginBottom: '36px' }}>
                <div style={{ fontSize: '14px', fontWeight: '600', color: '#666', marginBottom: '14px' }}>CONTEXT WINDOW VISUALIZATION</div>
                <div style={{ position: 'relative', backgroundColor: '#f0f0f0', borderRadius: '10px', overflow: 'hidden', border: '2px solid #ddd' }}>
                  {messages.map((msg, i) => {
                    const isVisible = i >= Math.max(0, messages.length - Math.floor(fillAmount / 15));
                    return (
                      <div
                        key={i}
                        style={{
                          padding: '14px 16px',
                          borderBottom: '1px solid #ddd',
                          backgroundColor: isVisible ? '#ffffff' : '#e8e8e8',
                          opacity: isVisible ? 1 : 0.3,
                          fontSize: '15px',
                          color: isVisible ? '#1a1a1a' : '#999',
                          transition: 'all 0.3s ease'
                        }}
                      >
                        <strong style={{ color: msg.sender === 'user' ? '#6c5ce7' : '#2ecc71' }}>
                          {msg.sender === 'user' ? 'You' : 'AI'}:
                        </strong> {msg.text} <span style={{ fontSize: '12px', color: '#999' }}>({msg.tokens}t)</span>
                      </div>
                    );
                  })}
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={fillAmount}
                  onChange={(e) => setFillAmount(Number(e.target.value))}
                  style={{ width: '100%', marginTop: '18px', cursor: 'pointer' }}
                />
              </div>

              <div style={{ marginBottom: '24px', padding: '20px', backgroundColor: '#f0f0f0', borderRadius: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: '13px', color: '#666', marginBottom: '4px' }}>Tokens Used</div>
                  <div style={{ fontSize: '22px', fontWeight: '700', color: '#6c5ce7' }}>{Math.floor(fillAmount * 1280)}</div>
                </div>
                <div style={{ width: '60%', height: '10px', backgroundColor: '#ddd', borderRadius: '5px', overflow: 'hidden' }}>
                  <div style={{ width: fillAmount + '%', height: '100%', backgroundColor: '#6c5ce7', transition: 'width 0.3s ease' }}></div>
                </div>
                <div>
                  <div style={{ fontSize: '13px', color: '#666', marginBottom: '4px' }}>Capacity</div>
                  <div style={{ fontSize: '22px', fontWeight: '700', color: '#999' }}>128k</div>
                </div>
              </div>

              <div style={{ marginBottom: '24px', padding: '20px', backgroundColor: '#f0f0f0', borderRadius: '10px' }}>
                <div style={{ fontSize: '13px', fontWeight: '600', color: '#666', marginBottom: '14px' }}>CONTEXT WINDOW COMPARISON</div>
                <div style={{ display: 'grid', gap: '14px', fontSize: '15px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <strong>GPT-4 Turbo</strong>
                    <span style={{ color: '#2ecc71', fontWeight: '600' }}>128K tokens</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <strong>Claude 3.5 Sonnet</strong>
                    <span style={{ color: '#2ecc71', fontWeight: '600' }}>200K tokens</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <strong>Gemini 1.5 Pro</strong>
                    <span style={{ color: '#2ecc71', fontWeight: '600' }}>1M tokens</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <strong>GPT-4o</strong>
                    <span style={{ color: '#2ecc71', fontWeight: '600' }}>128K tokens</span>
                  </div>
                </div>
              </div>

              <div style={{ padding: '18px', backgroundColor: '#fff3cd', borderRadius: '10px', borderLeft: '4px solid #ffc107' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
                  <SvgIcon html={SVG_LIGHTBULB} />
                  <span style={{ fontSize: '14px', fontWeight: '600', color: '#856404' }}>PRACTICAL IMPACT</span>
                </div>
                <div style={{ fontSize: '15px', color: '#2a2a2a' }}>
                  <strong>Page 1 of your 100-page doc...</strong> [FORGOTTEN by page 100] | <strong>Page 100...</strong> [CLEAR]
                </div>
              </div>
            </div>
          </div>
          <div style={P.insight}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
              <SvgIcon html={SVG_LIGHTBULB} />
              <span style={{ fontSize: '14px', fontWeight: '700', color: '#1a9456' }}>INSIGHT</span>
            </div>
            Think of context window as a whiteboard -- eventually you run out of space and have to erase the oldest notes.
          </div>
        </>
      );
    }

    function S5({ onNavigate }) {
      const [expandedPanel, setExpandedPanel] = useState(null);

      const solutions = [
        {
          title: "Fix Hallucinations",
          svg: SVG_GHOST,
          tactics: [
            "Ask for sources and citations",
            "Cross-verify with trusted sources",
            "Use RAG (Retrieval-Augmented Generation)",
            "Tell AI to say 'I don't know' if unsure"
          ]
        },
        {
          title: "Fix Knowledge Cutoff",
          svg: SVG_CALENDAR,
          tactics: [
            "Use web-enabled AI (Perplexity, Bing Chat)",
            "Provide recent context in your prompt",
            "Use RAG with up-to-date documents",
            "Ask AI about cutoff date before trusting answers"
          ]
        },
        {
          title: "Fix Context Window",
          svg: SVG_BRAIN,
          tactics: [
            "Break long documents into chunks",
            "Summarize progressively",
            "Use RAG for large document sets",
            "Choose models with larger windows (Claude 3.5, Gemini 1.5)"
          ]
        }
      ];

      return (
        <>
          <div><h2 className="stage-header">Mitigation Strategies</h2></div>
          <div style={P.explainRow}>
            <p style={P.explain}>
              Every limitation has a workaround. Here's how to mitigate each weakness and use AI more effectively. Notice that RAG (Retrieval-Augmented Generation) appears in all three solutions -- a powerful pattern covered in Module 3.
            </p>
          </div>
          <div style={P.scene}>
            <div style={{ width: '100%', display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px' }}>
              {solutions.map((solution, i) => {
                const isExpanded = expandedPanel === i;
                const panelId = `mitigation-panel-${i}`;
                const toggle = () => setExpandedPanel(expandedPanel === i ? null : i);
                return (
                <div
                  key={i}
                  className={`disclosure-card-host ${isExpanded ? 'expanded' : ''}`}
                  onClick={toggle}
                  role="button"
                  tabIndex={0}
                  aria-expanded={isExpanded}
                  aria-controls={panelId}
                  onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
                  style={{
                    position: 'relative',
                    padding: '28px',
                    backgroundColor: '#ffffff',
                    borderRadius: '14px',
                    border: '2px solid #6c5ce7',
                    cursor: 'pointer',
                    transition: 'all 0.3s ease',
                    height: 'fit-content',
                    transform: isExpanded ? 'scale(1.02)' : 'scale(1)',
                    boxShadow: isExpanded ? '0 8px 24px rgba(108, 92, 231, 0.2)' : '0 4px 16px rgba(0,0,0,0.08)',
                    animation: 'slideInLeft 0.5s ease ' + (i * 0.1) + 's both'
                  }}
                >
                  <span className="disclosure-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">
                      <polyline points="6 9 12 15 18 9" />
                    </svg>
                  </span>
                  <div style={{ marginBottom: '14px' }}>
                    <SvgIcon html={solution.svg} />
                  </div>
                  <div style={{ fontSize: '20px', fontWeight: '700', color: '#1a1a1a', marginBottom: '14px', fontFamily: 'Fraunces, serif' }}>
                    {solution.title}
                  </div>
                  {isExpanded && (
                    <div id={panelId} style={{ marginTop: '18px', paddingTop: '18px', borderTop: '2px solid #f0f0f0', animation: 'fadeIn 0.3s ease' }}>
                      {solution.tactics.map((tactic, j) => (
                        <div key={j} style={{ fontSize: '15px', marginBottom: '12px', paddingLeft: '22px', position: 'relative', color: '#2a2a2a', lineHeight: '1.6' }}>
                          <span style={{ position: 'absolute', left: '0', color: '#2ecc71', fontWeight: '700' }}>+</span>
                          {tactic}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                );
              })}
            </div>
          </div>
          <div style={P.insight}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
              <SvgIcon html={SVG_LIGHTBULB} />
              <span style={{ fontSize: '14px', fontWeight: '700', color: '#1a9456' }}>INSIGHT</span>
            </div>
            Always verify important facts, check if information might be outdated, and break long documents into smaller chunks. RAG is your most powerful mitigation tool.
          </div>
        </>
      );
    }

    function Guide() {
      const [stage, setStage] = useState(0);

      const stageComponents = [S1, S2, S3, S4, S5];
      const CurrentStage = stageComponents[stage];

      const canGoPrev = stage > 0;
      const canGoNext = stage < STAGES.length - 1;

      const handleNext = () => canGoNext && setStage(stage + 1);
      const handlePrev = () => canGoPrev && setStage(stage - 1);
      const handleNavigate = (idx) => setStage(idx);

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div style={P.root}>
            <aside className="sidebar" aria-label="Guide sections">
              {STAGES.map((s, i) => {
                const iconMarkup = { __html: s.svgSm };
                return (
                  <React.Fragment key={i}>
                    <div className={`step-wrapper ${stage === i ? 'active' : ''}`}>
                      <button
                        type="button"
                        className={`step-btn ${stage === i ? 'active' : ''}`}
                        aria-label={`Step ${i + 1}: ${s.label}`}
                        aria-current={stage === i ? "step" : undefined}
                        onClick={() => handleNavigate(i)}
                        dangerouslySetInnerHTML={iconMarkup}
                      />
                      <div className="step-btn-label">{s.label}</div>
                    </div>
                    {i < STAGES.length - 1 && (
                      <div className={`step-connector ${stage > i ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

            <div style={P.main}>
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">← Back to All Guides</a>
                  <span style={{ fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">1.5</span>
                    <h1 className="title">{STAGES[stage].title}</h1>
                  </div>
                  <div>
                    <div className="badge">BEGINNER</div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {stage + 1} of {STAGES.length}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button type="button" className="arrow-btn" aria-label="Previous section" onClick={handlePrev} disabled={!canGoPrev}>←</button>
                    <button type="button" className="arrow-btn" aria-label="Next section" onClick={handleNext} disabled={!canGoNext}>→</button>
                  </nav>
                </div>
              </div>

              <main id="main" style={P.content}>
                <CurrentStage onNavigate={handleNavigate} />
                {stage === STAGES.length - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">→</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
