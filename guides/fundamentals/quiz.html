    /* Quiz-specific styles */
    .option-card {
      padding: 18px 24px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      line-height: 1.5;
    }

    .option-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.1);
    }

    .option-card.selected {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .option-card.correct {
      border-color: #2ecc71;
      background: #f0faf0;
    }

    .option-card.incorrect {
      border-color: #e74c3c;
      background: #fef5f5;
    }

    .option-card.disabled {
      cursor: default;
      opacity: 0.7;
    }

    .option-card.disabled:hover {
      transform: none;
      box-shadow: none;
    }

    .option-letter {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 2px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #6c5ce7;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .option-card.selected .option-letter {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
    }

    .option-card.correct .option-letter {
      background: #2ecc71;
      border-color: #2ecc71;
      color: white;
    }

    .option-card.incorrect .option-letter {
      background: #e74c3c;
      border-color: #e74c3c;
      color: white;
    }

    .submit-btn {
      padding: 14px 40px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
    }

    .submit-btn:hover {
      background: #5a4bd1;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.3);
    }

    .submit-btn:disabled {
      background: #c4bce8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .section-tag {
      display: inline-block;
      background: #eee9fd;
      color: #6c5ce7;
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .score-ring {
      width: 180px;
      height: 180px;
      position: relative;
    }

    .score-ring svg {
      transform: rotate(-90deg);
    }

    .score-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .score-number {
      font-family: 'Fraunces', serif;
      font-size: 48px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1;
    }

    .score-label {
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }

    .result-card {
      padding: 20px 24px;
      background: white;
      border-radius: 14px;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .result-card:hover {
      border-color: #6c5ce7;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.08);
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .scale-in {
      animation: scaleIn 0.5s ease forwards;
    }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120px) rotate(720deg); opacity: 0; }
    }

        question: "What is the final principle ('Y') of the VERIFY framework?",

    const SECTION_ICONS = {
      "1.1": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',

      "1.5": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      "1.6": '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    };

    const INSIGHT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>';

    function ScoreBarChart({ sectionScores }) {
      return (
        <div style={{ width: '100%', maxWidth: '500px', margin: '0 auto' }}>
          {sectionScores.map((s, i) => {
            const pct = s.total > 0 ? (s.score / s.total) : 0;
            const color = pct >= 0.8 ? '#2ecc71' : pct >= 0.5 ? '#f39c12' : '#e74c3c';
            return (
              <div key={i} style={{ display: 'grid', gridTemplateColumns: '160px 1fr 50px', alignItems: 'center', gap: '10px', marginBottom: '10px' }}>
                <div style={{ fontSize: '12px', fontWeight: 600, color: '#1a1a1a', textAlign: 'right' }}>
                  {s.label}
                </div>
                <div style={{ height: '20px', background: '#f0edfa', borderRadius: '6px', overflow: 'hidden', position: 'relative' }}>
                  <div style={{ position: 'absolute', top: 0, left: 0, bottom: 0, width: `${Math.round(pct * 100)}%`, background: color, borderRadius: '6px', transition: 'width 0.8s ease' }} />
                </div>
                <div style={{ fontSize: '12px', fontWeight: 700, color, textAlign: 'left' }}>
                  {s.score}/{s.total}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function MiniRegularVsGenAI() {
      return (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '16px', maxWidth: '480px', margin: '0 auto 16px' }}>
          <div style={{ padding: '12px', background: '#f5f3ff', borderRadius: '10px', border: '1.5px solid #6c5ce7', textAlign: 'center' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: '#6c5ce7', letterSpacing: '0.5px', marginBottom: '6px' }}>REGULAR AI</div>
            <div style={{ fontSize: '13px', color: '#1a1a1a' }}>Classify / Predict</div>
            <div style={{ fontSize: '11px', color: '#666', marginTop: '4px' }}>Finds patterns → outputs a label</div>
          </div>
          <div style={{ padding: '12px', background: '#f0faf5', borderRadius: '10px', border: '1.5px solid #2ecc71', textAlign: 'center' }}>
            <div style={{ fontSize: '11px', fontWeight: 700, color: '#1a9456', letterSpacing: '0.5px', marginBottom: '6px' }}>GENERATIVE AI</div>
            <div style={{ fontSize: '13px', color: '#1a1a1a' }}>Create / Generate</div>
            <div style={{ fontSize: '11px', color: '#666', marginTop: '4px' }}>Predicts next token → new content</div>
          </div>
        </div>
      );
    }

    function QuestionView({ question, questionIndex, totalQuestions, selectedAnswer, answered, onSelect, onSubmit, onNext }) {
      const letters = ['A', 'B', 'C', 'D'];
      const sectionNum = question.section.split(' ')[0];

      return (
        <div className="fade-in" key={question.id}>
          <div className="section-tag">
            {question.section}
          </div>

          <div className="explanation">
            {question.question}
          </div>

          <div className="scene-card">
            {question.id === 3 && <MiniRegularVsGenAI />}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: '100%' }}>
              {question.options.map((option, idx) => {
                let cardClass = 'option-card';
                if (answered) {
                  cardClass += ' disabled';
                  if (idx === question.correct) {
                    cardClass += ' correct';
                  } else if (idx === selectedAnswer && idx !== question.correct) {
                    cardClass += ' incorrect';
                  }
                } else if (selectedAnswer === idx) {
                  cardClass += ' selected';
                }

                return (
                  <div
                    key={idx}
                    className={cardClass}
                    onClick={() => !answered && onSelect(idx)}
                    style={{ animationDelay: `${idx * 0.08}s` }}
                  >
                    <div className="option-letter">{letters[idx]}</div>
                    <div style={{ flex: 1 }}>{option}</div>
                    {answered && idx === question.correct && (
                      <span style={{ fontSize: 20, flexShrink: 0 }}>&#10003;</span>
                    )}
                    {answered && idx === selectedAnswer && idx !== question.correct && (
                      <span style={{ fontSize: 20, flexShrink: 0 }}>&#10007;</span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {!answered && (
            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8 }}>
              <button
                className="submit-btn"
                disabled={selectedAnswer === null}
                onClick={onSubmit}
              >
                Check Answer
              </button>
            </div>
          )}

          {answered && (
            <div className="insight-box fade-in">
              <div className="insight-label">
                <span dangerouslySetInnerHTML={{__html: INSIGHT_ICON}} />
                {selectedAnswer === question.correct ? 'CORRECT!' : 'EXPLANATION'}
              </div>
              {question.explanation}
            </div>
          )}

          {answered && (
            <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 8 }} className="fade-in">
              <button
                className="submit-btn"
                onClick={onNext}
              >
                {questionIndex < totalQuestions - 1 ? 'Next Question \u2192' : 'See Results'}
              </button>
            </div>
          )}
        </div>
      );
    }

    function ResultsView({ questions, answers, onRetry }) {
      const correctCount = answers.filter((a, i) => a === questions[i].correct).length;
      const percentage = Math.round((correctCount / questions.length) * 100);
      const circumference = 2 * Math.PI * 75;
      const strokeDashoffset = circumference - (percentage / 100) * circumference;

      const getGrade = () => {
        if (percentage >= 90) return { label: 'Outstanding!', color: '#2ecc71', emoji: '\uD83C\uDF1F' };
        if (percentage >= 70) return { label: 'Great Job!', color: '#6c5ce7', emoji: '\uD83D\uDCAA' };
        if (percentage >= 50) return { label: 'Good Effort!', color: '#f39c12', emoji: '\uD83D\uDC4D' };
        return { label: 'Keep Learning!', color: '#e74c3c', emoji: '\uD83D\uDCDA' };
      };

      const grade = getGrade();

      const sectionScores = {};
      questions.forEach((q, i) => {
        const sec = q.section.split(' ')[0];
        if (!sectionScores[sec]) sectionScores[sec] = { correct: 0, total: 0, name: q.section };
        sectionScores[sec].total++;
        if (answers[i] === q.correct) sectionScores[sec].correct++;
      });

      const sectionScoresArray = Object.entries(sectionScores).map(([sec, data]) => ({
        label: data.name,
        score: data.correct,
        total: data.total,
      }));

      return (
        <div className="scale-in">
          <div style={{ textAlign: 'center', marginBottom: 32 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>{grade.emoji}</div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 32, fontWeight: 700, color: '#1a1a1a', marginBottom: 4 }}>
              {grade.label}
            </div>
            <div style={{ fontSize: 16, color: '#999' }}>Module 1: Fundamentals of Generative AI</div>
          </div>

          <div className="scene-card" style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 48, flexWrap: 'wrap' }}>
            <div className="score-ring">
              <svg width="180" height="180" viewBox="0 0 180 180">
                <circle cx="90" cy="90" r="75" fill="none" stroke="#e8e8f0" strokeWidth="10" />
                <circle
                  cx="90" cy="90" r="75"
                  fill="none"
                  stroke={grade.color}
                  strokeWidth="10"
                  strokeLinecap="round"
                  strokeDasharray={circumference}
                  strokeDashoffset={strokeDashoffset}
                  style={{ transition: 'stroke-dashoffset 1s ease' }}
                />
              </svg>
              <div className="score-text">
                <div className="score-number">{percentage}%</div>
                <div className="score-label">{correctCount}/{questions.length}</div>
              </div>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, minWidth: 280 }}>
              {Object.entries(sectionScores).map(([sec, data]) => (
                <div key={sec} className="result-card">
                  <div style={{ width: 40, height: 40, borderRadius: 10, background: data.correct === data.total ? '#f0faf0' : '#f5f3ff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}
                    dangerouslySetInnerHTML={{__html: SECTION_ICONS[sec] || ''}}
                  />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: '#1a1a1a' }}>{data.name}</div>
                    <div style={{ fontSize: 12, color: '#999' }}>{data.correct}/{data.total} correct</div>
                  </div>
                  <div style={{
                    padding: '4px 12px',
                    borderRadius: 10,
                    fontSize: 12,
                    fontWeight: 700,
                    background: data.correct === data.total ? '#f0faf0' : '#fef5f5',
                    color: data.correct === data.total ? '#2ecc71' : '#e74c3c',
                  }}>
                    {Math.round((data.correct / data.total) * 100)}%
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ marginTop: 24 }}>
            <div style={{ fontSize: '13px', fontWeight: 700, color: '#6c5ce7', textAlign: 'center', marginBottom: '14px', letterSpacing: '0.5px', textTransform: 'uppercase' }}>Score by Section</div>
            <ScoreBarChart sectionScores={sectionScoresArray} />
          </div>

          <div className="insight-box" style={{ marginTop: 24 }}>
            <div className="insight-label">
              <span dangerouslySetInnerHTML={{__html: INSIGHT_ICON}} />
              RECOMMENDATION
            </div>
            {percentage >= 90
              ? "Excellent mastery of GenAI fundamentals! You're ready to move on to Module 2: Prompt Engineering."
              : percentage >= 70
              ? "Strong understanding! Review the sections you missed, then move on to Prompt Engineering."
              : "Consider revisiting the guide sections where you scored below 100% before moving to the next module."
            }
          </div>

          <div className="module-complete-cta">
            <div className="celebrate">
              <span className="celebrate-icon" aria-hidden="true">🎉</span>
              <span className="celebrate-text">Module 1 Complete</span>
            </div>
            <a href="../prompt-engineering/costar-meta.html" className="continue-btn">
              Continue to Module 2: Prompt Engineering →
            </a>
          </div>

          <div className="quiz-actions" role="group" aria-label="Quiz actions">
            <button type="button" className="action-btn" onClick={onRetry} aria-label="Retry this quiz">
              ↻ Retry quiz
            </button>
            <a href="../../index.html#module-1" className="action-btn" aria-label="Review Module 1">
              📖 Review module
            </a>
          </div>
        </div>
      );
    }

    function Quiz() {
      const [currentQuestion, setCurrentQuestion] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [answers, setAnswers] = useState([]);
      const [showResults, setShowResults] = useState(false);
      const contentRef = useRef(null);

      const resetQuiz = () => {
        setCurrentQuestion(0);
        setSelectedAnswer(null);
        setAnswered(false);
        setAnswers([]);
        setShowResults(false);
        if (contentRef.current) contentRef.current.scrollTop = 0;
      };

      const handleSelect = (idx) => {
        setSelectedAnswer(idx);
      };

      const handleSubmit = () => {
        setAnswered(true);
        const newAnswers = [...answers];
        newAnswers[currentQuestion] = selectedAnswer;
        setAnswers(newAnswers);
      };

      const handleNext = () => {
        if (currentQuestion < QUESTIONS.length - 1) {
          setCurrentQuestion(currentQuestion + 1);
          setSelectedAnswer(null);
          setAnswered(false);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        } else {
          setShowResults(true);
        }
      };

      const handlePrev = () => {
        if (currentQuestion > 0 && !showResults) {
          setCurrentQuestion(currentQuestion - 1);
          setSelectedAnswer(answers[currentQuestion - 1] ?? null);
          setAnswered(answers[currentQuestion - 1] !== undefined);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        }
      };

      const handleStageClick = (idx) => {
        if (showResults) return;
        if (idx <= answers.length) {
          setCurrentQuestion(idx);
          setSelectedAnswer(answers[idx] ?? null);
          setAnswered(answers[idx] !== undefined);
          if (contentRef.current) contentRef.current.scrollTop = 0;
        }
      };

      const getStepStatus = (idx) => {
        if (answers[idx] !== undefined) {
          return answers[idx] === QUESTIONS[idx].correct ? 'correct' : 'incorrect';
        }
        return '';
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Quiz questions">
              {QUESTIONS.map((q, idx) => (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentQuestion === idx && !showResults ? 'active' : ''}`}>
                    <button
                      type="button"
                      className={`step-btn ${currentQuestion === idx && !showResults ? 'active' : ''} ${getStepStatus(idx)}`}
                      aria-label={`Question ${idx + 1}`}
                      aria-current={currentQuestion === idx && !showResults ? "step" : undefined}
                      onClick={() => handleStageClick(idx)}
                      style={{ fontSize: 16, fontWeight: 700 }}
                    >
                      {answers[idx] !== undefined
                        ? (answers[idx] === QUESTIONS[idx].correct ? '\u2713' : '\u2717')
                        : idx + 1
                      }
                    </button>
                    <div className="step-btn-label">Q{idx + 1}</div>
                  </div>
                  {idx < QUESTIONS.length - 1 && (
                    <div className={`step-connector ${answers[idx] !== undefined ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              ))}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&larr; Back to All Guides</a>
                  <span style={{ marginLeft: 20, fontSize: 14, color: '#999' }}>|</span>
                  <div style={{ marginLeft: 12, display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">1.7</span>
                    <h1 className="title">Module 1 Quiz</h1>
                  </div>
                  <div style={{ marginLeft: 16 }}>
                    <div className="badge">QUIZ</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  {!showResults && (
                    <span className="progress-indicator">
                      Question {currentQuestion + 1} of {QUESTIONS.length}
                    </span>
                  )}
                  {showResults && (
                    <span className="progress-indicator">
                      Results
                    </span>
                  )}
                  <nav className="nav-arrows" aria-label="Quiz navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      aria-label="Previous question"
                      onClick={handlePrev}
                      disabled={currentQuestion === 0 || showResults}
                      title="Previous question"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      aria-label="Next question"
                      onClick={handleNext}
                      disabled={!answered || showResults}
                      title="Next question"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide" ref={contentRef}>
                {showResults ? (
                  <ResultsView questions={QUESTIONS} answers={answers} onRetry={resetQuiz} />
                ) : (
                  <QuestionView
                    question={QUESTIONS[currentQuestion]}
                    questionIndex={currentQuestion}
                    totalQuestions={QUESTIONS.length}
                    selectedAnswer={selectedAnswer}
                    answered={answered}
                    onSelect={handleSelect}
                    onSubmit={handleSubmit}
                    onNext={handleNext}
                  />
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Quiz />);
  </script>
</body>
</html>
