    <style>
        .split-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            width: 100%;
        }

        .split-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .panel-title {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 700;
            color: #6c5ce7;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-large {
            font-size: 64px;
            animation: pulse 2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .librarian-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .books {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .book {
            width: 12px;
            height: 40px;
            background: #6c5ce7;
            border-radius: 2px;
            animation: fadeIn 0.5s ease;
        }

        .book:nth-child(2) {
            background: #2ecc71;
        }

        .book:nth-child(3) {
            background: #f39c12;
        }

        .interactive-prompt {
            background: #f0f0f0;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .question-btn {
            background: #6c5ce7;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .question-btn:hover {
            background: #5a4bc7;
        }

        .response {
            background: #f9f9f9;
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid #6c5ce7;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        .table-container {
            width: 100%;
        }

        .domain-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .domain-tab {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .domain-tab.active {
            border-color: #6c5ce7;
            background: linear-gradient(135deg, #6c5ce7 0%, #8b7cf7 100%);
            color: #fff;
        }

        .domain-tab:hover:not(.active) {
            border-color: #6c5ce7;
            color: #6c5ce7;
        }

        .comparison-row {
            background: #f9f9f9;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            animation: fadeIn 0.4s ease;
        }

        .comparison-row-title {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            color: #6c5ce7;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .comparison-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .comparison-col {
            display: flex;
            gap: 12px;
        }

        .comparison-col-icon {
            font-size: 24px;
            flex-shrink: 0;
            display: flex;
            align-items: flex-start;
        }

        .comparison-col-text {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .card {
            position: relative;
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            padding: 24px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        /* Disclosure badge - shared across all click-to-expand cards */
        .disclosure-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f5f3ff;
            border: 1.5px solid rgba(108, 92, 231, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
            pointer-events: none;
            z-index: 2;
        }
        .disclosure-badge svg {
            width: 14px;
            height: 14px;
            stroke: #6c5ce7;
            transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
        }
        .disclosure-card-host:hover .disclosure-badge,
        .disclosure-card-host.expanded .disclosure-badge {
            background: #6c5ce7;
            border-color: transparent;
        }
        .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
        .disclosure-card-host:hover .disclosure-badge svg,
        .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
        .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
        @media (prefers-reduced-motion: reduce) {
            .disclosure-badge svg { transition: none; }
        }

        .card:hover {
            border-color: #6c5ce7;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.1);
        }

        .card.active {
            background: #6c5ce7;
            color: #fff;
            border-color: #6c5ce7;
        }

        .card-icon {
            font-size: 28px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 16px;
            line-height: 1.4;
            opacity: 0.8;
        }

        .card-demo {
            margin-top: 16px;
            font-size: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .demo-item {
            display: flex;
            gap: 8px;
            margin: 8px 0;
            justify-content: center;
            align-items: center;
        }

        .demo-item-icon {
            font-size: 16px;
        }

        .drag-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }
        @media (max-width: 720px) {
            .drag-area { grid-template-columns: 1fr; }
        }

        .drop-zone {
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-md);
            padding: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: var(--transition-default);
        }
        .drop-zone.regular {
            background: linear-gradient(135deg, #faf9ff 0%, var(--color-primary-faint) 100%);
            border-color: var(--color-primary-light);
        }
        .drop-zone.genai {
            background: linear-gradient(135deg, #f7fdf9 0%, var(--color-success-bg) 100%);
            border-color: #c8ecd4;
        }
        .drop-zone.regular.has-items {
            border-style: solid;
            border-color: var(--color-primary);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
        }
        .drop-zone.genai.has-items {
            border-style: solid;
            border-color: var(--color-success);
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.1);
        }

        .drop-zone-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }
        .drop-zone-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .drop-zone.regular .drop-zone-title { color: var(--color-primary); }
        .drop-zone.genai .drop-zone-title { color: var(--color-success); }

        .zone-count-pill {
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            letter-spacing: 0.3px;
        }
        .drop-zone.regular .zone-count-pill {
            background: var(--color-primary-light);
            color: var(--color-primary);
        }
        .drop-zone.genai .zone-count-pill {
            background: #d4f1dc;
            color: #1a7a43;
        }

        .drop-zone-empty {
            position: absolute;
            inset: 48px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            opacity: 0.4;
            pointer-events: none;
            transition: opacity var(--transition-default);
        }
        .drop-zone.has-items .drop-zone-empty { opacity: 0; }
        .drop-zone-empty-icon svg { width: 40px; height: 40px; }
        .drop-zone-empty-text {
            font-size: 13px;
            font-weight: 500;
            max-width: 220px;
            line-height: 1.4;
        }
        .drop-zone.regular .drop-zone-empty { color: var(--color-primary); }
        .drop-zone.genai .drop-zone-empty { color: var(--color-success); }

        .task-item {
            background: #fff;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition-fast);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: taskLand 0.35s cubic-bezier(0.22, 0.68, 0, 1.2);
        }
        .task-item .task-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
        }
        .task-item.correct.regular {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }
        .task-item.correct.regular .task-badge { color: var(--color-primary); }
        .task-item.correct.genai {
            background: var(--color-success);
            color: #fff;
            border-color: var(--color-success);
        }
        .task-item.correct.genai .task-badge { color: var(--color-success); }
        .task-item:hover { filter: brightness(1.05); }

        @keyframes taskLand {
            from { opacity: 0; transform: scale(0.9) translateY(-4px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes taskShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(3px); }
        }

        /* Available Tasks */
        .available-tasks-header {
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .task-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
            border: 1px solid var(--color-border-soft);
            border-radius: var(--radius-md);
            padding: 10px 12px 10px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
            transition: var(--transition-fast);
        }
        .task-card:hover { box-shadow: var(--shadow-card); border-color: var(--color-primary-light); }
        .task-card.shake { animation: taskShake 0.45s ease; }
        .task-card-text {
            flex: 1;
            font-size: 14.5px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .task-card-pills { display: inline-flex; gap: 8px; flex-shrink: 0; }

        .choice-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
            transition: var(--transition-fast);
            font-family: var(--font-body);
        }
        .choice-pill svg { width: 14px; height: 14px; }
        .choice-pill.regular { border: 1.5px solid var(--color-primary-light); color: var(--color-primary); }
        .choice-pill.regular:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
        .choice-pill.genai { border: 1.5px solid #c8ecd4; color: var(--color-success); }
        .choice-pill.genai:hover { background: var(--color-success); color: #fff; border-color: var(--color-success); }
        .choice-pill.wrong {
            background: #fff0f0 !important;
            color: #c0392b !important;
            border-color: #e74c3c !important;
            animation: taskShake 0.4s ease;
        }

        /* Progress bar */
        .quiz-progress {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .quiz-progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #4a4a5e;
        }
        .quiz-progress-count { color: var(--color-primary); font-weight: 700; }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-success));
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.22, 0.68, 0, 1.2);
        }

        /* Completion banner */
        @keyframes bannerGlow {
            0%, 100% { box-shadow: 0 4px 20px rgba(108, 92, 231, 0.12), 0 0 0 0 rgba(46, 204, 113, 0.25); }
            50% { box-shadow: 0 8px 28px rgba(108, 92, 231, 0.2), 0 0 0 6px rgba(46, 204, 113, 0.12); }
        }
        .completion-banner {
            margin-top: 20px;
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--color-primary-faint) 0%, var(--color-success-bg) 100%);
            border: 1.5px solid var(--color-primary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 16px;
            animation: bannerGlow 2.4s ease-in-out infinite;
        }
        .completion-banner-emoji { font-size: 32px; line-height: 1; }
        .completion-banner-text { flex: 1; line-height: 1.5; }
        .completion-banner-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            color: var(--color-primary);
            margin-bottom: 2px;
        }
        .completion-banner-body { font-size: 14px; color: #3a3a4e; }
        .completion-banner-reset {
            background: transparent;
            border: 1.5px solid var(--color-primary);
            color: var(--color-primary);
            font-family: var(--font-body);
            font-size: 12.5px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        .completion-banner-reset:hover { background: var(--color-primary); color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            .task-item, .task-card.shake, .choice-pill.wrong, .completion-banner { animation: none !important; }
        }
    </style>
</head>

        function DecisionTree() {
            const violet = '#6c5ce7';
            const green = '#2ecc71';
            const gray = '#999';
            const arrowDt = 'arrow-dt';

            const nodeW = 145;
            const nodeH = 44;

            // Node center positions
            const root = { cx: 320, cy: 42 };
            const genaiNode = { cx: 490, cy: 118 };
            const predNode = { cx: 155, cy: 118 };
            const regularNode = { cx: 82, cy: 194 };
            const eitherNode = { cx: 248, cy: 194 };

            function Node({ cx, cy, label, label2, color, fillColor }) {
                return (
                    <>
                        <rect
                            x={cx - nodeW / 2}
                            y={cy - nodeH / 2}
                            width={nodeW}
                            height={nodeH}
                            rx="8"
                            fill={fillColor || '#f5f3ff'}
                            stroke={color}
                            strokeWidth="2"
                        />
                        {label2 ? (
                            <>
                                <text x={cx} y={cy - 3} fontFamily="DM Sans, sans-serif" fontSize="11" fontWeight="600" fill={color} textAnchor="middle">{label}</text>
                                <text x={cx} y={cy + 13} fontFamily="DM Sans, sans-serif" fontSize="11" fontWeight="600" fill={color} textAnchor="middle">{label2}</text>
                            </>
                        ) : (
                            <text x={cx} y={cy + 5} fontFamily="DM Sans, sans-serif" fontSize="11" fontWeight="600" fill={color} textAnchor="middle">{label}</text>
                        )}
                    </>
                );
            }

            function Arrow({ x1, y1, x2, y2, label, labelSide }) {
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                const offset = labelSide === 'right' ? 10 : -10;
                return (
                    <>
                        <path
                            d={`M${x1},${y1} L${x2},${y2}`}
                            stroke={violet}
                            strokeWidth="1.5"
                            fill="none"
                            markerEnd={`url(#${arrowDt})`}
                        />
                        <text
                            x={midX + offset}
                            y={midY - 4}
                            fontFamily="DM Sans, sans-serif"
                            fontSize="10"
                            fontWeight="700"
                            fill={violet}
                            textAnchor="middle"
                        >
                            {label}
                        </text>
                    </>
                );
            }

            return (
                <svg viewBox="0 0 640 230" width="100%" style={{ display: 'block', maxWidth: '640px', margin: '0 auto' }} aria-label="Decision tree for choosing Regular AI vs Generative AI">
                    <defs>
                        <marker id={arrowDt} markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                            <path d="M0,0 L0,6 L8,3 z" fill={violet} />
                        </marker>
                    </defs>

                    {/* Root node — 2-line label */}
                    <Node cx={root.cx} cy={root.cy} label="Need new content" label2="created?" color={violet} />

                    {/* YES → Generative AI */}
                    <Arrow
                        x1={root.cx + nodeW / 2}
                        y1={root.cy}
                        x2={genaiNode.cx - nodeW / 2}
                        y2={genaiNode.cy}
                        label="YES"
                        labelSide="right"
                    />
                    <Node cx={genaiNode.cx} cy={genaiNode.cy} label="→ Generative AI" color={green} fillColor="#f0faf5" />

                    {/* NO → Need a prediction? */}
                    <Arrow
                        x1={root.cx - nodeW / 2}
                        y1={root.cy}
                        x2={predNode.cx + nodeW / 2}
                        y2={predNode.cy}
                        label="NO"
                        labelSide="left"
                    />
                    <Node cx={predNode.cx} cy={predNode.cy} label="Need a prediction?" color={violet} />

                    {/* YES → Regular AI */}
                    <Arrow
                        x1={predNode.cx - nodeW / 2 + 20}
                        y1={predNode.cy + nodeH / 2}
                        x2={regularNode.cx}
                        y2={regularNode.cy - nodeH / 2}
                        label="YES"
                        labelSide="left"
                    />
                    <Node cx={regularNode.cx} cy={regularNode.cy} label="→ Regular AI" color={violet} fillColor="#ede9ff" />

                    {/* NO → Either works */}
                    <Arrow
                        x1={predNode.cx + nodeW / 2 - 20}
                        y1={predNode.cy + nodeH / 2}
                        x2={eitherNode.cx}
                        y2={eitherNode.cy - nodeH / 2}
                        label="NO"
                        labelSide="right"
                    />
                    <Node cx={eitherNode.cx} cy={eitherNode.cy} label="→ Either works" color={gray} fillColor="#f5f5f5" />
                </svg>
            );
        }

                    { id: 4, text: 'Predict sales', correct: 'regular' },
                    { id: 5, text: 'Write a blog post', correct: 'genai' },
                    { id: 6, text: 'Create an image', correct: 'genai' },
                    { id: 7, text: 'Generate code', correct: 'genai' },
                    { id: 8, text: 'Draft an email', correct: 'genai' },
                ];
                for (let i = base.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [base[i], base[j]] = [base[j], base[i]];
                }
                return base;
            });

            const regularCorrectCount = tasks.filter((t) => t.correct === 'regular').length;
            const genaiCorrectCount = tasks.filter((t) => t.correct === 'genai').length;
            const placedRegular = tasks.filter((t) => placed[t.id] === 'regular').length;
            const placedGenai = tasks.filter((t) => placed[t.id] === 'genai').length;
            const placedCount = placedRegular + placedGenai;
            const totalTasks = tasks.length;
            const isComplete = placedCount === totalTasks;

            const handleChoice = (taskId, zone) => {
                const task = tasks.find((t) => t.id === taskId);
                if (task.correct === zone) {
                    setPlaced({ ...placed, [taskId]: zone });
                } else {
                    setShakeId(taskId);
                    setWrongKey(`${taskId}-${zone}`);
                    setTimeout(() => setShakeId(null), 450);
                    setTimeout(() => setWrongKey(null), 450);
                }
            };

            const handleRemove = (taskId) => {
                const next = { ...placed };
                delete next[taskId];
                setPlaced(next);
            };

            const handleReset = () => {
                setPlaced({});
                setShakeId(null);
                setWrongKey(null);
            };

            const unplacedTasks = tasks.filter((t) => !placed[t.id]);
            const progressPct = Math.round((placedCount / totalTasks) * 100);

            return (
                <>
                    <div><h2 className="stage-header">When to Use Which</h2></div>
                    <p className="explanation">
                        Understanding when to use Regular AI vs GenAI is key — use the right tool for the right job
                    </p>
                    <div className="scene-card">
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', width: '100%' }}>
                        <DecisionTree />
                        <div className="drag-area">
                            <div className={`drop-zone regular${placedRegular > 0 ? ' has-items' : ''}`}>
                                <div className="drop-zone-header">
                                    <div className="drop-zone-title"><SvgIcon html={SVG_ICONS.search24} /> Regular AI</div>
                                    <span className="zone-count-pill">{placedRegular} / {regularCorrectCount}</span>
                                </div>
                                <div className="drop-zone-empty" aria-hidden="true">
                                    <span className="drop-zone-empty-icon"><SvgIcon html={SVG_ICONS.search48} /></span>
                                    <span className="drop-zone-empty-text">Tasks that <strong>find, predict, or classify</strong> land here</span>
                                </div>
                                {tasks
                                    .filter((t) => placed[t.id] === 'regular')
                                    .map((task) => (
                                        <div
                                            key={task.id}
                                            className="task-item correct regular"
                                            onClick={() => handleRemove(task.id)}
                                            title="Click to remove"
                                        >
                                            <span className="task-badge">✓</span>
                                            <span>{task.text}</span>
                                        </div>
                                    ))}
                            </div>
                            <div className={`drop-zone genai${placedGenai > 0 ? ' has-items' : ''}`}>
                                <div className="drop-zone-header">
                                    <div className="drop-zone-title"><SvgIcon html={SVG_ICONS.penTool24} /> Generative AI</div>
                                    <span className="zone-count-pill">{placedGenai} / {genaiCorrectCount}</span>
                                </div>
                                <div className="drop-zone-empty" aria-hidden="true">
                                    <span className="drop-zone-empty-icon"><SvgIcon html={SVG_ICONS.penTool48} /></span>
                                    <span className="drop-zone-empty-text">Tasks that <strong>create something new</strong> land here</span>
                                </div>
                                {tasks
                                    .filter((t) => placed[t.id] === 'genai')
                                    .map((task) => (
                                        <div
                                            key={task.id}
                                            className="task-item correct genai"
                                            onClick={() => handleRemove(task.id)}
                                            title="Click to remove"
                                        >
                                            <span className="task-badge">✓</span>
                                            <span>{task.text}</span>
                                        </div>
                                    ))}
                            </div>
                        </div>
                        </div>
                    </div>

                    {!isComplete && (
                        <div style={{ maxWidth: '760px' }}>
                            <div className="available-tasks-header">
                                <SvgIcon html={SVG_ICONS.clipboard} /> Available Tasks · {unplacedTasks.length} left
                            </div>
                            {unplacedTasks.map((task) => (
                                <div
                                    key={task.id}
                                    className={`task-card${shakeId === task.id ? ' shake' : ''}`}
                                >
                                    <span className="task-card-text">{task.text}</span>
                                    <span className="task-card-pills">
                                        <button
                                            type="button"
                                            className={`choice-pill regular${wrongKey === `${task.id}-regular` ? ' wrong' : ''}`}
                                            onClick={() => handleChoice(task.id, 'regular')}
                                            aria-label={`Classify ${task.text} as Regular AI`}
                                        >
                                            <SvgIcon html={SVG_ICONS.search20} /> Regular
                                        </button>
                                        <button
                                            type="button"
                                            className={`choice-pill genai${wrongKey === `${task.id}-genai` ? ' wrong' : ''}`}
                                            onClick={() => handleChoice(task.id, 'genai')}
                                            aria-label={`Classify ${task.text} as Generative AI`}
                                        >
                                            <SvgIcon html={SVG_ICONS.penTool20} /> GenAI
                                        </button>
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="quiz-progress" aria-label="Sorting progress">
                        <div className="quiz-progress-label">
                            <span>Progress</span>
                            <span className="quiz-progress-count">{placedCount} / {totalTasks}</span>
                        </div>
                        <div className="progress-bar" role="progressbar" aria-valuenow={progressPct} aria-valuemin="0" aria-valuemax="100">
                            <div className="progress-bar-fill" style={{ width: `${progressPct}%` }} />
                        </div>
                    </div>

                    {isComplete ? (
                        <div className="completion-banner" role="status">
                            <div className="completion-banner-emoji" aria-hidden="true">🎉</div>
                            <div className="completion-banner-text">
                                <div className="completion-banner-title">Nailed it — {totalTasks} / {totalTasks} correct</div>
                                <div className="completion-banner-body">You've got the instinct. <strong>Regular AI picks. Generative AI makes.</strong> Best results come from combining both.</div>
                            </div>
                            <button type="button" className="completion-banner-reset" onClick={handleReset}>Try again</button>
                        </div>
                    ) : (
                        <div className="insight-box">
                            <div style={{ fontWeight: 700, color: '#1a9456', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px' }}><SvgIcon html={SVG_ICONS.lightbulb} /> INSIGHT</div>
                            Regular AI = Picker (chooses from what exists). Generative AI = Maker (creates something new). Best results come from combining both.
                        </div>
                    )}
                </>
            );
        }

        function App() {
            const [currentStage, setCurrentStage] = useState(0);

            const NEXT_GUIDE = { id: "1.3", title: "How GenAI Works", module: "Module 1", href: "./how-genai-works.html" };
            const stages = [
                { component: Stage1, title: 'Regular AI vs Generative AI' },
                { component: Stage2, title: 'Regular AI vs Generative AI' },
                { component: Stage3, title: 'Regular AI vs Generative AI' },
                { component: Stage4, title: 'Regular AI vs Generative AI' },
                { component: Stage5, title: 'Regular AI vs Generative AI' },
            ];

            const CurrentStage = stages[currentStage].component;

            return (
                <React.Fragment>
                    <a href="#main" className="skip-link">Skip to main content</a>
                    <div className="container">
                        <aside className="sidebar" aria-label="Guide sections">
                            {sidebarSteps.map((step, idx) => (
                                <React.Fragment key={idx}>
                                    <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                                        <button
                                            type="button"
                                            className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                                            aria-label={`Step ${idx + 1}: ${step.label}`}
                                            aria-current={currentStage === idx ? "step" : undefined}
                                            onClick={() => setCurrentStage(idx)}
                                            dangerouslySetInnerHTML={{ __html: step.icon }}
                                        />
                                        <div className="step-btn-label">{step.label}</div>
                                    </div>
                                    {idx < sidebarSteps.length - 1 && (
                                        <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                                    )}
                                </React.Fragment>
                            ))}
                        </aside>

                        <div className="main-content">
                            <div className="top-bar">
                                <div className="left-section">
                                    <a href="../../index.html" className="back-link">← Back to All Guides</a>
                                    <span style={{ fontSize: '14px', color: '#999' }}>|</span>
                                    <div style={{ display: 'flex', alignItems: 'center' }}>
                                        <span className="guide-number">1.2</span>
                                        <h1 className="title">{stages[currentStage].title}</h1>
                                    </div>
                                    <div>
                                        <div className="badge">INTERACTIVE</div>
                                    </div>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="progress-indicator">Page {currentStage + 1} of 5</span>
                                    <nav className="nav-arrows" aria-label="Section navigation">
                                        <button type="button" className="arrow-btn" aria-label="Previous section" onClick={() => setCurrentStage(Math.max(0, currentStage - 1))} disabled={currentStage === 0}>←</button>
                                        <button type="button" className="arrow-btn" aria-label="Next section" onClick={() => setCurrentStage(Math.min(stages.length - 1, currentStage + 1))} disabled={currentStage === stages.length - 1}>→</button>
                                    </nav>
                                </div>
                            </div>

                            <main id="main" className="content-area">
                                <CurrentStage />
                                {currentStage === stages.length - 1 && (
                                    <div className="up-next-card" role="complementary" aria-label="Up next">
                                        <span className="up-next-label">UP NEXT</span>
                                        <a href={NEXT_GUIDE.href} className="up-next-link">
                                            <div className="up-next-meta">
                                                <span className="up-next-id">{NEXT_GUIDE.id}</span>
                                                <span className="up-next-module">{NEXT_GUIDE.module}</span>
                                            </div>
                                            <div className="up-next-title">{NEXT_GUIDE.title}</div>
                                            <span className="up-next-arrow" aria-hidden="true">→</span>
                                        </a>
                                    </div>
                                )}
                            </main>
                        </div>
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
