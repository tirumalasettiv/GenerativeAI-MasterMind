<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular AI vs Generative AI - Interactive Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8f9fa;
            overflow: hidden;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            background: #fff;
        }

        .sidebar {
            width: 120px;
            background: #f0f0f0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
        }

        .steps-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50px;
            bottom: -40px;
            width: 2px;
            background: #ddd;
            transform: translateX(-50%);
        }

        .step-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ddd;
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .step-btn.active {
            border-color: #6c5ce7;
            background: #6c5ce7;
            color: #fff;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.4);
        }

        .step-btn:hover:not(.active) {
            border-color: #6c5ce7;
            background: #f5f5f5;
        }

        .step-label {
            margin-top: 8px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            color: #666;
            width: 100px;
            line-height: 1.2;
        }

        .step-btn.active + .step-label {
            color: #6c5ce7;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            background: #fff;
        }

        .top-left {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .back-link {
            color: #6c5ce7;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #1a9456;
        }

        .badge {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #6c5ce7;
            letter-spacing: 0.5px;
        }

        .title {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .nav-arrows {
            display: flex;
            gap: 10px;
        }

        .arrow-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #e0e0e0;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-btn:hover:not(:disabled) {
            border-color: #6c5ce7;
            color: #6c5ce7;
        }

        .arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .explanation {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
        }

        .scene-card {
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            border-radius: 16px;
            padding: 40px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e0e0;
            animation: fadeIn 0.6s ease;
        }

        .insight-box {
            background: #f0f0f0;
            padding: 24px;
            border-radius: 12px;
            border-left: 4px solid #6c5ce7;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes blink {
            0%, 49%, 100% {
                opacity: 1;
            }
            50%, 99% {
                opacity: 0;
            }
        }

        .split-screen {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
        }

        .split-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .panel-title {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 700;
            color: #6c5ce7;
        }

        .icon-large {
            font-size: 64px;
            animation: pulse 2s ease-in-out infinite;
        }

        .librarian-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .books {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .book {
            width: 12px;
            height: 40px;
            background: #6c5ce7;
            border-radius: 2px;
            animation: fadeIn 0.5s ease;
        }

        .book:nth-child(2) {
            background: #2ecc71;
        }

        .book:nth-child(3) {
            background: #f39c12;
        }

        .interactive-prompt {
            background: #f0f0f0;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .question-btn {
            background: #6c5ce7;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .question-btn:hover {
            background: #5a4bc7;
        }

        .response {
            background: #f9f9f9;
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid #6c5ce7;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        .table-container {
            width: 100%;
            max-width: 900px;
        }

        .domain-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .domain-tab {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .domain-tab.active {
            border-color: #6c5ce7;
            background: #6c5ce7;
            color: #fff;
        }

        .domain-tab:hover:not(.active) {
            border-color: #6c5ce7;
            color: #6c5ce7;
        }

        .comparison-row {
            background: #f9f9f9;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            animation: fadeIn 0.4s ease;
        }

        .comparison-row-title {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            color: #6c5ce7;
            margin-bottom: 16px;
            font-size: 16px;
        }

        .comparison-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .comparison-col {
            display: flex;
            gap: 12px;
        }

        .comparison-col-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .comparison-col-text {
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .card {
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            padding: 24px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .card:hover {
            border-color: #6c5ce7;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.1);
        }

        .card.active {
            background: #6c5ce7;
            color: #fff;
            border-color: #6c5ce7;
        }

        .card-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .card-title {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 13px;
            line-height: 1.4;
            opacity: 0.8;
        }

        .card-demo {
            margin-top: 16px;
            font-size: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .demo-item {
            display: flex;
            gap: 8px;
            margin: 8px 0;
            justify-content: center;
            align-items: center;
        }

        .demo-item-icon {
            font-size: 16px;
        }

        .drag-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 900px;
        }

        .drop-zone {
            background: linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%);
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
        }

        .drop-zone-title {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            margin-bottom: 20px;
            color: #6c5ce7;
        }

        .task-item {
            background: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: move;
            border: 2px solid #e0e0e0;
            transition: all 0.2s;
            font-size: 14px;
            text-align: center;
        }

        .task-item:hover {
            border-color: #6c5ce7;
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.1);
        }

        .task-item.correct {
            background: #2ecc71;
            color: #fff;
            border-color: #2ecc71;
        }

        .drop-zone.highlight {
            background: rgba(108, 92, 231, 0.05);
            border-color: #6c5ce7;
        }

        .score-display {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            color: #6c5ce7;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const P = {
            primaryColor: '#6c5ce7',
            successColor: '#2ecc71',
            darkSuccess: '#1a9456',
            lightGray: '#f0f0f0',
            darkGray: '#333',
        };

        function S1({ isActive, onClick }) {
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <button
                        onClick={onClick}
                        className={`step-btn ${isActive ? 'active' : ''}`}
                        style={{
                            borderColor: isActive ? P.primaryColor : '#ddd',
                            background: isActive ? P.primaryColor : '#fff',
                            color: isActive ? '#fff' : '#333',
                        }}
                    >
                        \u0031
                    </button>
                    <div className="step-label">The Core</div>
                </div>
            );
        }

        function S2({ isActive, onClick }) {
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <button
                        onClick={onClick}
                        className={`step-btn ${isActive ? 'active' : ''}`}
                        style={{
                            borderColor: isActive ? P.primaryColor : '#ddd',
                            background: isActive ? P.primaryColor : '#fff',
                            color: isActive ? '#fff' : '#333',
                        }}
                    >
                        \u0032
                    </button>
                    <div className="step-label">Analogy</div>
                </div>
            );
        }

        function S3({ isActive, onClick }) {
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <button
                        onClick={onClick}
                        className={`step-btn ${isActive ? 'active' : ''}`}
                        style={{
                            borderColor: isActive ? P.primaryColor : '#ddd',
                            background: isActive ? P.primaryColor : '#fff',
                            color: isActive ? '#fff' : '#333',
                        }}
                    >
                        \u0033
                    </button>
                    <div className="step-label">Examples</div>
                </div>
            );
        }

        function S4({ isActive, onClick }) {
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <button
                        onClick={onClick}
                        className={`step-btn ${isActive ? 'active' : ''}`}
                        style={{
                            borderColor: isActive ? P.primaryColor : '#ddd',
                            background: isActive ? P.primaryColor : '#fff',
                            color: isActive ? '#fff' : '#333',
                        }}
                    >
                        \u0034
                    </button>
                    <div className="step-label">Types</div>
                </div>
            );
        }

        function S5({ isActive, onClick }) {
            return (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <button
                        onClick={onClick}
                        className={`step-btn ${isActive ? 'active' : ''}`}
                        style={{
                            borderColor: isActive ? P.primaryColor : '#ddd',
                            background: isActive ? P.primaryColor : '#fff',
                            color: isActive ? '#fff' : '#333',
                        }}
                    >
                        \u0035
                    </button>
                    <div className="step-label">When to Use</div>
                </div>
            );
        }

        function Stage1() {
            return (
                <>
                    <p className="explanation">
                        Regular AI finds, sorts, or decides \u2014 Generative AI creates something new. One is a Picker, the other is a Maker.
                    </p>
                    <div className="scene-card">
                        <div className="split-screen">
                            <div className="split-panel">
                                <div className="panel-title">\ud83d\udd0d Regular AI</div>
                                <div className="icon-large">\ud83d\udd0d</div>
                                <p style={{ fontSize: '14px', color: '#666', textAlign: 'center' }}>Finds existing items</p>
                                <div style={{ marginTop: '20px', padding: '16px', background: '#e8e4ff', borderRadius: '8px', fontSize: '13px' }}>
                                    Search \u2192 Find \u2192 Sort
                                </div>
                            </div>
                            <div className="split-panel">
                                <div className="panel-title">\u270d\ufe0f Generative AI</div>
                                <div className="icon-large">\u270d\ufe0f</div>
                                <p style={{ fontSize: '14px', color: '#666', textAlign: 'center' }}>Creates new content</p>
                                <div style={{ marginTop: '20px', padding: '16px', background: '#e8f8f5', borderRadius: '8px', fontSize: '13px' }}>
                                    Prompt \u2192 Generate \u2192 Create
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="insight-box">
                        Both are AI. Generative AI is just a specific type that focuses on creation rather than selection.
                    </div>
                </>
            );
        }

        function Stage2() {
            const [showResponse, setShowResponse] = useState(null);

            return (
                <>
                    <p className="explanation">
                        Regular AI is like a librarian \u2014 finds existing books. Generative AI is like an author \u2014 writes new ones.
                    </p>
                    <div className="scene-card">
                        <div className="split-screen">
                            <div className="split-panel">
                                <div className="panel-title">\ud83d\udcda Librarian (Regular AI)</div>
                                <div className="librarian-scene">
                                    <div className="books">
                                        <div className="book"></div>
                                        <div className="book"></div>
                                        <div className="book"></div>
                                    </div>
                                    <div className="icon-large">\ud83d\udcda</div>
                                    <div className="interactive-prompt">Click a question below</div>
                                    <button
                                        className="question-btn"
                                        onClick={() => setShowResponse('find')}
                                    >
                                        \u2754 Find me a book
                                    </button>
                                    {showResponse === 'find' && (
                                        <div className="response">
                                            Searches shelves, finds existing book, hands it to you.
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="split-panel">
                                <div className="panel-title">\u270d\ufe0f Author (Generative AI)</div>
                                <div className="librarian-scene">
                                    <div style={{ width: '50px', height: '70px', background: '#f0f0f0', border: '2px dashed #999', borderRadius: '4px' }}></div>
                                    <div className="icon-large">\u270d\ufe0f</div>
                                    <div className="interactive-prompt">Click a question below</div>
                                    <button
                                        className="question-btn"
                                        onClick={() => setShowResponse('write')}
                                    >
                                        \u2754 Write me a book
                                    </button>
                                    {showResponse === 'write' && (
                                        <div className="response">
                                            Takes your idea, writes completely new content from scratch.
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="insight-box">
                        A librarian is great at finding what exists. An author creates what never existed. Both are valuable.
                    </div>
                </>
            );
        }

        function Stage3() {
            const [selectedDomain, setSelectedDomain] = useState('search');

            const examples = {
                search: {
                    icon: '\ud83d\udd0d',
                    task: 'Find information',
                    regular: 'Google finds existing web pages',
                    genai: 'ChatGPT writes a new answer',
                },
                images: {
                    icon: '\ud83d\uddbc\ufe0f',
                    task: 'Get an image',
                    regular: 'Google Images finds existing photos',
                    genai: 'DALL-E creates a new image',
                },
                music: {
                    icon: '\ud83c\udfa5',
                    task: 'Listen to music',
                    regular: 'Spotify recommends existing songs',
                    genai: 'Suno creates a new song',
                },
                shopping: {
                    icon: '\ud83d\udecd\ufe0f',
                    task: 'Get a product',
                    regular: 'Amazon recommends existing products',
                    genai: 'AI designs a new product',
                },
                email: {
                    icon: '\ud83d\udce7',
                    task: 'Manage email',
                    regular: 'Spam filter sorts spam/not spam',
                    genai: 'AI writes a new email',
                },
            };

            return (
                <>
                    <p className="explanation">
                        See how the same task is handled differently by Regular AI vs Generative AI
                    </p>
                    <div className="scene-card">
                        <div className="table-container">
                            <div className="domain-tabs">
                                {Object.entries(examples).map(([key, val]) => (
                                    <button
                                        key={key}
                                        className={`domain-tab ${selectedDomain === key ? 'active' : ''}`}
                                        onClick={() => setSelectedDomain(key)}
                                    >
                                        {val.icon} {key.charAt(0).toUpperCase() + key.slice(1)}
                                    </button>
                                ))}
                            </div>
                            <div className="comparison-row">
                                <div className="comparison-row-title">{examples[selectedDomain].icon} {examples[selectedDomain].task}</div>
                                <div className="comparison-cols">
                                    <div className="comparison-col">
                                        <div className="comparison-col-icon">\ud83d\udd0d</div>
                                        <div className="comparison-col-text">
                                            <strong>Regular AI:</strong> {examples[selectedDomain].regular}
                                        </div>
                                    </div>
                                    <div className="comparison-col">
                                        <div className="comparison-col-icon">\u270d\ufe0f</div>
                                        <div className="comparison-col-text">
                                            <strong>Generative AI:</strong> {examples[selectedDomain].genai}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="insight-box">
                        Regular AI: "Here's what I found." Generative AI: "Here's what I made."
                    </div>
                </>
            );
        }

        function Stage4() {
            const [selectedCard, setSelectedCard] = useState(null);

            const aiTypes = [
                {
                    id: 'classification',
                    title: 'Classification',
                    icon: '\ud83d\udcc4',
                    desc: 'Sorts into categories',
                    demo: 'Email \u2192 Spam / Not Spam',
                },
                {
                    id: 'recommendation',
                    title: 'Recommendation',
                    icon: '\u2705',
                    desc: 'Suggests existing items',
                    demo: 'Netflix \u2192 Movies you might like',
                },
                {
                    id: 'prediction',
                    title: 'Prediction',
                    icon: '\ud83d\udd2e',
                    desc: 'Forecasts outcomes',
                    demo: 'Weather \u2192 80% chance of rain',
                },
                {
                    id: 'detection',
                    title: 'Detection',
                    icon: '\ud83d\udea8',
                    desc: 'Finds anomalies',
                    demo: 'Bank \u2192 Fraud detection',
                },
                {
                    id: 'recognition',
                    title: 'Recognition',
                    icon: '\ud83d\udc4b',
                    desc: 'Identifies things',
                    demo: 'Phone \u2192 Face unlock',
                },
            ];

            return (
                <>
                    <p className="explanation">
                        Before GenAI, these 5 types of AI were (and still are) everywhere \u2014 none of them create, they all analyze, sort, or choose.
                    </p>
                    <div className="scene-card">
                        <div className="cards-grid">
                            {aiTypes.map((type) => (
                                <div
                                    key={type.id}
                                    className={`card ${selectedCard === type.id ? 'active' : ''}`}
                                    onClick={() => setSelectedCard(selectedCard === type.id ? null : type.id)}
                                    style={{
                                        background: selectedCard === type.id ? P.primaryColor : 'linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%)',
                                        color: selectedCard === type.id ? '#fff' : '#333',
                                    }}
                                >
                                    <div className="card-icon">{type.icon}</div>
                                    <div className="card-title">{type.title}</div>
                                    <div className="card-desc">{type.desc}</div>
                                    {selectedCard === type.id && (
                                        <div className="card-demo" style={{ borderTopColor: selectedCard === type.id ? 'rgba(255,255,255,0.3)' : '#e0e0e0' }}>
                                            {type.demo}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="insight-box">
                        These AI types power most of the tech you use daily \u2014 from Netflix recommendations to spam filters
                    </div>
                </>
            );
        }

        function Stage5() {
            const [placed, setPlaced] = useState({});
            const [score, setScore] = useState(0);

            const tasks = [
                { id: 1, text: 'Detect fraud', correct: 'regular' },
                { id: 2, text: 'Recommend products', correct: 'regular' },
                { id: 3, text: 'Filter spam', correct: 'regular' },
                { id: 4, text: 'Predict sales', correct: 'regular' },
                { id: 5, text: 'Write a blog post', correct: 'genai' },
                { id: 6, text: 'Create an image', correct: 'genai' },
                { id: 7, text: 'Generate code', correct: 'genai' },
                { id: 8, text: 'Draft an email', correct: 'genai' },
            ];

            const handleTaskClick = (taskId, zone) => {
                const task = tasks.find((t) => t.id === taskId);
                const newPlaced = { ...placed, [taskId]: zone };
                setPlaced(newPlaced);

                let newScore = 0;
                Object.entries(newPlaced).forEach(([id, z]) => {
                    const t = tasks.find((task) => task.id === parseInt(id));
                    if (t.correct === z) newScore++;
                });
                setScore(newScore);
            };

            const unplacedTasks = tasks.filter((t) => !placed[t.id]);

            return (
                <>
                    <p className="explanation">
                        Understanding when to use Regular AI vs GenAI is key \u2014 use the right tool for the right job
                    </p>
                    <div className="scene-card">
                        <div className="drag-area">
                            <div className="drop-zone">
                                <div className="drop-zone-title">\ud83d\udd0d Regular AI</div>
                                {tasks
                                    .filter((t) => placed[t.id] === 'regular')
                                    .map((task) => (
                                        <div
                                            key={task.id}
                                            className="task-item correct"
                                            onClick={() => handleTaskClick(task.id, null)}
                                        >
                                            \u2713 {task.text}
                                        </div>
                                    ))}
                            </div>
                            <div className="drop-zone">
                                <div className="drop-zone-title">\u270d\ufe0f Generative AI</div>
                                {tasks
                                    .filter((t) => placed[t.id] === 'genai')
                                    .map((task) => (
                                        <div
                                            key={task.id}
                                            className="task-item correct"
                                            onClick={() => handleTaskClick(task.id, null)}
                                        >
                                            \u2713 {task.text}
                                        </div>
                                    ))}
                            </div>
                        </div>
                    </div>

                    <div style={{ display: 'flex', gap: '30px', maxWidth: '900px' }}>
                        <div style={{ flex: 1 }}>
                            <div style={{ marginBottom: '20px', fontSize: '16px', fontWeight: '600', color: P.primaryColor }}>
                                \ud83d\udcdc Available Tasks ({unplacedTasks.length})
                            </div>
                            {unplacedTasks.map((task) => (
                                <div
                                    key={task.id}
                                    style={{
                                        display: 'flex',
                                        gap: '10px',
                                        marginBottom: '10px',
                                    }}
                                >
                                    <button
                                        onClick={() => handleTaskClick(task.id, 'regular')}
                                        style={{
                                            flex: 1,
                                            padding: '10px',
                                            background: '#fff',
                                            border: '2px solid #e0e0e0',
                                            borderRadius: '8px',
                                            cursor: 'pointer',
                                            fontSize: '13px',
                                            fontWeight: '500',
                                            transition: 'all 0.2s',
                                        }}
                                        onMouseEnter={(e) => {
                                            e.target.style.borderColor = P.primaryColor;
                                        }}
                                        onMouseLeave={(e) => {
                                            e.target.style.borderColor = '#e0e0e0';
                                        }}
                                    >
                                        \ud83d\udd0d {task.text}
                                    </button>
                                    <button
                                        onClick={() => handleTaskClick(task.id, 'genai')}
                                        style={{
                                            flex: 1,
                                            padding: '10px',
                                            background: '#fff',
                                            border: '2px solid #e0e0e0',
                                            borderRadius: '8px',
                                            cursor: 'pointer',
                                            fontSize: '13px',
                                            fontWeight: '500',
                                            transition: 'all 0.2s',
                                        }}
                                        onMouseEnter={(e) => {
                                            e.target.style.borderColor = P.primaryColor;
                                        }}
                                        onMouseLeave={(e) => {
                                            e.target.style.borderColor = '#e0e0e0';
                                        }}
                                    >
                                        \u270d\ufe0f {task.text}
                                    </button>
                                </div>
                            ))}
                            <div className="score-display">
                                \ud83c\udf1f Score: {score}/{tasks.length}
                            </div>
                        </div>
                    </div>

                    <div className="insight-box">
                        Regular AI = Picker (chooses from what exists). Generative AI = Maker (creates something new). Best results come from combining both.
                    </div>
                </>
            );
        }

        function App() {
            const [currentStage, setCurrentStage] = useState(0);

            const stages = [
                { component: Stage1, title: 'Regular AI vs Generative AI' },
                { component: Stage2, title: 'Regular AI vs Generative AI' },
                { component: Stage3, title: 'Regular AI vs Generative AI' },
                { component: Stage4, title: 'Regular AI vs Generative AI' },
                { component: Stage5, title: 'Regular AI vs Generative AI' },
            ];

            const CurrentStage = stages[currentStage].component;

            return (
                <div className="container">
                    <div className="sidebar">
                        <div className="steps-container">
                            <S1 isActive={currentStage === 0} onClick={() => setCurrentStage(0)} />
                            <S2 isActive={currentStage === 1} onClick={() => setCurrentStage(1)} />
                            <S3 isActive={currentStage === 2} onClick={() => setCurrentStage(2)} />
                            <S4 isActive={currentStage === 3} onClick={() => setCurrentStage(3)} />
                            <S5 isActive={currentStage === 4} onClick={() => setCurrentStage(4)} />
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="top-bar">
                            <div className="top-left">
                                <a href="../../index.html" className="back-link">\u2190 Back to All Guides</a>
                                <div className="badge">INTERACTIVE GUIDE</div>
                                <h1 className="title">{stages[currentStage].title}</h1>
                            </div>
                            <div className="nav-arrows">
                                <button
                                    className="arrow-btn"
                                    onClick={() => setCurrentStage(Math.max(0, currentStage - 1))}
                                    disabled={currentStage === 0}
                                >
                                    \u2190
                                </button>
                                <button
                                    className="arrow-btn"
                                    onClick={() => setCurrentStage(Math.min(stages.length - 1, currentStage + 1))}
                                    disabled={currentStage === stages.length - 1}
                                >
                                    \u2192
                                </button>
                            </div>
                        </div>

                        <div className="content-area">
                            <CurrentStage />
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
