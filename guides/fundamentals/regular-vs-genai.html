                            <div className="split-panel">
                                <div className="panel-title"><SvgIcon html={SVG_ICONS.search48} /> Regular AI</div>
                                <p style={{ fontSize: '16px', color: '#666', textAlign: 'center', margin: '12px 0' }}>Finds existing items</p>
                                <div style={{ marginTop: '12px', padding: '16px', background: '#e8e4ff', borderRadius: '8px', fontSize: '15px' }}>
                                    Search → Find → Sort
                                </div>
                            </div>
                            <div className="split-panel">
                                <div className="panel-title"><SvgIcon html={SVG_ICONS.penTool48} /> Generative AI</div>
                                <p style={{ fontSize: '16px', color: '#666', textAlign: 'center', margin: '12px 0' }}>Creates new content</p>
                                <div style={{ marginTop: '12px', padding: '16px', background: '#e8f8f5', borderRadius: '8px', fontSize: '15px' }}>
                                    Prompt → Generate → Create
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="insight-box">
                        <div style={{ fontWeight: 700, color: '#1a9456', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px' }}><SvgIcon html={SVG_ICONS.lightbulb} /> INSIGHT</div>
                        Both are AI. Generative AI is just a specific type that focuses on creation rather than selection.
                    </div>
                </>
            );
        }

        function Stage2() {
            const [showResponse, setShowResponse] = useState(null);

            return (
                <>
                    <div><div className="stage-number">Stage 2</div><div className="stage-header">Picker vs Maker</div></div>
                    <p className="explanation">
                        Regular AI is like a librarian — finds existing books. Generative AI is like an author — writes new ones.
                    </p>
                    <div className="scene-card">
                        <div className="split-screen">
                            <div className="split-panel">
                                <div className="panel-title"><SvgIcon html='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>' /> Librarian (Regular AI)</div>
                                <div className="librarian-scene">
                                    <div className="interactive-prompt">Click a question below</div>
                                    <button
                                        className="question-btn"
                                        onClick={() => setShowResponse('find')}
                                    >
                                        ? Find me a book
                                    </button>
                                    {showResponse === 'find' && (
                                        <div className="response">
                                            Searches shelves, finds existing book, hands it to you.
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="split-panel">
                                <div className="panel-title"><SvgIcon html='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/><path d="M15 5l4 4"/><line x1="2" y1="22" x2="7.5" y2="20.5"/></svg>' /> Author (Generative AI)</div>
                                <div className="librarian-scene">
                                    <div className="interactive-prompt">Click a question below</div>
                                    <button
                                        className="question-btn"
                                        onClick={() => setShowResponse('write')}
                                    >
                                        ? Write me a book
                                    </button>
                                    {showResponse === 'write' && (
                                        <div className="response">
                                            Takes your idea, writes completely new content from scratch.
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="insight-box">
                        <div style={{ fontWeight: 700, color: '#1a9456', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px' }}><SvgIcon html={SVG_ICONS.lightbulb} /> INSIGHT</div>
                        A librarian is great at finding what exists. An author creates what never existed. Both are valuable.
                    </div>
                </>
            );
        }

        function Stage3() {
            const [selectedDomain, setSelectedDomain] = useState('search');

            const domainIcons = {
                search: SVG_ICONS.domainSearch,
                images: SVG_ICONS.domainImage,
                music: SVG_ICONS.domainMusic,
                shopping: SVG_ICONS.domainShopping,
                email: SVG_ICONS.domainEmail,
            };

            const examples = {
                search: {
                    task: 'Find information',
                    regular: 'Google finds existing web pages',
                    genai: 'ChatGPT writes a new answer',
                },
                images: {
                    task: 'Get an image',
                    regular: 'Google Images finds existing photos',
                    genai: 'DALL-E creates a new image',
                },
                music: {
                    task: 'Listen to music',
                    regular: 'Spotify recommends existing songs',
                    genai: 'Suno creates a new song',
                },
                shopping: {
                    task: 'Get a product',
                    regular: 'Amazon recommends existing products',
                    genai: 'AI designs a new product',
                },
                email: {
                    task: 'Manage email',
                    regular: 'Spam filter sorts spam/not spam',
                    genai: 'AI writes a new email',
                },
            };

            return (
                <>
                    <div><div className="stage-number">Stage 3</div><div className="stage-header">Real-World Examples</div></div>
                    <p className="explanation">
                        See how the same task is handled differently by Regular AI vs Generative AI
                    </p>
                    <div className="scene-card">
                        <div className="table-container">
                            <div className="domain-tabs">
                                {Object.entries(examples).map(([key, val]) => (
                                    <button
                                        key={key}
                                        className={`domain-tab ${selectedDomain === key ? 'active' : ''}`}
                                        onClick={() => setSelectedDomain(key)}
                                    >
                                        <SvgIcon html={domainIcons[key]} /> {key.charAt(0).toUpperCase() + key.slice(1)}
                                    </button>
                                ))}
                            </div>
                            <div className="comparison-row">
                                <div className="comparison-row-title" style={{ display: 'flex', alignItems: 'center', gap: '8px' }}><SvgIcon html={domainIcons[selectedDomain]} /> {examples[selectedDomain].task}</div>
                                <div className="comparison-cols">
                                    <div className="comparison-col">
                                        <div className="comparison-col-icon"><SvgIcon html={SVG_ICONS.search24} /></div>
                                        <div className="comparison-col-text">
                                            <strong>Regular AI:</strong> {examples[selectedDomain].regular}
                                        </div>
                                    </div>
                                    <div className="comparison-col">
                                        <div className="comparison-col-icon"><SvgIcon html={SVG_ICONS.penTool24} /></div>
                                        <div className="comparison-col-text">
                                            <strong>Generative AI:</strong> {examples[selectedDomain].genai}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="insight-box">
                        <div style={{ fontWeight: 700, color: '#1a9456', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px' }}><SvgIcon html={SVG_ICONS.lightbulb} /> INSIGHT</div>
                        Regular AI: "Here's what I found." Generative AI: "Here's what I made."
                    </div>
                </>
            );
        }

        function Stage4() {
            const [selectedCard, setSelectedCard] = useState(null);

            const aiTypes = [
                {
                    id: 'classification',
                    title: 'Classification',
                    iconHtml: SVG_ICONS.cardClassify,
                    desc: 'Sorts into categories',
                    demo: 'Email → Spam / Not Spam',
                },
                {
                    id: 'recommendation',
                    title: 'Recommendation',
                    iconHtml: SVG_ICONS.cardRecommend,
                    desc: 'Suggests existing items',
                    demo: 'Netflix → Movies you might like',
                },
                {
                    id: 'prediction',
                    title: 'Prediction',
                    iconHtml: SVG_ICONS.cardPredict,
                    desc: 'Forecasts outcomes',
                    demo: 'Weather → 80% chance of rain',
                },
                {
                    id: 'detection',
                    title: 'Detection',
                    iconHtml: SVG_ICONS.cardDetect,
                    desc: 'Finds anomalies',
                    demo: 'Bank → Fraud detection',
                },
                {
                    id: 'recognition',
                    title: 'Recognition',
                    iconHtml: SVG_ICONS.cardRecognize,
                    desc: 'Identifies things',
                    demo: 'Phone → Face unlock',
                },
            ];

            return (
                <>
                    <div><div className="stage-number">Stage 4</div><div className="stage-header">Types of AI Tasks</div></div>
                    <p className="explanation">
                        Before GenAI, these 5 types of AI were (and still are) everywhere — none of them create, they all analyze, sort, or choose.
                    </p>
                    <div className="scene-card">
                        <div className="cards-grid">
                            {aiTypes.map((type) => (
                                <div
                                    key={type.id}
                                    className={`card ${selectedCard === type.id ? 'active' : ''}`}
                                    onClick={() => setSelectedCard(selectedCard === type.id ? null : type.id)}
                                    style={{
                                        background: selectedCard === type.id ? P.primaryColor : 'linear-gradient(135deg, #f5f5f5 0%, #fafafa 100%)',
                                        color: selectedCard === type.id ? '#fff' : '#333',
                                    }}
                                >
                                    <div className="card-icon"><SvgIcon html={type.iconHtml} /></div>
                                    <div className="card-title">{type.title}</div>
                                    <div className="card-desc">{type.desc}</div>
                                    {selectedCard === type.id && (
                                        <div className="card-demo" style={{ borderTopColor: selectedCard === type.id ? 'rgba(255,255,255,0.3)' : '#e0e0e0' }}>
                                            {type.demo}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="insight-box">
                        <div style={{ fontWeight: 700, color: '#1a9456', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px' }}><SvgIcon html={SVG_ICONS.lightbulb} /> INSIGHT</div>
                        These AI types power most of the tech you use daily — from Netflix recommendations to spam filters
                    </div>
                </>
            );
        }

        function Stage5() {
            const [placed, setPlaced] = useState({});
            const [score, setScore] = useState(0);

            const tasks = [
                { id: 1, text: 'Detect fraud', correct: 'regular' },
                { id: 2, text: 'Recommend products', correct: 'regular' },
                { id: 3, text: 'Filter spam', correct: 'regular' },
                { id: 4, text: 'Predict sales', correct: 'regular' },
                { id: 5, text: 'Write a blog post', correct: 'genai' },
                { id: 6, text: 'Create an image', correct: 'genai' },
                { id: 7, text: 'Generate code', correct: 'genai' },
                { id: 8, text: 'Draft an email', correct: 'genai' },
            ];

            const handleTaskClick = (taskId, zone) => {
                const task = tasks.find((t) => t.id === taskId);
                const newPlaced = { ...placed, [taskId]: zone };
                setPlaced(newPlaced);

                let newScore = 0;
                Object.entries(newPlaced).forEach(([id, z]) => {
                    const t = tasks.find((task) => task.id === parseInt(id));
                    if (t.correct === z) newScore++;
                });
                setScore(newScore);
            };

            const unplacedTasks = tasks.filter((t) => !placed[t.id]);

            return (
                <>
                    <div><div className="stage-number">Stage 5</div><div className="stage-header">When to Use Which</div></div>
                    <p className="explanation">
                        Understanding when to use Regular AI vs GenAI is key — use the right tool for the right job
                    </p>
                    <div className="scene-card">
                        <div className="drag-area">
                            <div className="drop-zone">
                                <div className="drop-zone-title"><SvgIcon html={SVG_ICONS.search24} /> Regular AI</div>
                                {tasks
                                    .filter((t) => placed[t.id] === 'regular')
                                    .map((task) => (
                                        <div
                                            key={task.id}
                                            className="task-item correct"
                                            onClick={() => handleTaskClick(task.id, null)}
                                        >
                                            ✓ {task.text}
                                        </div>
                                    ))}
                            </div>
                            <div className="drop-zone">
                                <div className="drop-zone-title"><SvgIcon html={SVG_ICONS.penTool24} /> Generative AI</div>
                                {tasks
                                    .filter((t) => placed[t.id] === 'genai')
                                    .map((task) => (
                                        <div
                                            key={task.id}
                                            className="task-item correct"
                                            onClick={() => handleTaskClick(task.id, null)}
                                        >
                                            ✓ {task.text}
                                        </div>
                                    ))}
                            </div>
                        </div>
                    </div>

                    <div style={{ display: 'flex', gap: '30px', maxWidth: '900px' }}>
                        <div style={{ flex: 1 }}>
                            <div style={{ marginBottom: '20px', fontSize: '16px', fontWeight: '600', color: P.primaryColor, display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <SvgIcon html={SVG_ICONS.clipboard} /> Available Tasks ({unplacedTasks.length})
                            </div>
                            {unplacedTasks.map((task) => (
                                <div
                                    key={task.id}
                                    style={{
                                        display: 'flex',
                                        gap: '10px',
                                        marginBottom: '10px',
                                    }}
                                >
                                    <button
                                        onClick={() => handleTaskClick(task.id, 'regular')}
                                        style={{
                                            flex: 1,
                                            padding: '10px',
                                            background: '#fff',
                                            border: '2px solid #e0e0e0',
                                            borderRadius: '8px',
                                            cursor: 'pointer',
                                            fontSize: '13px',
                                            fontWeight: '500',
                                            transition: 'all 0.2s',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '6px',
                                        }}
                                        onMouseEnter={(e) => {
                                            e.target.style.borderColor = P.primaryColor;
                                        }}
                                        onMouseLeave={(e) => {
                                            e.target.style.borderColor = '#e0e0e0';
                                        }}
                                    >
                                        <SvgIcon html={SVG_ICONS.search20} /> {task.text}
                                    </button>
                                    <button
                                        onClick={() => handleTaskClick(task.id, 'genai')}
                                        style={{
                                            flex: 1,
                                            padding: '10px',
                                            background: '#fff',
                                            border: '2px solid #e0e0e0',
                                            borderRadius: '8px',
                                            cursor: 'pointer',
                                            fontSize: '13px',
                                            fontWeight: '500',
                                            transition: 'all 0.2s',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            gap: '6px',
                                        }}
                                        onMouseEnter={(e) => {
                                            e.target.style.borderColor = P.primaryColor;
                                        }}
                                        onMouseLeave={(e) => {
                                            e.target.style.borderColor = '#e0e0e0';
                                        }}
                                    >
                                        <SvgIcon html={SVG_ICONS.penTool20} /> {task.text}
                                    </button>
                                </div>
                            ))}
                            <div className="score-display">
                                <SvgIcon html={SVG_ICONS.star} /> Score: {score}/{tasks.length}
                            </div>
                        </div>
                    </div>

                    <div className="insight-box">
                        <div style={{ fontWeight: 700, color: '#1a9456', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '6px' }}><SvgIcon html={SVG_ICONS.lightbulb} /> INSIGHT</div>
                        Regular AI = Picker (chooses from what exists). Generative AI = Maker (creates something new). Best results come from combining both.
                    </div>
                </>
            );
        }

        function App() {
            const [currentStage, setCurrentStage] = useState(0);

            const stages = [
                { component: Stage1, title: 'Regular AI vs Generative AI' },
                { component: Stage2, title: 'Regular AI vs Generative AI' },
                { component: Stage3, title: 'Regular AI vs Generative AI' },
                { component: Stage4, title: 'Regular AI vs Generative AI' },
                { component: Stage5, title: 'Regular AI vs Generative AI' },
            ];

            const CurrentStage = stages[currentStage].component;

            return (
                <div className="container">
                    <div className="sidebar">
                        {sidebarSteps.map((step, idx) => (
                            <React.Fragment key={idx}>
                                <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                                    <button
                                        className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                                        onClick={() => setCurrentStage(idx)}
                                        dangerouslySetInnerHTML={{__html: step.icon}}
                                    />
                                    <div className="step-btn-label">{step.label}</div>
                                </div>
                                {idx < sidebarSteps.length - 1 && (
                                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                                )}
                            </React.Fragment>
                        ))}
                    </div>

                    <div className="main-content">
                        <div className="top-bar">
                            <div className="left-section">
                                <a href="../../index.html" className="back-link">← Back to All Guides</a>
                                <span style={{ fontSize: '14px', color: '#999' }}>|</span>
                                <div style={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="guide-number">1.2</span>
                                    <div className="title">{stages[currentStage].title}</div>
                                </div>
                                <div>
                                    <div className="badge">INTERACTIVE GUIDE</div>
                                </div>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center' }}>
                                <span className="progress-indicator">Page {currentStage + 1} of 5</span>
                                <div className="nav-arrows">
                                    <button className="arrow-btn" onClick={() => setCurrentStage(Math.max(0, currentStage - 1))} disabled={currentStage === 0}>←</button>
                                    <button className="arrow-btn" onClick={() => setCurrentStage(Math.min(stages.length - 1, currentStage + 1))} disabled={currentStage === stages.length - 1}>→</button>
                                </div>
                            </div>
                        </div>

                        <div className="content-area">
                            <CurrentStage />
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
