<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Types of AI Models - Foundational, Proprietary, Open Source</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes blink {
      0%, 49%, 100% {
        opacity: 1;
      }
      50%, 99% {
        opacity: 0;
      }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid #e0e0e0;
      background: white;
      flex-shrink: 0;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      color: #6c5ce7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #2ecc71;
    }

    .badge {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .guide-number {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #b0a6e8;
      margin-right: 8px;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }

    

    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .stage-number {
      font-size: 13px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .nav-arrows {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .progress-indicator {
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .arrow-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #e0e0e0;
      background: #fff;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-btn:hover:not(:disabled) {
      border-color: #6c5ce7;
      color: #6c5ce7;
    }

    .arrow-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .sidebar {
      width: 120px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 80px 12px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .step-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .step-btn:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .step-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    .step-wrapper.active .step-btn-label {
      color: #6c5ce7;
    }

    .step-connector {
      width: 2px;
      height: 16px;
      background: #e0e0e0;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .step-connector.active {
      background: #6c5ce7;
    }

</head>

      stepContainer: {

      stepLine: {

      stepLineActive: {
        position: 'absolute',

      stepButton: {

        alignItems: 'center',

        transition: 'all 0.2s',

            width: '100%',
            maxWidth: '600px',
            padding: '16px',

          <div style={{
            width: '100%',
            maxWidth: '600px',
            padding: '16px',
            backgroundColor: '#f5f5f5',
            borderRadius: '8px',
            fontSize: '14px',
            color: '#666',
            textAlign: 'center',
            lineHeight: '1.6',
          }}>
            <div style={{ fontWeight: 600, marginBottom: '8px' }}>Deployment Flow</div>
            <div>Download Model > Upload to Your Hardware > Full Control</div>
          </div>
        </div>

    // Stage 4: Application Layer
    const S4 = () => {

      const appIcons = [SVG.search24, SVG.doc24, SVG.monitor24, SVG.sparkle24];

      const apps = [
        { name: 'Perplexity', models: ['GPT-4', 'Claude 3.5'] },
        { name: 'Gamma', models: ['GPT-4', 'Claude 3.5'] },
        { name: 'Cursor', models: ['GPT-4', 'Claude 3.5'] },

      return (
        <div style={P.scene}>
          <div><div className="stage-number">Stage 4</div><div className="stage-header">The App Layer</div></div>
          <div style={{
            textAlign: 'center',
            marginBottom: '28px',
            animation: 'slideIn 0.4s ease-out',
          }}>
            <div style={{
              marginBottom: '12px',
            }}>
              <SvgIcon svg={SVG.phone48} />

              fontWeight: 600,

            maxWidth: '600px',

                  <td style={{ padding: '6px 0', fontWeight: 600 }}>Car Service</td>

                </tr>

                  <td style={{ padding: '6px 0', fontWeight: 600 }}>Passenger</td>
                  <td style={{ padding: '6px 0' }}>You</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // Stage 5: Decision Framework
    const S5 = () => {
      const [priority, setPriority] = useState(null);

      const priorityIcons = [SVG.bolt24, SVG.shield24, SVG.dollar24, SVG.star24];

      const priorities = [

        { name: 'Ease of Use', rec: 'Application Layer' },

      return (
        <div style={P.scene}>

                    borderRadius: '6px',
                    cursor: 'pointer',
                    fontSize: '14px',

                    transition: 'all 0.2s',

                  <div style={{ marginBottom: '4px' }}>
                    <SvgIcon svg={priorityIcons[i]} style={{ color: priority === i ? '#fff' : '#6c5ce7' }} />

            <table style={{
              width: '100%',

              overflow: 'hidden',

                <tr style={{ backgroundColor: '#e8e8e8' }}>

                {comparison.map((row, i) => (
                  <tr key={i} style={{ borderBottom: '1px solid #e0e0e0' }}>

                  </tr>

          <div style={{
            width: '100%',
            maxWidth: '600px',
            padding: '16px',
            backgroundColor: '#f0f7ff',
            borderRadius: '8px',
            fontSize: '14px',
            color: '#444',
            lineHeight: '1.6',
          }}>
            <div style={{ fontWeight: 600, marginBottom: '8px', color: '#2c5aa0' }}>Decision Tree</div>
            <div style={{ marginBottom: '8px' }}>
              <strong>Do you need full control?</strong>
              <div style={{ marginLeft: '12px', marginTop: '4px', fontSize: '14px' }}>
                YES > <span style={{ color: '#2ecc71', fontWeight: 600 }}>Open Source</span>
              </div>
            </div>
            <div>
              <strong>No. Is ease of use priority?</strong>
              <div style={{ marginLeft: '12px', marginTop: '4px', fontSize: '14px' }}>
                YES > <span style={{ color: '#3498db', fontWeight: 600 }}>App Layer</span>
              </div>
              <div style={{ marginLeft: '12px', marginTop: '4px', fontSize: '14px' }}>
                NO > <span style={{ color: '#6c5ce7', fontWeight: 600 }}>Proprietary</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Main App
    const App = () => {
      const [stage, setStage] = useState(0);

      const getScene = () => {
        switch (stage) {
          case 0: return <S1 />;
          case 1: return <S2 />;
          case 2: return <S3 />;
          case 3: return <S4 />;
          case 4: return <S5 />;
          default: return <S1 />;
        }
      };

      const getInsight = () => {
        switch (stage) {
          case 0:
            return "Think of foundational models as Toyota engines -- they power many different cars, from taxis to race cars.";
          case 1:
            return "You can buy the drink but can't see how it's made -- highest quality, but you're dependent on the provider.";
          case 2:
            return "Like a recipe posted online -- make it at home, modify it, or sell your own version. Full freedom.";
          case 3:
            return "Uber doesn't manufacture engines -- they build a service using cars with existing engines. Same with Perplexity using GPT-4.";
          case 4:
            return "There's no single 'best' model -- match the model type to your specific needs: performance, privacy, cost, or ease of use.";
          default:
            return "";
        }
      };

      const getExplanation = () => {
        switch (stage) {
          case 0:
            return "Foundational models are the 'engines' of AI -- large pre-trained models trained on massive data that serve as the base intelligence. You don't build an engine from scratch to make a taxi service -- you buy one and build around it.";
          case 1:
            return "Proprietary models keep their weights, training data, and code secret. You access them via API only -- like Coca-Cola's secret recipe.";
          case 2:
            return "Open source models make weights (and sometimes code/data) publicly available. Download and run yourself -- like a recipe posted online that you can modify.";
          case 3:
            return "Products like Perplexity, Gamma, and Cursor don't build foundational models -- they build products ON TOP of them. Like Uber doesn't manufacture engines.";
          case 4:
            return "The right choice depends on your priorities: performance, cost, privacy, and customization. Here's how to decide.";
          default:
            return "";
        }

                </div>
              </div>
            </div>

            {/* Content Area */}
            <div style={P.content} key={stage}>
              <div style={P.explainRow}>
                <div style={P.explain}>{getExplanation()}</div>
              </div>
              {getScene()}
              <div style={P.insight}>
                <div style={P.insightLabel}>
                  <SvgIcon svg={SVG.lightbulb} /> INSIGHT

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
