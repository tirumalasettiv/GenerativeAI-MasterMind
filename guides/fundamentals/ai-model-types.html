              overflow: 'hidden',
            }}>
              <thead>
                <tr style={{ backgroundColor: '#e8e8e8' }}>
                  <th style={{ padding: '10px', textAlign: 'left', fontWeight: 600 }}>Aspect</th>
                  <th style={{ padding: '10px', textAlign: 'center', fontWeight: 600 }}>Proprietary</th>
                  <th style={{ padding: '10px', textAlign: 'center', fontWeight: 600 }}>Open Source</th>
                  <th style={{ padding: '10px', textAlign: 'center', fontWeight: 600 }}>App Layer</th>
                </tr>
              </thead>
              <tbody>
                {comparison.map((row, i) => (
                  <tr key={i} style={{ borderBottom: '1px solid #e0e0e0' }}>
                    <td style={{ padding: '10px', fontWeight: 500 }}>{row.label}</td>
                    <td style={{ padding: '10px', textAlign: 'center', color: '#666' }}>{row.prop}</td>
                    <td style={{ padding: '10px', textAlign: 'center', color: '#666' }}>{row.os}</td>
                    <td style={{ padding: '10px', textAlign: 'center', color: '#666' }}>{row.app}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{
            width: '100%',
            maxWidth: '600px',
            padding: '16px',
            backgroundColor: '#f0f7ff',
            borderRadius: '8px',
            fontSize: '14px',
            color: '#444',
            lineHeight: '1.6',
          }}>
            <div style={{ fontWeight: 600, marginBottom: '8px', color: '#2c5aa0' }}>Decision Tree</div>
            <div style={{ marginBottom: '8px' }}>
              <strong>Do you need full control?</strong>
              <div style={{ marginLeft: '12px', marginTop: '4px', fontSize: '14px' }}>
                YES > <span style={{ color: '#2ecc71', fontWeight: 600 }}>Open Source</span>
              </div>
            </div>
            <div>
              <strong>No. Is ease of use priority?</strong>
              <div style={{ marginLeft: '12px', marginTop: '4px', fontSize: '14px' }}>
                YES > <span style={{ color: '#3498db', fontWeight: 600 }}>App Layer</span>
              </div>
              <div style={{ marginLeft: '12px', marginTop: '4px', fontSize: '14px' }}>
                NO > <span style={{ color: '#6c5ce7', fontWeight: 600 }}>Proprietary</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Main App
    const App = () => {
      const [stage, setStage] = useState(0);

      const getScene = () => {
        switch (stage) {
          case 0: return <S1 />;
          case 1: return <S2 />;
          case 2: return <S3 />;
          case 3: return <S4 />;
          case 4: return <S5 />;
          default: return <S1 />;
        }
      };

      const getInsight = () => {
        switch (stage) {
          case 0:
            return "Think of foundational models as Toyota engines -- they power many different cars, from taxis to race cars.";
          case 1:
            return "You can buy the drink but can't see how it's made -- highest quality, but you're dependent on the provider.";
          case 2:
            return "Like a recipe posted online -- make it at home, modify it, or sell your own version. Full freedom.";
          case 3:
            return "Uber doesn't manufacture engines -- they build a service using cars with existing engines. Same with Perplexity using GPT-4.";
          case 4:
            return "There's no single 'best' model -- match the model type to your specific needs: performance, privacy, cost, or ease of use.";
          default:
            return "";
        }
      };

      const getExplanation = () => {
        switch (stage) {
          case 0:
            return "Foundational models are the 'engines' of AI -- large pre-trained models trained on massive data that serve as the base intelligence. You don't build an engine from scratch to make a taxi service -- you buy one and build around it.";
          case 1:
            return "Proprietary models keep their weights, training data, and code secret. You access them via API only -- like Coca-Cola's secret recipe.";
          case 2:
            return "Open source models make weights (and sometimes code/data) publicly available. Download and run yourself -- like a recipe posted online that you can modify.";
          case 3:
            return "Products like Perplexity, Gamma, and Cursor don't build foundational models -- they build products ON TOP of them. Like Uber doesn't manufacture engines.";
          case 4:
            return "The right choice depends on your priorities: performance, cost, privacy, and customization. Here's how to decide.";
          default:
            return "";
        }
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div style={P.root}>
          {/* Sidebar */}
          <aside className="sidebar" aria-label="Guide sections">
            {STAGES.map((s, i) => {
              const iconMarkup = { __html: SIDEBAR_ICONS[i] };
              return (
                <React.Fragment key={i}>
                  <div className={`step-wrapper ${stage === i ? 'active' : ''}`}>
                    <button
                      type="button"
                      className={`step-btn ${stage === i ? 'active' : ''}`}
                      aria-label={`Step ${i + 1}: ${s.label}`}
                      aria-current={stage === i ? "step" : undefined}
                      onClick={() => setStage(i)}
                      dangerouslySetInnerHTML={iconMarkup}
                    />
                    <div className="step-btn-label">{s.label}</div>
                  </div>
                  {i < STAGES.length - 1 && (
                    <div className={`step-connector ${stage > i ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              );
            })}
          </aside>

          {/* Main Content */}
          <div style={P.main}>
            {/* Top Bar */}
            <div className="top-bar">
              <div className="left-section">
                <a href="../../index.html" className="back-link">← Back to All Guides</a>
                <span style={{ fontSize: '14px', color: '#999' }}>|</span>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="guide-number">1.4</span>
                  <h1 className="title">{STAGES[stage].title}</h1>
                </div>
                <div>
                  <div className="badge">INTERACTIVE</div>
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center' }}>
                <span className="progress-indicator">Page {stage + 1} of {STAGES.length}</span>
                <nav className="nav-arrows" aria-label="Section navigation">
                  <button type="button" className="arrow-btn" aria-label="Previous section" onClick={() => setStage(Math.max(0, stage - 1))} disabled={stage === 0}>←</button>
                  <button type="button" className="arrow-btn" aria-label="Next section" onClick={() => setStage(Math.min(STAGES.length - 1, stage + 1))} disabled={stage === STAGES.length - 1}>→</button>
                </nav>
              </div>
            </div>

            {/* Content Area */}
            <main id="main" style={P.content} key={stage}>
              <div style={P.explainRow}>
                <div style={P.explain}>{getExplanation()}</div>
              </div>
              {getScene()}
              <div style={P.insight}>
                <div style={P.insightLabel}>
                  <SvgIcon svg={SVG.lightbulb} /> INSIGHT
                </div>
                <div>{getInsight()}</div>
              </div>
              {stage === STAGES.length - 1 && (
                <div className="up-next-card" role="complementary" aria-label="Up next">
                  <span className="up-next-label">UP NEXT</span>
                  <a href={NEXT_GUIDE.href} className="up-next-link">
                    <div className="up-next-meta">
                      <span className="up-next-id">{NEXT_GUIDE.id}</span>
                      <span className="up-next-module">{NEXT_GUIDE.module}</span>
                    </div>
                    <div className="up-next-title">{NEXT_GUIDE.title}</div>
                    <span className="up-next-arrow" aria-hidden="true">→</span>
                  </a>
                </div>
              )}
            </main>
          </div>
        </div>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
