<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Inside the Black Box: How Generative AI Works">
    <meta property="og:description" content="Open the black box. A visual walk through tokens, embeddings, attention, and next-token prediction that power modern LLMs.">

    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <title>Inside the Black Box: How Generative AI Works</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/guide-shared.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

    <style>
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .stage-title {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #2c3e50;
        }

        .analogy-text {
            font-size: 22px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 32px;
            font-style: italic;
            padding: 12px 16px;
            background: #f8f9fa;
            border-left: 4px solid #6c5ce7;
            border-radius: 4px;
        }

        .animated {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }

        .cursor-blink {
            animation: blink 1s infinite;
        }

        .interactive-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d0c4ff;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            background: white;
            color: #2c3e50;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .interactive-input:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .token-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .token-chip {
            padding: 6px 12px;
            border-radius: 20px;
            background: #e0d4ff;
            color: #6c5ce7;
            font-size: 15px;
            font-weight: 600;
            animation: slideIn 0.3s ease-out;
            transition: transform 0.2s ease;
        }

        .token-chip:hover {
            transform: scale(1.12);
            box-shadow: 0 2px 8px rgba(108, 92, 231, 0.2);
        }

        .token-count {
            font-size: 15px;
            color: #666;
            margin-top: 12px;
            text-align: center;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 8px 14px;
            background: #f0f0f0;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            color: #666;
        }

        .preset-btn:hover {
            background: #e0d4ff;
            border-color: #6c5ce7;
            color: #6c5ce7;
        }

        .attention-text {
            position: relative;
            display: inline-block;
            word-spacing: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin: 24px 0;
            text-align: center;
        }

        .attention-word {
            position: relative;
            cursor: pointer;
            padding: 4px 2px;
        }

        .attention-word span {
            position: relative;
            z-index: 2;
        }

        .attention-weights {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 120px;
            margin: 20px 0;
            gap: 8px;
        }

        .attention-bar {
            flex: 1;
            background: linear-gradient(to top, #6c5ce7, #d0c4ff);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s ease;
            position: relative;
            min-height: 20px;
        }

        .attention-bar:hover {
            opacity: 0.8;
        }

        .attention-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }

        .probability-bars {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0;
            width: 100%;
        }

        .probability-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .prob-label {
            width: 80px;
            text-align: right;
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
        }

        .prob-bar-bg {
            flex: 1;
            height: 40px;
            background: #f0f0f0;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .prob-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #5a4bd1, #6c5ce7, #8b7cf6, #a78bfa);
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 12px;
        }

        .prob-percent {
            min-width: 40px;
            text-align: right;
            font-weight: 600;
            color: #6c5ce7;
            font-size: 16px;
        }

        .slider-container {
            margin: 20px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #666;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(108, 92, 231, 0.3);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(108, 92, 231, 0.3);
        }

        .slider::-webkit-slider-thumb:hover {
            background: #1a9456;
            box-shadow: 0 4px 8px rgba(26, 148, 86, 0.3);
        }

        .slider::-moz-range-thumb:hover {
            background: #1a9456;
            box-shadow: 0 4px 8px rgba(26, 148, 86, 0.3);
        }

        .parameter-display {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
        }

        .param-card {
            flex: 1;
            background: white;
            border: 1px solid #d0c4ff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .param-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 92, 231, 0.12);
        }

        .param-model {
            font-weight: 600;
            color: #2c3e50;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .param-count {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 700;
            color: #6c5ce7;
        }

        .param-unit {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }

        .network-node {
            fill: #6c5ce7;
            transition: all 0.2s ease;
        }

        .network-node:hover {
            fill: #1a9456;
            filter: drop-shadow(0 0 6px rgba(26, 148, 86, 0.5));
        }

        .network-line {
            stroke: #d0c4ff;
            stroke-width: 1;
            transition: all 0.2s ease;
        }

        .network-line.active {
            stroke: #1a9456;
            stroke-width: 2;
        }

        .book-animation {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }

        .text-flow {
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 6px;
            font-size: 15px;
            color: #666;
            animation: slideIn 0.5s ease-out;
            border-left: 3px solid #6c5ce7;
        }

        .neural-net-viz {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .neural-nodes {
            display: flex;
            gap: 8px;
        }

        .neural-node {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e0d4ff;
            border: 2px solid #6c5ce7;
            animation: pulse 2s ease-in-out infinite;
        }

        .neural-arrow {
            color: #6c5ce7;
            font-size: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 15px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .comparison-table th {
            background: #f8f9fa;
            font-weight: 700;
            color: #2c3e50;
        }

        .comparison-table tr:hover {
            background: #f8f9fa;
        }

        .memory-viz {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .memory-unit {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .memory-label {
            width: 100px;
            font-weight: 600;
            font-size: 13px;
            color: #666;
        }

        .memory-dots {
            display: flex;
            gap: 3px;
            flex: 1;
        }

        .memory-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6c5ce7;
            opacity: 0.6;
        }

        .memory-dot.active {
            background: #1a9456;
            opacity: 1;
            transform: scale(1.2);
        }

        @keyframes dashMarch {
            to {
                stroke-dashoffset: -20;
            }
        }

    </style>
    <script src="../../assets/analytics.js" defer></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const P = {
            primary: '#6c5ce7',
            success: '#2ecc71',
            successDark: '#1a9456',
            light: '#f8f9fa',
            border: '#e0e0e0',
            text: '#2c3e50',
            textMuted: '#666'
        };

        const NEXT_GUIDE = { id: "1.4", title: "AI Model Types", module: "Module 1", href: "./ai-model-types.html" };
        const STAGES = [
            { id: 1, name: 'Training', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>' },
            { id: 2, name: 'Parameters', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m-8.66-3.34l2.83-2.83m11.31-11.31l2.83-2.83M1 12h4m14 0h4M4.34 4.34l2.83 2.83m11.31 11.31l2.83 2.83"/></svg>' },
            { id: 3, name: 'Tokens', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="6" height="10" rx="1"/><rect x="9" y="4" width="6" height="16" rx="1"/><rect x="16" y="9" width="6" height="6" rx="1"/></svg>' },
            { id: 4, name: 'Attention', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' },
            { id: 5, name: 'Prediction', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>' }
        ];

        // Training Flow Diagram
        const TrainingFlowDiagram = () => {
            const [activeNode, setActiveNode] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => {
                    setActiveNode(prev => (prev + 1) % 4);
                }, 1200);
                return () => clearInterval(timer);
            }, []);

            const nodes = [
                { label: 'Raw Text Data',     sub: 'Billions of examples',    x: 10  },
                { label: 'Pattern Extraction', sub: 'Neural network reads',    x: 170 },
                { label: 'Weight Updates',     sub: 'Billions of adjustments', x: 330 },
                { label: 'Trained Model',      sub: 'Ready to predict',        x: 490 },
            ];

            const nodeW = 130;
            const nodeH = 48;
            const nodeY = 40;
            const arrowColor = '#b0a6e8';

            const arrowMarker = (
                <defs>
                    <marker id="tfArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                        <path d="M0,0 L0,6 L8,3 z" fill={arrowColor} />
                    </marker>
                </defs>
            );

            return (
                <svg viewBox="0 0 640 130" style={{ width: '100%', maxWidth: '640px', height: 'auto', display: 'block', margin: '0 auto 12px' }}>
                    {arrowMarker}

                    {/* Connecting arrows */}
                    {nodes.slice(0, 3).map((node, i) => {
                        const x1 = node.x + nodeW;
                        const x2 = nodes[i + 1].x;
                        const midY = nodeY + nodeH / 2;
                        return (
                            <path
                                key={`arrow-${i}`}
                                d={`M${x1},${midY} L${x2},${midY}`}
                                stroke={arrowColor}
                                strokeWidth="1.5"
                                fill="none"
                                markerEnd="url(#tfArrow)"
                                strokeDasharray="6 4"
                                style={{ animation: 'dashMarch 0.6s linear infinite' }}
                            />
                        );
                    })}

                    {/* Nodes */}
                    {nodes.map((node, i) => {
                        let fill, stroke, strokeWidth;
                        if (i === activeNode) {
                            fill = '#f5f3ff'; stroke = '#6c5ce7'; strokeWidth = 2;
                        } else if (i < activeNode) {
                            fill = '#f5f3ff'; stroke = '#a29bfe'; strokeWidth = 1.5;
                        } else {
                            fill = 'white'; stroke = '#d8d8e8'; strokeWidth = 1.5;
                        }
                        return (
                            <g key={`node-${i}`}>
                                <rect
                                    x={node.x}
                                    y={nodeY}
                                    width={nodeW}
                                    height={nodeH}
                                    rx={12}
                                    fill={fill}
                                    stroke={stroke}
                                    strokeWidth={strokeWidth}
                                />
                                <text
                                    x={node.x + nodeW / 2}
                                    y={nodeY + nodeH / 2 - 5}
                                    textAnchor="middle"
                                    fontFamily="DM Sans, sans-serif"
                                    fontSize="12"
                                    fontWeight="600"
                                    fill={i <= activeNode ? '#6c5ce7' : '#999'}
                                >
                                    {node.label}
                                </text>
                                <text
                                    x={node.x + nodeW / 2}
                                    y={nodeY + nodeH / 2 + 11}
                                    textAnchor="middle"
                                    fontFamily="DM Sans, sans-serif"
                                    fontSize="10"
                                    fill="#aaa"
                                >
                                    {node.sub}
                                </text>
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // Training Stage Component
        const S1 = ({ stage }) => {
            const [books, setBooks] = useState([]);

            useEffect(() => {
                if (stage !== 1) return;

                const texts = [
                    'Capital of France is Paris',
                    'Capital of Japan is Tokyo',
                    'Capital of Germany is Berlin'
                ];

                texts.forEach((text, idx) => {
                    setTimeout(() => {
                        setBooks(prev => [...prev, { id: idx, text }]);
                    }, idx * 600);
                });

                return () => setBooks([]);
            }, [stage]);

            return (
                <div className="content-wrapper">
                    <div><h2 className="stage-header">The Training Process</h2></div>
                    <h2 className="stage-title">Training</h2>
                    <div className="analogy-text">
                        "A student who reads every library book but memorizes how sentences flow, not specific facts"
                    </div>

                    <div className="scene-card">
                        <div style={{ width: '100%' }}>
                            <TrainingFlowDiagram />
                        </div>
                        <div className="book-animation">
                            {books.map(book => (
                                <div key={book.id} className="text-flow">
                                    <span style={{display: 'inline-flex', verticalAlign: 'middle', marginRight: '6px'}} dangerouslySetInnerHTML={{__html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>'}} />
                                    {book.text}
                                </div>
                            ))}

                            {books.length > 0 && (
                                <div style={{ marginTop: '16px', textAlign: 'center', color: P.primary, fontWeight: '600', animation: 'pulse 2s ease-in-out infinite' }}>
                                    Learning pattern: "Capital of [country] is [city]"
                                </div>
                            )}

                            <div className="neural-net-viz">
                                <div className="neural-nodes">
                                    <div className="neural-node"></div>
                                    <div className="neural-node"></div>
                                    <div className="neural-node"></div>
                                </div>
                                <div className="neural-arrow">→</div>
                                <div className="neural-nodes">
                                    <div className="neural-node"></div>
                                    <div className="neural-node"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="insight-box">
                        <div className="insight-label"><span style={{display: 'inline-flex', verticalAlign: 'middle', marginRight: '6px'}} dangerouslySetInnerHTML={{__html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a9456" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> Insight</div>
                        <div>AI learns <strong>patterns, not facts</strong> — like learning grammar rules by reading, not by memorizing a dictionary</div>
                    </div>
                </div>
            );
        };

        // Parameters Stage Component
        const S2 = ({ stage }) => {
            const [hoveredNode, setHoveredNode] = useState(null);

            const NetworkViz = () => {
                const nodePositions = [
                    [30, 50], [70, 30], [50, 70], [10, 40], [90, 60],
                    [40, 20], [60, 80], [25, 75], [80, 15]
                ];

                return (
                    <svg viewBox="0 0 100 100" style={{ width: '280px', height: '220px', margin: '20px 0' }}>
                        {nodePositions.map((pos1, i) =>
                            nodePositions.map((pos2, j) =>
                                i < j && Math.random() > 0.4 ? (
                                    <line
                                        key={`line-${i}-${j}`}
                                        x1={pos1[0]}
                                        y1={pos1[1]}
                                        x2={pos2[0]}
                                        y2={pos2[1]}
                                        className={`network-line ${hoveredNode !== null && (hoveredNode === i || hoveredNode === j) ? 'active' : ''}`}
                                    />
                                ) : null
                            )
                        )}
                        {nodePositions.map((pos, idx) => (
                            <circle
                                key={`node-${idx}`}
                                cx={pos[0]}
                                cy={pos[1]}
                                r="3.5"
                                className="network-node"
                                onMouseEnter={() => setHoveredNode(idx)}
                                onMouseLeave={() => setHoveredNode(null)}
                                style={{ cursor: 'pointer' }}
                            />
                        ))}
                    </svg>
                );
            };

            return (
                <div className="content-wrapper">
                    <div><h2 className="stage-header">Parameters &amp; Knowledge</h2></div>
                    <h2 className="stage-title">Parameters</h2>
                    <div className="analogy-text">
                        "Like muscle memory — you can't explain how you ride a bike, but your body knows"
                    </div>

                    <div className="scene-card">
                        <NetworkViz />
                        <p style={{ fontSize: '13px', color: P.textMuted, marginBottom: '20px' }}>
                            Hover over nodes to see connections
                        </p>

                        <div className="parameter-display">
                            <div className="param-card">
                                <div className="param-model">GPT-2</div>
                                <div className="param-count">1.5B</div>
                                <div className="param-unit">parameters</div>
                            </div>
                            <div className="param-card">
                                <div className="param-model">GPT-3</div>
                                <div className="param-count">175B</div>
                                <div className="param-unit">parameters</div>
                            </div>
                            <div className="param-card">
                                <div className="param-model">GPT-4</div>
                                <div className="param-count">~1.8T</div>
                                <div className="param-unit">parameters</div>
                            </div>
                        </div>
                    </div>

                    <div className="insight-box">
                        <div className="insight-label"><span style={{display: 'inline-flex', verticalAlign: 'middle', marginRight: '6px'}} dangerouslySetInnerHTML={{__html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a9456" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> Insight</div>
                        <div><strong>More parameters = more patterns captured</strong> = better understanding. Each connection stores learned knowledge about language.</div>
                    </div>
                </div>
            );
        };

        // Token Breakdown SVG Diagram
        const TokenBreakdown = () => {
            const wordY = 20;
            const tokenY = 80;
            const chipH = 24;
            const chipRx = 6;

            const words = [
                { label: 'playing',      cx: 100 },
                { label: 'unbelievable', cx: 300 },
                { label: 'tokenization', cx: 500 },
            ];

            const tokenGroups = [
                { pieces: ['play', 'ing'],          startX: 54  },
                { pieces: ['un', 'believ', 'able'],  startX: 224 },
                { pieces: ['token', 'ization'],      startX: 436 },
            ];

            const chipColors = ['#f5f3ff'];
            const chipStroke = '#6c5ce7';
            const chipPad = 10;
            const fontSize = 11;

            // Estimate chip widths (approx 7px per char + 2*padding)
            const chipWidth = (text) => text.length * 7 + chipPad * 2;

            return (
                <svg viewBox="0 0 600 120" style={{ width: '100%', maxWidth: '600px', height: 'auto', display: 'block', margin: '0 auto 12px' }}>
                    {/* Label */}
                    <text
                        x="590"
                        y="14"
                        textAnchor="end"
                        fontFamily="DM Sans, sans-serif"
                        fontSize="10"
                        fill="#aaa"
                    >
                        How AI sees words
                    </text>

                    {/* Row 1: full words */}
                    {words.map((w, i) => {
                        const ww = w.label.length * 7 + chipPad * 2;
                        return (
                            <g key={`word-${i}`}>
                                <rect
                                    x={w.cx - ww / 2}
                                    y={wordY}
                                    width={ww}
                                    height={chipH}
                                    rx={chipRx}
                                    fill="#f0f8ff"
                                    stroke="#a29bfe"
                                    strokeWidth="1.5"
                                />
                                <text
                                    x={w.cx}
                                    y={wordY + chipH / 2 + 4}
                                    textAnchor="middle"
                                    fontFamily="DM Sans, sans-serif"
                                    fontSize={fontSize}
                                    fontWeight="600"
                                    fill="#5a4bd1"
                                >
                                    {w.label}
                                </text>
                            </g>
                        );
                    })}

                    {/* Arrows from words to tokens */}
                    {words.map((w, i) => (
                        <path
                            key={`down-arrow-${i}`}
                            d={`M${w.cx},${wordY + chipH} L${w.cx},${tokenY}`}
                            stroke="#b0a6e8"
                            strokeWidth="1.5"
                            fill="none"
                            markerEnd="url(#tbArrow)"
                        />
                    ))}

                    <defs>
                        <marker id="tbArrow" markerWidth="6" markerHeight="6" refX="3" refY="5" orient="auto">
                            <path d="M0,0 L3,5 L6,0" fill="none" stroke="#b0a6e8" strokeWidth="1.5" />
                        </marker>
                    </defs>

                    {/* Row 2: subword tokens */}
                    {tokenGroups.map((group, gi) => {
                        let curX = group.startX;
                        return group.pieces.map((piece, pi) => {
                            const cw = chipWidth(piece);
                            const cx = curX;
                            curX += cw + 4;
                            return (
                                <g key={`token-${gi}-${pi}`}>
                                    <rect
                                        x={cx}
                                        y={tokenY}
                                        width={cw}
                                        height={chipH}
                                        rx={chipRx}
                                        fill="#f5f3ff"
                                        stroke={chipStroke}
                                        strokeWidth="1.5"
                                    />
                                    <text
                                        x={cx + cw / 2}
                                        y={tokenY + chipH / 2 + 4}
                                        textAnchor="middle"
                                        fontFamily="DM Sans, sans-serif"
                                        fontSize={fontSize}
                                        fontWeight="600"
                                        fill="#6c5ce7"
                                    >
                                        {piece}
                                    </text>
                                </g>
                            );
                        });
                    })}
                </svg>
            );
        };

        // Tokens Stage Component
        const S3 = ({ stage }) => {
            const [userText, setUserText] = useState('Explain photosynthesis');
            const [tokens, setTokens] = useState([]);

            useEffect(() => {
                if (stage !== 3) return;
                generateTokens(userText);
            }, [stage]);

            const generateTokens = (text) => {
                const tokenMap = {
                    'Explain photosynthesis': ['Explain', ' photo', 'synth', 'esis'],
                    'Hello world': ['Hello', ' world'],
                    'Machine learning': ['Machine', ' learning'],
                    'Neural networks': ['Neural', ' networks'],
                    'Computer science': ['Computer', ' science'],
                    'Artificial intelligence': ['Artificial', ' intelligence']
                };

                const result = tokenMap[text] || text.split(/(\s+)/).filter(t => t.trim());
                setTokens([]);

                result.forEach((token, idx) => {
                    setTimeout(() => {
                        setTokens(prev => [...prev, { id: idx, text: token }]);
                    }, idx * 150);
                });
            };

            const presets = [
                'Explain photosynthesis',
                'Hello world',
                'Machine learning',
                'Neural networks'
            ];

            const colors = [
                '#d0c4ff', '#c8b8ff', '#b8a8ff', '#a898ff',
                '#98f5ff', '#88e8ff', '#78d8ff', '#68c8ff'
            ];

            return (
                <div className="content-wrapper">
                    <div><h2 className="stage-header">Tokens &amp; Processing</h2></div>
                    <h2 className="stage-title">Tokens</h2>
                    <div className="analogy-text">
                        "Lego bricks — smaller pieces AI can mix and match"
                    </div>

                    <div className="scene-card">
                        <div style={{ width: '100%' }}>
                            <TokenBreakdown />
                        </div>
                        <div style={{ width: '100%' }}>
                            <input
                                type="text"
                                className="interactive-input"
                                value={userText}
                                onChange={(e) => {
                                    setUserText(e.target.value);
                                    generateTokens(e.target.value);
                                }}
                                placeholder="Type text to tokenize..."
                            />

                            <div className="preset-buttons">
                                {presets.map(preset => (
                                    <button
                                        key={preset}
                                        className="preset-btn"
                                        onClick={() => {
                                            setUserText(preset);
                                            generateTokens(preset);
                                        }}
                                    >
                                        {preset}
                                    </button>
                                ))}
                            </div>

                            <div className="token-chips">
                                {tokens.map((token, idx) => (
                                    <div
                                        key={token.id}
                                        className="token-chip"
                                        style={{
                                            background: colors[idx % colors.length],
                                            animationDelay: `${idx * 0.1}s`
                                        }}
                                    >
                                        {token.text === ' photo' ? '∅photo' : token.text === ' synth' ? '∅synth' : token.text === ' esis' ? '∅esis' : token.text === ' world' ? '∅world' : token.text === ' learning' ? '∅learning' : token.text === ' networks' ? '∅networks' : token.text === ' intelligence' ? '∅intelligence' : token.text === ' science' ? '∅science' : token.text}
                                    </div>
                                ))}
                            </div>

                            <div className="token-count">
                                Total tokens: <strong>{tokens.length}</strong>
                            </div>
                        </div>
                    </div>

                    <div className="insight-box">
                        <div className="insight-label"><span style={{display: 'inline-flex', verticalAlign: 'middle', marginRight: '6px'}} dangerouslySetInnerHTML={{__html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a9456" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> Insight</div>
                        <div><strong>Context window, API cost, and speed</strong> are all measured in tokens — the fundamental unit of GenAI. Tokens are not words; they're the sub-word pieces AI processes.</div>
                    </div>
                </div>
            );
        };

        // Attention Stage Component
        const S4 = ({ stage }) => {
            const [selectedQuestion, setSelectedQuestion] = useState(0);

            const questions = [
                {
                    text: 'The Eiffel Tower, built in 1889, is in which city?',
                    words: ['The', 'Eiffel', 'Tower', ',', 'built', 'in', '1889', ',', 'is', 'in', 'which', 'city', '?'],
                    attention: [0.05, 0.3, 0.35, 0.02, 0.04, 0.02, 0.05, 0.02, 0.08, 0.02, 0.03, 0.95, 0.01]
                },
                {
                    text: 'What color is the sky on a clear day?',
                    words: ['What', 'color', 'is', 'the', 'sky', 'on', 'a', 'clear', 'day', '?'],
                    attention: [0.08, 0.15, 0.05, 0.02, 0.6, 0.03, 0.02, 0.02, 0.01, 0.02]
                },
                {
                    text: 'How many legs does a cat have?',
                    words: ['How', 'many', 'legs', 'does', 'a', 'cat', 'have', '?'],
                    attention: [0.05, 0.08, 0.2, 0.05, 0.02, 0.55, 0.04, 0.01]
                }
            ];

            const current = questions[selectedQuestion];
            const maxAttention = Math.max(...current.attention);

            return (
                <div className="content-wrapper">
                    <div><h2 className="stage-header">The Transformer Architecture</h2></div>
                    <h2 className="stage-title">Attention (Transformers)</h2>
                    <div className="analogy-text">
                        "Highlighting key words in a sentence — deciding what matters most"
                    </div>

                    <div className="scene-card">
                        <div style={{ width: '100%' }}>
                            <div className="preset-buttons">
                                {questions.map((q, idx) => (
                                    <button
                                        key={idx}
                                        className="preset-btn"
                                        onClick={() => setSelectedQuestion(idx)}
                                        style={selectedQuestion === idx ? { background: P.primary, color: 'white', borderColor: P.primary } : {}}
                                    >
                                        Question {idx + 1}
                                    </button>
                                ))}
                            </div>

                            <div style={{ fontSize: '14px', fontWeight: '500', margin: '16px 0', color: P.text }}>
                                {current.text}
                            </div>

                            <div className="attention-weights">
                                {current.words.map((word, idx) => {
                                    const normalizedAttention = current.attention[idx] / maxAttention;
                                    const height = 20 + normalizedAttention * 100;

                                    return (
                                        <div key={idx} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                            <div className="attention-bar" style={{ height: `${height}px` }}></div>
                                            <div className="attention-label">{word}</div>
                                        </div>
                                    );
                                })}
                            </div>

                            <p style={{ fontSize: '12px', color: P.textMuted, textAlign: 'center', marginTop: '12px' }}>
                                Taller bars = higher attention. Watch how AI focuses on key words.
                            </p>
                        </div>
                    </div>

                    <div className="insight-box">
                        <div className="insight-label"><span style={{display: 'inline-flex', verticalAlign: 'middle', marginRight: '6px'}} dangerouslySetInnerHTML={{__html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a9456" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> Insight</div>
                        <div>This is the <strong>'T' in GPT — the Transformer breakthrough</strong> that lets AI see ALL words at once instead of one by one. It decides which words matter most by computing attention weights.</div>
                    </div>
                </div>
            );
        };

        // Prediction Stage Component
        const S5 = ({ stage }) => {
            const [temperature, setTemperature] = useState(0.5);

            const predictions = [
                { word: 'Python', baseProb: 42 },
                { word: 'JavaScript', baseProb: 18 },
                { word: 'Scratch', baseProb: 12 },
                { word: 'Rust', baseProb: 8 },
                { word: 'C++', baseProb: 7 },
                { word: 'Java', baseProb: 13 }
            ];

            const adjustedProbabilities = predictions.map(p => {
                if (temperature === 0) {
                    return { ...p, prob: p.word === 'Python' ? 100 : 0 };
                }
                const tempFactor = 1 + (temperature * 2);
                const adjusted = Math.pow(p.baseProb / 100, 1 / (temperature + 0.1)) * 100;
                return { ...p, prob: Math.max(0, Math.min(100, adjusted)) };
            });

            const sorted = [...adjustedProbabilities].sort((a, b) => b.prob - a.prob);
            const total = sorted.reduce((sum, p) => sum + p.prob, 0);
            const normalized = sorted.map(p => ({ ...p, prob: (p.prob / total) * 100 }));

            return (
                <div className="content-wrapper">
                    <div><h2 className="stage-header">Temperature &amp; Creativity</h2></div>
                    <h2 className="stage-title">Prediction (Next Token)</h2>
                    <div className="analogy-text">
                        "Super-autocomplete — predicting the most likely next word"
                    </div>

                    <div className="scene-card">
                        <div style={{ width: '100%' }}>
                            <div style={{ fontSize: '16px', fontWeight: '600', marginBottom: '20px', color: P.text }}>
                                "Best language for beginners is"
                            </div>

                            <div className="probability-bars">
                                {normalized.map((item, idx) => (
                                    <div key={item.word} className="probability-bar">
                                        <div className="prob-label">{item.word}</div>
                                        <div className="prob-bar-bg">
                                            <div
                                                className="prob-bar-fill"
                                                style={{
                                                    width: `${item.prob}%`,
                                                    transition: 'width 0.4s ease'
                                                }}
                                            >
                                                {item.prob > 8 && `${Math.round(item.prob)}%`}
                                            </div>
                                        </div>
                                        <div className="prob-percent">{Math.round(item.prob)}%</div>
                                    </div>
                                ))}
                            </div>

                            <div className="slider-container">
                                <div className="slider-label">
                                    <span>Temperature: {temperature.toFixed(2)}</span>
                                    <span style={{ fontSize: '11px', color: P.textMuted }}>Deterministic (0.0) ← → Creative (1.0)</span>
                                </div>
                                <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.05"
                                    value={temperature}
                                    onChange={(e) => setTemperature(parseFloat(e.target.value))}
                                    className="slider"
                                />
                            </div>

                            <p style={{ fontSize: '12px', color: P.textMuted, textAlign: 'center', marginTop: '12px' }}>
                                {temperature === 0 ? 'Deterministic: Always picks Python' : temperature < 0.5 ? 'Focused: Prefers likely answers' : temperature === 0.5 ? 'Balanced: Mix of likely and creative' : 'Creative: More randomness'}
                            </p>
                        </div>
                    </div>

                    <div className="insight-box">
                        <div className="insight-label"><span style={{display: 'inline-flex', verticalAlign: 'middle', marginRight: '6px'}} dangerouslySetInnerHTML={{__html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a9456" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> Insight</div>
                        <div>This is <strong>the whole trick — GenAI asks "what word probably comes next?" thousands of times</strong> to generate complete responses. Temperature controls the creativity of these predictions.</div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [currentStage, setCurrentStage] = useState(1);

            const handlePrevious = () => {
                if (currentStage > 1) setCurrentStage(currentStage - 1);
            };

            const handleNext = () => {
                if (currentStage < 5) setCurrentStage(currentStage + 1);
            };

            const renderStage = () => {
                switch (currentStage) {
                    case 1: return <S1 stage={currentStage} />;
                    case 2: return <S2 stage={currentStage} />;
                    case 3: return <S3 stage={currentStage} />;
                    case 4: return <S4 stage={currentStage} />;
                    case 5: return <S5 stage={currentStage} />;
                    default: return <S1 stage={currentStage} />;
                }
            };

            return null;
        };

        const MainContent = ({ currentStage, setCurrentStage }) => {
            const renderStage = () => {
                switch (currentStage) {
                    case 1: return <S1 stage={currentStage} />;
                    case 2: return <S2 stage={currentStage} />;
                    case 3: return <S3 stage={currentStage} />;
                    case 4: return <S4 stage={currentStage} />;
                    case 5: return <S5 stage={currentStage} />;
                    default: return <S1 stage={currentStage} />;
                }
            };

            return (
                <main id="main" className="content-area">
                    {renderStage()}
                    {currentStage === STAGES.length && (
                        <div className="up-next-card" role="complementary" aria-label="Up next">
                            <span className="up-next-label">UP NEXT</span>
                            <a href={NEXT_GUIDE.href} className="up-next-link">
                                <div className="up-next-meta">
                                    <span className="up-next-id">{NEXT_GUIDE.id}</span>
                                    <span className="up-next-module">{NEXT_GUIDE.module}</span>
                                </div>
                                <div className="up-next-title">{NEXT_GUIDE.title}</div>
                                <span className="up-next-arrow" aria-hidden="true">→</span>
                            </a>
                        </div>
                    )}
                </main>
            );
        };

        const RootApp = () => {
            const [currentStage, setCurrentStage] = useState(1);

            const handlePrevious = () => {
                if (currentStage > 1) setCurrentStage(currentStage - 1);
            };

            const handleNext = () => {
                if (currentStage < 5) setCurrentStage(currentStage + 1);
            };

            return (
                <React.Fragment>
                    <a href="#main" className="skip-link">Skip to main content</a>
                    <div className="container">
                        <aside className="sidebar" aria-label="Guide sections">
                            {STAGES.map((s, idx) => {
                                const iconHtml = { __html: s.icon };
                                return (
                                    <React.Fragment key={s.id}>
                                        <div className={`step-wrapper ${currentStage === s.id ? 'active' : ''}`}>
                                            <button
                                                type="button"
                                                className={`step-btn ${currentStage === s.id ? 'active' : ''}`}
                                                aria-label={`Step ${idx + 1}: ${s.name}`}
                                                aria-current={currentStage === s.id ? "step" : undefined}
                                                onClick={() => setCurrentStage(s.id)}
                                                dangerouslySetInnerHTML={iconHtml}
                                            />
                                            <div className="step-btn-label">{s.name}</div>
                                        </div>
                                        {idx < STAGES.length - 1 && (
                                            <div className={`step-connector ${currentStage > s.id ? 'active' : ''}`} />
                                        )}
                                    </React.Fragment>
                                );
                            })}
                        </aside>

                        <div className="main-content">
                            <div className="top-bar">
                                <div className="left-section">
                                    <a href="../../index.html" className="back-link">← Back to All Guides</a>
                                    <span style={{ fontSize: '14px', color: '#999' }}>|</span>
                                    <div style={{ display: 'flex', alignItems: 'center' }}>
                                        <span className="guide-number">1.3</span>
                                        <h1 className="title">Inside the Black Box</h1>
                                    </div>
                                    <div>
                                        <div className="badge">DEEP DIVE</div>
                                    </div>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center' }}>
                                    <span className="progress-indicator">Page {currentStage} of 5</span>
                                    <nav className="nav-arrows" aria-label="Section navigation">
                                        <button type="button" className="arrow-btn" aria-label="Previous section" onClick={handlePrevious} disabled={currentStage === 1}>←</button>
                                        <button type="button" className="arrow-btn" aria-label="Next section" onClick={handleNext} disabled={currentStage === 5}>→</button>
                                    </nav>
                                </div>
                            </div>

                            <MainContent currentStage={currentStage} setCurrentStage={setCurrentStage} />
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RootApp />);
    </script>
</body>
</html>
