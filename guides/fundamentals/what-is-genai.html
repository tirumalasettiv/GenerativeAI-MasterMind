<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive guide to Generative AI. Learn what GenAI is, how it differs from traditional software, and what makes it powerful through hands-on examples.">
  <meta name="theme-color" content="#6c5ce7">
  <meta property="og:title" content="What is Generative AI? — Interactive Guide">
  <meta property="og:description" content="Interactive guide to Generative AI. Learn what GenAI is, how it differs from traditional software, and what makes it powerful through hands-on examples.">
  <meta property="og:type" content="article">
  <meta property="og:image" content="../../assets/og-default.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="What is Generative AI? — Interactive Guide">
  <meta name="twitter:description" content="Interactive guide to Generative AI. Learn what GenAI is, how it differs from traditional software, and what makes it powerful through hands-on examples.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>What is Generative AI? - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/guide-shared.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Stage 1 specific styles */
    .demo-outputs {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .output-type {
      text-align: center;
      min-width: 100px;
    }

    .output-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f5f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px auto;
    }

    .output-text {
      font-size: 16px;
      font-weight: 600;
      color: #666;
    }

    /* Stage 2 specific styles */
    .analogy-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .analogy-card {
      position: relative;
      flex: 1;
      min-width: 180px;
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .analogy-card:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(108, 92, 231, 0.1);
    }

    .analogy-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .analogy-title {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .analogy-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .analogy-description {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .analogy-card.expanded .analogy-description {
      max-height: 200px;
      margin-top: 12px;
    }

    /* Disclosure badge - shared across all click-to-expand cards */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

    /* Stage 3 specific styles */
    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
    }

    .example-item {
      padding: 16px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .example-item:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .example-item.active {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .example-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .example-label {
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .example-content {
      font-size: 13px;
      color: #999;
      min-height: 40px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .example-item.active .example-content {
      color: #6c5ce7;
      font-weight: 500;
    }

    /* Stage 4 specific styles */
    .prediction-chain {
      max-width: 600px;
    }

    .prompt-input {
      padding: 12px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }

    .prediction-step {
      margin-bottom: 20px;
    }

    .step-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .probability-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .prob-btn {
      padding: 8px 12px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .prob-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
    }

    .prob-btn.selected {
      background: #6c5ce7;
      color: white;
      border-color: #6c5ce7;
    }

    /* Stage 5 specific styles */
    .can-cannot {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .capability-column {
      padding: 20px;
      background: white;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }

    .capability-column.can {
      border-color: #2ecc71;
      background: #f0f8f0;
    }

    .capability-column.cannot {
      border-color: #e74c3c;
      background: #fef5f5;
    }

    .capability-header {
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    .capability-list {
      list-style: none;
    }

    .capability-item {
      padding: 8px 0;
      font-size: 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .capability-mark {
      font-weight: 700;
      flex-shrink: 0;
      font-size: 16px;
    }

    /* Stage 6 specific styles */
    .timeline {
      position: relative;
      padding-left: 30px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #6c5ce7 0%, #2ecc71 100%);
    }

    .timeline-item {
      margin-bottom: 24px;
      padding-bottom: 20px;
      position: relative;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -37px;
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #6c5ce7;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #6c5ce7;
    }

    .timeline-year {
      font-weight: 700;
      color: #6c5ce7;
      margin-bottom: 4px;
      font-size: 16px;
    }

    .timeline-event {
      color: #2a2a2a;
      font-size: 16px;
      line-height: 1.6;
    }

    /* --- Visual diagrams (added enhancement) --- */

    @keyframes dashMarch {
      from { stroke-dashoffset: 20; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes barFill {
      from { width: 0; }
    }

    @keyframes drawCurve {
      from { stroke-dashoffset: 800; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(108, 92, 231, 0)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 10px rgba(108, 92, 231, 0.35)); }
    }

    .flow-diagram {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .flow-diagram svg {
      width: 100%;
      max-width: 720px;
      height: auto;
    }

    .flow-node-label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #1a1a1a;
    }

    .flow-node-active rect {
      transform-box: fill-box;
      transform-origin: center;
      animation: nodePulse 1.6s ease-in-out infinite;
    }

    .flow-arrow {
      stroke: #b0a6e8;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 4 4;
      animation: dashMarch 1.2s linear infinite;
    }

    .flow-arrow.inactive {
      stroke: #e0e0e0;
      animation: none;
    }

    /* Override analogy-icon so SVG illustration renders at the right size */
    .analogy-icon {
      font-size: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .analogy-icon svg {
      width: 72px;
      height: 72px;
    }

    /* S2 mechanics collapsible */
    .mechanics-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: white;
      border: 1px solid #d5cff5;
      color: #6c5ce7;
      border-radius: 999px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }

    .mechanics-toggle:hover {
      background: #f5f3ff;
      border-color: #6c5ce7;
      transform: translateY(-1px);
    }

    .mechanics-toggle .chevron {
      transition: transform 0.3s ease;
    }

    .mechanics-toggle.open .chevron {
      transform: rotate(180deg);
    }

    .mechanics-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      flex-shrink: 0;
    }

    .mechanics-panel.open {
      max-height: 420px;
    }

    .mechanics-card {
      margin-top: 16px;
      background: linear-gradient(135deg, #fbfbff 0%, #f5f3ff 100%);
      border: 1px solid #e8e3f8;
      border-radius: 14px;
      padding: 28px 24px;
    }

    .mechanics-card svg {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .mechanics-caption {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 10px;
      line-height: 1.5;
    }

    /* S4 probability bar chart */
    .prob-bars-chart {
      width: 560px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .prob-bar-row {
      display: grid;
      grid-template-columns: 140px 1fr 56px;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      background: white;
      border: 1px solid #e8e3f8;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .prob-bar-row:hover {
      border-color: #6c5ce7;
      transform: translateX(2px);
      box-shadow: 0 4px 14px rgba(108, 92, 231, 0.12);
    }

    .prob-bar-row.winner {
      border-color: #a29bfe;
      box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.15);
    }

    .prob-bar-row.dim {
      opacity: 0.3;
      transform: none;
    }

    .prob-bar-row.locked {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .prob-bar-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      text-align: right;
    }

    .prob-bar-track {
      position: relative;
      height: 22px;
      background: #f0edfa;
      border-radius: 8px;
      overflow: hidden;
    }

    .prob-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: linear-gradient(90deg, #6c5ce7 0%, #a29bfe 100%);
      border-radius: 8px;
      animation: barFill 0.9s cubic-bezier(0.22, 0.68, 0, 1.2);
    }

    .prob-bar-row.winner .prob-bar-fill {
      background: linear-gradient(90deg, #6c5ce7 0%, #7d6ff0 60%, #a29bfe 100%);
      box-shadow: 0 0 12px rgba(108, 92, 231, 0.5);
    }

    .prob-bar-pct {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #6c5ce7;
      text-align: right;
    }

    /* S5 quadrant matrix */
    .quadrant-chart {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .quadrant-chart svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .quadrant-legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 14px;
      font-size: 12px;
      color: #666;
      flex-wrap: wrap;
    }

    .quadrant-legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* S6 growth curve */
    .growth-curve {
      width: 100%;
      max-width: 680px;
      margin: 0 auto 20px auto;
      padding: 18px 10px 6px;
      background: white;
      border: 1px solid #e8e3f8;
      border-radius: 14px;
    }

    .growth-curve svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .growth-curve path.curve-line {
      fill: none;
      stroke: #6c5ce7;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 800;
      animation: drawCurve 1.4s ease-out forwards;
    }

    .growth-dot {
      transition: r 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }

    .growth-dot.active {
      r: 8;
      filter: drop-shadow(0 0 6px rgba(108, 92, 231, 0.55));
    }

    .timeline-item.highlight .timeline-year {
      color: #2ecc71;
    }

    /* --- end visual diagrams --- */
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const P = {
      violet: '#6c5ce7',
      green: '#2ecc71',
      darkGreen: '#1a9456',
    };

    const OUTPUT_TYPES = [
      { icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>', label: 'Text' },
      { icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>', label: 'Images' },
      { icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="14" y1="4" x2="10" y2="20"/></svg>', label: 'Code' },
      { icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>', label: 'Audio' },
      { icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6c5ce7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>', label: 'Video' },
    ];

    const FLOW_NODES = [
      'Training Data',
      'Neural Network',
      'Patterns',
      'Token Prediction',
      'Output',
    ];

    function FlowDiagram({ activeNode }) {
      const W = 720, H = 90, NODE_W = 120, NODE_H = 60;
      const xs = FLOW_NODES.map((_, i) => i * 150);
      return (
        <svg viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg" aria-label="GenAI pipeline flow">
          <defs>
            <marker id="flow-arrow-head" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0a6e8" />
            </marker>
            <marker id="flow-arrow-head-dim" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0e0e0" />
            </marker>
          </defs>
          {xs.slice(0, -1).map((x, i) => (
            <path
              key={`arrow-${i}`}
              className={`flow-arrow${i === activeNode ? '' : ' inactive'}`}
              d={`M ${x + NODE_W + 4} 45 L ${xs[i + 1] - 4} 45`}
              markerEnd={i === activeNode ? 'url(#flow-arrow-head)' : 'url(#flow-arrow-head-dim)'}
            />
          ))}
          {FLOW_NODES.map((label, i) => {
            const isActive = i === activeNode;
            const isPast = i < activeNode;
            const stroke = isActive ? '#6c5ce7' : isPast ? '#a29bfe' : '#d8d8e8';
            const fill = isActive || isPast ? '#f5f3ff' : 'white';
            const textColor = isActive ? '#6c5ce7' : '#1a1a1a';
            return (
              <g key={`node-${i}`} className={isActive ? 'flow-node-active' : ''}>
                <rect x={xs[i]} y={15} width={NODE_W} height={NODE_H} rx={12}
                      fill={fill} stroke={stroke} strokeWidth={2} />
                <text x={xs[i] + NODE_W / 2} y={51} textAnchor="middle"
                      className="flow-node-label" fill={textColor}>
                  {label}
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    function S1() {
      const [count, setCount] = useState(0);
      const [activeNode, setActiveNode] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setCount(prev => {
            if (prev >= OUTPUT_TYPES.length) {
              clearInterval(interval);
              return prev;
            }
            return prev + 1;
          });
        }, 400);

        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          setActiveNode(prev => (prev + 1) % FLOW_NODES.length);
        }, 1100);
        return () => clearInterval(interval);
      }, []);

      const outputs = OUTPUT_TYPES.slice(0, count);

      return (
        <>
          <div><h2 className="stage-header">What is Generative AI?</h2></div>
          <div className="explanation">
            Generative AI is software that creates new content — text, images, code, audio, video — by predicting what should come next based on patterns it learned from millions of examples.
          </div>
          <div className="scene-card">
            <div className="flow-diagram">
              <FlowDiagram activeNode={activeNode} />
              <div className="demo-outputs">
              {outputs.map((output, idx) => (
                <div key={idx} className="output-type fade-in">
                  <div className="output-icon" dangerouslySetInnerHTML={{__html: output.icon}} />
                  <div className="output-text">{output.label}</div>
                </div>
              ))}
              </div>
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Think of it as autocomplete on steroids — your phone suggests the next word, GenAI predicts entire paragraphs, images, or code.
          </div>
        </>
      );
    }

    function AnalogyIcon({ id }) {
      const common = {
        viewBox: '0 0 72 72',
        fill: 'none',
        stroke: '#6c5ce7',
        strokeWidth: 1.5,
        strokeLinecap: 'round',
        strokeLinejoin: 'round',
        xmlns: 'http://www.w3.org/2000/svg',
      };
      if (id === 1) {
        return (
          <svg {...common} aria-label="Phone with autocomplete suggestions">
            <rect x="24" y="30" width="24" height="36" rx="3" fill="white" />
            <line x1="32" y1="60" x2="40" y2="60" />
            <rect x="6" y="4" width="20" height="8" rx="4" fill="#f5f3ff" />

    function S4() {
      const [step, setStep] = useState(0);
      const [selections, setSelections] = useState([]);
      const [lockedIdx, setLockedIdx] = useState(null);

      const steps = [
        {
          prompt: 'The best programming language for',
          options: [
            { text: 'beginners', prob: '38%' },
            { text: 'data science', prob: '22%' },
            { text: 'web development', prob: '18%' },
            { text: 'AI/ML', prob: '15%' },
          ],
        },
        {
          prompt: 'is',
          options: [
            { text: 'Python', prob: '45%' },
            { text: 'JavaScript', prob: '20%' },
            { text: 'Java', prob: '18%' },
            { text: 'Go', prob: '12%' },
          ],
        },
        {
          prompt: 'because it has',
          options: [
            { text: 'a gentle learning curve', prob: '42%' },
            { text: 'rich libraries', prob: '28%' },
            { text: 'great community support', prob: '20%' },
            { text: 'fast execution', prob: '8%' },
          ],
        },
      ];

      const handleSelect = (option) => {
        setSelections([...selections.slice(0, step), option]);
        if (step < steps.length - 1) {
          setStep(step + 1);
        } else {
          setTimeout(() => {
            setStep(0);
            setSelections([]);
          }, 2000);
        }
      };

      const handleBarClick = (option, idx) => {
        if (lockedIdx !== null) return;
        setLockedIdx(idx);
        setTimeout(() => {
          handleSelect(option);
          setLockedIdx(null);
        }, 380);
      };

      const currentStep = steps[step];
      const fullText = `${currentStep.prompt} ${selections.map(s => s.text).join(' ')}`;
      const maxProb = Math.max(...currentStep.options.map(o => parseFloat(o.prob)));

      return (
        <>
          <div><h2 className="stage-header">Next-Token Prediction</h2></div>
          <div className="explanation">
            At its core, GenAI does one thing: predicts the most likely next piece of content, over and over.
          </div>
          <div className="scene-card">
            <div className="prediction-chain">
              <div className="prompt-input">
                <span>{fullText}</span>
                {selections.length <= step && <span className="typing" />}
              </div>

              {step < steps.length && (
                <div className="prediction-step">
                  <div className="step-label">Next prediction options:</div>
                  <div className="prob-bars-chart">
                    {currentStep.options.map((option, idx) => {
                      const pct = parseFloat(option.prob);
                      const isWinner = pct === maxProb;
                      const isLocked = lockedIdx === idx;
                      const isDim = lockedIdx !== null && lockedIdx !== idx;
                      const cls = ['prob-bar-row'];
                      if (isWinner && lockedIdx === null) cls.push('winner');
                      if (isLocked) cls.push('locked');
                      if (isDim) cls.push('dim');
                      return (
                        <div
                          key={`${step}-${idx}`}
                          className={cls.join(' ')}
                          onClick={() => handleBarClick(option, idx)}
                          role="button"
                          tabIndex={0}
                        >
                          <div className="prob-bar-label">{option.text}</div>
                          <div className="prob-bar-track">
                            <div className="prob-bar-fill" style={{ width: `${pct}%` }} />
                          </div>
                          <div className="prob-bar-pct">{option.prob}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>

    }

                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            GenAI is pattern-matching, not reasoning — incredibly useful, but always verify important outputs.
          </div>
        </>
      );
    }

    function GrowthCurve({ activeIdx, onHover }) {
      const points = [
        { x: 60,  y: 180 },
        { x: 200, y: 160 },
        { x: 340, y: 120 },
        { x: 460, y: 70 },
        { x: 600, y: 30 },
      ];
      const yearLabels = ['2017', '2020', '2022', '2023', '2024–25'];
      const path = 'M 60 180 C 200 180, 270 165, 340 120 C 400 90, 510 45, 600 30';
      return (
        <svg viewBox="0 0 660 220" xmlns="http://www.w3.org/2000/svg" aria-label="Capability growth 2017 to 2025">
          <line x1="40" y1="200" x2="640" y2="200" stroke="#d8d8e8" strokeWidth="1.5" />
          <line x1="40" y1="200" x2="40" y2="20" stroke="#d8d8e8" strokeWidth="1.5" />
          <path d="M 640 200 L 634 196 M 640 200 L 634 204"
                stroke="#d8d8e8" strokeWidth="1.5" fill="none" />
          <path d="M 40 20 L 36 26 M 40 20 L 44 26"
                stroke="#d8d8e8" strokeWidth="1.5" fill="none" />

          <text x="640" y="216" textAnchor="end" fontSize="11" fill="#999" fontFamily="DM Sans">Year →</text>
          <text x="50"  y="22"  fontSize="11" fill="#999" fontFamily="DM Sans">↑ Capability</text>

          <path className="curve-line" d={path} />

          {points.map((p, i) => (
            <text key={`yr-${i}`} x={p.x} y="216" textAnchor="middle"
                  fontSize="11" fontWeight="600"
                  fill={activeIdx === i ? '#6c5ce7' : '#666'}
                  fontFamily="DM Sans">
              {yearLabels[i]}
            </text>
          ))}

          {points.map((p, i) => (
            <circle
              key={`dot-${i}`}
              cx={p.x}
              cy={p.y}
              r={activeIdx === i ? 8 : 5}
              fill="#6c5ce7"
              stroke="white"
              strokeWidth="2"
              className={`growth-dot${activeIdx === i ? ' active' : ''}`}
              onMouseEnter={() => onHover(i)}
              onMouseLeave={() => onHover(null)}
            />
          ))}
        </svg>
      );
    }

    function S6() {
      const [animating, setAnimating] = useState(false);
      const [hoverIdx, setHoverIdx] = useState(null);

      useEffect(() => {
        setAnimating(true);
      }, []);

      const milestones = [
        {
          year: '2017',
          event: '\u201cAttention Is All You Need\u201d paper published, introducing Transformers',
        },
        {
          year: '2020',
          event: 'GPT-3 launches with 175 billion parameters',
        },
        {
          year: '2022',
          event: 'ChatGPT reaches 100M users in 2 months (fastest adoption ever)',
        },
        {
          year: '2023',
          event: 'GPT-4, Claude, Midjourney V5 released',
        },
        {
          year: '2024\u20132025',
          event: 'AI Agents, Multi-modal AI, Enterprise adoption accelerates',
        },
      ];

      return (
        <>
          <div><h2 className="stage-header">The GenAI Timeline</h2></div>
          <div className="explanation">
            GenAI went mainstream in late 2022 with ChatGPT — here's why it's transforming everything.
          </div>
          <div className="growth-curve">
            <GrowthCurve activeIdx={hoverIdx} onHover={setHoverIdx} />
          </div>
          <div className="scene-card">
            <div className="timeline">
              {milestones.map((milestone, idx) => (
                <div
                  key={idx}
                  className={`timeline-item${hoverIdx === idx ? ' highlight' : ''}`}
                  style={{ animationDelay: `${idx * 0.15}s` }}
                  onMouseEnter={() => setHoverIdx(idx)}
                  onMouseLeave={() => setHoverIdx(null)}
                >
                  <div className="timeline-year">{milestone.year}</div>
                  <div className="timeline-event">{milestone.event}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            We're still in the early days — like the internet in 1995. The best applications haven't been built yet.
          </div>
        </>
      );
    }

    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stageIcons = [
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M4 7l8-4 8 4"/><path d="M4 7v3a4 4 0 008 0V7"/><path d="M12 7v3a4 4 0 008 0V7"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>',
      ];

      const NEXT_GUIDE = { id: "1.2", title: "Regular vs. GenAI", module: "Module 1", href: "./regular-vs-genai.html" };
      const stages = [
        { icon: stageIcons[0], label: 'Definition', component: S1 },
        { icon: stageIcons[1], label: 'Analogies', component: S2 },
        { icon: stageIcons[2], label: 'Examples', component: S3 },
        { icon: stageIcons[3], label: 'Prediction', component: S4 },
        { icon: stageIcons[4], label: "Can vs Can't", component: S5 },
        { icon: stageIcons[5], label: 'Timeline', component: S6 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) {
          setCurrentStage(currentStage + 1);
        }
      };

      const handlePrev = () => {
        if (currentStage > 0) {
          setCurrentStage(currentStage - 1);
        }
      };

      const handleStageClick = (idx) => {
        setCurrentStage(idx);
      };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar" aria-label="Guide sections">
              {stages.map((stage, idx) => (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    <button
                      type="button"
                      className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                      aria-label={`Step ${idx + 1}: ${stage.label}`}
                      aria-current={currentStage === idx ? "step" : undefined}
                      onClick={() => handleStageClick(idx)}
                      dangerouslySetInnerHTML={{__html: stage.icon}}
                    />
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < stages.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              ))}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">← Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">1.1</span>
                    <h1 className="title">What is Generative AI?</h1>
                  </div>
                  <div style={{ marginLeft: '16px' }}>
                    <div className="badge">INTERACTIVE</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of 6</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentStage === 0}
                      aria-label="Previous section"
                      title="Previous stage"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={currentStage === stages.length - 1}
                      aria-label="Next section"
                      title="Next stage"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide">
                <CurrentComponent />
                {currentStage === stages.length - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">→</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
