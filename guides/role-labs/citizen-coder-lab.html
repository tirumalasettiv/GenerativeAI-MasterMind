<!DOCTYPE html>

<head>

  <style>
    /* Disclosure cards (S1) */
    .use-case-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .use-case-card {
      position: relative;
      padding: 18px 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .use-case-card:hover {
      border-color: #6c5ce7;
      transform: translateX(3px);
    }

    .use-case-card.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .use-case-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .use-case-emoji {
      font-size: 26px;
      flex-shrink: 0;
    }

    .use-case-title {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      flex: 1;
    }

    .use-case-savings {
      font-size: 13px;
      font-weight: 700;
      color: #2ecc71;
      background: #e8f8f0;
      border: 1px solid #b0e8cc;
      border-radius: 20px;
      padding: 3px 10px;
      white-space: nowrap;
    }

    .use-case-detail {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.65;
    }

    .use-case-card.expanded .use-case-detail {
      max-height: 300px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #ddd;
    }

    .use-case-row {
      margin-bottom: 6px;
    }

    .use-case-label {
      font-weight: 700;
      color: #6c5ce7;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    /* Disclosure badge */
    .disclosure-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }

    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }

    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }

    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }

    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }

    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }

    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }

    /* Prompt builder (S2, S3) */
    .prompt-builder {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .builder-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .builder-textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: #1a1a1a;
      resize: vertical;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }

    .builder-textarea:focus {
      border-color: #6c5ce7;
      outline: none;
    }

    .costar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .costar-field {
      background: #f9f8ff;
      border: 1px solid #e8e3f8;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .costar-key {
      font-size: 11px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .costar-value {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }

    .builder-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 10px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .builder-btn-primary {
      background: #6c5ce7;
      color: white;
    }

    .builder-btn-primary:hover {
      background: #5b4bc8;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(108, 92, 231, 0.3);
    }

    .builder-btn-secondary {
      background: white;
      color: #6c5ce7;
      border: 2px solid #d5cff5 !important;
    }

    .builder-btn-secondary:hover {
      background: #f5f3ff;
      border-color: #6c5ce7 !important;
      transform: translateY(-1px);
    }

    .prompt-preview {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 18px 20px;
      overflow-x: auto;
    }

    .prompt-preview pre {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #e0d9ff;
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 0;
    }

    .example-panel {
      background: #f0f8f0;
      border: 2px solid #2ecc71;
      border-radius: 12px;
      padding: 18px 20px;
    }

    .example-panel-title {
      font-weight: 700;
      font-size: 14px;
      color: #1a9456;
      margin-bottom: 12px;
    }

    /* Entity list styles */
    .entity-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entity-item {
      background: white;
      border: 1px solid #b0e8cc;
      border-radius: 10px;
      padding: 12px 16px;
    }

    .entity-name {
      font-weight: 700;
      font-size: 14px;
      color: #1a9456;
      margin-bottom: 4px;
    }

    .entity-field-tag {
      display: inline-block;
      background: #e8f8f0;
      border: 1px solid #b0e8cc;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      color: #1a7a48;
      margin: 2px 3px 2px 0;
    }

    /* Screen spec styles (S3) */
    .screen-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .screen-item {
      background: white;
      border: 1px solid #b0e8cc;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .screen-name {
      font-weight: 700;
      font-size: 14px;
      color: #1a9456;
      margin-bottom: 6px;
    }

    .screen-action-tag {
      display: inline-block;
      background: #e8f8f0;
      border: 1px solid #b0e8cc;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      color: #1a7a48;
      margin: 2px 3px 2px 0;
    }

    /* Tabs (S4) */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 22px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      background: white;
      color: #555;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn[aria-selected="true"] {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
    }

    .tab-btn:hover:not([aria-selected="true"]) {
      border-color: #6c5ce7;
      color: #6c5ce7;
    }

    .prompt-template-card {
      background: linear-gradient(135deg, #f9f8ff 0%, #f0edfa 100%);
      border: 1px solid #e8e3f8;
      border-radius: 12px;
      padding: 18px 20px;
    }

    .prompt-template-title {
      font-size: 11px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .prompt-template-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12.5px;
      color: #333;
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 0;
    }

    /* Your Turn (S5) */
    .output-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .output-checkbox-label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .output-checkbox-label:hover {
      border-color: #6c5ce7;
      background: #f9f8ff;
    }

    .output-checkbox-label.selected {
      border-color: #6c5ce7;
      background: #f5f3ff;
    }

    .output-checkbox-label input[type="checkbox"] {
      accent-color: #6c5ce7;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .output-emoji {
      font-size: 20px;
      flex-shrink: 0;
    }

    .auto-summary-card {
      background: linear-gradient(135deg, #f0f8ff 0%, #e8e3f8 100%);
      border: 2px solid #6c5ce7;
      border-radius: 12px;
      padding: 18px 20px;
    }

    .auto-summary-title {
      font-size: 11px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .auto-summary-body {
      font-size: 14px;
      line-height: 1.7;
      color: #333;
    }

    .auto-summary-highlight {
      font-weight: 700;
      color: #6c5ce7;
    }

    .spec-section {
      margin-bottom: 12px;
      padding: 12px 14px;
      background: white;
      border-left: 3px solid #6c5ce7;
      border-radius: 0 8px 8px 0;
    }

    .spec-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .spec-section-text {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }

    .max-two-notice {
      font-size: 12px;
      color: #888;
      font-style: italic;
      margin-top: 6px;
    }
  </style>
    <script src="../../assets/analytics.js" defer></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" strokeWidth="2">
              <path d="M9 18h6" />
              <path d="M10 22h4" />
              <path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z" />
            </svg>
            {' '}INSIGHT
          </div>
          {children}
        </div>
      );
    }

    function ChevronSvg() {
      return (
        <svg viewBox="0 0 24 24" fill="none" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      );
    }

    /* ---- Stage 1: Use Cases ---- */
    const USE_CASES = [
      {
        id: 'data-model',
        emoji: '\uD83D\uDDC4\uFE0F',
        title: 'Data Model Design',
        savings: '75% faster',
        task: 'Describe your app idea in plain English and get back a complete entity-relationship model: tables, fields, data types, and relationships.',
        aiValue: 'AI converts a paragraph description into a structured schema in seconds — what used to take a database architect an hour now takes two minutes of clear description.',
      },
      {
        id: 'ui-wireframe',
        emoji: '\uD83D\uDCF1',
        title: 'UI Wireframe Specs',
        savings: '70% faster',
        task: "List your app's key features and get screen-by-screen UI specifications describing components, user actions, and navigation flows.",
        aiValue: 'AI generates screen specs that no-code tools (Bubble, Webflow, Glide) or developers can implement directly — turning your feature list into a full UI blueprint.',
      },
      {
        id: 'workflow-logic',
        emoji: '\u2699\uFE0F',
        title: 'Workflow Logic',
        savings: '80% faster',
        task: 'Describe a business process in plain English and get structured pseudo-code — the step-by-step logic that any developer or automation tool can implement.',
        aiValue: "AI translates 'when a lead fills out the form, check if they're already in our CRM...' into clean conditional logic with error handling — without you writing a single line of code.",
      },
      {
        id: 'formula-writing',
        emoji: '\uD83D\uDCCA',
        title: 'Formula Writing',
        savings: '90% faster',
        task: 'Describe the calculation you need in plain English and get the exact Excel, Google Sheets, or Airtable formula — with an explanation of how it works.',
        aiValue: 'Stop Googling "Excel formula for..." — describe what you want to calculate and AI returns the formula, explains each part, and flags edge cases to watch for.',
      },
      {
        id: 'api-planning',
        emoji: '\uD83D\uDD17',
        title: 'API Integration Planning',
        savings: '65% faster',
        task: 'Describe two systems you want to connect and get a structured integration plan: endpoints to call, data mapping, authentication approach, and error handling.',
        aiValue: 'AI reads API documentation on your behalf — describe what you want to pull from Salesforce into your spreadsheet and it maps the exact fields and auth flow to use.',
      },
    ];

    function S1() {
      const [expanded, setExpanded] = useState(null);

      return (
        <>
          <div><h2 className="stage-header">AI as Your Co-Builder</h2></div>
          <div className="explanation">
            You don&rsquo;t need to be a developer to build software &mdash; you need to describe clearly. AI converts your plain-English descriptions into technical specifications that no-code tools and developers can implement. Click each use case to see the task, AI value, and time savings.
          </div>
          <div className="scene-card">
            <div className="use-case-grid">
              {USE_CASES.map((uc) => {
                const isOpen = expanded === uc.id;
                const handleToggle = () => setExpanded(isOpen ? null : uc.id);
                return (
                  <div
                    key={uc.id}
                    className={`use-case-card disclosure-card-host${isOpen ? ' expanded' : ''}`}
                    onClick={handleToggle}
                    role="button"
                    tabIndex={0}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleToggle(); } }}
                    aria-expanded={isOpen}
                    aria-controls={`cc-uc-detail-${uc.id}`}
                  >
                    <span className="disclosure-badge" aria-hidden="true"><ChevronSvg /></span>
                    <div className="use-case-header">
                      <span className="use-case-emoji">{uc.emoji}</span>
                      <span className="use-case-title">{uc.title}</span>
                      <span className="use-case-savings">{uc.savings}</span>
                    </div>
                    <div className="use-case-detail" id={`cc-uc-detail-${uc.id}`}>
                      <div className="use-case-row">
                        <div className="use-case-label">The Task</div>
                        <div>{uc.task}</div>
                      </div>
                      <div className="use-case-row" style={{ marginTop: '10px' }}>
                        <div className="use-case-label">AI Value</div>
                        <div>{uc.aiValue}</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <InsightBlock>
            You don&rsquo;t need to code to build &mdash; you need to describe clearly. AI turns clear descriptions into technical specifications that developers (or no-code tools) can implement.
          </InsightBlock>
        </>
      );
    }

    /* ---- Stage 2: Data Model ---- */
    function buildDataModelCostar(appIdea) {
      return {
        context: appIdea
          ? 'You are a senior software architect designing a data model for: ' + appIdea
          : 'You are a senior software architect designing a data model for the application described below.',
        objective: 'Generate a complete entity-relationship data model. List all entities (tables), their key fields with data types, and relationships between them.',
        style: 'Use plain English for field descriptions. Show relationships as "Entity A has many Entity B" or "Entity A belongs to Entity B". Include primary keys and foreign keys.',
        tone: 'Technical but accessible to a non-developer audience. Explain why each entity exists.',
        audience: 'A non-technical app builder who will use this model in a no-code tool like Airtable, Glide, or Bubble.',
        response: 'Return a numbered list of entities. For each entity: name in bold, then a bulleted list of fields with data type in parentheses, then relationships listed below.',
      };
    }

    const EXAMPLE_APP_IDEA = 'A todo app with teams — users can create tasks, assign them to teammates, add labels, and track completion status.';

    const EXAMPLE_ENTITIES = [
      {
        name: 'User',
        fields: ['id (UUID, primary key)', 'email (text, unique)', 'name (text)', 'avatar_url (text, optional)', 'created_at (timestamp)'],
        relations: 'User belongs to many Teams. User has many Tasks (as assignee). User has many Tasks (as creator).',
      },
      {
        name: 'Team',
        fields: ['id (UUID, primary key)', 'name (text)', 'description (text, optional)', 'created_by (foreign key \u2192 User)', 'created_at (timestamp)'],
        relations: 'Team has many Users (through TeamMember). Team has many Tasks.',
      },
      {
        name: 'Task',
        fields: ['id (UUID, primary key)', 'title (text)', 'description (text, optional)', 'status (enum: todo/in-progress/done)', 'due_date (date, optional)', 'team_id (foreign key \u2192 Team)', 'created_by (foreign key \u2192 User)', 'assigned_to (foreign key \u2192 User, optional)', 'created_at (timestamp)'],
        relations: 'Task belongs to a Team. Task is created by a User. Task is assigned to a User (optional). Task has many Labels (through TaskLabel).',
      },
      {
        name: 'Label',
        fields: ['id (UUID, primary key)', 'name (text)', 'color (text, hex code)', 'team_id (foreign key \u2192 Team)'],
        relations: 'Label belongs to a Team. Label has many Tasks (through TaskLabel).',
      },
    ];

    function S2() {
      const [appIdea, setAppIdea] = useState('');
      const [showPreview, setShowPreview] = useState(false);
      const [showExample, setShowExample] = useState(false);

      const costar = buildDataModelCostar(appIdea.trim());

      const promptText = [
        'CONTEXT: ' + costar.context,
        '\nOBJECTIVE: ' + costar.objective,
        '\nSTYLE: ' + costar.style,
        '\nTONE: ' + costar.tone,
        '\nAUDIENCE: ' + costar.audience,
        '\nRESPONSE FORMAT: ' + costar.response,
        appIdea.trim()
          ? '\n\nAPP IDEA:\n' + appIdea.trim()
          : '\n\nAPP IDEA:\n[Describe your app idea above]',
      ].join('');

      return (
        <>
          <div><h2 className="stage-header">From Idea to Entity-Relationship</h2></div>
          <div className="explanation">
            A data model is the skeleton of your app. Describe your app idea below and the COSTAR prompt auto-fills. Hit &ldquo;Generate Preview&rdquo; to see the full prompt, or &ldquo;Show Example&rdquo; to see the todo app model.
          </div>
          <div className="scene-card">
            <div className="prompt-builder">
              <div>
                <div className="builder-section-label">Step 1 &mdash; Your App Idea</div>
                <textarea
                  className="builder-textarea"
                  placeholder="Describe your app in 2–4 sentences. Example: A booking system for a yoga studio — clients can browse class schedules, reserve spots, and instructors can manage their classes and view attendance."
                  value={appIdea}
                  onChange={(e) => { setAppIdea(e.target.value); setShowPreview(false); }}
                  aria-label="App idea input"
                  rows={4}
                />
              </div>

              <div>
                <div className="builder-section-label">Step 2 &mdash; COSTAR Template (auto-fills from your idea)</div>
                <div className="costar-grid">
                  <div className="costar-field">
                    <div className="costar-key">C &mdash; Context</div>
                    <div className="costar-value">{costar.context}</div>
                  </div>
                  <div className="costar-field">
                    <div className="costar-key">O &mdash; Objective</div>
                    <div className="costar-value">{costar.objective}</div>
                  </div>
                  <div className="costar-field">
                    <div className="costar-key">S &mdash; Style</div>
                    <div className="costar-value">{costar.style}</div>
                  </div>
                  <div className="costar-field">
                    <div className="costar-key">T &mdash; Tone</div>
                    <div className="costar-value">{costar.tone}</div>
                  </div>
                  <div className="costar-field">
                    <div className="costar-key">A &mdash; Audience</div>
                    <div className="costar-value">{costar.audience}</div>
                  </div>
                  <div className="costar-field">
                    <div className="costar-key">R &mdash; Response Format</div>
                    <div className="costar-value">{costar.response}</div>
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                <button
                  type="button"
                  className="builder-btn builder-btn-primary"
                  onClick={() => setShowPreview(true)}
                  aria-label="Generate prompt preview"
                >
                  Generate Preview
                </button>

          <div className="container">
            <aside className="sidebar" aria-label="Guide sections">
              {STAGES.map((stage, idx) => (
                <React.Fragment key={idx}>
                  <div className={'step-wrapper' + (currentStage === idx ? ' active' : '')}>
                    <button
                      type="button"
                      className={'step-btn' + (currentStage === idx ? ' active' : '')}
                      aria-label={'Step ' + (idx + 1) + ': ' + stage.label}
                      aria-current={currentStage === idx ? 'step' : undefined}
                      onClick={() => setCurrentStage(idx)}
                      dangerouslySetInnerHTML={{ __html: stage.icon }}
                    />
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < STAGES.length - 1 && (
                    <div className={'step-connector' + (currentStage > idx ? ' active' : '')} />
                  )}
                </React.Fragment>
              ))}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">&larr; Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">6.2</span>
                    <h1 className="title">Citizen Coder Lab</h1>
                  </div>
                  <div style={{ marginLeft: '16px' }}>
                    <div className="badge">USE CASE</div>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of {STAGES.length}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handlePrev}
                      disabled={currentStage === 0}
                      aria-label="Previous section"
                      title="Previous stage"
                    >
                      &#8592;
                    </button>
                    <button
                      type="button"
                      className="arrow-btn"
                      onClick={handleNext}
                      disabled={currentStage === STAGES.length - 1}
                      aria-label="Next section"
                      title="Next stage"
                    >
                      &#8594;
                    </button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area">
                <CurrentComponent />
                {currentStage === STAGES.length - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">&rarr;</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
