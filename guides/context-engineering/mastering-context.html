<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastering Context - Deep Dive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
    }

    #root {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 120px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 80px 12px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .step-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .step-btn:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .step-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    .step-wrapper.active .step-btn-label {
      color: #6c5ce7;
    }

    .step-connector {
      width: 2px;
      height: 16px;
      background: #e0e0e0;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .step-connector.active {
      background: #6c5ce7;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid #e0e0e0;
      background: white;
      flex-shrink: 0;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      color: #6c5ce7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #2ecc71;
    }

    .badge {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .progress-indicator {
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .guide-number {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #b0a6e8;
      margin-right: 8px;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .stage-number {
      font-size: 13px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .nav-arrows {
      display: flex;
      gap: 12px;
    }

    .arrow-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .arrow-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
      transform: translateY(-2px);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 32px 48px;
      gap: 30px;
    }

    .explanation {
      font-size: 22px;
      line-height: 1.7;
      color: #2a2a2a;
    }

    .scene-card {
      background: linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%);
      border-radius: 16px;
      padding: 40px;
      border: 1px solid #e8e3f8;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
    }

    .insight-box {
      background: #f0faf0;
      border-left: 4px solid #2ecc71;
      padding: 24px;
      border-radius: 8px;
      color: #1a5e3a;
      font-size: 17px;
      line-height: 1.7;
      margin-top: 24px;
      position: relative;
    }

    .insight-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #2ecc71;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    @keyframes blink {
      0%, 50%, 100% {
        opacity: 1;
      }
      25%, 75% {
        opacity: 0;
      }
    }

    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .slide-in-left {
      animation: slideInLeft 0.6s ease forwards;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .typing {
      display: inline-block;
      overflow: hidden;
      border-right: 2px solid #6c5ce7;
      white-space: nowrap;
      animation: blink 1s steps(1) infinite;
    }

    /* Comparison styles */
    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.bad {
      background: #fef5f5;
      border-color: #e74c3c;
    }

    .comparison-item.good {
      background: #f0f8f0;
      border-color: #2ecc71;
    }

    .comparison-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .comparison-item.bad .comparison-title {
      color: #c0392b;
    }

    .comparison-item.good .comparison-title {
      color: #27ae60;
    }

    .comparison-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    /* COSTAR grid */
    .costar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .costar-box {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .costar-box:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .costar-box.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .costar-label {
      font-weight: 700;
      font-size: 20px;
      color: #6c5ce7;
      margin-bottom: 4px;
    }

    .costar-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .costar-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 8px;
      font-style: italic;
    }

    .costar-box.expanded .costar-hint {
      display: none;
    }

    .costar-example {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-top: 0;
      padding-top: 0;
    }

    .costar-box.expanded .costar-example {
      max-height: 400px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    /* Decision tree */
    .decision-tree {
      width: 100%;
    }

    .decision-node {
      padding: 24px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .decision-node:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .decision-question {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .expand-hint {
      font-size: 18px;
      color: #b0a6e8;
      transition: transform 0.3s ease;
    }

    .decision-node.expanded .expand-hint {
      transform: rotate(180deg);
    }

    .decision-answer {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .decision-node.expanded .decision-answer {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .answer-text {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* ========== Custom styles for Mastering Context guide ========== */

    .tier-card {
      padding: 20px;
      background: white;
      border-radius: 10px;
      border-left: 4px solid #6c5ce7;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .tier-card-emoji {
      font-size: 24px;
      flex-shrink: 0;
    }

    .tier-card-title {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a1a;
    }

    .tier-card-subtitle {
      font-size: 12px;
      color: #6c5ce7;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tier-card-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .code-block {
      background: #1a1a2e;
      color: #a78bfa;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .tier-diagram {
      width: 100%;
      max-width: 500px;
      margin: 24px auto 0;
    }

    .tier-diagram-box {
      padding: 14px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border-radius: 0;
    }

    .tier-diagram-box:first-child {
      border-radius: 10px 10px 0 0;
    }

    .tier-diagram-box:last-child {
      border-radius: 0 0 10px 10px;
    }

    .tier-diagram-arrow {
      text-align: center;
      padding: 8px;
      font-size: 14px;
      color: #6c5ce7;
      font-weight: 600;
    }

    .llm-box {
      background: linear-gradient(135deg, #6c5ce7, #2ecc71);
      color: white;
      padding: 14px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      max-width: 300px;
      margin: 0 auto;
    }

    .retrieval-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .retrieval-table th, .retrieval-table td {
      padding: 12px 16px;
      text-align: left;
      border: 1px solid #e0e0e0;
      font-size: 14px;
    }

    .retrieval-table th {
      background: #f5f3ff;
      font-weight: 700;
      color: #6c5ce7;
    }

    .retrieval-table td {
      background: white;
      color: #333;
    }

    .mechanism-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
    }

    .org-chart {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 20px;
    }

    .org-top {
      padding: 16px 24px;
      background: #6c5ce7;
      color: white;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-align: center;
    }

    .org-connector {
      width: 2px;
      height: 24px;
      background: #6c5ce7;
    }

    .org-branches {
      display: flex;
      gap: 16px;
      position: relative;
    }

    .org-branches::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: #6c5ce7;
    }

    .org-agent {
      padding: 12px 16px;
      background: white;
      border: 2px solid #6c5ce7;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-width: 100px;
      position: relative;
    }

    .org-agent::before {
      content: '';
      position: absolute;
      top: -24px;
      left: 50%;
      width: 2px;
      height: 24px;
      background: #6c5ce7;
    }

    .summary-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .summary-card-emoji { font-size: 24px; flex-shrink: 0; }
    .summary-card-title { font-weight: 700; font-size: 16px; color: #1a1a1a; margin-bottom: 4px; }
    .summary-card-desc { font-size: 14px; color: #555; line-height: 1.6; }

    .benefits-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
    }

    .benefit-check {
      color: #2ecc71;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const insightSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>';

    function InsightLabel() {
      return React.createElement('div', { className: 'insight-label' },
        React.createElement('span', { dangerouslySetInnerHTML: { __html: insightSvg } }),
        ' INSIGHT'
      );
    }

    function SidebarIcon({ html }) {
      return React.createElement('span', { dangerouslySetInnerHTML: { __html: html } });
    }

    function S1() {
      return (
        <>
          <div>
            <div className="stage-number">Stage 1</div>
            <div className="stage-header">Architecting Memory: The Three-Tier Hierarchy</div>
          </div>
          <div className="explanation">
            Effective context engineering uses a layered memory system &mdash; shared project knowledge, personal preferences, and dynamic imports &mdash; so the right context is always available.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              <p style={{ fontSize: '16px', color: '#444', marginBottom: '20px', fontWeight: 500 }}>
                Think of it like how a company organizes knowledge:
              </p>
              <div className="tier-card fade-in">
                <div className="tier-card-emoji">&#128218;</div>
                <div>
                  <div className="tier-card-subtitle">Project Memory</div>
                  <div className="tier-card-title">Company Wiki</div>
                  <div className="tier-card-desc">Shared standards everyone follows</div>
                </div>
              </div>
              <div className="tier-card fade-in" style={{ animationDelay: '0.15s' }}>
                <div className="tier-card-emoji">&#128211;</div>
                <div>
                  <div className="tier-card-subtitle">User Memory</div>
                  <div className="tier-card-title">Personal Notebook</div>
                  <div className="tier-card-desc">Your shortcuts, preferences, notes</div>
                </div>
              </div>
              <div className="tier-card fade-in" style={{ animationDelay: '0.3s' }}>
                <div className="tier-card-emoji">&#128214;</div>
                <div>
                  <div className="tier-card-subtitle">Dynamic Imports</div>
                  <div className="tier-card-title">Reference Library</div>
                  <div className="tier-card-desc">Specialized docs you pull in when needed</div>
                </div>
              </div>
            </div>
          </div>
          <div className="insight-box">
            {React.createElement(InsightLabel)}
            Think of memory tiers like how a company organizes knowledge &mdash; shared standards, personal shortcuts, and on-demand references.
          </div>
        </>
      );
    }

    function S2() {
      const [expandedTier, setExpandedTier] = useState(null);

      const tiers = [
        {
          id: 'project',
          title: 'Tier 1: Project Memory',
          subtitle: 'Shared context about architecture, standards, and conventions',
          details: [
            'Version-controlled (lives in the repo)',
            'Available to all team members',
            'Defines how the project works'
          ],
          code: '// Example: CLAUDE.md at project root\n"This project uses TypeScript, Jest for testing,\nand follows the repository pattern for data access."'
        },
        {
          id: 'user',
          title: 'Tier 2: User Memory',
          subtitle: 'Personal preferences specific to an individual',
          details: [
            'Stored locally (e.g., ~/.claude/claude.md)',
            'Not committed to the repository',
            'Persists across sessions'
          ],
          code: '// Example: ~/.claude/claude.md\n"I prefer concise responses. Always use dark mode\nexamples. I\'m experienced with React but new to Python."'
        },
        {
          id: 'dynamic',
          title: 'Tier 3: Dynamic Memory Imports',
          subtitle: 'On-demand context pulled in for specific tasks',
          details: [
            'Imported using @ syntax or automatic scanning',
            'Dedicated files for specific topics',
            'Dynamically updated based on task or branch'
          ],
          code: '// Example: @api-standards.md\nTyping @api-standards.md in a prompt pulls in\nyour team\'s API naming conventions.'
        }
      ];

      return (
        <>
          <div>
            <div className="stage-number">Stage 2</div>
            <div className="stage-header">The Three Memory Tiers in Detail</div>
          </div>
          <div className="explanation">
            Each tier serves a different purpose and operates at a different scope.
          </div>
          <div className="scene-card">
            <div style={{ width: '100%' }}>
              {tiers.map((tier, idx) => (
                <div
                  key={tier.id}
                  className={`costar-box ${expandedTier === tier.id ? 'expanded' : ''}`}
                  onClick={() => setExpandedTier(expandedTier === tier.id ? null : tier.id)}
                  style={{ marginBottom: '16px', gridColumn: 'auto' }}
                >
                  <div className="costar-label" style={{ fontSize: '16px' }}>{tier.title}</div>
                  <div className="costar-description">{tier.subtitle}</div>
                  <div className="costar-hint">Click to explore</div>
                  <div className="costar-example">
                    <ul style={{ paddingLeft: '18px', marginBottom: '12px' }}>
                      {tier.details.map((d, i) => (
                        <li key={i} style={{ marginBottom: '4px' }}>{d}</li>
                      ))}
                    </ul>
                    <div className="code-block">{tier.code}</div>
                  </div>
                </div>
              ))}

              <div className="tier-diagram">
                <div className="tier-diagram-box" style={{ background: '#f5f3ff', border: '2px solid #6c5ce7', color: '#6c5ce7' }}>
                  Dynamic Imports (Tier 3) &nbsp;&larr; Pulled in on demand
                </div>
                <div className="tier-diagram-box" style={{ background: '#eef2ff', border: '2px solid #818cf8', borderTop: 'none', color: '#818cf8' }}>
                  User Memory (Tier 2) &nbsp;&larr; Personal preferences
                </div>
                <div className="tier-diagram-box" style={{ background: '#e8f5e9', border: '2px solid #2ecc71', borderTop: 'none', color: '#2ecc71' }}>
                  Project Memory (Tier 1) &nbsp;&larr; Shared team standards
                </div>
                <div className="tier-diagram-arrow">&darr; All layers feed into &darr;</div>
                <div className="llm-box">LLM Context Window</div>
              </div>
            </div>
          </div>
          <div className="insight-box">
            {React.createElement(InsightLabel)}
