  <style>
    /* Guide-specific: mastering-context (context-engineering) */

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes drawCurve {
      from { stroke-dashoffset: 800; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes barFill {
      from { width: 0%; }
      to { width: var(--bar-target); }
    }

    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(108, 92, 231, 0)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(108, 92, 231, 0.4)); }
    }

    @keyframes dashMarch {
      to { stroke-dashoffset: -16; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .scale-in { animation: scaleIn 0.5s ease forwards; }

    .node-pulse { animation: nodePulse 2s ease-in-out infinite; }

    .memory-tier-wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .memory-tier-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 10px;
    }

    .memory-tier-bar {
      flex: 1;
      padding: 14px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .memory-tier-bar:hover {
      transform: translateX(4px);
    }

    .memory-tier-bar.active {
      border-color: currentColor;
    }

    .memory-tier-detail {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      max-height: 0;
      opacity: 0;
    }

    .memory-tier-detail.open {
      max-height: 100px;
      opacity: 1;
      margin-top: 6px;
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .slide-in-left {
      animation: slideInLeft 0.6s ease forwards;
    }

    /* Comparison styles */
    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.bad {
      background: #fef5f5;
      border-color: #e74c3c;
    }

    .comparison-item.good {
      background: #f0f8f0;
      border-color: #2ecc71;
    }

    .comparison-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .comparison-item.bad .comparison-title {
      color: #c0392b;
    }

    .comparison-item.good .comparison-title {
      color: #27ae60;
    }

    .comparison-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    /* COSTAR grid */
    .costar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .costar-box {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .costar-box:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .costar-box.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .costar-label {
      font-weight: 700;
      font-size: 20px;
      color: #6c5ce7;
      margin-bottom: 4px;
    }

    .costar-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .costar-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 8px;
      font-style: italic;
    }

    .costar-box.expanded .costar-hint {
      display: none;
    }

    .costar-example {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-top: 0;
      padding-top: 0;
    }

    .costar-box.expanded .costar-example {
      max-height: 400px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    /* Decision tree */
    .decision-tree {
      width: 100%;
    }

    .decision-node {
      padding: 24px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .decision-node:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .decision-question {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .expand-hint {
      font-size: 18px;
      color: #b0a6e8;
      transition: transform 0.3s ease;
    }

    .decision-node.expanded .expand-hint {
      transform: rotate(180deg);
    }

    .decision-answer {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .decision-node.expanded .decision-answer {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .answer-text {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
    }

    /* ========== Custom styles for Mastering Context guide ========== */

    .tier-card {
      padding: 20px;
      background: white;
      border-radius: 10px;
      border-left: 4px solid #6c5ce7;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .tier-card-emoji {
      font-size: 24px;
      flex-shrink: 0;
    }

    .tier-card-title {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a1a;
    }

    .tier-card-subtitle {
      font-size: 12px;
      color: #6c5ce7;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tier-card-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .code-block {
      background: #1a1a2e;
      color: #a78bfa;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .tier-diagram {
      width: 100%;
      max-width: 500px;
      margin: 24px auto 0;
    }

    .tier-diagram-box {
      padding: 14px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border-radius: 0;
    }

    .tier-diagram-box:first-child {
      border-radius: 10px 10px 0 0;
    }

    .tier-diagram-box:last-child {
      border-radius: 0 0 10px 10px;
    }

    .tier-diagram-arrow {
      text-align: center;
      padding: 8px;
      font-size: 14px;
      color: #6c5ce7;
      font-weight: 600;
    }

    .llm-box {
      background: linear-gradient(135deg, #6c5ce7, #2ecc71);
      color: white;
      padding: 14px 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      max-width: 300px;
      margin: 0 auto;
    }

    .retrieval-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .retrieval-table th, .retrieval-table td {
      padding: 12px 16px;
      text-align: left;
      border: 1px solid #e0e0e0;
      font-size: 14px;
    }

    .retrieval-table th {
      background: #f5f3ff;
      font-weight: 700;
      color: #6c5ce7;
    }

    .retrieval-table td {
      background: white;
      color: #333;
    }

    .mechanism-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
    }

    .org-chart {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 20px;
    }

    .org-top {
      padding: 16px 24px;
      background: #6c5ce7;
      color: white;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-align: center;
    }

    .org-connector {
      width: 2px;
      height: 24px;
      background: #6c5ce7;
    }

    .org-branches {
      display: flex;
      gap: 16px;
      position: relative;
    }

    .org-branches::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: #6c5ce7;
    }

    .org-agent {
      padding: 12px 16px;
      background: white;
      border: 2px solid #6c5ce7;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-width: 100px;
      position: relative;
    }

    .org-agent::before {
      content: '';
      position: absolute;
      top: -24px;
      left: 50%;
      width: 2px;
      height: 24px;
      background: #6c5ce7;
    }

    .summary-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .summary-card-emoji { font-size: 24px; flex-shrink: 0; }
    .summary-card-title { font-weight: 700; font-size: 16px; color: #1a1a1a; margin-bottom: 4px; }
    .summary-card-desc { font-size: 14px; color: #555; line-height: 1.6; }

    .benefits-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
    }

    .benefit-check {
      color: #2ecc71;
      font-weight: 700;
    }

    /* Disclosure badge */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const insightSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>';

    function InsightLabel() {
      return React.createElement('div', { className: 'insight-label' },
        React.createElement('span', { dangerouslySetInnerHTML: { __html: insightSvg } }),
        ' INSIGHT'
      );
    }

    function SidebarIcon({ html }) {
      return React.createElement('span', { dangerouslySetInnerHTML: { __html: html } });
    }

    function MemoryHierarchyDiagram() {
      const [activeTier, setActiveTier] = React.useState(null);

      const tiers = [
        {
          id: 'working', label: 'Working Memory', subtitle: 'Active context window',
          color: '#6c5ce7', icon: '⚡',
          detail: 'Everything currently in the context window. Fast access, expensive, cleared after session. ~200K tokens max.',
          examples: 'Current conversation, open files, recent tool results'
        },
        {
          id: 'episodic', label: 'Episodic Memory', subtitle: 'Session notes & summaries',
          color: '#3498db', icon: '📝',
          detail: 'Summaries and notes from past interactions. Written to files or memory tools. Survives across sessions.',
          examples: 'CLAUDE.md, session notes, .memory/ files'
        },
        {
          id: 'semantic', label: 'Semantic Memory', subtitle: 'Knowledge base',
          color: '#00b894', icon: '🧠',
          detail: 'Structured facts, domain knowledge, documentation. Retrieved via search or RAG when needed.',
          examples: 'Codebase docs, API references, project wikis'
        },
        {
          id: 'procedural', label: 'Procedural Memory', subtitle: 'Skills & patterns',
          color: '#fdcb6e', icon: '⚙️',
          detail: 'How to do things — baked into the model weights during training. Cannot be changed without fine-tuning.',
          examples: 'Coding patterns, language understanding, reasoning skills'
        },
      ];

      return (
        <div className="memory-tier-wrap">
          <div style={{ fontWeight: 700, fontSize: '14px', color: '#555', marginBottom: '14px', textAlign: 'center', letterSpacing: '0.5px' }}>
            MEMORY ARCHITECTURE (FASTEST → MOST DURABLE)
          </div>
          {tiers.map((tier, idx) => {
            const isActive = activeTier === tier.id;
            const panelId = `memory-tier-panel-${tier.id}`;
            const toggle = () => setActiveTier(activeTier === tier.id ? null : tier.id);
            return (
            <div key={tier.id} className="fade-in" style={{ animationDelay: `${idx * 0.1}s` }}>
              <div
                className={`memory-tier-bar ${isActive ? 'active' : ''}`}
                style={{
                  background: isActive ? tier.color + '20' : '#fafafa',
                  borderColor: isActive ? tier.color : '#e0e0e0',
                  color: tier.color
                }}
                onClick={toggle}
                role="button"
                tabIndex={0}
                aria-expanded={isActive}
                aria-controls={panelId}
                onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                  <span style={{ fontSize: '22px' }}>{tier.icon}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: '15px', color: '#1a1a1a' }}>{tier.label}</div>
                    <div style={{ fontSize: '12px', color: '#888', marginTop: '2px' }}>{tier.subtitle}</div>
                  </div>
                  <span style={{ color: '#bbb', fontSize: '18px', transition: 'transform 0.3s ease', transform: isActive ? 'rotate(180deg)' : 'none' }}>▾</span>
                </div>
              </div>
              <div id={panelId} className={`memory-tier-detail ${isActive ? 'open' : ''}`}
                style={{ paddingLeft: '16px', borderLeft: `3px solid ${tier.color}`, marginBottom: '4px' }}
              >
                <div style={{ fontSize: '14px', color: '#333', lineHeight: '1.6', paddingTop: '8px' }}>{tier.detail}</div>
                <div style={{ fontSize: '12px', color: '#888', marginTop: '4px' }}><strong>Examples:</strong> {tier.examples}</div>
              </div>
            </div>
            );
          })}
        </div>
      );
    }

    /* ── SVG Diagram Components ── */

    function DiagramS1() {
      const tiers = [
        { label: '⚡ Working Memory',    speed: '⚡ fastest',  fill: '#f5f3ff', stroke: '#6c5ce7' },
        { label: '📝 Episodic Memory',   speed: '🔄 session',  fill: '#edf5ff', stroke: '#3498db' },
        { label: '🧠 Semantic Memory',   speed: '📚 retrieval',fill: '#f0fff8', stroke: '#2ecc71' },
        { label: '⚙️ Procedural Memory', speed: '🐢 baked-in', fill: '#fffbf0', stroke: '#f39c12' },
      ];
      const barH = 28, gap = 6, startY = 10;
      const totalH = tiers.length * barH + (tiers.length - 1) * gap;
      const arrowTopY = startY + totalH + 10;
      const arrowBotY = arrowTopY + 28;
      const cwY = arrowBotY + 4;
      const svgH = cwY + 40;

      return (
        <svg
          viewBox={`0 0 500 ${svgH}`}
          style={{ maxWidth: '100%', overflow: 'visible', display: 'block', margin: '0 auto' }}
          aria-label="Four-tier memory hierarchy (Working, Episodic, Semantic, Procedural) feeding into context window"
        >
          <defs>
            <marker id="arrowS1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
              <path d="M1,1 L7,4 L1,7 Z" fill="#6c5ce7" />
            </marker>
          </defs>
          {tiers.map((t, i) => {
            const y = startY + i * (barH + gap);
            return (
              <g key={i}>
                <rect x="60" y={y} width="380" height={barH} rx="6"
                  fill={t.fill} stroke={t.stroke} strokeWidth="2" />
                <text x="74" y={y + barH / 2 + 5}
                  fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="600" fill="#1a1a1a">
                  {t.label}
                </text>
                <text x="432" y={y + barH / 2 + 5}
                  fontFamily="'DM Sans', sans-serif" fontSize="11" fontWeight="600" fill="#888" textAnchor="end">
                  {t.speed}
                </text>
              </g>
            );
          })}
          {/* down arrow */}
          <line x1="250" y1={arrowTopY} x2="250" y2={arrowBotY}
            stroke="#6c5ce7" strokeWidth="2" markerEnd="url(#arrowS1)" />
          {/* Context Window box */}
          <rect x="140" y={cwY} width="220" height="36" rx="10"
            fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="2" />
          <text x="250" y={cwY + 23}
            fontFamily="'DM Sans', sans-serif" fontSize="13" fontWeight="700" fill="#6c5ce7" textAnchor="middle">
            Context Window
          </text>
        </svg>
      );
    }

    function DiagramS2() {
      return (
        <svg
          viewBox="0 0 480 150"
          style={{ maxWidth: '100%', overflow: 'visible', display: 'block', margin: '0 auto' }}
          aria-label="Three memory tiers cascading into LLM context window"
        >
          <defs>
            <marker id="arrowS2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
              <path d="M1,1 L7,4 L1,7 Z" fill="#6c5ce7" />
            </marker>
          </defs>
          {/* Box 1 – Project */}
          <rect x="20" y="20" width="120" height="50" rx="10"
            fill="#f5f3ff" stroke="#6c5ce7" strokeWidth="2" />
          <text x="80" y="42" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="700" fill="#6c5ce7" textAnchor="middle">Tier 1: Project</text>
          <text x="80" y="58" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="#888" textAnchor="middle">Shared</text>
          {/* Box 2 – User */}
          <rect x="90" y="50" width="120" height="50" rx="10"
            fill="#edf5ff" stroke="#3498db" strokeWidth="2" />
          <text x="150" y="72" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="700" fill="#3498db" textAnchor="middle">Tier 2: User</text>
          <text x="150" y="88" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="#888" textAnchor="middle">Personal</text>
          {/* Box 3 – Dynamic */}
          <rect x="160" y="80" width="120" height="50" rx="10"
            fill="#f0fff8" stroke="#2ecc71" strokeWidth="2" />
          <text x="220" y="102" fontFamily="'DM Sans', sans-serif" fontSize="12" fontWeight="700" fill="#2ecc71" textAnchor="middle">Tier 3: Dynamic</text>
          <text x="220" y="118" fontFamily="'DM Sans', sans-serif" fontSize="10" fontWeight="600" fill="#888" textAnchor="middle">On-demand</text>
          {/* Arrow from Box 3 → Context Window */}
          <line x1="280" y1="105" x2="316" y2="75"
            stroke="#6c5ce7" strokeWidth="2" markerEnd="url(#arrowS2)" />
          {/* Context Window box */}
          <rect x="316" y="53" width="144" height="44" rx="10"

                  {components.map((comp) => {
                    const isExpanded = expandedComponent === comp.id;

                      </div>
                    </div>
                    );

                </div>
              </div>
