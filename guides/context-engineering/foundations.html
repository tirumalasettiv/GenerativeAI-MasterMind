<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Context Engineering Foundations - Interactive Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
    }

    #root {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 120px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 80px 12px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .step-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .step-btn:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .step-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    .step-wrapper.active .step-btn-label {
      color: #6c5ce7;
    }

    .step-connector {
      width: 2px;
      height: 16px;
      background: #e0e0e0;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .step-connector.active {
      background: #6c5ce7;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, #6c5ce7, #a78bfa, #2ecc71) 1;
      background: white;
      flex-shrink: 0;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      color: #6c5ce7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #2ecc71;
    }

    .badge {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .progress-indicator {
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .guide-number {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #b0a6e8;
      margin-right: 8px;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .nav-arrows {
      display: flex;
      gap: 12px;
    }

    .arrow-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .arrow-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
      transform: translateY(-2px);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 24px 36px;
      gap: 18px;
    }

    .explanation {
      font-size: 22px;
      line-height: 1.7;
      color: #2a2a2a;
    }

    .scene-card {
      background: linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%);
      border-radius: 16px;
      padding: 28px;
      border: 1px solid #e8e3f8;
      min-height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
    }

    .insight-box {
      background: #f0faf0;
      border-left: 4px solid #2ecc71;
      padding: 16px 20px;
      border-radius: 8px;
      color: #1a5e3a;
      font-size: 17px;
      line-height: 1.7;
      margin-top: 0;
      position: relative;
    }

    .insight-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #2ecc71;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    @keyframes blink {
      0%, 50%, 100% {
        opacity: 1;
      }
      25%, 75% {
        opacity: 0;
      }
    }

    @keyframes drawCurve {
      from { stroke-dashoffset: 800; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes barFill {
      from { width: 0%; }
      to { width: var(--bar-target); }
    }

    @keyframes nodePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(108, 92, 231, 0)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(108, 92, 231, 0.4)); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes dashMarch { to { stroke-dashoffset: -16; } }

    .scale-in { animation: scaleIn 0.5s ease forwards; }

    .context-window-wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .cw-track {
      width: 100%;
      height: 48px;
      background: #f0f0f4;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      border: 1px solid #e0e0e0;
      position: relative;
    }

    .cw-segment {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.3px;
      transition: all 0.4s ease;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
    }

    .cw-segment:hover {
      filter: brightness(1.1);
    }

    .cw-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 12px;
      justify-content: center;
    }

    .cw-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #555;
      font-weight: 500;
    }

    .cw-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .cw-detail {
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      max-height: 0;
      opacity: 0;
    }

    .cw-detail.open {
      max-height: 80px;
      opacity: 1;
      margin-top: 12px;
    }

    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    .slide-in-right {
      animation: slideInRight 0.6s ease forwards;
    }

    .slide-in-left {
      animation: slideInLeft 0.6s ease forwards;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .typing {
      display: inline-block;
      overflow: hidden;
      border-right: 2px solid #6c5ce7;
      white-space: nowrap;
      animation: blink 1s steps(1) infinite;
    }

    /* Comparison styles */
    .comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
    }

    .comparison-item {
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #e0e0e0;
    }

    .comparison-item.bad {
      background: #fef5f5;
      border-color: #e74c3c;
    }

    .comparison-item.good {
      background: #f0f8f0;
      border-color: #2ecc71;
    }

    .comparison-item.neutral {
      background: #f8f9fa;
      border-color: #bbb;
    }

    .comparison-title {
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .comparison-item.bad .comparison-title {
      color: #c0392b;
    }

    .comparison-item.good .comparison-title {
      color: #27ae60;
    }

    .comparison-item.neutral .comparison-title {
      color: #555;
    }

    .comparison-content {
      font-size: 15px;
      line-height: 1.6;
      color: #333;
    }

    /* COSTAR grid and boxes */
    .costar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .costar-box {
      padding: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .costar-box:hover {
      border-color: #6c5ce7;
      transform: translateY(-4px);
    }

    .costar-box.expanded {
      border-color: #6c5ce7;
      background: #f5f3ff;
      grid-column: 1 / -1;
    }

    .costar-label {
      font-weight: 700;
      font-size: 20px;
      color: #6c5ce7;
      margin-bottom: 4px;
    }

    .costar-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }

    .costar-hint {
      font-size: 11px;
      color: #b0a6e8;
      margin-top: 8px;
      font-style: italic;
    }

    .costar-box.expanded .costar-hint {
      display: none;
    }

    .costar-example {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      margin-top: 0;
      padding-top: 0;
    }

    .costar-box.expanded .costar-example {
      max-height: 200px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    /* Decision tree */
    .decision-tree {
      width: 100%;
    }

    .decision-node {
      padding: 24px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .decision-node:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .decision-question {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .expand-hint {
      font-size: 18px;
      color: #b0a6e8;
      transition: transform 0.3s ease;
    }

    .decision-node.expanded .expand-hint {
      transform: rotate(180deg);
    }

    .decision-answer {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .decision-node.expanded .decision-answer {
      max-height: 300px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    .answer-text {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Context source rows */
    .context-source-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e3f8;
      margin-bottom: 8px;
    }

    .context-source-emoji {
      font-size: 20px;
      flex-shrink: 0;
    }

    .context-source-label {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a1a;
    }

    .context-source-desc {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    /* Failure cards */
    .failure-card {
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .failure-card:hover {
      transform: translateY(-2px);
    }

    .failure-card.expanded {
      border-color: inherit;
    }

    .failure-card-title {
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .failure-card-content {
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .failure-card.expanded .failure-card-content {
      max-height: 200px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }

    /* Summary cards */
    .summary-card {
      padding: 20px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .summary-card-emoji {
      font-size: 24px;
      flex-shrink: 0;
    }

    .summary-card-title {
      font-weight: 700;
      font-size: 16px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .summary-card-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    /* Disclosure badge */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* Static SVG string for the insight icon - only used with hardcoded trusted content */
    const insightSvg = React.createElement('svg', {
      width: 14, height: 14, viewBox: '0 0 24 24', fill: 'none',
      stroke: '#2ecc71', strokeWidth: 2
    },
      React.createElement('path', { d: 'M9 18h6' }),
      React.createElement('path', { d: 'M10 22h4' }),
      React.createElement('path', { d: 'M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z' })
    );

    function InsightBlock({ children }) {
      return (
        <div className="insight-box">
          <div className="insight-label">{insightSvg} INSIGHT</div>
          {children}
        </div>
      );
    }

    /* Sidebar icon components rendered as React elements */
    function LightbulbIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M9 18h6" />
          <path d="M10 22h4" />
          <path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z" />
        </svg>
      );
    }

    function TargetIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <circle cx="12" cy="12" r="10" />
          <circle cx="12" cy="12" r="6" />
          <circle cx="12" cy="12" r="2" />
        </svg>
      );
    }

    function AlertIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      );
    }

    function UsersIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 00-3-3.87" />
          <path d="M16 3.13a4 4 0 010 7.75" />
        </svg>
      );
    }

    function BookIcon() {
      return (
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" />
        </svg>
      );
    }

    /* ── Stage SVG Diagrams ─────────────────────────────────── */

    function S1Diagram() {
      const blocks = [
        { label: 'System Prompt', color: '#6c5ce7', w: 80 },
        { label: 'Memory',        color: '#3498db', w: 80 },
        { label: 'Tool Results',  color: '#f39c12', w: 80 },
        { label: 'Conversation',  color: '#2ecc71', w: 80 },
      ];
      const totalFilled = blocks.reduce((s, b) => s + b.w, 0); // 320
      const windowW = 480;
      const barH = 60;
      const availW = windowW - totalFilled; // 160

      return (
        <svg
          width={windowW}
          height={120}
          viewBox={`0 0 ${windowW} 120`}
          aria-label="Context window capacity showing four blocks filling 70% of available space"
          style={{ maxWidth: '100%', overflow: 'visible' }}
          fontFamily="'DM Sans', sans-serif"
        >
          <defs>
            <marker id="s1arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L0,6 L8,3 z" fill="#6c5ce7" />
            </marker>
          </defs>

          {/* outer window rect */}
          <rect x={0} y={16} width={windowW} height={barH} rx={12} ry={12}
            fill="#f5f3ff" stroke="#6c5ce7" strokeWidth={2} />

          {/* colored blocks */}
          {blocks.map((b, i) => {
            const x = i * b.w;
            return (
              <g key={i}>
                <rect x={x} y={16} width={b.w} height={barH}
                  rx={i === 0 ? 10 : 0} ry={i === 0 ? 10 : 0}
                  fill={b.color} />
                <text x={x + b.w / 2} y={16 + barH / 2 + 1} textAnchor="middle" dominantBaseline="middle"
                  fontSize={10} fontWeight="600" fill="white" fontFamily="'DM Sans', sans-serif">
                  {b.label}
                </text>
              </g>
            );
          })}

          {/* Available space block */}
          <rect x={totalFilled} y={16} width={availW} height={barH}
            rx={0} ry={0}
            fill="none" stroke="#e0e0e0" strokeWidth={1.5} strokeDasharray="4 4" />
          <text x={totalFilled + availW / 2} y={16 + barH / 2 + 1} textAnchor="middle" dominantBaseline="middle"
            fontSize={11} fontWeight="600" fill="#b0b0b0" fontFamily="'DM Sans', sans-serif">
            Available
          </text>

          {/* Right-end rounded clip — overlay to round right side */}

          desc: "Dynamic context systems matter more than static prompt text. A well-engineered context system will outperform the most carefully crafted single prompt.",
          color: "#6c5ce7"
        },
        {
          emoji: "\u26A0\uFE0F",
          title: "Garbage In, Garbage Out",
          desc: "LLMs can only be as good as the context they receive. Missing information, irrelevant noise, or contradictory instructions all degrade output quality.",
          color: "#f39c12"
        },
        {
          emoji: "\uD83D\uDEE1\uFE0F",
          title: "Watch for Failures",
          desc: "Context poisoning, confusion, and clash are the three ways context goes wrong. Awareness of these failure modes is the first step to preventing them.",
          color: "#e74c3c"
        }
      ];

      return (
        <>
          <div>
            <div className="stage-header">Key Foundations</div>
          </div>
          <div className="explanation">
            Three foundational principles to remember about context engineering.
          </div>
          <div className="scene-card">
            <S5Diagram />
            <div style={{ width: '100%', marginTop: '24px' }}>
              {summaries.map((item, idx) => (
                <div
                  className="summary-card fade-in"
                  key={idx}
                  style={{ borderLeftColor: item.color, animationDelay: `${0.15 * idx}s` }}
                >
                  <div className="summary-card-emoji">{item.emoji}</div>
                  <div>
                    <div className="summary-card-title">{item.title}</div>
                    <div className="summary-card-desc">{item.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            Context engineering is the evolution of prompt engineering. Once you understand this, you&rsquo;ll never look at AI interactions the same way.
          </InsightBlock>
        </>
      );
    }

    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stageIconComponents = [LightbulbIcon, TargetIcon, AlertIcon, UsersIcon, BookIcon];

      const stages = [
        { icon: LightbulbIcon, label: 'What is CE', component: S1 },
        { icon: TargetIcon, label: 'Why It Matters', component: S2 },
        { icon: AlertIcon, label: 'Failures', component: S3 },
        { icon: UsersIcon, label: 'Everyone', component: S4 },
        { icon: BookIcon, label: 'Takeaways', component: S5 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) {
          setCurrentStage(currentStage + 1);
        }
      };

      const handlePrev = () => {
        if (currentStage > 0) {
          setCurrentStage(currentStage - 1);
        }
      };

      const handleStageClick = (idx) => {
        setCurrentStage(idx);
      };

      return (
        <div className="container">
          <div className="sidebar scrollbar-hide">
            {stages.map((stage, idx) => {
              const IconComp = stage.icon;
              return (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    <button
                      className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                      onClick={() => handleStageClick(idx)}
                    >
                      <IconComp />
                    </button>
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < stages.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              );
            })}
          </div>

          <div className="main-content">
            <div className="top-bar">
              <div className="left-section">
                <a href="../../index.html" className="back-link">&#8592; Back to All Guides</a>
                <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                  <span className="guide-number">3.1</span>
                  <div className="title">Context Engineering Foundations</div>
                </div>
                <div style={{ marginLeft: '20px' }}>
                  <div className="badge">BEGINNER GUIDE</div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center' }}>
                <span className="progress-indicator">Page {currentStage + 1} of 5</span>
                <div className="nav-arrows">
                  <button
                    className="arrow-btn"
                    onClick={handlePrev}
                    disabled={currentStage === 0}
                    title="Previous stage"
                  >
                    &#8592;
                  </button>
                  <button
                    className="arrow-btn"
                    onClick={handleNext}
                    disabled={currentStage === stages.length - 1}
                    title="Next stage"
                  >
                    &#8594;
                  </button>
                </div>
              </div>
            </div>

            <div className="content-area scrollbar-hide">
              <CurrentComponent />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
