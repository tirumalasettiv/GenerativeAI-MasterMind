<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    /* SVG icon components — pure JSX, no innerHTML */
    const I = {
      Grid: ({size = 18, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      Cache: ({size = 18, color = 'currentColor'}) => (

          <circle cx="6" cy="19" r="3" /><circle cx="18" cy="5" r="3" />
          <path d="M6 16V8a3 3 0 013-3h6" /><path d="M9 11h6a3 3 0 013 3v2" />
        </svg>
      ),
      Stack: ({size = 18, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" />
        </svg>
      ),
      Bulb: ({size = 14, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 18h6" /><path d="M10 22h4" />
          <path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z" />
        </svg>
      ),
      Check: ({size = 20}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#2ecc71" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />

      ),
      Cross: ({size = 20}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#e74c3c" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      ),
      Dollar: ({size = 18, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="1" x2="12" y2="23" /><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
        </svg>
      ),
      Warn: ({size = 14, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      )
    };

    const NEXT_GUIDE = { id: "2.4", title: "Prompt Engineering Quiz", module: "Module 2", href: "./quiz.html", isQuiz: true };

    const fmt = (n) => {
      if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
      if (n >= 1_000)     return '$' + (n / 1_000).toFixed(1) + 'K';
      return '$' + n.toFixed(0);
    };

    /* ===================== STAGE 0: Overview ===================== */
    function OverviewStage() {
      const stack = [
        { label: 'Naive — all on Opus 4.7',         cost: 27500, color: '#e74c3c', savings: 0 },
        { label: 'Routing only',                    cost:  9900, color: '#f39c12', savings: 64 },
        { label: 'Routing + caching',               cost:  3500, color: '#3498db', savings: 87 },
        { label: 'Routing + caching + batch',       cost:  1800, color: '#2ecc71', savings: 93 }
      ];
      const max = Math.max(...stack.map(s => s.cost));

      return (
        <>
          <div><h2 className="stage-header">The Three Levers That Cut Your LLM Bill 90%+</h2></div>
          <div className="explanation">
            Most beginner tutorials teach you to call <code className="inline">client.messages.create()</code> and stop there. Production LLM teams use three architectural levers — <strong>prompt caching</strong>, <strong>batch processing</strong>, and <strong>model routing</strong> — that compound to cut bills by 90% or more on the same workload, with zero quality loss. None of these are exotic. All three live in the docs. Few beginners turn them on.
          </div>

          <div className="cost-hero">
            <div className="hero-stat-card">
              <span className="hero-stat-label">Prompt caching</span>
              <span className="hero-stat-value">~90% off</span>
              <span className="hero-stat-detail">Cached input tokens cost roughly 10% of the standard rate. One <code className="inline">cache_control</code> flag, two-call break-even.</span>
            </div>
            <div className="hero-stat-card">
              <span className="hero-stat-label">Batch processing</span>
              <span className="hero-stat-value">50% off</span>
              <span className="hero-stat-detail">Async submission, results within 24 hours. Both input and output tokens. Stacks with caching.</span>
            </div>
            <div className="hero-stat-card">
              <span className="hero-stat-label">Model routing</span>
              <span className="hero-stat-value">50–80% off</span>
              <span className="hero-stat-detail">Send the easy 70% of work to Haiku, keep Opus for the hard 10%. Match the tier to the task.</span>
            </div>
            <div className="hero-stat-card">
              <span className="hero-stat-label">All three combined</span>
              <span className="hero-stat-value">~93% off</span>
              <span className="hero-stat-detail">Caching + batch + routing on a 1M-request workload: $27,500/mo → $1,800/mo. Same outputs.</span>
            </div>
          </div>

          <div className="stack-wrap">
            <div className="stack-title">
              <I.Dollar color="#6c5ce7" />
              Compounding savings — 1M requests / month, 3K input + 500 output tokens each
            </div>
            {stack.map((row, i) => (
              <div className="stack-row" key={i}>
                <div className="stack-label">{row.label}</div>
                <div className="stack-bar-track">
                  <div className="stack-bar-fill" style={{ width: `${(row.cost / max) * 100}%`, background: row.color }} />
                </div>
                <div className="stack-cost">
                  {fmt(row.cost)}
                  {row.savings > 0 && <div style={{ fontSize: 11, color: '#1a5e3a', fontWeight: 600 }}>−{row.savings}%</div>}
                </div>
              </div>
            ))}
          </div>

          <div className="insight-box">
            <div className="insight-label">
              <I.Bulb color="#2ecc71" />
              THE MENTAL MODEL
            </div>
            LLM cost optimization is mostly architectural — <em>where</em> you call the API, <em>which</em> model you call, <em>which</em> parts you cache. Once you internalize that, "saving money" stops feeling like a chore and starts feeling like designing the system correctly.
          </div>
        </>
      );
    }

    /* ===================== STAGE 1: Caching ===================== */
    function CachingStage() {
      const [tokens, setTokens] = useState(8000);
      const [callsPerHour, setCallsPerHour] = useState(100);
      const [hoursPerMonth, setHoursPerMonth] = useState(720);

      const base = 3.0;       // Sonnet 4.6 base $/MTok input
      const writeMul = 1.25;
      const readMul = 0.10;

      const totals = useMemo(() => {
        const callsTotal = callsPerHour * hoursPerMonth;

        const reads  = Math.max(0, callsTotal - writes);

        const noCache = (callsTotal * tokens / 1_000_000) * base;
        const withCache =
          (writes * tokens / 1_000_000) * base * writeMul +
          (reads  * tokens / 1_000_000) * base * readMul;
        const savings = noCache - withCache;
        const pct = noCache > 0 ? (savings / noCache) * 100 : 0;
        return { noCache, withCache, savings, pct };
      }, [tokens, callsPerHour, hoursPerMonth]);

      return (

    function BatchStage() {
      const [volume, setVolume] = useState(100000);
      const [inputTokens, setInputTokens] = useState(5000);
      const [outputTokens, setOutputTokens] = useState(500);
      const [withCaching, setWithCaching] = useState(true);

      const inBase  = 3.0;     // Sonnet 4.6
      const outBase = 15.0;
      const cachedShare = 0.8;

      const totals = useMemo(() => {
        const inMTok  = (volume * inputTokens) / 1_000_000;
        const outMTok = (volume * outputTokens) / 1_000_000;

        const sync = inMTok * inBase + outMTok * outBase;
        const batchOnly = sync * 0.5;

        const cachedIn = inMTok * cachedShare * inBase * 0.5 * 0.1;
        const freshIn  = inMTok * (1 - cachedShare) * inBase * 0.5;
        const batchCached = cachedIn + freshIn + outMTok * outBase * 0.5;

        const result = withCaching ? batchCached : batchOnly;
        const savings = sync - result;
        const pct = sync > 0 ? (savings / sync) * 100 : 0;
        return { sync, result, savings, pct };

# 1. Submit up to 100,000 requests in one batch

    requests=[

for result in client.messages.batches.results(batch.id):

    function RoutingStage() {

      const opusPct = Math.max(0, 100 - haikuPct - sonnetPct);

      const setHaiku = (v) => {
        const newH = Math.max(0, Math.min(100, v));
        const newS = Math.min(sonnetPct, 100 - newH);
        setHaikuPct(newH);
        setSonnetPct(newS);
      };
      const setSonnet = (v) => {
        const newS = Math.max(0, Math.min(100 - haikuPct, v));
        setSonnetPct(newS);
      };

      const volume = 1_000_000;
      const inTok  = 3000;
      const outTok = 500;

      const tiers = [
        { name: 'Haiku 4.5',  pct: haikuPct,  inP: 1.0, outP: 5.0,  color: '#2ecc71' },
        { name: 'Sonnet 4.6', pct: sonnetPct, inP: 3.0, outP: 15.0, color: '#3498db' },
        { name: 'Opus 4.7',   pct: opusPct,   inP: 5.0, outP: 25.0, color: '#9b59b6' }
      ];

      const totals = useMemo(() => {
        let total = 0;
        tiers.forEach(t => {
          const vol = volume * (t.pct / 100);
          total += (vol * inTok / 1_000_000) * t.inP + (vol * outTok / 1_000_000) * t.outP;
        });
        const naive = (volume * inTok / 1_000_000) * 5.0 + (volume * outTok / 1_000_000) * 25.0;
        const savings = naive - total;
        const pct = naive > 0 ? (savings / naive) * 100 : 0;
        return { total, naive, savings, pct };
      }, [haikuPct, sonnetPct, opusPct]);

          <div className="code-block" style={{ marginTop: 12 }}>{`# DYNAMIC routing — Haiku classifier picks the tier at runtime.

              <span className="gotcha-num">1</span>
              <span className="gotcha-title">Quality drift in the tail</span>
              <div className="gotcha-body">The 70% on Haiku mostly works. The problem is the 5–10% of edge cases — Haiku will misclassify the one ticket where the customer is sarcastic in three languages. <strong>Fix:</strong> confidence check; if Haiku's response looks degenerate, retry on Sonnet.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">2</span>
              <span className="gotcha-title">The router itself is a single point of failure</span>
              <div className="gotcha-body">A bug in dynamic routing sends <em>everything</em> to the wrong tier. <strong>Fix:</strong> log every routing decision, alert on anomalous distributions ("Opus traffic exceeded 25%"), keep a kill switch that pins everything to a specific model.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">3</span>
              <span className="gotcha-title">Output cost dominates at the heavy tier</span>
              <div className="gotcha-body">Output is 5× input across all Claude models. A 4,000-token Opus response costs $0.10 — multiply by 100K and you're at $10,000/month from output alone. <strong>Fix:</strong> tight <code className="inline">max_tokens</code> per tier — Haiku 512, Sonnet 1,024–2,048, Opus 4,096+ only when needed.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">4</span>
              <span className="gotcha-title">Cache breakage across tiers</span>
              <div className="gotcha-body">Caches are per-model. Routing the same system prompt across Haiku and Sonnet maintains two caches with worse hit rates. <strong>Fix:</strong> for static routing, accept duplicate caches — savings still exceed the cost. Monitor <code className="inline">cache_read_input_tokens</code> per model.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">5</span>
              <span className="gotcha-title">The classifier itself can hallucinate</span>
              <div className="gotcha-body">Dynamic routers occasionally output garbage — neither SIMPLE nor STANDARD nor COMPLEX. <strong>Fix:</strong> always have a sane fallback (<code className="inline">{`model_map.get(tier, "claude-sonnet-4-6")`}</code>). Sonnet is almost always the right default.</div>
            </div>
          </div>

          <div className="insight-box">
            <div className="insight-label">
              <I.Warn color="#e67e22" />
              THE SINGLE BIGGEST MISTAKE
            </div>
            <strong>Routing too aggressively too early.</strong> Better to ship with everything on Sonnet, validate it works, then carve out specific task types to push down to Haiku. Going the other way — starting on Haiku and discovering quality problems in production — is much harder to recover from.
          </div>
        </>
      );
    }

    /* ===================== STAGE 4: Stack ===================== */
    function StackStage() {
      const baseline = 27500;
      const rows = [
        { label: 'Naive baseline',                    tag: 'BAD',   color: '#e74c3c', cost: baseline, pct: 0,  caption: 'Everything on Opus, sync, no caching' },
        { label: '+ Routing',                         tag: 'GOOD',  color: '#f39c12', cost:  9900,    pct: 64, caption: '70% Haiku / 20% Sonnet / 10% Opus' },
        { label: '+ Routing + Caching',               tag: 'GREAT', color: '#3498db', cost:  3500,    pct: 87, caption: 'Cached system prompts on each tier' },
        { label: '+ Routing + Caching + Batch',       tag: 'BEST',  color: '#2ecc71', cost:  1800,    pct: 93, caption: 'Async pipeline with all three' }
      ];
      const max = baseline;

      return (
        <>
          <div><h2 className="stage-header">4. Stack All Three: The Canonical Production Pattern</h2></div>
          <div className="explanation">
            None of these techniques is exotic on its own. The real win is the <strong>multiplicative effect</strong> when you compose them. The canonical shape of a cost-optimized production pipeline in 2026: <em>route by task type, cache the stable prefix, submit async work as a batch.</em> Same workload, ~5–7% of the cost.
          </div>

          <div className="stack-wrap">
            <div className="stack-title">
              <I.Stack color="#6c5ce7" />
              The compounding effect — 1M requests / month
            </div>
            <div className="final-stack">
              {rows.map((r, i) => {
                const tagColor = { BAD: '#e74c3c', GOOD: '#f39c12', GREAT: '#3498db', BEST: '#2ecc71' }[r.tag];
                return (
                  <div className="final-row" key={i}>
                    <div>
                      <span className="final-label">{r.label}</span>
                      <span className="final-tag" style={{ background: tagColor, color: 'white' }}>{r.tag}</span>
                      <div style={{ fontSize: 11, color: '#777', marginTop: 2 }}>{r.caption}</div>
                    </div>
                    <div className="final-bar-track">
                      <div className="final-bar-fill" style={{ width: `${(r.cost / max) * 100}%`, background: r.color }}>
                        {((r.cost / max) * 100).toFixed(0)}% of baseline
                      </div>
                    </div>
                    <div>
                      <div className="final-cost">{fmt(r.cost)}</div>
                      {r.pct > 0 && <span className="final-savings">−{r.pct}%</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="section-divider" />

          <h3 className="sub-heading">All three in one pipeline</h3>
          <div className="explanation" style={{ marginTop: 0 }}>
            Production-shaped example: a service that classifies incoming support emails, extracts structured data, and drafts replies. Each step is routed to the right tier, every system prompt is cached, and the whole job is submitted as a batch.
          </div>

          <div className="code-block">{`def build_classify_request(email_id: str, email: str) -> Request:
    """Step 1: simple classification → Haiku, cached prompt."""
    return Request(
        custom_id=f"classify-{email_id}",
        params=MessageCreateParamsNonStreaming(
            model="claude-haiku-4-5",                      # routing: light tier
            max_tokens=128,
            system=[{"type": "text", "text": CLASSIFY_PROMPT,
                     "cache_control": {"type": "ephemeral"}}],   # caching
            messages=[{"role": "user", "content": email}]
        )
    )

def build_extract_request(email_id: str, email: str) -> Request:
    """Step 2: structured extraction → Sonnet, cached."""
    return Request(
        custom_id=f"extract-{email_id}",
        params=MessageCreateParamsNonStreaming(
            model="claude-sonnet-4-6",                     # routing: standard tier
            max_tokens=512,
            system=[{"type": "text", "text": EXTRACT_PROMPT,
                     "cache_control": {"type": "ephemeral"}}],
            messages=[{"role": "user", "content": email}]
        )
    )

def build_draft_request(email_id: str, email: str, urgency: str) -> Request:
    """Step 3: reply draft → Sonnet routine, Opus high-urgency."""
    model = "claude-opus-4-7" if urgency == "high" else "claude-sonnet-4-6"
    return Request(
        custom_id=f"draft-{email_id}",
        params=MessageCreateParamsNonStreaming(
            model=model,                                   # routing: dynamic
            max_tokens=1024,
            system=[{"type": "text", "text": DRAFT_REPLY_PROMPT,
                     "cache_control": {"type": "ephemeral"}}],
            messages=[{"role": "user", "content": email}]
        )
    )

def process_email_batch(emails: list[dict]) -> str:
    requests = []
    for e in emails:
        requests.append(build_classify_request(e["id"], e["text"]))
        requests.append(build_extract_request(e["id"], e["text"]))
        requests.append(build_draft_request(e["id"], e["text"], e["urgency"]))
    batch = client.messages.batches.create(requests=requests)   # batch
    return batch.id`}</div>

          <div className="section-divider" />

          <h3 className="sub-heading">Five-step action plan</h3>
          <div className="gotcha-list">
            <div className="gotcha-card">
              <span className="gotcha-num">1</span>
              <span className="gotcha-title">Add caching first</span>
              <div className="gotcha-body">Identify your largest static prefix (usually the system prompt), pad it above the model minimum if needed, mark it with one <code className="inline">cache_control</code> block, log <code className="inline">cache_read_input_tokens</code> to confirm. 5 minutes of work, often 70–90% off your input bill.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">2</span>
              <span className="gotcha-title">Audit which workloads are async</span>
              <div className="gotcha-body">List every place your code calls the LLM API. For each, ask: <em>"Could this tolerate up to 24 hours of latency?"</em> Most teams discover the majority can. Migrate the highest-volume async workload to Batch first.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">3</span>
              <span className="gotcha-title">Migrate obvious wins to Haiku</span>
              <div className="gotcha-body">Classification, simple extraction, format conversion, routing decisions. Run side-by-side on real traffic. If Haiku matches Sonnet on the metrics that matter, switch.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">4</span>
              <span className="gotcha-title">Keep Sonnet as your default</span>
              <div className="gotcha-body">For everything in the gray zone. Don't agonize over whether something might run on Haiku unless you have data. Reserve Opus only for proven needs — <em>"it might benefit from Opus"</em> is not enough justification.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">5</span>
              <span className="gotcha-title">Build a quality dashboard before you start</span>
              <div className="gotcha-body">You cannot do model routing safely without measurement. Track quality per tier per task type. <em>Routing without measurement is gambling, not optimization.</em></div>
            </div>
          </div>

          <div className="insight-box">
            <div className="insight-label">
              <I.Bulb color="#2ecc71" />
              THE COMPOUND EFFECT
            </div>
            Production LLM costs in 2026 can be <strong>5–15× lower</strong> than they were in 2024 for the same workloads. None of these techniques requires a research team or custom infrastructure — just the discipline to recognize that <em>where</em> you call the API, <em>which</em> model you call, and <em>which</em> parts you cache are architectural decisions, not optimizations.
          </div>
        </>
      );
    }

    /* ===================== Guide shell ===================== */
    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stages = [
        { id: 'overview', label: 'Overview', Icon: I.Grid,  render: () => <OverviewStage /> },
        { id: 'caching',  label: 'Caching',  Icon: I.Cache, render: () => <CachingStage /> },
        { id: 'batch',    label: 'Batch',    Icon: I.Batch, render: () => <BatchStage /> },
        { id: 'routing',  label: 'Routing',  Icon: I.Route, render: () => <RoutingStage /> },
        { id: 'stack',    label: 'Stack',    Icon: I.Stack, render: () => <StackStage /> }
      ];

      const totalStages = stages.length;
      const handleNext = () => { if (currentStage < totalStages - 1) setCurrentStage(currentStage + 1); };
      const handlePrev = () => { if (currentStage > 0) setCurrentStage(currentStage - 1); };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {stages.map((step, idx) => {
                const StepIcon = step.Icon;
                const isActive = currentStage === idx;
                return (
                  <React.Fragment key={step.id}>
                    <div className={`step-wrapper ${isActive ? 'active' : ''}`}>
                      <button
                        type="button"
                        className={`step-btn ${isActive ? 'active' : ''}`}
                        aria-label={`Step ${idx + 1}: ${step.label}`}
                        aria-current={isActive ? "step" : undefined}
                        onClick={() => setCurrentStage(idx)}
                      >
                        <StepIcon size={22} color={isActive ? 'white' : '#6c5ce7'} />
                      </button>
                      <div className="step-btn-label">{step.label}</div>
                    </div>
                    {idx < stages.length - 1 && (
                      <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">← Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">2.3</span>
                    <h1 className="title">Cost Optimization Trio</h1>
                  </div>
                  <div style={{ marginLeft: '16px' }}>
                    <div className="badge">USE CASE</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of {totalStages}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button type="button" className="arrow-btn" aria-label="Previous section" onClick={handlePrev} disabled={currentStage === 0} title="Previous">&#8592;</button>
                    <button type="button" className="arrow-btn" aria-label="Next section" onClick={handleNext} disabled={currentStage === totalStages - 1} title="Next">&#8594;</button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide" key={currentStage}>
                {stages[currentStage].render()}
                {currentStage === totalStages - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">→</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
