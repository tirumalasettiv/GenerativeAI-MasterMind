<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    /* SVG icon components — pure JSX, no innerHTML */
    const I = {
      Grid: ({size = 18, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      Cache: ({size = 18, color = 'currentColor'}) => (

          <circle cx="6" cy="19" r="3" /><circle cx="18" cy="5" r="3" />
          <path d="M6 16V8a3 3 0 013-3h6" /><path d="M9 11h6a3 3 0 013 3v2" />
        </svg>
      ),
      Stack: ({size = 18, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" />
        </svg>
      ),
      Bulb: ({size = 14, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9 18h6" /><path d="M10 22h4" />
          <path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z" />
        </svg>
      ),
      Check: ({size = 20}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#2ecc71" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />

      ),
      Cross: ({size = 20}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#e74c3c" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      ),
      Dollar: ({size = 18, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="1" x2="12" y2="23" /><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
        </svg>
      ),
      Warn: ({size = 14, color = 'currentColor'}) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      )
    };

    const NEXT_GUIDE = { id: "2.4", title: "Prompt Engineering Quiz", module: "Module 2", href: "./quiz.html", isQuiz: true };

    const fmt = (n) => {
      if (n >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
      if (n >= 1_000)     return '$' + (n / 1_000).toFixed(1) + 'K';
      return '$' + n.toFixed(0);
    };

    /* ===================== STAGE 0: Overview ===================== */
    function OverviewStage() {
      const stack = [
        { label: 'Naive — all on Opus 4.7',         cost: 27500, color: '#e74c3c', savings: 0 },
        { label: 'Routing only',                    cost:  9900, color: '#f39c12', savings: 64 },
        { label: 'Routing + caching',               cost:  3500, color: '#3498db', savings: 87 },
        { label: 'Routing + caching + batch',       cost:  1800, color: '#2ecc71', savings: 93 }
      ];
      const max = Math.max(...stack.map(s => s.cost));

      return (
        <>
          <div><h2 className="stage-header">The Three Levers That Cut Your LLM Bill 90%+</h2></div>
          <div className="explanation">
            Most beginner tutorials teach you to call <code className="inline">client.messages.create()</code> and stop there. Production LLM teams use three architectural levers — <strong>prompt caching</strong>, <strong>batch processing</strong>, and <strong>model routing</strong> — that compound to cut bills by 90% or more on the same workload, with zero quality loss. None of these are exotic. All three live in the docs. Few beginners turn them on.
          </div>

          <div className="cost-hero">
            <div className="hero-stat-card">
              <span className="hero-stat-label">Prompt caching</span>
              <span className="hero-stat-value">~90% off</span>
              <span className="hero-stat-detail">Cached input tokens cost roughly 10% of the standard rate. One <code className="inline">cache_control</code> flag, two-call break-even.</span>
            </div>
            <div className="hero-stat-card">
              <span className="hero-stat-label">Batch processing</span>
              <span className="hero-stat-value">50% off</span>
              <span className="hero-stat-detail">Async submission, results within 24 hours. Both input and output tokens. Stacks with caching.</span>
            </div>
            <div className="hero-stat-card">
              <span className="hero-stat-label">Model routing</span>
              <span className="hero-stat-value">50–80% off</span>
              <span className="hero-stat-detail">Send the easy 70% of work to Haiku, keep Opus for the hard 10%. Match the tier to the task.</span>
            </div>
            <div className="hero-stat-card">
              <span className="hero-stat-label">All three combined</span>
              <span className="hero-stat-value">~93% off</span>
              <span className="hero-stat-detail">Caching + batch + routing on a 1M-request workload: $27,500/mo → $1,800/mo. Same outputs.</span>
            </div>
          </div>

          <div className="stack-wrap">
            <div className="stack-title">
              <I.Dollar color="#6c5ce7" />
              Compounding savings — 1M requests / month, 3K input + 500 output tokens each
            </div>
            {stack.map((row, i) => (
              <div className="stack-row" key={i}>
                <div className="stack-label">{row.label}</div>
                <div className="stack-bar-track">
                  <div className="stack-bar-fill" style={{ width: `${(row.cost / max) * 100}%`, background: row.color }} />
                </div>
                <div className="stack-cost">
                  {fmt(row.cost)}
                  {row.savings > 0 && <div style={{ fontSize: 11, color: '#1a5e3a', fontWeight: 600 }}>−{row.savings}%</div>}
                </div>
              </div>
            ))}
          </div>

          <div className="insight-box">
            <div className="insight-label">
              <I.Bulb color="#2ecc71" />
              THE MENTAL MODEL
            </div>
            LLM cost optimization is mostly architectural — <em>where</em> you call the API, <em>which</em> model you call, <em>which</em> parts you cache. Once you internalize that, "saving money" stops feeling like a chore and starts feeling like designing the system correctly.
          </div>
        </>
      );
    }

    /* ===================== STAGE 1: Caching ===================== */
    function CachingStage() {
      const [tokens, setTokens] = useState(8000);
      const [callsPerHour, setCallsPerHour] = useState(100);
      const [hoursPerMonth, setHoursPerMonth] = useState(720);

import logging
import anthropic
from anthropic.types.message_create_params import MessageCreateParamsNonStreaming
from anthropic.types.messages.batch_create_params import Request

logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
log = logging.getLogger("acme.batch")

# Stable instructions — same across every ticket in the batch, perfect to cache.
CLASSIFY_PROMPT = """You are a support ticket classifier for AcmeCorp.

CATEGORIES (pick exactly one):
- billing      : invoices, refunds, payment failures
- auth         : login, MFA, password reset, SSO
- bug          : product feature broken, error message, crash
- feature      : feature request, "how do I...?" without a bug
- abuse        : suspected fraud or policy violation

- low          : informational, no business impact
- medium       : single-user blocked
- high         : multi-user outage or data risk

OUTPUT FORMAT — STRICT JSON, no commentary:
{"category": "...", "severity": "...", "team": "...", "summary": "<= 20 words"}

[ ... ~3,500 more tokens of category disambiguation rules and edge cases ... ]
"""


# ---------------------------------------------------------------------------
# 1. BUILD THE BATCH. Each request carries its own custom_id so you can match
#    the response back to the source record (DB row, ticket number, hash, etc).
# ---------------------------------------------------------------------------
def build_request(ticket: dict) -> Request:
    return Request(
        custom_id=ticket["id"],
        params=MessageCreateParamsNonStreaming(
            model="claude-sonnet-4-6",
            max_tokens=256,
            system=[{
                "type": "text",
                "text": CLASSIFY_PROMPT,
                "cache_control": {"type": "ephemeral"},   # caching INSIDE batch
            }],
            messages=[{"role": "user", "content": ticket["text"]}],
        ),
    )


def submit_batch(tickets: list[dict]) -> str:
    """Submit a batch and return its ID. Cap at 100,000 requests / 256MB."""
    if len(tickets) > 100_000:
        raise ValueError("split this into multiple batches")
    batch = client.messages.batches.create(
        requests=[build_request(t) for t in tickets]
    )
    log.info("submitted batch %s with %s requests", batch.id, len(tickets))
    return batch.id


# ---------------------------------------------------------------------------
# 2. POLL until the batch ends. In production you'd use webhooks instead — but
#    polling is fine for one-off jobs and exploratory work.
# ---------------------------------------------------------------------------
def wait_for_batch(batch_id: str, poll_seconds: int = 60, timeout_hours: int = 24) -> str:
    deadline = time.time() + (timeout_hours * 3600)
    while time.time() < deadline:
        batch = client.messages.batches.retrieve(batch_id)
        counts = batch.request_counts
        log.info(
            "batch %s status=%s succeeded=%s errored=%s expired=%s processing=%s",
            batch_id, batch.processing_status,
            counts.succeeded, counts.errored, counts.expired, counts.processing,
        )
        if batch.processing_status == "ended":
            return batch.processing_status
        time.sleep(poll_seconds)
    raise TimeoutError(f"batch {batch_id} did not finish within {timeout_hours} hours")


# ---------------------------------------------------------------------------
# 3. STREAM RESULTS. Batches don't fail — INDIVIDUAL REQUESTS do. Always handle
#    every result.type explicitly. Plan for partial success.
# ---------------------------------------------------------------------------
def consume_results(batch_id: str) -> dict:
    summary = {"succeeded": 0, "errored": 0, "canceled": 0, "expired": 0}

    for result in client.messages.batches.results(batch_id):
        rtype = result.result.type
        summary[rtype] = summary.get(rtype, 0) + 1

        if rtype == "succeeded":
            text = result.result.message.content[0].text
            save_classification(result.custom_id, text)

        elif rtype == "errored":
            err = result.result.error
            log.error("ticket=%s errored: %s %s", result.custom_id, err.type, err.message)
            # 4xx on YOUR input -> log and move on
            # 5xx from API     -> queue for retry in next batch

        elif rtype == "expired":
            log.warning("ticket=%s expired (24h timeout) — requeue", result.custom_id)
            requeue_for_next_batch(result.custom_id)

        elif rtype == "canceled":
            log.info("ticket=%s canceled", result.custom_id)

    log.info("batch %s consumed: %s", batch_id, summary)
    return summary


# ---------------------------------------------------------------------------
# 4. PUT IT TOGETHER. Submit at ~02:00, results land before the morning standup.
# ---------------------------------------------------------------------------
if __name__ == "__main__":
    tickets = load_overnight_tickets()       # your DB query / Kafka consumer
    bid = submit_batch(tickets)
    wait_for_batch(bid)
    summary = consume_results(bid)
    log.info("done: %s", summary)`}</div>

# STATIC ROUTING — the decision is hardcoded by task type at design time.
# This is where every team should start. No classifier, no surprises.
# =============================================================================
import anthropic
from dataclasses import dataclass
from enum import Enum

client = anthropic.Anthropic()


class Tier(str, Enum):
    LIGHT    = "claude-haiku-4-5"
    STANDARD = "claude-sonnet-4-6"
    HEAVY    = "claude-opus-4-7"


@dataclass
class TierConfig:
    model: str
    max_tokens: int           # tight per-tier output caps to control cost
    fallback: str | None      # next tier up, used on degenerate output


TIERS: dict[Tier, TierConfig] = {
    Tier.LIGHT:    TierConfig(Tier.LIGHT.value,     max_tokens=512,  fallback=Tier.STANDARD.value),
    Tier.STANDARD: TierConfig(Tier.STANDARD.value,  max_tokens=2048, fallback=Tier.HEAVY.value),
    Tier.HEAVY:    TierConfig(Tier.HEAVY.value,     max_tokens=4096, fallback=None),
}


def _call(tier: Tier, prompt: str, *, system: str | None = None) -> str:
    cfg = TIERS[tier]
    response = client.messages.create(
        model=cfg.model,
        max_tokens=cfg.max_tokens,
        system=system or "",
        messages=[{"role": "user", "content": prompt}],
    )
    return response.content[0].text


# ----------------------------- TASK FUNCTIONS --------------------------------
# Different task types, different tiers. The decision is OBVIOUS in code.
# A reviewer reading classify_ticket() can immediately see why Haiku is fine.

def classify_ticket(text: str) -> str:
    """Bounded classification with 5 known categories — Haiku handles this."""
    return _call(Tier.LIGHT, text, system="Classify the ticket into: billing | auth | bug | feature | abuse.")


def extract_invoice_fields(invoice_text: str) -> str:
    """Structured extraction with a fixed schema — also Haiku-fine."""
    return _call(Tier.LIGHT, invoice_text, system="Extract: vendor, total, currency, due_date as JSON.")


def generate_code_review(diff: str) -> str:
    """Multi-step code reasoning — Sonnet is the right floor for quality."""
    return _call(Tier.STANDARD, diff, system="You are a senior engineer. Review correctness, security, perf.")


def synthesize_research_brief(documents: list[str]) -> str:
    """Cross-document synthesis — Sonnet handles the bulk of production work."""
    joined = "\\n\\n---\\n\\n".join(documents)
    return _call(Tier.STANDARD, joined, system="Produce a 1-page brief with citations to source IDs.")


def architect_distributed_system(requirements: str) -> str:
    """Novel design with serious tradeoff reasoning — Opus earns its price."""
    return _call(Tier.HEAVY, requirements, system="You are a principal architect. Design and justify tradeoffs.")


def negotiate_complex_contract(context: str) -> str:
    """Adversarial multi-party reasoning — Opus territory."""
    return _call(Tier.HEAVY, context, system="You are senior counsel. Identify risks, leverage, and counter-positions.")`}</div>

          <div className="code-block" style={{ marginTop: 12 }}>{`# =============================================================================
# DYNAMIC ROUTING — a fast classifier picks the tier at request time.
# Use this when you genuinely cannot tell at design time how hard a request is
# (general-purpose chatbots, mixed-difficulty queues, ad-hoc developer tools).
# =============================================================================
import logging

log = logging.getLogger("acme.router")

ROUTING_SYSTEM = """You classify the COMPLEXITY of a user request. Output one
word, no commentary, no punctuation:

SIMPLE    - factual lookup, classification, extraction, format conversion
STANDARD  - code, multi-step reasoning, document synthesis, planning
COMPLEX   - novel problems, deep architecture, multi-agent coordination,
            high-stakes decisions, adversarial reasoning

If unsure, output STANDARD."""


# Per-tier metrics so you can ALERT when the router misbehaves. A bug in the
# classifier sending 100% of traffic to Opus has bankrupted real teams. Don't
# skip the observability.
_tier_counter = {"SIMPLE": 0, "STANDARD": 0, "COMPLEX": 0, "FALLBACK": 0}


def classify_complexity(user_prompt: str) -> Tier:
    """Use Haiku to pick the tier. Costs ~10 tokens out + a few hundred in."""
    decision = client.messages.create(
        model=Tier.LIGHT.value,
        max_tokens=4,                           # tight cap — we want one word
        system=ROUTING_SYSTEM,
        messages=[{"role": "user", "content": user_prompt}],
    )
    raw = decision.content[0].text.strip().upper()

    table = {
        "SIMPLE":   Tier.LIGHT,
        "STANDARD": Tier.STANDARD,
        "COMPLEX":  Tier.HEAVY,
    }
    if raw in table:
        _tier_counter[raw] += 1
        return table[raw]

    # Classifier hallucinated something unexpected. Don't crash, don't escalate
    # to Opus by accident — fall back to the safe middle tier.
    _tier_counter["FALLBACK"] += 1
    log.warning("router returned unexpected token %r — falling back to Sonnet", raw)
    return Tier.STANDARD


def route_request(user_prompt: str, *, kill_switch: Tier | None = None) -> str:
    """Dynamic-route a single request. kill_switch pins everything to one tier
    if the router is misbehaving in production (set via feature flag)."""
    tier = kill_switch or classify_complexity(user_prompt)
    log.info("routed to %s: %r", tier.name, user_prompt[:80])

    cfg = TIERS[tier]
    response = client.messages.create(
        model=cfg.model,
        max_tokens=cfg.max_tokens,
        messages=[{"role": "user", "content": user_prompt}],
    )
    text = response.content[0].text

    # Confidence check on the LIGHT tier — Haiku will gracefully fail on the
    # 5-10% of inputs it can't actually handle. Detect degenerate output and
    # retry one tier up. The cost bump is tiny vs. the quality save.
    if tier == Tier.LIGHT and _looks_degenerate(text):
        log.info("Haiku output looked degenerate, retrying on Sonnet")
        return route_request(user_prompt, kill_switch=Tier.STANDARD)

    return text


def _looks_degenerate(text: str) -> bool:
    """Cheap heuristic: too short, hedging, or refusing without reason."""
    if len(text) < 20:
        return True
    hedges = ["i'm not sure", "i cannot", "as an ai", "i don't have"]
    lowered = text.lower()
    return any(h in lowered for h in hedges)`}</div>

              <span className="gotcha-num">4</span>
              <span className="gotcha-title">Cache breakage across tiers</span>
              <div className="gotcha-body">Caches are per-model. Routing the same system prompt across Haiku and Sonnet maintains two caches with worse hit rates. <strong>Fix:</strong> for static routing, accept duplicate caches — savings still exceed the cost. Monitor <code className="inline">cache_read_input_tokens</code> per model.</div>
            </div>
            <div className="gotcha-card">

              <span className="gotcha-title">The classifier itself can hallucinate</span>
              <div className="gotcha-body">Dynamic routers occasionally output garbage — neither SIMPLE nor STANDARD nor COMPLEX. <strong>Fix:</strong> always have a sane fallback (<code className="inline">{`model_map.get(tier, "claude-sonnet-4-6")`}</code>). Sonnet is almost always the right default.</div>

          <h3 className="sub-heading">All three in one pipeline</h3>
          <div className="explanation" style={{ marginTop: 0 }}>

          <div className="code-block">{`# =============================================================================
# THE CANONICAL PRODUCTION SHAPE: routing + caching + batch in a single pipeline.
# Workload: incoming customer support emails — classify, extract, draft a reply.
# Each stage picks the right tier, caches its stable prompt, and submits async.
# =============================================================================
import logging
import anthropic
from anthropic.types.message_create_params import MessageCreateParamsNonStreaming
from anthropic.types.messages.batch_create_params import Request

log = logging.getLogger("acme.email_pipeline")
client = anthropic.Anthropic()

# ---------------------------------------------------------------------------
# Stable instruction blocks — different prompts per task, all cacheable. The
# byte-for-byte stability of these strings is what makes caching work; do NOT
# interpolate timestamps, request IDs, or per-email values into them.
# ---------------------------------------------------------------------------
CLASSIFY_PROMPT = """You are a support email classifier for AcmeCorp.
Output strict JSON: {"category": "...", "severity": "...", "team": "..."}.
[ ... ~4,000 tokens of categories, examples, edge cases ... ]"""

EXTRACT_PROMPT = """Extract structured data from this support email.
Output strict JSON matching the schema below — no extra fields, no commentary.
SCHEMA: {customer_email, order_id?, product?, requested_action, deadline?}
[ ... ~3,000 tokens of schema rules, parsing examples, ambiguity tiebreakers ... ]"""

DRAFT_REPLY_PROMPT = """Draft a professional reply to this customer email.
TONE: warm, concrete, never apologetic without cause. Cite product docs by slug.
ESCALATION: any legal / safety / billing >$500 -> mark as 'NEEDS HUMAN' and stop.
[ ... ~5,000 tokens of brand voice, escalation rules, refund policies, examples ... ]"""


# ---------------------------------------------------------------------------
# STEP 1 — CLASSIFY. Bounded categorical task. Haiku is the right floor.
# Cached prompt + batch + Haiku = roughly 5% of standard sync-Opus pricing.
# ---------------------------------------------------------------------------
def build_classify_request(email_id: str, email_text: str) -> Request:
    return Request(
        custom_id=f"classify-{email_id}",
        params=MessageCreateParamsNonStreaming(
            model="claude-haiku-4-5",                          # routing: LIGHT
            max_tokens=128,                                    # tight cap on cheap tier
            system=[{
                "type": "text",
                "text": CLASSIFY_PROMPT,
                "cache_control": {"type": "ephemeral"},        # caching
            }],
            messages=[{"role": "user", "content": email_text}],
        ),
    )


# ---------------------------------------------------------------------------
# STEP 2 — EXTRACT. Structured schema with disambiguation rules. Sonnet is the
# safer default for any extraction beyond simple key-value pairs.
# ---------------------------------------------------------------------------
def build_extract_request(email_id: str, email_text: str) -> Request:
    return Request(
        custom_id=f"extract-{email_id}",
        params=MessageCreateParamsNonStreaming(
            model="claude-sonnet-4-6",                         # routing: STANDARD
            max_tokens=512,
            system=[{
                "type": "text",
                "text": EXTRACT_PROMPT,
                "cache_control": {"type": "ephemeral"},
            }],
            messages=[{"role": "user", "content": email_text}],
        ),
    )


# ---------------------------------------------------------------------------
# STEP 3 — DRAFT REPLY. Dynamic routing within the pipeline: routine drafts
# stay on Sonnet, high-urgency or escalated drafts get Opus. Output cap is
# tighter on Sonnet because long outputs there are usually a sign of drift.
# ---------------------------------------------------------------------------
def build_draft_request(email_id: str, email_text: str, urgency: str) -> Request:
    if urgency == "high":
        model = "claude-opus-4-7"                              # routing: HEAVY
        max_tokens = 1500
    else:
        model = "claude-sonnet-4-6"                            # routing: STANDARD
        max_tokens = 800
    return Request(
        custom_id=f"draft-{email_id}",
        params=MessageCreateParamsNonStreaming(
            model=model,
            max_tokens=max_tokens,
            system=[{
                "type": "text",
                "text": DRAFT_REPLY_PROMPT,
                "cache_control": {"type": "ephemeral"},
            }],
            messages=[{"role": "user", "content": email_text}],
        ),
    )


# ---------------------------------------------------------------------------
# SUBMIT a batch with all three steps interleaved. Anthropic processes them in
# parallel, billing is 50% off the per-tier rate, and the cached prompts cost
# 10% of that for every cache-hit request. Most batches finish in under an hour.
# ---------------------------------------------------------------------------
def process_email_batch(emails: list[dict]) -> str:
    if len(emails) > 33_000:
        # 3 requests per email * 33,000 emails = ~99,000 requests, under the
        # 100,000 cap. Beyond this, split into multiple batches.
        raise ValueError("split into multiple batches")

    requests: list[Request] = []
    for e in emails:
        requests.append(build_classify_request(e["id"], e["text"]))
        requests.append(build_extract_request(e["id"], e["text"]))
        requests.append(build_draft_request(e["id"], e["text"], e["urgency"]))

    batch = client.messages.batches.create(requests=requests)
    log.info(
        "submitted batch %s with %s requests across 3 stages for %s emails",
        batch.id, len(requests), len(emails),
    )
    return batch.id


# ---------------------------------------------------------------------------
# CONSUME results. custom_id encodes BOTH the stage and the email_id so we can
# re-assemble the per-email record from the flat result stream.
# ---------------------------------------------------------------------------
def collect_results(batch_id: str) -> dict[str, dict]:
    by_email: dict[str, dict] = {}

    for result in client.messages.batches.results(batch_id):
        if result.result.type != "succeeded":
            log.warning("dropping %s -> %s", result.custom_id, result.result.type)
            continue

        stage, email_id = result.custom_id.split("-", 1)
        text = result.result.message.content[0].text
        by_email.setdefault(email_id, {})[stage] = text

    log.info("collected %s emails from batch %s", len(by_email), batch_id)
    return by_email


# ---------------------------------------------------------------------------
# PUT IT TOGETHER. Run nightly at 02:00; results land before the morning shift.
# Cost vs. naive (all-Opus, sync, no caching): ~5-7% — same outputs to the user.
# ---------------------------------------------------------------------------
if __name__ == "__main__":
    emails = load_overnight_emails()              # your DB query / queue
    batch_id = process_email_batch(emails)
    wait_for_batch(batch_id)                      # poll or use webhooks
    records = collect_results(batch_id)

    for email_id, stages in records.items():
        write_to_crm(email_id, stages)            # category + extract + draft`}</div>

          <h3 className="sub-heading">Five-step action plan</h3>
          <div className="gotcha-list">
            <div className="gotcha-card">
              <span className="gotcha-num">1</span>
              <span className="gotcha-title">Add caching first</span>
              <div className="gotcha-body">Identify your largest static prefix (usually the system prompt), pad it above the model minimum if needed, mark it with one <code className="inline">cache_control</code> block, log <code className="inline">cache_read_input_tokens</code> to confirm. 5 minutes of work, often 70–90% off your input bill.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">2</span>
              <span className="gotcha-title">Audit which workloads are async</span>
              <div className="gotcha-body">List every place your code calls the LLM API. For each, ask: <em>"Could this tolerate up to 24 hours of latency?"</em> Most teams discover the majority can. Migrate the highest-volume async workload to Batch first.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">3</span>
              <span className="gotcha-title">Migrate obvious wins to Haiku</span>
              <div className="gotcha-body">Classification, simple extraction, format conversion, routing decisions. Run side-by-side on real traffic. If Haiku matches Sonnet on the metrics that matter, switch.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">4</span>
              <span className="gotcha-title">Keep Sonnet as your default</span>
              <div className="gotcha-body">For everything in the gray zone. Don't agonize over whether something might run on Haiku unless you have data. Reserve Opus only for proven needs — <em>"it might benefit from Opus"</em> is not enough justification.</div>
            </div>
            <div className="gotcha-card">
              <span className="gotcha-num">5</span>
              <span className="gotcha-title">Build a quality dashboard before you start</span>
              <div className="gotcha-body">You cannot do model routing safely without measurement. Track quality per tier per task type. <em>Routing without measurement is gambling, not optimization.</em></div>
            </div>
          </div>

          <div className="insight-box">
            <div className="insight-label">
              <I.Bulb color="#2ecc71" />
              THE COMPOUND EFFECT
            </div>
            Production LLM costs in 2026 can be <strong>5–15× lower</strong> than they were in 2024 for the same workloads. None of these techniques requires a research team or custom infrastructure — just the discipline to recognize that <em>where</em> you call the API, <em>which</em> model you call, and <em>which</em> parts you cache are architectural decisions, not optimizations.
          </div>

          <div className="container">

                const StepIcon = step.Icon;
                const isActive = currentStage === idx;
                return (
                  <React.Fragment key={step.id}>
                    <div className={`step-wrapper ${isActive ? 'active' : ''}`}>
                      <button

                        className={`step-btn ${isActive ? 'active' : ''}`}
                        aria-label={`Step ${idx + 1}: ${step.label}`}
                        aria-current={isActive ? "step" : undefined}

                        <StepIcon size={22} color={isActive ? 'white' : '#6c5ce7'} />
                      </button>
                      <div className="step-btn-label">{step.label}</div>
                    </div>
                    {idx < stages.length - 1 && (
                      <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </aside>

              <div className="top-bar">
                <div className="left-section">

                  <div style={{ marginLeft: '16px' }}>
                    <div className="badge">USE CASE</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of {totalStages}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button type="button" className="arrow-btn" aria-label="Previous section" onClick={handlePrev} disabled={currentStage === 0} title="Previous">&#8592;</button>
                    <button type="button" className="arrow-btn" aria-label="Next section" onClick={handleNext} disabled={currentStage === totalStages - 1} title="Next">&#8594;</button>
                  </nav>
                </div>
              </div>

                {stages[currentStage].render()}

                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">

                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }
