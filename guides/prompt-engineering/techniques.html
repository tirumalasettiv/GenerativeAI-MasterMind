<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Master 12 Prompt Engineering Techniques</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
    }

    #root {
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 120px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      padding: 80px 12px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .step-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .step-btn.active {
      background: #6c5ce7;
      border-color: #6c5ce7;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .step-btn:hover {
      border-color: #6c5ce7;
      transform: translateY(-2px);
    }

    .step-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    .step-wrapper.active .step-btn-label {
      color: #6c5ce7;
    }

    .step-connector {
      width: 2px;
      height: 16px;
      background: #e0e0e0;
      margin: 2px 0;
      flex-shrink: 0;
    }

    .step-connector.active {
      background: #6c5ce7;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 3px solid transparent;
      border-image: linear-gradient(90deg, #6c5ce7, #a78bfa, #2ecc71) 1;
      background: white;
      flex-shrink: 0;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      color: #6c5ce7;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #2ecc71;
    }

    .badge {
      display: inline-block;
      background: #e8e3f8;
      color: #6c5ce7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .guide-number {
      font-family: 'Fraunces', serif;
      font-size: 20px;
      font-weight: 700;
      color: #b0a6e8;
      margin-right: 8px;
    }

    .title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stage-header {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .nav-arrows {
      display: flex;
      gap: 12px;
    }

    .arrow-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .arrow-btn:hover {
      border-color: #6c5ce7;
      color: #6c5ce7;
      transform: translateY(-2px);
    }

    .arrow-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 32px 48px;
      gap: 30px;
    }

    .explanation {
      font-size: 22px;
      line-height: 1.7;
      color: #2a2a2a;
    }

    .scene-card {
      background: linear-gradient(135deg, #fafafe 0%, #f5f3ff 50%, #f0f8ff 100%);
      border-radius: 16px;
      padding: 40px;
      border: 1px solid #e8e3f8;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.08);
    }

    .insight-box {
      background: #f0faf0;
      border-left: 4px solid #2ecc71;
      padding: 24px;
      border-radius: 8px;
      color: #1a5e3a;
      font-size: 17px;
      line-height: 1.7;
      margin-top: 24px;
      position: relative;
    }

    .insight-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #2ecc71;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .progress-indicator {
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      background: #f5f3ff;
      padding: 4px 12px;
      border-radius: 12px;
      margin-right: 12px;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    /* Technique-specific styles */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #999;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .tab.active {
      color: #6c5ce7;
      border-bottom-color: #6c5ce7;
    }

    .code-block {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      overflow-x: auto;
      margin: 12px 0;
    }

    .code-output {
      background: #ecf0f1;
      color: #2c3e50;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-top: 8px;
      border-left: 3px solid #6c5ce7;
    }

    .interactive-demo {
      display: flex;
      gap: 20px;
      flex-direction: column;
    }

    .demo-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .demo-label {
      font-weight: 600;
      color: #2c3e50;
      font-size: 14px;
    }

    .constraint-builder {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .constraint-input {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .constraint-box {
      flex: 1;
      padding: 12px;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      background: white;
      font-size: 13px;
      line-height: 1.5;
    }

    .add-btn {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      background: #5a4cb8;
    }

    .remove-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .remove-btn:hover {
      background: #ee5a52;
    }

    .pipeline-viz {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pipeline-box {
      background: #e0d4ff;
      border: 2px solid #6c5ce7;
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #6c5ce7;
      text-align: center;
      min-width: 120px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .pipeline-box:hover {
      background: #6c5ce7;
      color: white;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
    }

    .pipeline-arrow {
      font-size: 20px;
      color: #999;
    }

    .role-selector {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .role-btn {
      padding: 10px 16px;
      border: 1px solid #e9ecef;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .role-btn.selected {
      background: #6c5ce7;
      color: white;
      border-color: #6c5ce7;
    }

    .response-box {
      background: white;
      border: 1px solid #e9ecef;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    .analysis-paths {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 12px 0;
    }

    .analysis-path {
      background: white;
      border: 1px solid #e9ecef;
      padding: 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .consensus-panel {
      background: #f0faf0;
      border: 2px solid #2ecc71;
      padding: 16px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.6;
      color: #2d5016;
    }

    .key-takeaways {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .takeaway-card {
      background: white;
      border: 1px solid #e9ecef;
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .takeaway-card:hover {
      border-color: #6c5ce7;
      box-shadow: 0 2px 8px rgba(108, 92, 231, 0.15);
    }

    .takeaway-title {
      font-weight: 600;
      color: #6c5ce7;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .takeaway-content {
      font-size: 13px;
      line-height: 1.5;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const A = "#6c5ce7", G = "#2ecc71", GD = "#1a9456";

    // Stage 1: Zero-Shot & Few-Shot
    const S1 = () => {
      const [mode, setMode] = useState('zero');
      return (
        <>
          <div><div className="stage-header">Zero-Shot &amp; Few-Shot</div></div>
          <div className="explanation">
            Zero-Shot and Few-Shot prompting are foundational techniques that control how much context and examples you provide to the AI.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start' }}>
            <div className="tabs">
              <button className={`tab ${mode === 'zero' ? 'active' : ''}`} onClick={() => setMode('zero')}>Zero-Shot</button>
              <button className={`tab ${mode === 'few' ? 'active' : ''}`} onClick={() => setMode('few')}>Few-Shot</button>
            </div>
            {mode === 'zero' ? (
              <div style={{ width: '100%' }}>
                <div style={{ marginBottom: '16px' }}>
                  <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>Prompt:</div>
                  <div className="code-block">Explain Python's try-except-finally in 3 sentences</div>
                </div>
                <div>
                  <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>AI Response:</div>
                  <div className="code-output">try-except-finally is Python's error handling mechanism where try runs code that might fail, except catches specific errors, and finally runs cleanup code regardless of success or failure. The try block attempts execution, except blocks define what happens when specific exceptions occur, and the finally block guarantees execution for resource cleanup. This structure prevents crashes and ensures proper cleanup.</div>
                </div>
              </div>
            ) : (
              <div style={{ width: '100%' }}>
                <div style={{ marginBottom: '16px' }}>
                  <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>Examples (showing context):</div>
                  <div className="code-block">{`Input: "Book flight to NYC"
Output: {"type": "flight", "destination": "NYC"}`}</div>
                  <div className="code-block" style={{ marginTop: '8px' }}>{`Input: "Reserve hotel in Paris"
Output: {"type": "hotel", "location": "Paris"}`}</div>
                </div>
                <div style={{ marginBottom: '16px' }}>
                  <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>Your Task:</div>
                  <div className="code-block">Extract booking details from: "Reserve 2 hotel rooms in Tokyo for 5 nights"</div>
                </div>
                <div>
                  <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>Expected Output:</div>
                  <div className="code-output">{`{"type": "hotel", "location": "Tokyo", "quantity": 2, "nights": 5}`}</div>
                </div>
              </div>
            )}
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Zero-shot works for simple tasks, but Few-Shot dramatically improves accuracy by showing the AI the exact format and patterns you want.
          </div>
        </>
      );
    };

    // Stage 2: Chain-of-Thought & ReAct
    const S2 = () => {
      const [mode, setMode] = useState('cot');
      return (
        <>
          <div><div className="stage-header">Chain-of-Thought &amp; ReAct</div></div>
          <div className="explanation">
            Chain-of-Thought reasoning breaks complex problems into steps. ReAct extends this by adding actions and observations for tool use.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start' }}>
            <div className="tabs">
              <button className={`tab ${mode === 'cot' ? 'active' : ''}`} onClick={() => setMode('cot')}>Chain-of-Thought</button>
              <button className={`tab ${mode === 'react' ? 'active' : ''}`} onClick={() => setMode('react')}>ReAct</button>
            </div>
            {mode === 'cot' ? (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', width: '100%' }}>
                <div style={{ fontSize: '13px', fontWeight: '600', color: '#2c3e50' }}>Marketing ROI Calculation (Step by Step):</div>
                <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2d5016' }}>
                  <strong>Step 1:</strong> Revenue from campaign = $45,000
                </div>
                <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2d5016' }}>
                  <strong>Step 2:</strong> Attribute to marketing: 60% = $45,000 × 0.60 = $27,000
                </div>
                <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2d5016' }}>
                  <strong>Step 3:</strong> Marketing cost = $10,000
                </div>
                <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2d5016' }}>
                  <strong>Step 4:</strong> ROI = (Profit / Cost) × 100 = ($27,000 - $10,000) / $10,000 × 100 = 170%
                </div>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', width: '100%' }}>
                <div style={{ fontSize: '13px', fontWeight: '600', color: '#2c3e50' }}>Web Search Loop:</div>
                <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2c3e50' }}>
                  <strong style={{ color: A }}>Thought:</strong> I need current weather for NYC. Let me search.
                </div>
                <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2c3e50' }}>
                  <strong style={{ color: A }}>Action:</strong> search("NYC weather today")
                </div>
                <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2d5016' }}>
                  <strong style={{ color: GD }}>Observation:</strong> Weather API returned: 72°F, partly cloudy, 15mph wind
                </div>
                <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2c3e50' }}>
                  <strong style={{ color: A }}>Thought:</strong> I have the weather. User might want activity recommendations.
                </div>
                <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2c3e50' }}>
                  <strong style={{ color: A }}>Action:</strong> search("outdoor activities NYC pleasant weather")
                </div>
                <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', lineHeight: 1.6, color: '#2d5016' }}>
                  <strong style={{ color: GD }}>Observation:</strong> Central Park, Brooklyn Bridge walk, outdoor cafes recommended
                </div>
              </div>
            )}
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Explicit step-by-step reasoning dramatically improves accuracy on math, logic, and multi-step problems. ReAct adds tool integration for real-world actions.
          </div>
        </>
      );
    };

    // Stage 3: Role-Based & Prompt Chaining
    const S3 = () => {
      const [role, setRole] = useState('engineer');
      const roles = {
        engineer: { title: 'Data Engineer', response: 'Design a scalable pipeline using Apache Spark for batch processing, Kafka for streaming, and PostgreSQL for the warehouse. Implement incremental loading with change data capture to minimize load times and ensure data consistency across systems.' },
        legal: { title: 'Legal Expert', response: 'Review data governance policies for compliance with GDPR, CCPA, and local regulations. Establish clear data retention policies, access controls, and audit trails. Ensure contracts include proper data processing agreements with third parties.' },
        product: { title: 'Product Manager', response: 'Focus on data that drives user engagement metrics and revenue. Prioritize analytics for A/B testing, user funnel analysis, and retention cohorts. Ensure dashboards surface insights that directly impact product decisions.' }
      };

      return (
        <>
          <div><div className="stage-header">Role-Based &amp; Prompt Chaining</div></div>
          <div className="explanation">
            Role-based prompting gives the AI a persona to adopt. Prompt chaining breaks complex tasks into sequential prompts, each building on the previous.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start', width: '100%' }}>
            <div className="role-selector">
              {Object.entries(roles).map(([key, val]) => (
                <button
                  key={key}
                  className={`role-btn ${role === key ? 'selected' : ''}`}
                  onClick={() => setRole(key)}
                >
                  {val.title}
                </button>
              ))}
            </div>
            <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '12px', color: '#2c3e50', width: '100%' }}>Question: How should we build our data infrastructure?</div>
            <div className="response-box">
              {roles[role].response}
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Assign specific personas and constraints to get highly tailored responses. Chaining prompts helps break down complex projects into manageable steps.
          </div>
        </>
      );
    };

    // Stage 4: Constraints & Negative Prompting
    const S4 = () => {
      const [constraints, setConstraints] = useState([
        'Must include quantified metrics (numbers, percentages)',
        'No marketing fluff or hype language'
      ]);
      const [negatives, setNegatives] = useState([
        'DO NOT include apologies or disclaimers',
        'DO NOT use print statements'
      ]);

      const addConstraint = () => setConstraints([...constraints, 'New constraint...']);
      const removeConstraint = (i) => setConstraints(constraints.filter((_, idx) => idx !== i));
      const addNegative = () => setNegatives([...negatives, 'New negative constraint...']);
      const removeNegative = (i) => setNegatives(negatives.filter((_, idx) => idx !== i));

      return (
        <>
          <div><div className="stage-header">Constraints &amp; Negative Prompting</div></div>
          <div className="explanation">
            Constraints and negative prompting narrow the solution space by explicitly defining what you DO want and what you DON'T want.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start', width: '100%' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px', width: '100%' }}>
              <div>
                <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '12px', color: '#2c3e50' }}>MUST Include:</div>
                <div className="constraint-builder">
                  {constraints.map((c, i) => (
                    <div key={i} className="constraint-input">
                      <input type="text" value={c} readOnly className="constraint-box" />
                      <button className="remove-btn" onClick={() => removeConstraint(i)}>×</button>
                    </div>
                  ))}
                  <button className="add-btn" onClick={addConstraint}>+ Add Constraint</button>
                </div>
              </div>
              <div>
                <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '12px', color: '#2c3e50' }}>MUST NOT Do:</div>
                <div className="constraint-builder">
                  {negatives.map((n, i) => (
                    <div key={i} className="constraint-input">
                      <input type="text" value={n} readOnly className="constraint-box" />
                      <button className="remove-btn" onClick={() => removeNegative(i)}>×</button>
                    </div>
                  ))}
                  <button className="add-btn" onClick={addNegative}>+ Add Negative</button>
                </div>
              </div>
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Clear constraints prevent bad outputs. Negative prompting ("don't apologize") often works better than hoping the AI infers your preferences.
          </div>
        </>
      );
    };

    // Stage 5: Recursive Reasoning
    const S5 = () => {
      const [activeTab, setActiveTab] = useState('decompose');
      return (
        <>
          <div><div className="stage-header">Recursive Reasoning</div></div>
          <div className="explanation">
            Recursive reasoning breaks a complex problem into smaller sub-problems, solves each independently, then combines results. Multi-path analysis evaluates multiple solution routes.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start', width: '100%' }}>
            <div className="tabs">
              <button className={`tab ${activeTab === 'decompose' ? 'active' : ''}`} onClick={() => setActiveTab('decompose')}>Decomposition</button>
              <button className={`tab ${activeTab === 'multipath' ? 'active' : ''}`} onClick={() => setActiveTab('multipath')}>Multi-Path</button>
            </div>
            {activeTab === 'decompose' ? (
              <div style={{ width: '100%' }}>
                <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '12px', color: '#2c3e50' }}>Problem: Design a recommendation engine</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', color: '#2c3e50' }}>
                    <strong style={{ color: A }}>Sub-problem 1:</strong> How do we collect user preferences?
                  </div>
                  <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', color: '#2c3e50' }}>
                    <strong style={{ color: A }}>Sub-problem 2:</strong> What algorithm ranks items by relevance?
                  </div>
                  <div style={{ background: '#ecf0f1', padding: '12px', borderRadius: '6px', fontSize: '13px', color: '#2c3e50' }}>
                    <strong style={{ color: A }}>Sub-problem 3:</strong> How do we handle cold-start users?
                  </div>
                  <div style={{ background: '#f0faf0', padding: '12px', borderRadius: '6px', fontSize: '13px', color: '#2d5016', marginTop: '12px' }}>
                    <strong style={{ color: GD }}>Integration:</strong> Combine collaborative filtering + content-based + cold-start strategy
                  </div>
                </div>
              </div>
            ) : (
              <div style={{ width: '100%' }}>
                <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '12px', color: '#2c3e50' }}>Problem: Improve user retention</div>
                <div className="analysis-paths">
                  <div className="analysis-path">
                    <strong style={{ color: A, display: 'block', marginBottom: '8px' }}>Path A: Engagement Focus</strong>
                    Increase feature usage through notifications and tutorials. Measurable by daily active users.
                  </div>
                  <div className="analysis-path">
                    <strong style={{ color: A, display: 'block', marginBottom: '8px' }}>Path B: Community Focus</strong>
                    Build social connections. Measurable by referral rate and group activity.
                  </div>
                  <div className="analysis-path">
                    <strong style={{ color: A, display: 'block', marginBottom: '8px' }}>Path C: Value Focus</strong>
                    Improve core product value. Measurable by Net Promoter Score.
                  </div>
                </div>
                <div className="consensus-panel">
                  <strong>Consensus:</strong> Combine all three. Path B (community) creates stickiness that enables Path A (engagement). Path C ensures there's actual value to engage with.
                </div>
              </div>
            )}
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Breaking hard problems into pieces reveals missing assumptions. Exploring multiple paths prevents tunnel vision and finds better integrated solutions.
          </div>
        </>
      );
    };

    // Stage 6: Output Formatting & Structure
    const S6 = () => {
      const [format, setFormat] = useState('json');
      const examples = {
        json: { label: 'JSON', code: '{"name": "Alice", "department": "Engineering", "yearsAtCompany": 3}' },
        csv: { label: 'CSV', code: 'Name,Department,Years\nAlice,Engineering,3' },
        markdown: { label: 'Markdown', code: '### Alice\n- Department: Engineering\n- Tenure: 3 years' }
      };

      return (
        <>
          <div><div className="stage-header">Output Formatting</div></div>
          <div className="explanation">
            Specifying output format ensures the AI responds in a way your downstream code can easily parse and process.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start', width: '100%' }}>
            <div className="tabs">
              {Object.entries(examples).map(([key, val]) => (
                <button
                  key={key}
                  className={`tab ${format === key ? 'active' : ''}`}
                  onClick={() => setFormat(key)}
                >
                  {val.label}
                </button>
              ))}
            </div>
            <div style={{ width: '100%' }}>
              <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>Prompt:</div>
              <div className="code-block">Extract employee information into {examples[format].label} format</div>
              <div style={{ fontSize: '13px', fontWeight: '600', marginTop: '12px', marginBottom: '8px', color: '#2c3e50' }}>Expected Output:</div>
              <div className="code-output">{examples[format].code}</div>
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Specify format explicitly: JSON, CSV, Markdown, XML. The AI will structure output correctly, saving you parsing headaches downstream.
          </div>
        </>
      );
    };

    // Stage 7: Few-Shot Examples & Guardrails
    const S7 = () => {
      return (
        <>
          <div><div className="stage-header">Few-Shot Examples &amp; Guardrails</div></div>
          <div className="explanation">
            Few-shot examples show the AI the exact style and quality bar you expect. This is more powerful than lengthy instructions.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start', width: '100%' }}>
            <div style={{ width: '100%' }}>
              <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px', color: '#2c3e50' }}>Example 1 (Good):</div>
              <div className="code-block" style={{ background: '#f0faf0', color: '#2d5016', fontFamily: 'inherit' }}>
                "The report shows 15% growth in Q2 revenue, driven by a 22% increase in enterprise customers."
              </div>
              <div style={{ fontSize: '13px', fontWeight: '600', marginTop: '12px', marginBottom: '8px', color: '#2c3e50' }}>Example 2 (Good):</div>
              <div className="code-block" style={{ background: '#f0faf0', color: '#2d5016', fontFamily: 'inherit' }}>
                "Marketing spend was $450K, generating $1.2M in attributed revenue (2.7x ROI)."
              </div>
              <div style={{ fontSize: '13px', fontWeight: '600', marginTop: '12px', marginBottom: '8px', color: '#2c3e50' }}>Example 3 (Avoid):</div>
              <div style={{ background: '#fef5f5', color: '#8b3a3a', padding: '12px', borderRadius: '6px', fontFamily: 'inherit', fontSize: '13px', border: '1px solid #e9b0b0' }}>
                "Our amazing product absolutely crushed it this quarter with incredible results!" (vague, no metrics)
              </div>
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Show 2-3 high-quality examples of what you want, plus 1 example of what to avoid. The AI learns your style and quality bar from examples better than instructions.
          </div>
        </>
      );
    };

    // Stage 8: Summary
    const S8 = () => {
      const takeaways = [
        { title: 'Few-Shot > Zero-Shot', content: 'Always provide examples for consistent, high-quality output.' },
        { title: 'Chain Your Thinking', content: 'Explicit step-by-step reasoning beats hoping for the right answer.' },
        { title: 'Assign a Role', content: 'Give the AI a persona to get domain-specific, tailored responses.' },
        { title: 'Be Explicit', content: 'Constraints, format specs, and negative prompts prevent bad outputs.' },
        { title: 'Break It Down', content: 'Decompose complex problems into sub-problems to improve accuracy.' },
        { title: 'Test Multiple Paths', content: 'Explore alternative solutions and combine the best parts.' }
      ];

      return (
        <>
          <div><div className="stage-header">Key Takeaways</div></div>
          <div className="explanation">
            Mastering prompt engineering means combining these techniques strategically. The best prompts use multiple methods together.
          </div>
          <div className="scene-card" style={{ flexDirection: 'column', alignItems: 'flex-start', width: '100%' }}>
            <div className="key-takeaways">
              {takeaways.map((takeaway, idx) => (
                <div key={idx} className="takeaway-card">
                  <div className="takeaway-title">{takeaway.title}</div>
                  <div className="takeaway-content">{takeaway.content}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="insight-box">
            <div className="insight-label"><span dangerouslySetInnerHTML={{__html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>'}} /> INSIGHT</div>
            Prompt engineering is iterative. Test your prompts, measure results, and refine. Small tweaks often yield dramatic improvements in output quality.
          </div>
        </>
      );
    };

    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stageIcons = [
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h10z"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2z"/><circle cx="12" cy="12" r="3"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 7l-5-5-5 5M7 17l5 5 5-5"/></svg>',
        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/></svg>'
      ];

      const stages = [
        { icon: stageIcons[0], label: 'Zero vs Few-Shot', component: S1 },
        { icon: stageIcons[1], label: 'Chain-of-Thought', component: S2 },
        { icon: stageIcons[2], label: 'Role-Based', component: S3 },
        { icon: stageIcons[3], label: 'Constraints', component: S4 },
        { icon: stageIcons[4], label: 'Recursive', component: S5 },
        { icon: stageIcons[5], label: 'Formatting', component: S6 },
        { icon: stageIcons[6], label: 'Few-Shot', component: S7 },
        { icon: stageIcons[7], label: 'Summary', component: S8 },
      ];

      const CurrentComponent = stages[currentStage].component;

      const handleNext = () => {
        if (currentStage < stages.length - 1) {
          setCurrentStage(currentStage + 1);
        }
      };

      const handlePrev = () => {
        if (currentStage > 0) {
          setCurrentStage(currentStage - 1);
        }
      };

      const handleStageClick = (idx) => {
        setCurrentStage(idx);
      };

      return (
        <div className="container">
          <div className="sidebar scrollbar-hide">
            {stages.map((stage, idx) => (
              <React.Fragment key={idx}>
                <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                  <button
                    className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                    onClick={() => handleStageClick(idx)}
                    dangerouslySetInnerHTML={{__html: stage.icon}}
                  />
                  <div className="step-btn-label">{stage.label}</div>
                </div>
                {idx < stages.length - 1 && (
                  <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                )}
              </React.Fragment>
            ))}
          </div>

          <div className="main-content">
            <div className="top-bar">
              <div className="left-section">
                <a href="../../index.html" className="back-link">← Back to All Guides</a>
                <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                  <span className="guide-number">2.2</span>
                  <div className="title">Prompt Techniques Toolkit</div>
                </div>
                <div style={{ marginLeft: '16px' }}>
                  <div className="badge">DEEP DIVE</div>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center' }}>
                <span className="progress-indicator">Page {currentStage + 1} of {stages.length}</span>
                <div className="nav-arrows">
                  <button
                    className="arrow-btn"
                    onClick={handlePrev}
                    disabled={currentStage === 0}
                    title="Previous stage"
                  >
                    &#8592;
                  </button>
                  <button
                    className="arrow-btn"
                    onClick={handleNext}
                    disabled={currentStage === stages.length - 1}
                    title="Next stage"
                  >
                    &#8594;
                  </button>
                </div>
              </div>
            </div>

            <div className="content-area scrollbar-hide">
              <CurrentComponent />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
