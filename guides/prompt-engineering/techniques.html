    /* ---------- Overview Cards ---------- */
    .overview-intro {
      font-size: 16px; line-height: 1.7; color: #555;
      max-width: 760px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .tech-card {
      background: white;
      border: 2px solid #e8e8f0;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }

    .tech-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.12);
      border-color: #c9bdf3;
    }

    .tech-card.expanded {
      border-color: #6c5ce7;
      background: linear-gradient(135deg, #ffffff 0%, #f5f3ff 100%);
      box-shadow: 0 12px 28px rgba(108, 92, 231, 0.18);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-icon-wrap {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: white;
      flex-shrink: 0;
      padding: 9px;
    }

    .card-number {
      font-family: 'Fraunces', serif;
      font-size: 13px;
      font-weight: 700;
      color: #b0a6e8;
      background: #f5f3ff;
      padding: 3px 9px;
      border-radius: 10px;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.25;
    }

    .card-tagline {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    .card-complexity-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: auto;
    }

    .card-complexity-label {
      font-size: 10px;
      font-weight: 700;
      color: #999;
      letter-spacing: 0.6px;
    }

    .card-complexity-bar {
      flex: 1;
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .card-complexity-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s ease;
    }

    .card-complexity-value {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      min-width: 28px;
      text-align: right;
    }

    .card-reveal {
      background: #f5f3ff;
      border-left: 3px solid #6c5ce7;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.55;
      color: #3a2f7a;
      animation: revealIn 0.35s ease;
    }

    .card-reveal-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-cta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #6c5ce7;
      margin-top: 6px;
      cursor: pointer;
    }

    .card-cta:hover { color: #2ecc71; }

    @keyframes revealIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .overview-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .legend-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ---------- Detail Page ---------- */
    .detail-hero {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 28px;
      background: linear-gradient(135deg, #fafafe 0%, #f5f3ff 100%);
      border: 1px solid #e8e3f8;
      border-radius: 16px;
    }

    .detail-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: white; flex-shrink: 0;
      padding: 14px;
    }

    .detail-title-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }

    .detail-rank {
      font-family: 'Fraunces', serif;
      font-size: 14px;
      font-weight: 700;
      color: #6c5ce7;
      letter-spacing: 0.5px;
    }

    .detail-title {
      font-family: 'Fraunces', serif;
      font-size: 30px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.15;
    }

    .detail-tagline { font-size: 15px; color: #666; line-height: 1.5; }

    .detail-complexity-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 140px;
    }

    .detail-complexity-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #999;
    }

    .detail-complexity-bar {
      width: 140px;
      height: 8px;
      background: #e8e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .detail-complexity-value {
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
    }

    .usage-card {
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid;
    }

    .usage-card.good { background: #f0faf3; border-color: #c5ebd1; }
    .usage-card.bad  { background: #fef5f5; border-color: #f0c4c4; }

    .usage-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .usage-card.good .usage-header { color: #1a5e3a; }
    .usage-card.bad  .usage-header { color: #8b2020; }

    .usage-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .usage-list li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.55;
    }

    .usage-card.good .usage-list li { color: #2d5016; }
    .usage-card.bad  .usage-list li { color: #5a2020; }

    .bullet-icon {
      width: 18px; height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 700;
      margin-top: 1px;
    }

    .bullet-icon.good { background: #2ecc71; }
    .bullet-icon.bad  { background: #e74c3c; }

    .example-block {
      background: white;
      border: 1px solid #e8e8f0;
      border-radius: 14px;
      padding: 22px;
    }

    .example-title {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .example-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #6c5ce7;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .example-prompt {
      background: #2c3e50;
      color: #ecf0f1;
      padding: 14px 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .example-output {
      background: #f0faf0;
      color: #1a5e3a;
      padding: 14px 16px;
      border-left: 3px solid #2ecc71;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.55;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .protip-box {
      background: #fef7e6;
      border-left: 4px solid #f39c12;
      padding: 16px 20px;
      border-radius: 8px;
      color: #6b4a05;
      font-size: 14px;
      line-height: 1.65;
    }

    .protip-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      color: #b37a08;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* Disclosure badge */
    .disclosure-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f5f3ff;
      border: 1.5px solid rgba(108, 92, 231, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.22, 0.68, 0, 1.2);
      pointer-events: none;
      z-index: 2;
    }
    .disclosure-badge svg {
      width: 14px;
      height: 14px;
      stroke: #6c5ce7;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.22, 0.68, 0, 1.2);
    }
    .disclosure-card-host:hover .disclosure-badge,
    .disclosure-card-host.expanded .disclosure-badge {
      background: #6c5ce7;
      border-color: transparent;
    }
    .disclosure-card-host:hover .disclosure-badge { transform: scale(1.08); }
    .disclosure-card-host:hover .disclosure-badge svg,
    .disclosure-card-host.expanded .disclosure-badge svg { stroke: white; }
    .disclosure-card-host.expanded .disclosure-badge svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) {
      .disclosure-badge svg { transition: none; }
    }
  </style>

    /* Renders trusted inline SVG. The markup source is the local ICONS constant only. */

    const NEXT_GUIDE = { id: "2.3", title: "Prompt Engineering Quiz", module: "Module 2", href: "./quiz.html", isQuiz: true };

    const TECHNIQUES = [
      {
        id: 'zero-shot',
        name: 'Zero-Shot Prompting',
        short: 'Zero-Shot',
        tagline: 'Ask the model directly — no examples, no demos.',

        color: '#95a5a6',

          'Task is common and well-understood (summarize, translate, explain).',

          'You are exploring what the model already knows before adding examples.'

        whenNotToUse: [
          'You need a strict output format (JSON schema, CSV columns).',
          'Domain-specific tone or vocabulary is critical.',

          'You need the same shape of answer across many calls.'

        example: {
          prompt: 'Summarize the French Revolution in three sentences.',
          output: 'The French Revolution (1789-1799) overthrew the Bourbon monarchy and abolished feudal privileges in France. It was driven by Enlightenment ideals, widespread financial crisis, and resentment of aristocratic power. Its legacy reshaped Europe politically and inspired democratic movements worldwide.'
        },
        proTip: 'Always try zero-shot first. If the output is good enough, do not burn tokens on examples. Upgrade only when you see drift, format errors, or inconsistency.'
      },
      {
        id: 'few-shot',
        name: 'Few-Shot Prompting',
        short: 'Few-Shot',
        tagline: 'Teach by example — show 2 to 5 input/output pairs.',

        color: '#3498db',

        whenNotToUse: [

        example: {

        proTip: 'For production apps, do CoT internally, then ask the model to output only the final answer. Best of both: better accuracy, clean UX.'

      {

          output: 'Thought: I need current weather for NYC.\nAction: search("NYC weather today")\nObservation: 72°F, partly cloudy, light wind.\n\nThought: Pleasant weather — outdoor activities are viable.\nAction: search("outdoor activities NYC mild weather")\nObservation: Central Park walks, Brooklyn Bridge, rooftop cafes.\n\nAnswer: It is 72°F and partly cloudy. A walk through Central Park or across the Brooklyn Bridge is ideal.'
        },
        proTip: 'Cap the number of action steps. Unbounded ReAct loops are the #1 cause of runaway agent costs and infinite-retry failures.'
      },
      {
        id: 'role',
        name: 'Role-Based / Persona Prompting',
        short: 'Role',
        tagline: 'Assign the model a role: "You are a senior X..."',
        complexity: 40,
        color: '#6c5ce7',
        icon: ICONS.user,
        bestFor: 'Steering tone, vocabulary, and domain lens — consistent expertise across responses.',
        description: 'A role primes the model to answer from a particular viewpoint. "You are a senior security engineer" produces very different output than "You are a friendly tutor" for the same question.',
        whenToUse: [
          'Answer should reflect a specific domain expertise (legal framing, engineering, medical literacy).',
          'Tone needs to stay consistent across a conversation.',
          'You want to narrow the model from generalist to specialist vocabulary.',
          'Audience persona differs from writer persona (teach a 5-year-old vs a CFO).'
        ],
        whenNotToUse: [
          'Task is objective and needs neutral factual output.',
          'Role could imply unwarranted authority (e.g., pretending to be a licensed doctor).',
          'Persona adds noise but no real behavior change.',
          'You need many perspectives — one role collapses the range.'
        ],
        example: {
          prompt: 'You are a senior staff engineer reviewing a junior developer\'s PR. Be specific, kind, and focus on correctness over style.\n\nReview: "Added a try/except around the DB call that returns None on any exception."',
          output: 'A few concerns:\n1. Catching every exception hides real bugs (e.g., schema errors). Narrow it to the exceptions you actually expect.\n2. Returning None silently changes the caller contract — callers cannot tell "no rows" from "error." Consider raising, or returning a Result type.\n3. Add a log line so we can see the suppressed error in production.\n\nGood instinct protecting the caller — let us just make the failure mode explicit.'
        },
        proTip: 'Pair the role with constraints ("be concise", "focus on X"). A role alone is a vibe; a role plus rules is a contract.'
      },
      {
        id: 'chaining',
        name: 'Prompt Chaining',
        short: 'Chain',
        tagline: 'Break a big task into a sequence of smaller prompts.',
        complexity: 65,
        color: '#e67e22',
        icon: ICONS.link,
        bestFor: 'Multi-stage workflows: research → draft → edit → format. Each stage passes its output to the next.',
        description: 'Rather than cramming everything into one prompt, you split the task into ordered steps. Step 1\'s output becomes Step 2\'s input. Often combined with validation between steps.',
        whenToUse: [
          'Task has clearly distinct phases (outline → draft → polish).',
          'Intermediate output is worth reviewing or storing.',
          'Each step needs different instructions or even different models.',
          'A single prompt hits context limits or quality ceilings.'
        ],
        whenNotToUse: [
          'Task fits comfortably in a single prompt.',
          'Added latency between calls breaks the UX.',
          'Steps are so tightly coupled that splitting loses context.',
          'No human or automated check between stages — chain errors compound.'
        ],
        example: {
          prompt: 'Step 1: "Outline a blog post on vector databases — 5 sections, one line each."\n\nStep 2: "Here is the outline: {step1_output}. Expand section 3 into 250 words."\n\nStep 3: "Here is the draft: {step2_output}. Shorten to 180 words and remove jargon."',
          output: 'Each stage produces a clean, focused artifact. The final draft is tighter than a single "write a blog post" prompt, and you can inspect / fix each stage independently.'
        },
        proTip: 'Write the chain as named functions, not raw prompt strings. It turns prompts into composable, testable units — and you can swap stages without rewriting everything.'
      },
      {
        id: 'constraints',
        name: 'Constraints & Negative Prompting',
        short: 'Constraints',
        tagline: 'Spell out what MUST and MUST NOT appear in the output.',
        complexity: 25,
        color: '#e74c3c',
        icon: ICONS.shield,
        bestFor: 'Narrowing the solution space — hard requirements, forbidden content, length limits.',
        description: 'Constraints say what the output must contain (quantified metrics, bullet list, ≤100 words). Negative prompts say what it must NOT contain (no apologies, no marketing fluff, no Python print statements). Explicit beats hopeful.',
        whenToUse: [
          'Output must satisfy specific rules (length, format, vocabulary).',
          'The model has a known bad habit you want to suppress (apologies, disclaimers).',
          'Regulated or brand-sensitive output (no medical claims, no competitor mentions).',
          'You are repeatedly re-prompting to fix the same mistake.'
        ],
        whenNotToUse: [
          'Creative exploration — too many constraints kill novelty.',
          'Constraints contradict each other (watch for silent conflicts).',
          'Over-constraining when a simpler prompt already works.',
          'Negative prompts that name the unwanted thing so vividly they cause it.'
        ],
        example: {
          prompt: 'Write a product update for our API launch.\n\nMUST include: release version, 2 quantified metrics, a one-line CTA.\nMUST NOT include: "revolutionary", "game-changing", exclamation marks, apologies.\nLength: 80 words max.',
          output: 'v2.1 of the Payments API is live. P99 latency dropped from 210ms to 85ms (a 60% improvement), and the new idempotency-key header removes duplicate charges — the top-ranked support issue last quarter.\n\nUpgrade your SDK to version 4.3 to pick up both changes automatically; the old endpoints stay active for 90 days.\n\nTry it in staging today.'
        },
        proTip: 'If a negative prompt keeps failing, flip it. Instead of "do not be verbose", say "use at most 80 words". Positive constraints with numbers are easier for the model to follow.'
      },
      {
        id: 'format',
        name: 'Output Formatting',
        short: 'Format',
        tagline: 'Pin the output shape — JSON, CSV, Markdown, XML.',
        complexity: 20,
        color: '#16a085',
        icon: ICONS.code,
        bestFor: 'Anything a downstream program will parse. Structured output prevents regex-golf.',
        description: 'You tell the model not just what to answer, but the exact structure of the answer. Pair with a schema or example, and the output drops cleanly into code.',
        whenToUse: [
          'Downstream code parses the result (JSON, CSV, YAML).',
          'You need uniform fields across many records.',
          'API integrations or data-extraction pipelines.',
          'Tabular comparison of options where columns matter.'
        ],
        whenNotToUse: [
          'Output is for a human reader — structure can feel clinical.',
          'Creative writing where format constraints kill voice.',
          'Free-form exploration or brainstorming.',
          'The model cannot hold the schema in its working memory reliably.'
        ],
        example: {
          prompt: 'Extract contact info from the email below. Return JSON with keys: name (string), email (string), phone (string or null), company (string or null).\n\nEmail: "Hi, this is Jordan Lee from Acme Corp (jordan@acme.com). Feel free to call anytime."',
          output: '{\n  "name": "Jordan Lee",\n  "email": "jordan@acme.com",\n  "phone": null,\n  "company": "Acme Corp"\n}'
        },
        proTip: 'For production, use JSON mode or structured-output features when the provider supports them. They reject malformed JSON at the model level — no more 3am parser crashes.'
      },
      {
        id: 'decomposition',
        name: 'Decomposition (Least-to-Most)',
        short: 'Decompose',
        tagline: 'Split a hard problem into named sub-problems you can solve separately.',
        complexity: 75,
        color: '#9b59b6',
        icon: ICONS.layers,
        bestFor: 'Problems that are too big or too fuzzy to solve in one shot — design, planning, migrations.',
        description: 'Instead of asking "solve X", you first ask "what are the sub-problems of X?". Then you solve each sub-problem (sometimes with its own technique) and integrate. Forces the model to surface hidden assumptions.',
        whenToUse: [
          'Problem spans multiple concerns (data, UX, auth, perf).',
          'You suspect the model is skipping important parts.',
          'You want each piece verifiable before combining.',
          'Hand-off to humans at any sub-step is valuable.'
        ],
        whenNotToUse: [
          'Problem is atomic — splitting creates artificial seams.',
          'Sub-problems are too tightly coupled to solve independently.',
          'Speed matters more than correctness.',
          'You already know the decomposition — just ask for the solution.'
        ],
        example: {
          prompt: 'Design a recommendation engine. First, list the sub-problems to solve. Then solve each.',
          output: 'Sub-problems:\n  1. How do we collect user preferences?\n  2. What algorithm ranks items by relevance?\n  3. How do we handle cold-start (new users / items)?\n  4. How do we evaluate quality offline and online?\n\n1. Collect: implicit signals (clicks, dwell) + explicit (ratings).\n2. Rank: hybrid collaborative filtering + content embeddings.\n3. Cold-start: content-based fallback for users; popularity prior for items.\n4. Evaluate: offline NDCG@10; online A/B on CTR and 7-day retention.'
        },
        proTip: 'Ask for the sub-problems first, STOP, read them, then ask to solve. The decomposition itself is often where the insight is — and editing it early is cheap.'
      },
      {
        id: 'tot',
        name: 'Tree of Thoughts / Multi-Path',
        short: 'Tree',
        tagline: 'Explore several solution paths, compare, then pick or combine.',
        complexity: 85,
        color: '#e84393',
        icon: ICONS.tree,
        bestFor: 'Problems with multiple valid approaches — strategy, architecture, planning decisions.',
        description: 'You ask the model to generate 2-4 distinct paths (not variations), reason about each, then select or merge. It prevents tunnel vision and surfaces tradeoffs you would have missed.',
        whenToUse: [
          'Multiple reasonable approaches exist and tradeoffs matter.',
          'The first answer the model gives usually feels too "obvious".',
          'Architecture or strategy decisions where you need to defend the choice.',
          'You want a consensus synthesis that borrows from several angles.'
        ],
        whenNotToUse: [
          'A single correct answer exists (math, factual lookup).',
          'Token budget is tight — ToT triples or quadruples output size.',
          'Decision is low-stakes and exploration is overkill.',
          'Paths collapse into the same approach anyway.'
        ],
        example: {
          prompt: 'We need to improve user retention. Generate 3 distinct strategies (engagement, community, value), evaluate each in 2 sentences, then recommend a combined plan.',
          output: 'Path A — Engagement: drive habit via notifications and tutorials. Measurable by DAU; risk: annoying users.\nPath B — Community: build social connection and groups. Measurable by referrals; risk: slow to seed.\nPath C — Value: improve core product quality. Measurable by NPS; risk: long payoff.\n\nRecommendation: lead with C (no point retaining users on a weak product), layer B for stickiness once value is solid, and use A tactically only where it supports B and C.'
        },
        proTip: 'Force the paths to be structurally different, not three flavors of the same idea. "Generate 3 distinct strategies" yields far better results than "generate 3 options".'
      }
    ];

    function OverviewStage({ onNavigate }) {
      const [expanded, setExpanded] = useState(null);
      return (
        <>
          <div><div className="stage-header">The Top 10 Prompt Engineering Techniques</div></div>
          <div className="overview-intro">
            Every technique below is a tool — not a winner. Pick by the shape of the problem, not by how sophisticated it sounds. Click any card to see what it is best used for, then open the detailed page from the sidebar or the card.
          </div>

          <div className="overview-legend">
            <span><span className="legend-dot" style={{ background: '#95a5a6' }}></span>Simple</span>
            <span><span className="legend-dot" style={{ background: '#3498db' }}></span>Moderate</span>
            <span><span className="legend-dot" style={{ background: '#f39c12' }}></span>Advanced</span>
            <span><span className="legend-dot" style={{ background: '#2ecc71' }}></span>Agent-grade</span>
          </div>

          <div className="cards-grid">
            {TECHNIQUES.map((t, idx) => {
              const isOpen = expanded === idx;
              return (
                <div
                  key={t.id}
                  className={`tech-card disclosure-card-host ${isOpen ? 'expanded' : ''}`}
                  onClick={() => setExpanded(isOpen ? null : idx)}
                >
                  <span className="disclosure-badge" aria-hidden="true">
                    <svg viewBox="0 0 24 24" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.25"><polyline points="6 9 12 15 18 9" /></svg>
                  </span>
                  <div className="card-top-row">
                    <SvgIcon markup={t.icon} className="card-icon-wrap" style={{ background: t.color, color: 'white' }} />
                    <span className="card-number">#{idx + 1}</span>
                  </div>
                  <div className="card-title">{t.name}</div>
                  <div className="card-tagline">{t.tagline}</div>

                  <div className="card-complexity-row">
                    <span className="card-complexity-label">COMPLEXITY</span>
                    <div className="card-complexity-bar">
                      <div className="card-complexity-fill" style={{ width: `${t.complexity}%`, background: t.color }} />
                    </div>
                    <span className="card-complexity-value">{t.complexity}</span>
                  </div>

                  {isOpen && (
                    <>
                      <div className="card-reveal">
                        <span className="card-reveal-label">Best used for</span>
                        {t.bestFor}
                      </div>
                      <span className="card-cta" onClick={(e) => { e.stopPropagation(); onNavigate(idx + 1); }}>
                        Open deep dive →
                      </span>
                    </>
                  )}
                </div>
              );
            })}
          </div>

          <div className="insight-box">
            <div className="insight-label">
              <SvgIcon markup={ICONS.bulb} style={{ width: 14, height: 14, color: '#2ecc71', display: 'inline-flex' }} />
              HOW TO CHOOSE
            </div>
            Start with the simplest technique that could work. Move up only when the output drifts, misses format, or skips reasoning. The best real-world prompts stack 2–3 of these — not all 10.
          </div>
        </>
      );
    }

    function DetailStage({ index }) {
      const t = TECHNIQUES[index];
      return (
        <>
          <div className="detail-hero">
            <SvgIcon markup={t.icon} className="detail-icon" style={{ background: t.color, color: 'white' }} />
            <div className="detail-title-block">
              <div className="detail-rank">TECHNIQUE #{index + 1}</div>
              <div className="detail-title">{t.name}</div>
              <div className="detail-tagline">{t.tagline}</div>
            </div>
            <div className="detail-complexity-wrap">
              <span className="detail-complexity-label">COMPLEXITY</span>
              <div className="detail-complexity-bar">
                <div style={{ width: `${t.complexity}%`, height: '100%', background: t.color, borderRadius: 4, transition: 'width 0.8s ease' }} />
              </div>
              <span className="detail-complexity-value">{t.complexity} / 100</span>
            </div>
          </div>

          <div className="explanation">{t.description}</div>

          <div className="two-col">
            <div className="usage-card good">
              <div className="usage-header">
                <SvgIcon markup={ICONS.check} style={{ width: 22, height: 22, display: 'inline-flex' }} />
                When to use it
              </div>
              <ul className="usage-list">
                {t.whenToUse.map((item, i) => (
                  <li key={i}><span className="bullet-icon good">✓</span>{item}</li>
                ))}
              </ul>
            </div>

            <div className="usage-card bad">
              <div className="usage-header">
                <SvgIcon markup={ICONS.cross} style={{ width: 22, height: 22, display: 'inline-flex' }} />
                When NOT to use it
              </div>
              <ul className="usage-list">
                {t.whenNotToUse.map((item, i) => (
                  <li key={i}><span className="bullet-icon bad">✗</span>{item}</li>
                ))}
              </ul>
            </div>
          </div>

          <div className="example-block">
            <div className="example-title">
              <SvgIcon markup={ICONS.code} style={{ width: 18, height: 18, color: t.color, display: 'inline-flex' }} />
              Example in action
            </div>
            <div className="example-label">Prompt</div>
            <div className="example-prompt">{t.example.prompt}</div>
            <div className="example-label" style={{ marginTop: 14 }}>Output</div>
            <div className="example-output">{t.example.output}</div>
          </div>

          <div className="protip-box">
            <div className="protip-label">
              <SvgIcon markup={ICONS.bulb} style={{ width: 14, height: 14, color: '#b37a08', display: 'inline-flex' }} />
              Pro tip
            </div>
            {t.proTip}
          </div>
        </>
      );
    }

    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);
      const totalStages = TECHNIQUES.length + 1;

      const sidebarSteps = [
        { icon: ICONS.grid, label: 'Overview' },
        ...TECHNIQUES.map(t => ({ icon: t.icon, label: t.short }))
      ];

      const handleNext = () => { if (currentStage < totalStages - 1) setCurrentStage(currentStage + 1); };
      const handlePrev = () => { if (currentStage > 0) setCurrentStage(currentStage - 1); };

      return (
        <React.Fragment>
          <a href="#main" className="skip-link">Skip to main content</a>
          <div className="container">
            <aside className="sidebar scrollbar-hide" aria-label="Guide sections">
              {sidebarSteps.map((step, idx) => (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    <button
                      type="button"
                      className={`step-btn ${currentStage === idx ? 'active' : ''}`}
                      aria-label={`Step ${idx + 1}: ${step.label}`}
                      aria-current={currentStage === idx ? "step" : undefined}
                      onClick={() => setCurrentStage(idx)}
                      dangerouslySetInnerHTML={{ __html: step.icon }}
                    />
                    <div className="step-btn-label">{step.label}</div>
                  </div>
                  {idx < sidebarSteps.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              ))}
            </aside>

            <div className="main-content">
              <div className="top-bar">
                <div className="left-section">
                  <a href="../../index.html" className="back-link">← Back to All Guides</a>
                  <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                  <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                    <span className="guide-number">2.2</span>
                    <div className="title">Prompt Techniques Toolkit</div>
                  </div>
                  <div style={{ marginLeft: '16px' }}>
                    <div className="badge">DEEP DIVE</div>
                  </div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center' }}>
                  <span className="progress-indicator">Page {currentStage + 1} of {totalStages}</span>
                  <nav className="nav-arrows" aria-label="Section navigation">
                    <button type="button" className="arrow-btn" aria-label="Previous section" onClick={handlePrev} disabled={currentStage === 0} title="Previous">&#8592;</button>
                    <button type="button" className="arrow-btn" aria-label="Next section" onClick={handleNext} disabled={currentStage === totalStages - 1} title="Next">&#8594;</button>
                  </nav>
                </div>
              </div>

              <main id="main" className="content-area scrollbar-hide" key={currentStage}>
                {currentStage === 0
                  ? <OverviewStage onNavigate={setCurrentStage} />
                  : <DetailStage index={currentStage - 1} />}
                {currentStage === totalStages - 1 && (
                  <div className="up-next-card" role="complementary" aria-label="Up next">
                    <span className="up-next-label">UP NEXT</span>
                    <a href={NEXT_GUIDE.href} className="up-next-link">
                      <div className="up-next-meta">
                        <span className="up-next-id">{NEXT_GUIDE.id}</span>
                        <span className="up-next-module">{NEXT_GUIDE.module}</span>
                      </div>
                      <div className="up-next-title">{NEXT_GUIDE.title}</div>
                      <span className="up-next-arrow" aria-hidden="true">&rarr;</span>
                    </a>
                  </div>
                )}
              </main>
            </div>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Guide />);
  </script>
</body>
</html>
