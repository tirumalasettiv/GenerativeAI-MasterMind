    body { font-family: 'DM Sans', sans-serif; background: #ffffff; color: #1a1a1a; height: 100vh; }

    .container { display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 120px; background: #f8f9fa; border-right: 1px solid #e0e0e0; padding: 80px 12px 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }

    .step-btn { width: 64px; height: 64px; border-radius: 50%; background: white; border: 2px solid #e0e0e0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 26px; transition: all 0.3s ease; position: relative; flex-shrink: 0; }
    .step-btn.active { background: #6c5ce7; border-color: #6c5ce7; color: white; transform: scale(1.1); box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
    .step-btn:hover { border-color: #6c5ce7; transform: translateY(-2px); }
    .step-btn-label { font-size: 11px; font-weight: 600; color: #999; margin-top: 4px; text-align: center; letter-spacing: 0.3px; transition: color 0.3s ease; }
    .step-wrapper.active .step-btn-label { color: #6c5ce7; }
    .step-connector { width: 2px; height: 16px; background: #e0e0e0; margin: 2px 0; flex-shrink: 0; }
    .step-connector.active { background: #6c5ce7; }

    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 3px solid transparent; border-image: linear-gradient(90deg, #6c5ce7, #a78bfa, #2ecc71) 1; background: white; flex-shrink: 0; }
    .left-section { display: flex; align-items: center; gap: 20px; }
    .back-link { color: #6c5ce7; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
    .back-link:hover { color: #2ecc71; }
    .badge { display: inline-block; background: #e8e3f8; color: #6c5ce7; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
    .progress-indicator { font-size: 13px; font-weight: 600; color: #6c5ce7; background: #f5f3ff; padding: 4px 12px; border-radius: 12px; margin-right: 12px; }
    .guide-number { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: #b0a6e8; margin-right: 8px; }
    .title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; color: #1a1a1a; }

    .nav-arrows { display: flex; gap: 12px; }
    .arrow-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #e0e0e0; background: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }

    .content-area { flex: 1; display: flex; flex-direction: column; overflow-y: auto; scroll-behavior: smooth; padding: 32px 48px; gap: 30px; }
    .explanation { font-size: 22px; line-height: 1.7; color: #2a2a2a; }

    .insight-box { background: #f0faf0; border-left: 4px solid #2ecc71; padding: 24px; border-radius: 8px; color: #1a5e3a; font-size: 17px; line-height: 1.7; margin-top: 24px; position: relative; }
    .insight-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #2ecc71; margin-bottom: 8px; text-transform: uppercase; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .cur { animation: blink 0.7s infinite; }

    /* Terminal styles */
    .terminal-wrap { background: #fafafe; border-radius: 12px; border: 1px solid #e0e0ec; overflow: hidden; width: 100%; }
    .terminal-bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; background: #f0f0f5; border-bottom: 1px solid #e0e0ec; }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .terminal-body { padding: 14px 18px; font-family: monospace; font-size: 16px; line-height: 1.7; }

    /* Chunk grid */
    .chunk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .chunk-card { padding: 14px 16px; border-radius: 12px; cursor: pointer; transition: all 0.3s; border: 2px solid #dddde8; background: #fff; }

    /* Tab buttons */
    .tab-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { padding: 5px 16px; border-radius: 20px; border: 2px solid #dddde8; font-size: 15px; font-weight: 700; background: transparent; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .tab-btn.active { color: #fff; }
    .embed-panel { background: #f7f6fd; border-radius: 12px; border: 1px solid #e4e0f2; padding: 14px 18px; width: 100%; }
    .embed-source { font-size: 15px; color: #2d2d3d; margin-bottom: 8px; }
    .embed-arrow { text-align: center; font-size: 23px; color: #b0b0be; margin: 6px 0; }
    .embed-arrow-label { font-size: 15px; color: #4a4a5a; font-weight: 600; }
    .dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
    .dim-row { display: flex; align-items: center; gap: 8px; }
    .dim-label { font-size: 14px; color: #4a4a5a; font-family: monospace; width: 24px; font-weight: 600; }

    /* Vector space */
    .vector-space { position: relative; width: 100%; min-height: 240px; background: linear-gradient(135deg, #f7f6fd, #eee9fd); border-radius: 14px; border: 1px solid #d8d3ea; overflow: hidden; }
    .vector-gridline { position: absolute; background: #d0cbe5; }
    .vector-gridline-h { left: 0; right: 0; height: 1px; }
    .vector-gridline-v { top: 0; bottom: 0; width: 1px; }
    .vector-space-label { position: absolute; bottom: 6px; right: 10px; font-size: 11px; color: #9a90b8; letter-spacing: 1.5px; font-weight: 700; }
    .vector-dot-wrap { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: z-index 0s; }
    .vector-dot { border-radius: 50%; transition: all 0.3s; }
    .vector-dot-label { font-size: 14px; font-weight: 700; }
    .vector-tooltip { position: absolute; top: -48px; background: #fff; border-radius: 8px; padding: 5px 10px; font-size: 14px; color: #2d2d3d; white-space: nowrap; animation: fadeIn 0.2s; box-shadow: 0 3px 12px rgba(0,0,0,0.1); font-family: monospace; }

    /* Score rows */
    .score-list { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .score-row { display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; border: 2px solid #e8e8f0; background: #fff; }
    .score-row.best { border-color: #2ecc71; background: #eefaf2; }
    .score-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
    .score-label { font-size: 16px; color: #1a1a2e; font-weight: 600; flex: 1; }
    .score-bar { width: 80px; height: 10px; background: #e8e8f0; border-radius: 5px; overflow: hidden; margin-right: 8px; }
    .score-fill { height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(.22,.68,0,1.2); }
    .score-value { font-size: 15px; font-family: monospace; min-width: 38px; font-weight: 400; color: #6a6a7a; }
    .score-value.best { font-weight: 700; color: #1a9456; }
    .score-best { font-size: 13px; background: #2ecc71; color: #fff; padding: 2px 8px; border-radius: 8px; font-weight: 700; margin-left: 6px; }

    /* Question grid & buttons */
    .question-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
    .question-btn { padding: 10px 14px; border-radius: 10px; border: 2px solid #dddde8; background: #fafafe; cursor: pointer; font-size: 16px; color: #1a1a2e; text-align: left; font-weight: 500; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .question-btn:hover { border-color: #6c5ce7; background: #f5f3ff; }
    .try-again-btn { margin-top: 8px; padding: 6px 16px; border: 1px solid #d0d0dd; border-radius: 16px; background: #fff; cursor: pointer; font-size: 15px; color: #6c5ce7; font-weight: 700; font-family: 'DM Sans', sans-serif; align-self: flex-start; transition: all 0.2s; }
    .try-again-btn:hover { border-color: #6c5ce7; background: #f5f3ff; }

    /* Prompt blocks */
    .prompt-stack { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .prompt-block { padding: 10px 14px; border-radius: 10px; transition: opacity 0.5s; }
    .prompt-block-label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .prompt-block-text { font-size: 16px; color: #2d2d3d; margin-top: 5px; font-family: monospace; line-height: 1.6; }
    .prompt-plus { text-align: center; font-size: 18px; color: #c0c0d0; margin: 1px 0; transition: opacity 0.5s; }
    .prompt-result { text-align: center; animation: fadeIn 0.3s; }
    .prompt-result-arrow { font-size: 20px; color: #c0c0d0; }
    .prompt-result-box { padding: 8px 14px; border-radius: 10px; border: 2px solid #f39c12; background: linear-gradient(135deg, #fef9f3, #fdf4ea); display: inline-block; }
    .prompt-result-label { font-size: 14px; font-weight: 700; color: #c87f0a; letter-spacing: 1px; }

    /* Chat bubbles */
    .chat-bubble-user { background: #6c5ce7; color: #fff; padding: 8px 16px; border-radius: 14px 14px 4px 14px; font-size: 16px; font-weight: 600; max-width: 360px; margin-left: auto; margin-bottom: 12px; }
    .chat-source-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 8px; }
    .chat-source-dot { width: 10px; height: 10px; border-radius: 50%; }
    .chat-source-text { font-size: 15px; color: #3d3d4d; font-weight: 600; }
    .chat-bubble-ai { background: #f4f4fa; border: 1px solid rgba(46,204,113,0.27); padding: 12px 16px; border-radius: 14px 14px 14px 4px; font-size: 18px; line-height: 1.7; color: #1a1a2e; animation: fadeIn 0.4s; }
    .source-badge { margin-top: 8px; font-size: 14px; font-weight: 700; color: #1a9456; background: #e2f5ea; display: inline-block; padding: 3px 10px; border-radius: 8px; }

    /* Searching state */
    .searching-state { text-align: center; padding: 16px; color: #4a4a5a; font-size: 18px; }
    .searching-icon { font-size: 30px; animation: pulse 0.8s infinite alternate; display: inline-block; }

    /* Bar component */
    .bar-track { height: 10px; background: #e8e8f0; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; transition: width 0.6s cubic-bezier(.22,.68,0,1.2); }
    .bar-value { font-size: 14px; color: #3d3d4d; font-family: monospace; font-weight: 500; }
  </style>
</head>

    /* ─── Shared Components ─── */
    function TW({ text, speed = 16 }) {
      const [d, setD] = useState("");
      const i = useRef(0);
      useEffect(() => {
        setD(""); i.current = 0;
        const t = setInterval(() => { i.current++; setD(text.slice(0, i.current)); if (i.current >= text.length) clearInterval(t); }, speed);

      return <span>{d}{d.length < text.length && <span className="cur">|</span>}</span>;
    }

    function Bar({ value, color, w = 70 }) {
      const [a, setA] = useState(0);
      useEffect(() => { const t = setTimeout(() => setA(value * 100), 100); return () => clearTimeout(t); }, [value]);

    function S1() {
      const [lines, setLines] = useState(0);
      useEffect(() => { const t = setInterval(() => setLines(p => Math.min(p + 1, 11)), 200); return () => clearInterval(t); }, []);

        <>

              <div className="terminal-bar">
                <span className="terminal-dot" style={{ background: "#ff5f56" }} />
                <span className="terminal-dot" style={{ background: "#ffbd2e" }} />
                <span className="terminal-dot" style={{ background: "#27c93f" }} />
                <span style={{ marginLeft: 10, fontSize: 15, color: "#4a4a5a", fontWeight: 600 }}>employee_handbook.pdf</span>
              </div>
              <div className="terminal-body">
                {FULL_DOC_LINES.slice(0, lines).map((l, i) => (
                  <div key={i} style={{ color: l.accent ? "#6c5ce7" : l.bold ? "#1a1a2e" : "#2d2d3d", fontWeight: l.bold ? 700 : 400 }}>{l.text || "\u00A0"}</div>
                ))}
                {lines < 11 && <span className="cur" style={{ color: "#6c5ce7" }}>{"\u2588"}</span>}
              </div>
            </div>
          </div>
          <InsightBlock>
            Like photocopying a textbook so the librarian can work with it — the original stays safe.
          </InsightBlock>
        </>
      );
    }

    function S2() {
      const [ac, setAc] = useState(-1);
      useEffect(() => { const t = setInterval(() => setAc(p => p >= 3 ? 3 : p + 1), 500); return () => clearInterval(t); }, []);
      return (
        <>
          <div><div className="stage-header">Chunking</div></div>
          <div className="explanation">
            Documents are too long to search efficiently, so we split them into chunks — smaller, meaningful pieces.
          </div>
          <div className="scene-card">
            <div className="chunk-grid">
              {CHUNKS.map((c, i) => (
                <div key={i} onClick={() => setAc(i)}
                  className={`chunk-card ${i <= ac ? 'revealed' : ''}`}
                  style={{
                    borderColor: i <= ac ? CC[i] : "#dddde8",
                    boxShadow: i === ac ? `0 4px 16px ${CC[i]}15` : "none",
                  }}>
                  <div className="chunk-card-section" style={{ color: CC[i] }}>{c.section}</div>
                  <div className="chunk-card-title">{c.title}</div>
                  <div className="chunk-card-text">
                    {i === ac ? c.text : c.text.slice(0, 65) + "..."}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            Like cutting a book into index cards — each covers one topic, small enough to search fast.
          </InsightBlock>
        </>
      );
    }

    function S3() {
      const [ai, setAi] = useState(0);
      return (
        <>
          <div><div className="stage-header">Embeddings</div></div>
          <div className="explanation">
            We convert each chunk into a list of numbers called a vector. Similar meaning leads to similar numbers.
          </div>
          <div className="scene-card">
            <div className="tab-row">
              {CHUNKS.map((c, i) => (
                <button key={i} onClick={() => setAi(i)}
                  className={`tab-btn ${i === ai ? 'active' : ''}`}
                  style={{
                    borderColor: CC[i],
                    background: i === ai ? CC[i] : "transparent",
                    color: i === ai ? "#fff" : CC[i],
                  }}>{c.section}</button>
              ))}
            </div>
            <div className="embed-panel">
              <div className="embed-source">"{CHUNKS[ai].text.slice(0, 60)}..."</div>
              <div className="embed-arrow">{"\u2B07\uFE0F"} <span className="embed-arrow-label">Embedding Model</span></div>
              <div className="dim-grid">
                {VECS[ai].map((v, j) => (
                  <div key={j} className="dim-row">
                    <span className="dim-label">d{j + 1}</span>
                    <Bar value={v} color={CC[ai]} />
                  </div>
                ))}
              </div>
            </div>
          </div>
          <InsightBlock>
            Like GPS coordinates in "meaning space" — similar topics end up near each other.
          </InsightBlock>
        </>
      );
    }

    function S4() {
      const [hov, setHov] = useState(-1);
      const pos = [{ x: 25, y: 20 }, { x: 70, y: 75 }, { x: 35, y: 70 }, { x: 75, y: 22 }];
      return (
        <>
          <div><div className="stage-header">Vector Database</div></div>
          <div className="explanation">
            Vectors are stored in a vector database — optimized for finding similar items by comparing numbers.
          </div>
          <div className="scene-card">
            <div className="vector-space" style={{ height: 260 }}>
              {[25, 50, 75].map(p => <div key={`h${p}`} className="vector-gridline vector-gridline-h" style={{ top: `${p}%` }} />)}
              {[25, 50, 75].map(p => <div key={`v${p}`} className="vector-gridline vector-gridline-v" style={{ left: `${p}%` }} />)}
              <div className="vector-space-label">VECTOR SPACE</div>
              {CHUNKS.map((c, i) => (
                <div key={i} onMouseEnter={() => setHov(i)} onMouseLeave={() => setHov(-1)}
                  className="vector-dot-wrap"
                  style={{
                    left: `${pos[i].x}%`, top: `${pos[i].y}%`,
                    transform: "translate(-50%,-50%)",
                    zIndex: hov === i ? 10 : 1,
                  }}>
                  <div className="vector-dot" style={{
                    width: hov === i ? 26 : 18, height: hov === i ? 26 : 18,
                    background: CC[i],
                    boxShadow: `0 0 ${hov === i ? 24 : 8}px ${CC[i]}55`,
                  }} />
                  <span className="vector-dot-label" style={{ color: CC[i] }}>{hov === i ? c.title : c.section}</span>
                  {hov === i && (
                    <div className="vector-tooltip" style={{ borderColor: `${CC[i]}44` }}>
                      [{VECS[i].slice(0, 3).map(v => v.toFixed(2)).join(", ")}, ...]
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
          <InsightBlock>
            Like a constellation map — nearby stars discuss similar topics. We find the nearest one.
          </InsightBlock>
        </>
      );
    }

    function S5() {
      const [qi, setQi] = useState(null);
      const [ph, setPh] = useState("pick");
      const run = (i) => { setQi(i); setPh("searching"); setTimeout(() => setPh("results"), 1000); };
      return (
        <>
          <div><div className="stage-header">Query & Retrieval</div></div>
          <div className="explanation">
            When a user asks a question, we convert it to a vector and find the most similar chunk.
          </div>
          <div className="scene-card">
            {ph === "pick" ? (
              <div className="question-grid">
                {QS.map((q, i) => (
                  <button key={i} onClick={() => run(i)} className="question-btn">{q.text}</button>
                ))}
              </div>
            ) : (
              <div style={{ width: "100%" }}>
                <div className="chat-bubble-user">{QS[qi].text}</div>
                {ph === "searching" ? (
                  <div className="searching-state">
                    <span className="searching-icon">{"\u{1F50D}"}</span> Computing scores...
                  </div>
                ) : (
                  <div className="score-list">
                    {CHUNKS.map((c, i) => {
                      const s = QS[qi].scores[i], isT = i === QS[qi].top;
                      return (
                        <div key={i} className={`score-row ${isT ? 'best' : ''}`}>
                          <div className="score-dot" style={{ background: CC[i] }} />
                          <span className="score-label">{c.title}</span>
                          <div className="score-bar">
                            <div className="score-fill" style={{ width: `${s * 100}%`, background: isT ? "#2ecc71" : "#c0c0d0" }} />
                          </div>
                          <span className={`score-value ${isT ? 'best' : ''}`}>{(s * 100).toFixed(0)}%</span>
                          {isT && <span className="score-best">BEST</span>}
                        </div>
                      );
                    })}
                    <button onClick={() => { setQi(null); setPh("pick"); }} className="try-again-btn">{"\u2190"} Try another</button>
                  </div>
                )}
              </div>
            )}
          </div>
          <InsightBlock>
            Like asking "which index card is closest in meaning?" — math finds the best match instantly.
          </InsightBlock>
        </>
      );
    }

    function S6() {
      const [ph, setPh] = useState(0);
      useEffect(() => {
        const t1 = setTimeout(() => setPh(1), 500);
        const t2 = setTimeout(() => setPh(2), 1200);
        const t3 = setTimeout(() => setPh(3), 1900);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, []);
      const bl = [
        { color: "#6c5ce7", bg: "#faf9fe", label: "\u2460 SYSTEM INSTRUCTION", text: '"Answer ONLY using the provided context. Say you don\'t know if unsure."' },
        { color: "#1a9456", bg: "#eefaf2", label: "\u2461 RETRIEVED CONTEXT", text: '"Employees are entitled to 20 days annual leave. Accrues at 1.67 days/month..."' },
        { color: "#d63031", bg: "#fdf2ef", label: "\u2462 USER QUESTION", text: '"How many vacation days do I get?"' },
      ];
      return (
        <>
          <div><div className="stage-header">Prompt Assembly</div></div>
          <div className="explanation">
            The system assembles a super-prompt: system instructions + retrieved context + user question.
          </div>
          <div className="scene-card">
            <div className="prompt-stack">
              {bl.map((b, i) => (
                <div key={i}>
                  <div className="prompt-block"
                    style={{
                      border: `2px solid ${b.color}28`, background: b.bg,
                      opacity: ph >= i ? 1 : 0.1,
                    }}>
                    <div className="prompt-block-label" style={{ color: b.color }}>{b.label}</div>
                    <div className="prompt-block-text">{b.text}</div>
                  </div>
                  {i < 2 && <div className="prompt-plus" style={{ opacity: ph >= i + 1 ? 1 : 0.1 }}>{"\uFF0B"}</div>}
                </div>
              ))}
              {ph >= 3 && (
                <div className="prompt-result">
                  <div className="prompt-result-arrow">{"\u2B07\uFE0F"}</div>
                  <div className="prompt-result-box">
                    <span className="prompt-result-label">AUGMENTED PROMPT {"\u2192"} LLM</span>
                  </div>
                </div>
              )}
            </div>
          </div>
          <InsightBlock>
            Like an open-book exam — the question PLUS the relevant pages, so no guessing needed.
          </InsightBlock>
        </>
      );
    }

    function S7() {
      const [qi, setQi] = useState(null);
      const [ans, setAns] = useState(false);
      const run = (i) => { setQi(i); setAns(false); setTimeout(() => setAns(true), 500); };
      return (
        <>
          <div><div className="stage-header">Generation</div></div>
          <div className="explanation">
            The LLM reads the augmented prompt and generates an answer grounded in your actual data.
          </div>
          <div className="scene-card">
            {qi === null ? (
              <div className="question-grid">
                {QS.map((q, i) => (
                  <button key={i} onClick={() => run(i)} className="question-btn">{q.text}</button>
                ))}
              </div>
            ) : (
              <div style={{ width: "100%" }}>
                <div className="chat-bubble-user">{QS[qi].text}</div>
                <div className="chat-source-row">
                  <div className="chat-source-dot" style={{ background: CC[QS[qi].top] }} />
                  <span className="chat-source-text">Using: {CHUNKS[QS[qi].top].title}</span>
                </div>
                {ans && (
                  <div className="chat-bubble-ai">
                    <TW text={QS[qi].answer} speed={14} />
                    <div className="source-badge">{"\u2705"} Source: {CHUNKS[QS[qi].top].title}</div>
                  </div>
                )}
                <button onClick={() => setQi(null)} className="try-again-btn">{"\u2190"} Try another</button>
              </div>
            )}
          </div>
          <InsightBlock>
            The answer cites real data. If info isn't in the knowledge base, it says "I don't know."
          </InsightBlock>
        </>
      );
    }

    /* ─── Main Guide ─── */
    function Guide() {
      const [currentStage, setCurrentStage] = useState(0);

      const stages = [
        { icon: IngestIcon, label: 'Ingest', component: S1 },
        { icon: ChunkIcon, label: 'Chunk', component: S2 },
        { icon: EmbedIcon, label: 'Embed', component: S3 },
        { icon: StoreIcon, label: 'Store', component: S4 },
        { icon: QueryIcon, label: 'Query', component: S5 },
        { icon: AssembleIcon, label: 'Assemble', component: S6 },
        { icon: GenerateIcon, label: 'Generate', component: S7 },
      ];

      const CurrentComponent = stages[currentStage].component;
      const handleNext = () => { if (currentStage < stages.length - 1) setCurrentStage(currentStage + 1); };
      const handlePrev = () => { if (currentStage > 0) setCurrentStage(currentStage - 1); };

      return (
        <div className="container">
          <div className="sidebar scrollbar-hide">
            {stages.map((stage, idx) => {
              const IconComp = stage.icon;
              return (
                <React.Fragment key={idx}>
                  <div className={`step-wrapper ${currentStage === idx ? 'active' : ''}`}>
                    <button className={`step-btn ${currentStage === idx ? 'active' : ''}`} onClick={() => setCurrentStage(idx)}>
                      <IconComp />
                    </button>
                    <div className="step-btn-label">{stage.label}</div>
                  </div>
                  {idx < stages.length - 1 && (
                    <div className={`step-connector ${currentStage > idx ? 'active' : ''}`} />
                  )}
                </React.Fragment>
              );
            })}
          </div>
          <div className="main-content">
            <div className="top-bar">
              <div className="left-section">
                <a href="../index.html" className="back-link">&#8592; Back to All Guides</a>
                <span style={{ marginLeft: '20px', fontSize: '14px', color: '#999' }}>|</span>
                <div style={{ marginLeft: '12px', display: 'flex', alignItems: 'center' }}>
                  <span className="guide-number">5.8</span>
                  <div className="title">RAG Under the Hood</div>
                </div>
                <div style={{ marginLeft: '20px' }}>
                  <div className="badge">DEEP DIVE</div>
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center' }}>
                <span className="progress-indicator">Page {currentStage + 1} of 7</span>
                <div className="nav-arrows">
                  <button className="arrow-btn" onClick={handlePrev} disabled={currentStage === 0}>&#8592;</button>
                  <button className="arrow-btn" onClick={handleNext} disabled={currentStage === stages.length - 1}>&#8594;</button>
                </div>
              </div>
            </div>
            <div className="content-area scrollbar-hide" key={currentStage}>
              <CurrentComponent />
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Guide />);
  </script>
</body>
</html>
