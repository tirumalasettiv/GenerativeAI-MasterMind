    function GuideIcon({ guideId }) {
      const svg = GUIDE_ICONS[guideId];
      if (!svg) return null;
      /* Renders static SVG markup from GUIDE_ICONS constant above — no user input involved */
      return (
        <div
          style={{
            width: 36, height: 36, borderRadius: 10,
            background: "#f5f3ff",
            display: "flex", alignItems: "center", justifyContent: "center",
            flexShrink: 0,
          }}
          dangerouslySetInnerHTML={{__html: svg}}
        />
      );
    }

    function TypingEffect({ text, speed = 30 }) {
      const [displayed, setDisplayed] = useState("");
      const indexRef = useRef(0);

      useEffect(() => {
        setDisplayed("");
        indexRef.current = 0;
        const interval = setInterval(() => {
          indexRef.current++;
          setDisplayed(text.slice(0, indexRef.current));
          if (indexRef.current >= text.length) clearInterval(interval);
        }, speed);
        return () => clearInterval(interval);
      }, [text, speed]);

      return (
        <span>
          {displayed}
          {displayed.length < text.length && <span className="cursor">|</span>}
        </span>
      );
    }

          }}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}

          <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
            <GuideIcon guideId={guide.id} />
