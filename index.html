<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GenAI MasterMind — Master Generative AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MODULES = [
      {
        id: 1,
        name: "Fundamentals of Generative AI",
        category: "fundamentals",
        guides: [
          { id: "1.1", title: "What is Generative AI?", path: "guides/fundamentals/what-is-genai.html", badge: "BEGINNER", available: true, emoji: "🤖", desc: "Understanding the basics of generative models" },
          { id: "1.2", title: "Regular vs Gen AI", path: "guides/fundamentals/regular-vs-genai.html", badge: "BEGINNER", available: true, emoji: "⚖️", desc: "Key differences between traditional and generative AI" },
          { id: "1.3", title: "Inside the Black Box", path: "guides/fundamentals/how-genai-works.html", badge: "DEEP DIVE", available: true, emoji: "🔮", desc: "How generative AI models actually work" },
          { id: "1.4", title: "Types of AI Models", path: "guides/fundamentals/ai-model-types.html", badge: "INTERACTIVE", available: true, emoji: "📊", desc: "Explore different model architectures" },
          { id: "1.5", title: "Three Critical Limitations", path: "guides/fundamentals/limitations.html", badge: "BEGINNER", available: true, emoji: "⚠️", desc: "Understanding what generative AI cannot do" },
          { id: "1.6", title: "VERIFY Framework", path: "guides/fundamentals/verify-framework.html", badge: "INTERACTIVE", available: true, emoji: "✓", desc: "Framework for responsible AI use" },
          { id: "1.7", title: "Module 1 Quiz", path: "guides/fundamentals/quiz.html", badge: "INTERACTIVE", available: true, emoji: "📝", desc: "Test your knowledge of GenAI fundamentals" },
        ]
      },
      {
        id: 2,
        name: "Prompt Engineering",
        category: "prompt-engineering",
        guides: [
          { id: "2.1", title: "Meta & COSTAR Frameworks", path: "guides/prompt-engineering/costar-meta.html", badge: "INTERACTIVE", available: true, emoji: "🎯", desc: "Master prompt structure and optimization" },
          { id: "2.2", title: "Prompt Techniques Toolkit", path: "guides/prompt-engineering/techniques.html", badge: "DEEP DIVE", available: true, emoji: "🛠️", desc: "Advanced prompting techniques and strategies" },
        ]
      },
      {
        id: 3,
        name: "Context Engineering (RAG)",
        category: "context-engineering",
        guides: [
          { id: "3.1", title: "RAG Explainer", path: "docs/rag-explainer.html", badge: "BEGINNER", available: true, emoji: "📚", desc: "Introduction to Retrieval Augmented Generation" },
          { id: "3.2", title: "RAG Under the Hood", path: "docs/rag-internals.html", badge: "DEEP DIVE", available: true, emoji: "⚙️", desc: "Deep technical dive into RAG systems" },
        ]
      },
      {
        id: 4,
        name: "Model Context Protocol (MCP)",
        category: "mcp",
        guides: [
          { id: "4.1", title: "MCP Fundamentals", path: "guides/mcp/fundamentals.html", badge: "BEGINNER", available: false, emoji: "🔌", desc: "Understanding the Model Context Protocol" },
        ]
      },
      {
        id: 5,
        name: "The Five AI Architectures",
        category: "architectures",
        guides: [
          { id: "5.1", title: "Architecture Overview", path: "guides/architectures/overview.html", badge: "INTERACTIVE", available: true, emoji: "🏗️", desc: "Survey of the five core AI architectures" },
          { id: "5.2", title: "Basic LLM Chat", path: "guides/architectures/llm-chat.html", badge: "BEGINNER", available: true, emoji: "💬", desc: "Simple LLM conversation architecture" },
          { id: "5.3", title: "RAG Architecture", path: "guides/architectures/rag.html", badge: "DEEP DIVE", available: true, emoji: "🔍", desc: "Building RAG-based systems" },
          { id: "5.4", title: "AI Workflows", path: "guides/architectures/workflows.html", badge: "INTERACTIVE", available: true, emoji: "🔄", desc: "Orchestrating multi-step AI processes" },
          { id: "5.5", title: "AI Agents", path: "guides/architectures/agents.html", badge: "DEEP DIVE", available: true, emoji: "🤖", desc: "Autonomous AI agents and decision-making" },
          { id: "5.6", title: "Agentic AI (Multi-Agent)", path: "guides/architectures/agentic-ai.html", badge: "DEEP DIVE", available: true, emoji: "👥", desc: "Multi-agent systems and collaboration" },
        ]
      },
    ];

    const BADGE_COLORS = {
      "BEGINNER": "#6c5ce7",
      "INTERACTIVE": "#2ecc71",
      "DEEP DIVE": "#e17055",
      "USE CASE": "#f39c12",
    };

    const BADGE_BG = {
      "BEGINNER": "#eee9fd",
      "INTERACTIVE": "#eefaf2",
      "DEEP DIVE": "#fde8e0",
      "USE CASE": "#fef9f3",
    };

    function TypingEffect({ text, speed = 30 }) {
      const [displayed, setDisplayed] = useState("");
      const indexRef = useRef(0);

      useEffect(() => {
        setDisplayed("");
        indexRef.current = 0;
        const interval = setInterval(() => {
          indexRef.current++;
          setDisplayed(text.slice(0, indexRef.current));
          if (indexRef.current >= text.length) clearInterval(interval);
        }, speed);
        return () => clearInterval(interval);
      }, [text, speed]);

      return (
        <span>
          {displayed}
          {displayed.length < text.length && <span className="cursor">|</span>}
        </span>
      );
    }

    function GuideCard({ guide, module }) {
      const [isHovered, setIsHovered] = useState(false);
      const badgeColor = BADGE_COLORS[guide.badge];
      const badgeBg = BADGE_BG[guide.badge];

      if (!guide.available) {
        return (
          <div
            style={{
              position: "relative",
              borderRadius: 14,
              padding: "16px",
              background: "#fff",
              border: "1px solid #e8e8f0",
              cursor: "not-allowed",
              opacity: 0.65,
              transition: "all 0.3s",
            }}
          >
            <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
              <span style={{ fontSize: 28 }}>{guide.emoji}</span>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                  <h3 style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e", margin: 0 }}>
                    {guide.id} {guide.title}
                  </h3>
                  <span
                    style={{
                      fontSize: 9,
                      fontWeight: 700,
                      letterSpacing: 1.2,
                      color: badgeColor,
                      background: badgeBg,
                      padding: "2px 8px",
                      borderRadius: 10,
                      whiteSpace: "nowrap",
                    }}
                  >
                    {guide.badge}
                  </span>
                </div>
                <p style={{ fontSize: 13, color: "#6a6a7a", margin: 0 }}>{guide.desc}</p>
              </div>
            </div>
            <div
              style={{
                position: "absolute",
                top: 0,
                left: 0,
                right: 0,
                bottom: 0,
                background: "rgba(26, 26, 46, 0.85)",
                borderRadius: 14,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                flexDirection: "column",
                gap: 8,
                fontSize: 16,
                fontWeight: 600,
                color: "#fff",
              }}
            >
              <span style={{ fontSize: 24 }}>🔜</span>
              Coming Soon
            </div>
          </div>
        );
      }

      return (
        <a
          href={guide.path}
          style={{
            display: "block",
            textDecoration: "none",
            borderRadius: 14,
            padding: "16px",
            background: "#fff",
            border: "1px solid #e8e8f0",
            transition: "all 0.3s cubic-bezier(0.22, 0.68, 0, 1.2)",
            cursor: "pointer",
            transform: isHovered ? "translateY(-4px)" : "translateY(0)",
            boxShadow: isHovered ? "0 12px 24px rgba(108, 92, 231, 0.12)" : "0 2px 8px rgba(0, 0, 0, 0.04)",
          }}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
        >
          <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
            <span style={{ fontSize: 28 }}>{guide.emoji}</span>
            <div style={{ flex: 1 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                <h3 style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e", margin: 0 }}>
                  {guide.id} {guide.title}
                </h3>
                <span
                  style={{
                    fontSize: 9,
                    fontWeight: 700,
                    letterSpacing: 1.2,
                    color: badgeColor,
                    background: badgeBg,
                    padding: "2px 8px",
                    borderRadius: 10,
                    whiteSpace: "nowrap",
                  }}
                >
                  {guide.badge}
                </span>
              </div>
              <p style={{ fontSize: 13, color: "#6a6a7a", margin: 0 }}>{guide.desc}</p>
            </div>
          </div>
        </a>
      );
    }

    function ModuleSection({ module }) {
      return (
        <div style={{ marginBottom: 40 }}>
          <div style={{ marginBottom: 20 }}>
            <h2
              style={{
                fontFamily: "'Fraunces', serif",
                fontSize: 26,
                fontWeight: 700,
                color: "#1a1a2e",
                margin: 0,
                marginBottom: 4,
              }}
            >
              <span style={{ color: "#6c5ce7" }}>Module {module.id}:</span> {module.name}
            </h2>
          </div>
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
              gap: 16,
            }}
          >
            {module.guides.map((guide) => (
              <GuideCard key={guide.id} guide={guide} module={module} />
            ))}
          </div>
        </div>
      );
    }

    function ProgressBar({ total, available }) {
      const percentage = (available / total) * 100;
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div
            style={{
              flex: 1,
              height: 8,
              background: "#e8e8f0",
              borderRadius: 4,
              overflow: "hidden",
            }}
          >
            <div
              style={{
                height: "100%",
                width: `${percentage}%`,
                background: "linear-gradient(90deg, #6c5ce7, #2ecc71)",
                borderRadius: 4,
                transition: "width 0.6s cubic-bezier(0.22, 0.68, 0, 1.2)",
              }}
            />
          </div>
          <span style={{ fontSize: 14, fontWeight: 600, color: "#3d3d4d", minWidth: 70 }}>
            {available} of {total}
          </span>
        </div>
      );
    }

    function GenAIMasterMind() {
      const [activeFilter, setActiveFilter] = useState("All");
      const filters = ["All", ...MODULES.map((m) => m.category)];
      const filterLabels = {
        All: "All Modules",
        fundamentals: "Fundamentals",
        "prompt-engineering": "Prompt Engineering",
        "context-engineering": "Context Engineering",
        mcp: "Model Context Protocol",
        architectures: "Five Architectures",
      };

      const filteredModules =
        activeFilter === "All"
          ? MODULES
          : MODULES.filter((m) => m.category === activeFilter);

      const totalGuides = MODULES.reduce((sum, m) => sum + m.guides.length, 0);
      const availableGuides = MODULES.reduce(
        (sum, m) => sum + m.guides.filter((g) => g.available).length,
        0
      );

      return (
        <div
          style={{
            fontFamily: "'DM Sans', sans-serif",
            background: "linear-gradient(180deg, #f7f6fd 0%, #fff 50%, #fafafe 100%)",
            minHeight: "100vh",
            color: "#1a1a2e",
          }}
        >
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap');
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(12px); }
              to { opacity: 1; transform: translateY(0); }
            }
            @keyframes slideDown {
              from { opacity: 0; transform: translateY(-12px); }
              to { opacity: 1; transform: translateY(0); }
            }
            @keyframes pulse {
              from { transform: scale(1); }
              to { transform: scale(1.08); }
            }
            .cursor {
              animation: blink 0.7s infinite;
            }
            @keyframes blink {
              0%, 100% { opacity: 1; }
              50% { opacity: 0; }
            }
            * {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
            }
            html, body {
              margin: 0;
              padding: 0;
            }
            button:hover {
              filter: brightness(0.96);
            }
          `}</style>

          {/* Hero Section */}
          <div
            style={{
              background: "linear-gradient(135deg, #6c5ce7 0%, #a78bfa 50%, #2ecc71 100%)",
              padding: "44px 20px",
              textAlign: "center",
              color: "#fff",
              animation: "fadeIn 0.8s",
            }}
          >
            <h1
              style={{
                fontFamily: "'Fraunces', serif",
                fontSize: 54,
                fontWeight: 700,
                margin: 0,
                marginBottom: 12,
                letterSpacing: -1,
              }}
            >
              GenAI MasterMind
            </h1>
            <p
              style={{
                fontSize: 20,
                fontWeight: 500,
                margin: 0,
                marginBottom: 0,
                opacity: 0.95,
              }}
            >
              <TypingEffect text="Master Generative AI — From Concepts to Implementation" speed={25} />
            </p>
          </div>

          {/* Main Content */}
          <div style={{ maxWidth: 1200, margin: "0 auto", padding: "40px 20px" }}>
            {/* Progress Section */}
            <div
              style={{
                background: "#fff",
                borderRadius: 14,
                padding: "16px 20px",
                marginBottom: 40,
                border: "1px solid #e8e8f0",
                animation: "slideDown 0.6s",
              }}
            >
              <div style={{ marginBottom: 12 }}>
                <p
                  style={{
                    fontSize: 14,
                    fontWeight: 700,
                    color: "#6a6a7a",
                    margin: 0,
                    letterSpacing: 1,
                  }}
                >
                  LEARNING PROGRESS
                </p>
              </div>
              <ProgressBar total={totalGuides} available={availableGuides} />
            </div>

            {/* Filter Tabs */}
            <div
              style={{
                display: "flex",
                gap: 8,
                marginBottom: 40,
                flexWrap: "wrap",
                animation: "slideDown 0.6s 0.1s both",
              }}
            >
              {filters.map((filter) => (
                <button
                  key={filter}
                  onClick={() => setActiveFilter(filter)}
                  style={{
                    padding: "8px 16px",
                    borderRadius: 20,
                    border: `2px solid ${activeFilter === filter ? "#6c5ce7" : "#d0d0dd"}`,
                    background: activeFilter === filter ? "#6c5ce7" : "#fff",
                    color: activeFilter === filter ? "#fff" : "#3d3d4d",
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 14,
                    fontWeight: 600,
                    cursor: "pointer",
                    transition: "all 0.3s",
                  }}
                >
                  {filterLabels[filter]}
                </button>
              ))}
            </div>

            {/* Modules Grid */}
            <div style={{ animation: "fadeIn 0.6s 0.2s both" }}>
              {filteredModules.map((module) => (
                <ModuleSection key={module.id} module={module} />
              ))}
            </div>
          </div>

          {/* Footer */}
          <div
            style={{
              background: "#fff",
              borderTop: "1px solid #e8e8f0",
              padding: "24px 20px",
              textAlign: "center",
              animation: "slideDown 0.6s 0.3s both",
            }}
          >
            <p style={{ fontSize: 13, color: "#a0a0b0", margin: 0 }}>
              Comprehensive guide to modern generative AI architectures and techniques
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<GenAIMasterMind />);
  </script>
</body>
</html>
